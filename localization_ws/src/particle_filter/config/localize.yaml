particle_filter:
  ros__parameters:
    # topic names for the real car stack
    scan_topic: '/scan'
    odometry_topic: '/odom'
    map_frame: 'map'
    odom_frame: 'odom'
    base_frame: 'base_link'
    laser_frame: 'laser'
    # range data downsampling
    angle_step: 10
    max_particles: 3000
    squash_factor: 2.2
    # visualization
    viz: 1
    max_viz_particles: 60
    # ray marching method
    range_method: 'glt'
    theta_discretization: 112
    # range data filtering
    max_range: 10
    fine_timing: 0
    publish_odom: 1
    # sensor model constants
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.75
    sigma_hit: 4.0
    # motion model dispersion constants
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.08
    # Reject scan updates that would snap the filter too far from its
    # odom-propagated prediction in a single frame.
    pose_jump_guard_enabled: true
    max_pose_jump_translation_m: 0.30
    max_pose_jump_yaw_rad: 0.35
    # 가드가 영구 거부권이 되지 않도록: 연속 거부가 이 횟수에 닿으면 보정을
    # 한 번 받아들여 재동기화한다. 0 = 비활성(구 동작 = 영구 차단 위험).
    # PF ~15Hz -> 10회는 약 0.7초. 그 안에 못 붙으면 예측이 틀린 것이다.
    max_consecutive_jump_rejects: 10
    # Use the Python log-likelihood path to avoid sensor-weight underflow on real bags.
    rangelib_variant: 0

map_server:
  ros__parameters:
    # assuming map file is in particle_filter/maps
    map: 'my_track'

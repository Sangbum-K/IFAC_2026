/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    # Measured 2026-07-22 via tape measure + stopwatch over a 9 m straight,
    # commanded 0.8/1.0/1.5 m/s (topic pub, not joystick). Three independent
    # speeds agree within +-2% with mixed sign -> noise floor, not a real bias.
    # See ~/TUNING_STATUS.md.
    #
    # 2026-08-10: unchanged, but the TIRE SWAP made it accurate rather than
    # optimistic. Effective rolling circumference grew ~3.9%; PF path length
    # over odom integral went 0.957 (08-09) -> 0.994 (08-10). Read that
    # backwards: until 08-10 the car ran ~4% SLOWER than commanded, and every
    # on-car validation up to 08-09 (6 m/s promotion, A_ACC/A_DEC, mu 0.80
    # raceline, steering LUT) was carried out inside that hidden margin.
    # a_lat = kappa*v^2, so real lateral accel back then was 0.957^2 = 0.916 of
    # planned -- the mu 0.80 line was only ever demonstrated at an effective
    # 0.73. Planning compensates with global_trajectory/velocity_scale 0.96 in
    # planning_ws/.../environments/real_car.yaml until A_ACC/A_DEC are
    # re-measured against PF (not odom) on a post-08-10 bag.
    speed_to_erpm_gain: 4255.1
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    # 2026-08-10 post-tire-swap refit. THESE TWO VALUES ARE CURRENT AND
    # INTENTIONAL -- they supersede the 2026-07-22 pair (-0.8206 / 0.403) that
    # older notes still quote. Confirmed on-car the evening of 08-10.
    #
    # Gain: originally from a symmetric circle pair at delta +-0.18 rad
    # (3.12 m / 1.96 m diameters), refit after the tire swap. The old -0.8206
    # made the car reach only 0.8206/0.8320 = 98.6% of the commanded angle, so
    # every bag recorded before 08-10 under-steers by 1.4% relative to command.
    # Anything fitted on those bags (notably the control NUC2_hangar steering
    # LUT) is biased by that much until refitted.
    steering_angle_to_servo_gain: -0.8564
    # Offset: physical neutral back-solved per run
    # (S* = gain*delta0 + offset_in_effect, delta0 = yaw-rate zero crossing):
    #
    #   08-09 224544 (36 laps)      S* = 0.4061      |e|p50 0.141
    #   08-10 181449                S* = 0.4330      |e|p50 0.173
    #   08-10 182709                S* = 0.4309      |e|p50 0.199
    #   08-10 192916 (with 0.4319)  S* = 0.3969      |e|p50 0.253
    #
    # 0.4319 was tried first and made things worse (|e|p50 0.173 -> 0.253):
    # within any one run S* is stable to +-0.002 (15 s sliding windows), but it
    # jumps up to 0.036 servo (2.5 deg) BETWEEN runs, so no single value can
    # chase it. Stable-within / jumps-between is the signature of a discrete
    # mechanical slip (servo saver, horn spline, horn screw, tie rod / knuckle
    # re-seating on a wall hit).
    #
    # 2026-08-26 WHEEL SWAP: the between-run jump is GONE and the "three
    # consecutive runs within +-0.005" bar of TUNING_STATUS.md section 11 is
    # CLEARED -- by six runs, not three. Same method as the table above
    # (delta0 = yaw-rate zero crossing, Theil-Sen on wz/v vs delta, |delta|<0.12,
    # v>2, drive lag 0.12 s; IMU yaw rate, so independent of the servo model):
    #
    #   run_0826_192948   delta0 +0.0387 (+2.22 deg)   S* = 0.3908
    #   run_0826_193507   delta0 +0.0393 (+2.25 deg)   S* = 0.3904
    #   run_0826_194106   delta0 +0.0377 (+2.16 deg)   S* = 0.3917
    #   run_0826_194800   delta0 +0.0404 (+2.31 deg)   S* = 0.3894
    #   run_0826_195205   delta0 +0.0364 (+2.09 deg)   S* = 0.3928
    #   run_0826_195627   delta0 +0.0420 (+2.41 deg)   S* = 0.3880
    #   median 0.3906, total spread 0.0048 (+-0.0024) -- half the bar.
    #
    # Robust to the analysis knobs: sweeping lag 0.00-0.18 s and vmin 2.0/3.5
    # keeps S* inside 0.390-0.394. Within-run 15 s windows scatter more
    # (sd 0.010) than the between-run spread, so what is left is measurement
    # noise, not drift. Left- and right-hand slopes k/(delta-delta0) agree
    # (1.44-1.66 vs 1.17-1.60): a pure neutral offset, NOT a gain error --
    # the gain is untouched.
    #
    # 0.424 was wrong by -0.0334 servo = 2.23 deg of RIGHT bias at commanded
    # zero. Every command carried it: delta_actual = delta_cmd - 0.0390.
    # Commanded +0.20 left delivered +0.161 (-20%); commanded -0.20 right
    # delivered -0.239 (+20%). Path tracking sat 0.065-0.075 m right of the
    # local path in all six runs. Per-maneuver, left avoidances achieved a
    # median 0.81 of their planned lateral displacement (49% under 0.8) while
    # right avoidances achieved 1.08.
    #
    # Note the old asymmetric deploy pair (left 0.3950 / right 0.3220)
    # accidentally cancelled this at FULL LOCK -- it delivered +0.356/-0.361.
    # The new pair below is set so full lock delivers the same physical angles.
    # Mid-range steering, which is what avoidance actually uses, was never
    # compensated and is what this fixes.
    steering_angle_to_servo_offset: 0.3906
    #
    # Derived limits (delta = (servo - offset)/gain, servo clipped to
    # [servo_min, servo_max] below). Recomputed 2026-08-26 for offset 0.3906:
    #   left  (0.05-0.3906)/-0.8564 = +0.39771 rad (22.79 deg)
    #   right (0.70-0.3906)/-0.8564 = -0.36128 rad (20.70 deg) <- binding side
    # Deployed pair backs off ~0.007-0.008 servo from each mechanical end:
    #   left  0.3884 -> servo 0.05797 (0.00797 above servo_min)
    #   right 0.3531 -> servo 0.69299 (0.00701 below servo_max)
    # That margin is ~3x the residual between-run neutral spread (+-0.0024
    # servo) measured over the six 08-26 runs, so a drift in either direction
    # steers rather than clips.
    # Symmetric planning consumers use min(left, right) = 0.3531
    #   -> min turn radius 0.895 m, kappa_max 1.117 1/m.
    #   planning spliner/vehicle_max_steering_rad, tracker/max_steer_rad,
    #   opponent/max_steer_rad, global_trajectory/validation_max_steer_rad,
    #   deployment_profiles.MAX_STEER, control vehicle/max_{left,right}_steering_angle_rad.
    # ⚠️ These five must stay equal to min(left, right) or deployment_profiles
    #    raises at resolve time. The two directional values live only in
    #    control vehicle/max_{left,right}_steering_angle_rad.
    # ⚠️ The asymmetry here is real (the true neutral 0.3906 is not centred in
    #    [0.05, 0.70]), unlike the old 0.3950/0.3220 pair which was the neutral
    #    bias in disguise. Do NOT feed the spare left range back into a
    #    symmetric planning scalar -- see spliner/steer_kappa_scale.
    port: /dev/ttyACM0
    # Physical frame used by the AHRS quaternion. bringup_launch.py publishes
    # base_link -> this frame from sensors.yaml.
    imu_frame_id: vesc_imu
    # NOTE: duty_cycle_* only clips the "commands/motor/duty_cycle" topic in
    # vesc_driver. Nothing in this stack publishes there -- ackermann_to_vesc
    # emits commands/motor/{speed,current,brake} and commands/servo/position --
    # so these two are inert today. min was 0.05 until the localization_upgrade
    # merge (2026-08-11); paired with max 0.0 that inversion would have made
    # CommandLimit::clip collapse every command onto one of the two bounds. The
    # pair is now 0.0/0.0, so a future duty-cycle publisher gets clamped to zero
    # instead -- still wrong, but no longer inverted. Widen it before using it.
    # (Soft-starting the sensorless motor is NOT done here: throttle_interpolator
    #  is commented out in bringup_launch.py, so max_acceleration below is dead
    #  too. The live ramp is control_node's launch envelope.)
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    # Final VESC-driver clamp for every /commands/motor/brake publisher.
    # 2026-08-19: 6.0 -> 7.0, paired with ackermann_brake_max below (7.0) so
    # that ceiling isn't silently re-clipped here. ⚠️ real hardware current
    # ceiling change -- needs on-car brake verification like everything else
    # touched this session, not just a config bump.
    brake_min: 0.0
    brake_max: 7.0
    # 2026-08-19: 32000 -> 40000. VESC Tool 쪽 firmware ERPM max를 사용자가
    # 직접 ~40000으로 올리는 것과 짝을 맞춘다 (이 ROS 레벨 클램프가 firmware
    # max보다 낮으면 firmware를 올려도 소용없다 -- CLAUDE.md 참조).
    # 40000 / speed_to_erpm_gain(4255.1) = 9.40 m/s. 목표 RACELINE_V_MAX
    # 8.5 m/s(=36168 ERPM)에 여유를 남겨 둔다. ⚠️ firmware를 실제로 안 올리면
    # 이 숫자는 아무 효과가 없다 -- vesc_driver가 여전히 옛 firmware max에서
    # 클램프한다.
    speed_min: -40000.0
    speed_max: 40000.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.05
    # Right-hand steering stalls the servo from ~0.7196 (measured on a stand,
    # audible buzz). Clip below that so a full stick deflection cannot drive the
    # servo into the mechanical stop.
    servo_max: 0.70

    # 종방향 DRIVE / COAST / BRAKE 전환과 가속 선행 보정 설정이다. 코드를 다시
    # 빌드하지 않고 종방향 동작을 조정할 수 있도록 관련 파라미터를 여기에 둔다.
    # 계획 가속도가 양수이면 VESC 속도 PID 목표를 T_lead * acceleration만큼
    # 선행시킨다. 보정값은 max_mps와 실제 속도 오차로 제한하므로 계획 속도에
    # 가까워질수록 0으로 줄어든다. 모터 구동 전류를 직접 명령하는 방식은 아니다.
    #
    # 2026-08-19: false로 되돌림. rosbag_0818_204644(false) vs
    # rosbag_0818_225825(true) A/B에서 true 쪽이 코너에서 튀어나가는 경향 —
    # 원인 미확정(가속 리드가 코너 진입 감속 구간에서 오히려 선행 과다를
    # 만드는지, 아니면 무관한 다른 요인인지 이 리뷰에서 코드만으로는 못 갈랐다.
    # 아래 §LUT/브레이크 항목과 별개로, 재실차 시 최우선 확인 후보).
    accel_speed_lead_enabled: false
    accel_speed_lead_time_s: 0.08
    accel_speed_lead_max_mps: 0.30
    accel_speed_lead_target_max_mps: 7.0
    accel_speed_lead_rise_rate_mps2: 6.0
    brake_control_enabled: true
    # Normal-driving explicit-brake limit generated by ackermann_to_vesc.
    # This is intentionally separate from the VESC driver's brake_max clamp.
    # 2026-08-19: 5.0 -> 7.0, matched to deployment_profiles.BRAKE_AMPS_PLANNED
    # (reverted 5.0->7.0 same day -- see that constant's comment for why).
    # ⚠️ real hardware current ceiling change, needs on-car brake verification.
    ackermann_brake_max: 7.0
    # run_0822_070229: gain 5.0에서 계획 감속 중 과속 p90 0.88 m/s,
    # 보통 최대 명령 5.2~5.7/7.0 A, 7 A 직선 감속 중앙값 -2.60 m/s2였다.
    # 하드웨어 상한은 유지하고 기존 여유를 조금 더 일찍 쓰도록 6.0으로 조정.
    # 실측 배터리 회생 입력은 peak 2.95 A(5250 mAh 기준 0.56 C)였다.
    brake_speed_error_gain: 10.0       # brake A per (m/s) of overspeed
    brake_decel_threshold: 0.1        # planned deceleration intent (m/s^2)
    brake_entry_speed_error: 0.10     # planned-decel brake entry (m/s)
    brake_overspeed_error: 0.20       # brake entry without decel intent (m/s)
    brake_release_speed_error: 0.05   # hysteresis release threshold (m/s)
    brake_min_vehicle_speed: 0.30     # coast instead of braking below this (m/s)
    vesc_state_timeout: 0.15          # coast if VESC feedback is stale (s)

# No longer needed, all parameters are shared
# ackermann_to_vesc_node:
#   ros__parameters:

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    # publish odom to base link tf
    publish_tf: true
    # Use the VESC AHRS quaternion as relative yaw. The recorded mapping lap measured
    # 358.1 deg from IMU versus 390.8 deg from the steering model, reducing closure
    # error from 1.44 m to about 0.30 m in offline replay.
    use_imu_yaw: true
    imu_topic: sensors/imu/raw
    imu_yaw_timeout: 0.20
    # Current hardware_ws driver exposes VESC gyro in deg/s on sensor_msgs/Imu.
    imu_angular_velocity_scale: 0.017453292519943295
    imu_yaw_variance: 0.003
    max_integration_dt: 0.20
    use_servo_cmd_to_calc_angular_velocity: true
    # car wheelbase (this vehicle: 33cm)
    wheelbase: 0.33

# No longer needed, all parameters are shared
# vesc_driver:
#   ros__parameters:

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position

    # servo smoother - limits acceleration and smooths anything above limit
    max_acceleration: 2.5 # meters/second^2
    throttle_smoother_rate: 75.0 # messages/sec
    # servo smoother - limits rotation speed and smooths anything above limit
    max_servo_speed: 3.2 # radians/second
    servo_smoother_rate: 75.0 # messages/sec

/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    # Measured 2026-07-22 via tape measure + stopwatch over a 9 m straight,
    # commanded 0.8/1.0/1.5 m/s (topic pub, not joystick). Three independent
    # speeds agree within +-2% with mixed sign -> noise floor, not a real bias.
    # See ~/TUNING_STATUS.md.
    speed_to_erpm_gain: 4255.1
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    # Measured 2026-07-22. Gain comes from a symmetric circle pair at delta
    # +-0.18 rad (3.12 m / 1.96 m diameters); offset comes from a 4.5 m straight
    # run, which probes delta = 0 directly. Both circles and the straight run sit
    # on one line to within 0.2 deg. See ~/TUNING_STATUS.md.
    steering_angle_to_servo_gain: -0.8206
    steering_angle_to_servo_offset: 0.403

    port: /dev/ttyACM0
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    # Final VESC-driver clamp for every /commands/motor/brake publisher.
    brake_min: 0.0
    brake_max: 1.0
    speed_min: -26000.0
    speed_max: 26000.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.05
    # Right-hand steering stalls the servo from ~0.7196 (measured on a stand,
    # audible buzz). Clip below that so a full stick deflection cannot drive the
    # servo into the mechanical stop.
    servo_max: 0.70

    # Longitudinal DRIVE / COAST / BRAKE arbitration. All thresholds are kept
    # here so braking behavior can be tuned without rebuilding the code.
    brake_control_enabled: true
    # Normal-driving explicit-brake limit generated by ackermann_to_vesc.
    # This is intentionally separate from the VESC driver's brake_max clamp.
    ackermann_brake_max: 1.0
    brake_speed_error_gain: 2.0       # brake A per (m/s) of overspeed
    brake_decel_threshold: 0.1        # planned deceleration intent (m/s^2)
    brake_entry_speed_error: 0.10     # planned-decel brake entry (m/s)
    brake_overspeed_error: 0.20       # brake entry without decel intent (m/s)
    brake_release_speed_error: 0.05   # hysteresis release threshold (m/s)
    brake_min_vehicle_speed: 0.30     # coast instead of braking below this (m/s)
    vesc_state_timeout: 0.15          # coast if VESC feedback is stale (s)

    # Post-mux launch ramp used only after boot, a near-stop, or a VESC fault.
    # Keep drive_ramp_erpm_per_sec equal to Ramp eRPM/s in VESC Tool.
    launch_ramp_enabled: true
    launch_arm_speed_mps: 0.30
    launch_exit_speed_mps: 1.20
    launch_accel_limit_mps2: 1.10
    drive_ramp_erpm_per_sec: 5500.0
    fault_clear_hold_sec: 0.50

# No longer needed, all parameters are shared
# ackermann_to_vesc_node:
#   ros__parameters:

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    # publish odom to base link tf
    publish_tf: true
    # Use the VESC AHRS quaternion as relative yaw. The recorded mapping lap measured
    # 358.1 deg from IMU versus 390.8 deg from the steering model, reducing closure
    # error from 1.44 m to about 0.30 m in offline replay.
    use_imu_yaw: true
    imu_topic: sensors/imu/raw
    imu_yaw_timeout: 0.20
    # Current hardware_ws driver exposes VESC gyro in deg/s on sensor_msgs/Imu.
    imu_angular_velocity_scale: 0.017453292519943295
    imu_yaw_variance: 0.003
    max_integration_dt: 0.20
    use_servo_cmd_to_calc_angular_velocity: true
    # car wheelbase (this vehicle: 33cm)
    wheelbase: 0.33

# No longer needed, all parameters are shared
# vesc_driver:
#   ros__parameters:

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position

    # servo smoother - limits acceleration and smooths anything above limit
    max_acceleration: 2.5 # meters/second^2
    throttle_smoother_rate: 75.0 # messages/sec
    # servo smoother - limits rotation speed and smooths anything above limit
    max_servo_speed: 3.2 # radians/second
    servo_smoother_rate: 75.0 # messages/sec

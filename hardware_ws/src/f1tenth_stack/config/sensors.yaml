urg_node:
  ros__parameters:
    angle_max: 3.14
    angle_min: -3.14
    ip_address: "192.168.0.10"
    ip_port: 10940
    # serial_port: "/dev/sensors/hokuyo"
    serial_baud: 115200
    laser_frame_id: "laser"
    calibrate_time: false
    default_user_latency: 0.0
    diagnostics_tolerance: 0.05
    diagnostics_window_time: 5.0
    error_limit: 4
    get_detailed_status: false
    publish_intensity: false
    publish_multiecho: false
    cluster: 1
    skip: 0

# Measure these from base_link (rear-axle midpoint projected onto the floor) to
# each sensor's physical frame. Keep roll/pitch/yaw in radians. The current
# values preserve the old launch behavior; replace them only with measured data.
sensor_extrinsics:
  ros__parameters:
    base_to_laser_x: 0.27
    base_to_laser_y: 0.0
    base_to_laser_z: 0.11
    base_to_laser_roll: 0.0
    base_to_laser_pitch: 0.0
    base_to_laser_yaw: 0.0
    base_to_imu_x: 0.0
    base_to_imu_y: 0.0
    base_to_imu_z: 0.0
    base_to_imu_roll: 0.0
    base_to_imu_pitch: 0.0
    base_to_imu_yaw: 0.0

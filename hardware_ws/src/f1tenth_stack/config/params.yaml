/**:
  ros__parameters:
    use_sim_time: false

joy_node:
  ros__parameters:
    dev: /dev/input/js0
    deadzone: 0.1
    autorepeat_rate: 20.0

estop_node:
  ros__parameters:
    joy_topic: /joy
    estop_topic: /safety/emergency_stop
    button_index: 4
    latch_estop: true

robot_state_publisher:
  ros__parameters:
    publish_frequency: 30.0

vehicle:
  ros__parameters:
    wheelbase: 0.33
    max_speed: 4.0
    max_steering_angle: 0.4189
    vesc_odom_topic: /odom
    lidar_scan_topic: /scan
    base_frame: base_link
    laser_frame: laser
    map_frame: map
    odom_frame: odom

ackermann_joy_teleop:
  ros__parameters:
    joy_topic: /joy
    ackermann_topic: /manual_ackermann_cmd
    speed_axis: 7
    steering_axis: 3
    reverse_button: 0
    max_speed: 1.5
    max_speed_reverse: 0.8
    max_steering_angle: 0.4189
    joy_timeout: 0.5
    publish_rate: 30.0
    speed_deadzone: 0.05
    steering_deadzone: 0.05

ackermann_cmd_mux:
  ros__parameters:
    joy_topic: /joy
    manual_ackermann_topic: /manual_ackermann_cmd
    autonomous_ackermann_topic: /autonomy/ackermann_cmd
    output_ackermann_topic: /ackermann_cmd
    estop_topic: /safety/emergency_stop
    autonomous_button: 5  # 토글 버튼 (누르는 순간 자율/수동 전환)
    command_timeout: 0.5
    publish_rate: 30.0

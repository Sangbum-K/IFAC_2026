joy:
  ros__parameters:
    # device_name: /dev/input/joypad-f710
    device_id: 0
    deadzone: 0.01
    autorepeat_rate: 20.0
    coalesce_interval: 0.01

joy_toggle_teleop:
  ros__parameters:
    teleop_topic: teleop
    # Press once to switch manual <-> autonomous (edge triggered, no hold).
    toggle_button: 5
    # Press once to stop, from either mode; press again to release (always
    # back into manual, never straight into autonomous). Highest priority in
    # mux.yaml, and ignored buttons==5 while active.
    estop_button: 4
    estop_topic: /estop_cmd
    estop_status_topic: /safety/emergency_stop
    speed_axis: 1
    steering_axis: 3
    max_speed: 1.5
    max_steering_angle: 0.34
    speed_deadzone: 0.05
    steering_deadzone: 0.05
    publish_rate: 30.0
    joy_timeout: 0.5
    stop_burst_sec: 0.5

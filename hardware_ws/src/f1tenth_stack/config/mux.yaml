ackermann_mux:
  ros__parameters:
    topics:
      navigation:
        # control_pkg publishes here on the real car (real_car.yaml
        # ackermann_topic). The sim uses /drive instead, for the gym.
        topic   : /autonomy/ackermann_cmd
        timeout : 0.2
        priority: 10
      joystick:
        topic   : teleop
        timeout : 0.2
        priority: 100
      estop:
        # joy_toggle_teleop publishes continuous zero commands here while
        # estopped, so this always wins over joystick/navigation. Not a
        # `locks` entry on purpose: a lock only blocks lower-priority topics,
        # it doesn't make the mux emit a zero command itself, which would
        # leave the last real command latched downstream instead of stopping.
        topic   : /estop_cmd
        timeout : 0.2
        priority: 200
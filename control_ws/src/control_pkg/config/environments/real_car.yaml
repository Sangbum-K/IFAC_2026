control:
  ros__parameters:
    # MAP waypoints are in the map frame, so use the localized map-frame pose.
    odom_topic: /pf/pose/odom
    ackermann_topic: /autonomy/ackermann_cmd
    autonomous_on_start: true
    # Blocks only the autonomy publisher. Joystick and estop remain independent,
    # higher-priority ackermann_mux inputs.
    "localization_gate/enabled": true
    "recovery/require_supervisor": false
    # 2026-08-12 NUC2_hangar -> UNICORN2-hj-0331-faster-more-data.
    # 08-10 타이어 교체 후 4개 폴더/10개 rosbag의 44,496개 유효 표본을
    # 100~120 ms 응답 지연, 실행 servo gain, 런별 yaw-rate 중립을 보정해 채점했다.
    # 역조회 조향각 MAE [전체 / 준정상 / 4 m/s 이상]:
    #   UNICORN2  0.892° / 0.806° / 0.761°
    #   NUC2      1.290° / 1.313° / 0.990°
    # 기본 MAE는 10개 bag 모두 개선됐다. hj-acc-test와는 사실상 동률이지만,
    # 여러 평가 지표와 bag별 승률을 합친 robust rank에서 이 표가 1위였다.
    # 같은 목표 횡가속도에서 NUC2보다 약 0.2~1.4° 더 조향하므로 첫 주행은
    # 저속부터 단계적으로 확인하고, 타이어/조향 캘리브레이션 변경 시 재검증한다.
    # 2026-08-19: UNICORN2(ETH 기증 차량 표, 이 차 재적합 이력 없음) ->
    # IFAC_realcar_v2. run_0809_224544 + 08-17 5개 + 0818 2개(계획가속도 A/B),
    # 총 10백/66107샘플로 UNICORN2 대비 실현율(실측/표예측)을 속도밴드별로
    # 풀링해 보정: 1~4.5 m/s는 표와 거의 일치(0.83~0.99)하지만 5~7 m/s에서
    # 0.42~0.81로 뚝 떨어짐(밴드 평균 0.51~0.73) — UNICORN2가 레이싱 속도에서
    # 이 차 실제 그립을 꾸준히 과대평가해 왔다는 뜻. 코너 와이드/벽접촉(TUNING
    # 08-10/08-11, 오늘 세션의 코너 튀어나감 등)의 실질적 공통 원인일 가능성.
    # 7.0~8.5 m/s 구간은 이 차로 한 번도 안 달려본 속도라 실측 없음 — 마지막
    # 실측 밴드(6.5-7.0, 비율 0.51)를 그대로 유지(더 나빠진다고도 좋아진다고도
    # 가정 안 함)해서 채웠다. **이 구간은 추정이지 계측이 아니다.**
    # 생성: control_pkg/scripts/lut_calib.py 방법론(밴드별 실현율 스케일)을
    # 8백 풀링 + 7~8.5 확장으로 재구현. 원본 UNICORN2 표는 그대로 남겨 뒀다.
    "map/steering_lut_file": "IFAC_realcar_v2_pooled8bag_pacejka_lookup_table.csv"

    # Real-car speed cap. 2026-08-01: 5 m/s 단계(scale 0.83/cap 5.0) 실차 성공
    # 후 6 m/s 단계 승격 (planning velocity_scale 0.97과 한 변경으로 이동).
    # 2026-08-07 6.0 -> 7.0: deployment_profiles.RACELINE_V_MAX 를 7.0 으로
    # 올리면서 짝을 맞춘 것(= scale 1.0 × 7.0). 실제 프로파일 최고속은 여전히
    # 6.04 m/s 라 이 cap 은 클램프하지 않는 안전 상한이다 — 근거와 스윕 실측은
    # deployment_profiles.py RACELINE_V_MAX 주석에 있다.
    # ⚠️ cap 을 올리는 것과 차가 빨라지는 것은 별개다. 08-06 백 4개 실측:
    #    명령 max 5.50 m/s / 달성(odom) max 5.25 · PF 지면속도 = odom×0.97 이라
    #    erpm gain 문제가 아니라 프로파일을 못 따라가는 지연이다.
    # (scale 1.0은 build_map 폐루프 게이트 FAIL — planning yaml 주석 참조)
    # 2026-08-19 7.0 -> 8.5: map/steering_lut_file 을 8.5 m/s까지 다루는
    # IFAC_realcar_v2 로 바꾸면서 짝을 맞춤 (그 표의 7.0 이상 구간은 실측이
    # 아니라 마지막 실측 밴드를 유지한 추정 — 위 steering_lut_file 주석 참조).
    # deployment_profiles.controller_profile() 이 이 값과 LUT 최대 속도열이
    # 어긋나면 fail-closed로 죽으므로 LUT 파일을 바꾸지 않고 이 값만 올리면
    # 안 된다. RACELINE_V_MAX 도 같이 8.5로 맞출 것.
    "vehicle/max_speed_mps": 8.5
    "vehicle/speed_scale": 1.0
    # Stand test: +0.395 rad reached servo 0.0552 without driver clipping.
    # First loaded deployment retains margin with +0.380 rad (servo 0.0681).
    "vehicle/max_left_steering_angle_rad": 0.3800
    "vehicle/max_right_steering_angle_rad": 0.3578

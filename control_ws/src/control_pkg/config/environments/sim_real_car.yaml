# --- gym sim + 실차 명령 제한 (stack.launch.py env:=sim_real_car) ---
# 명령 한계는 real_car.yaml과 동일하게 두고, 배선(토픽)만 sim이다.
control:
  ros__parameters:
    # --- 배선 ---
    # odom은 실차와 **같은** /pf/pose/odom을 쓴다. sim에서도 pf:=true로
    # 진짜 particle_filter가 돌기 때문에 GT(/ego_racecar/odom)를 쓸 이유가 없다.
    # GT로 두면 위치추정 오차가 제어에서만 사라져 실차보다 낙관적이 된다.
    odom_topic: /pf/pose/odom
    ackermann_topic: /drive          # gym 입력 (실차: /autonomy/ackermann_cmd)
    autonomous_on_start: true
    "recovery/require_supervisor": false

    # real_car.yaml과 동일. 여기만 빠져 있어 base params.yaml의 false가 남았고,
    # 그 결과 sim은 **실차에 있는 출발 게이트가 통째로 없는** 상태로 돌았다
    # (test_sim_real_car_profiles_mirror_real_car 가 잡아낸 유일한 드리프트).
    # sim에서 이 게이트가 실제로 성립하는지 확인한 근거:
    #   · env:=sim_real_car 는 pf:=true 라 실차와 같은 particle_filter_cpp 가 돈다.
    #     ready_pub_ 는 조건 없이 생성되고(particle_filter_node.cpp:135,
    #     transient_local) 토픽 기본값도 /pf/localization_ready 로 같다.
    #   · ready = initial_pose_accepted && quality == kOk (mcl_core.cpp:426).
    #     초기 포즈는 sim_odom_drift_node 가 /initialpose 로 쏜다
    #     (sim_race.launch.py drift/init_pose_*), 품질 문턱은 localize_sim.yaml 에
    #     없지만 **노드 기본값이 실차 localize.yaml 과 같은 값**이다
    #     (0.70/0.40/3/5 — particle_filter_node.cpp:122-125).
    # 즉 게이트가 sim에서 영구히 닫히지 않는다. 막히면 원인은 이 값이 아니라
    # PF 미수렴이므로 /pf/localization_quality 를 볼 것.
    "localization_gate/enabled": true

    # 조향 LUT만은 sim 것을 유지한다. LUT는 하드웨어 한계가 아니라 타이어 모델이라
    # gym 차량 모델(f110_gym single-track)에 실차 Pacejka LUT를 물리면 요구 조향이
    # 어긋나 실차와 무관한 추적오차가 생긴다. 실차 LUT로 비교하려면 아래를
    # "NUC6_glc_pacejka_lookup_table.csv"로 바꿀 것.
    "map/steering_lut_file": "SIM_linear_lookup_table.csv"

    # --- 명령 한계: real_car.yaml과 동일 ---
    # 7.0 — real_car.yaml과 동일(2026-08-07 6.0에서 동반 상향). 4.0이면 raceline
    # 상단(5.94 m/s)이 통째로 잘려서 sim이 그날 차와 다른 속도 프로파일을 달린다.
    # bag 실측(rosbag_0805): 명령 speed max 5.94 / p95 5.58,
    # 달성 /odom max 5.28 / p95 5.01 — 명령을 못 따라가는 것 자체가 재현 대상이다.
    "vehicle/max_speed_mps": 7.0
    "vehicle/speed_scale": 1.0
    # 0.3578 rad = 20.51° — 2026-08-11 gain 재적합(-0.8564 / 0.3935)에서
    # 우측(구속측) servo 포화 한계 (0.70-0.3935)/-0.8564 자체. 옛 0.36은 이
    # 한계를 0.6% 넘겨서 sim이 실차가 못 내는 각을 낼 수 있다고 봤다.
    # planning 단일 기준은 deployment_profiles.MAX_STEER=0.3578이고,
    # control은 실차와 같은 좌우 비대칭 한계를 사용한다.
    # test_sim_gym_vehicle_matches_measured_plant 가 이 드리프트를 막는다.
    # sim_race.launch.py vehicle:=real_car가 gym 쪽 s_max도 같은 값으로 맞춘다.
    "vehicle/max_left_steering_angle_rad": 0.3800
    "vehicle/max_right_steering_angle_rad": 0.3578
    "vehicle/max_steering_rate_radps": 2.0

    # --- 가감속 한계 (차가 실제로 낼 수 있는 값) ---
    # 여기만 real_car.yaml과 다르고, 그건 의도된 것이다. 실차에서 이 두 값은
    # '명령 slew 한계'(control params.yaml 5.5 / 4.0)이고 차의 실제 가감속은
    # VESC 중재+타이어가 정한다. gym에는 그 plant가 없으므로, 명령단에서
    # 대신 묶어야 sim이 실차보다 낙관적으로 서지 않는다.
    #
    # 값의 단일 기준은 planning_pkg/scripts/deployment_profiles.py 다:
    #   max_accel = A_ACC_MAX        4.5  (2026-08-10 3.5->4.5)
    #   max_decel = A_DEC_PLANNED    2.38 = A_DEC_MAX 1.4 + 0.14 x 7 A (2026-08-10)
    # 2026-08-07 동기화: 2.2 / 1.3 은 07-31 시절(A_ACC 2.2, brake_max 1.0 A) 값이라
    # 지금 실차보다 sim이 59% 약하게 가속하고 35% 약하게 감속하고 있었다.
    # ⚠️ A_ACC_MAX 3.5 는 실측이 아니라 외삽이다 (0805~0806 백 재측정 p90 1.42).
    #    되돌릴 때는 deployment_profiles + gym vehicle(sim_race.launch.py) +
    #    레이스라인 CSV를 한 변경으로 같이 움직일 것.
    #
    # 감속을 여기서 거는 게 특히 중요하다: gym의 accl_constraints는 가감속이
    # 대칭(±a_max)이라 gym 쪽에서 2.0을 따로 줄 수 없다. 명령단에서 slew를
    # 2.0으로 묶어야 gym이 그보다 세게 못 멈춘다.
    "vehicle/max_accel_mps2": 4.5
    "vehicle/max_decel_mps2": 2.38

    # ⚠️ 여전히 재현 안 되는 실차 제약:
    #  - ackermann_to_vesc의 제동 상태기계 자체(brake_entry_speed_error /
    #    brake_min_vehicle_speed / 히스테리시스). 위 2.0은 "항상 낼 수 있는
    #    감속"으로 들어가지만 실차는 진입 조건을 만족해야 브레이크가 물린다.
    #    그 중재는 build_map/tuner 폐루프의 VescLongitudinalPlant만 모델링한다.
    #  - ackermann_brake_max 5 A 에서의 제동 크레딧은 1 A 실측(0.4~0.45/A)의
    #    선형 외삽이다 (deployment_profiles.BRAKE_DECEL_PER_AMP 주석).
    #  - throttle_interpolator(max_acceleration 2.5, max_servo_speed 3.2)는
    #    bringup에서 비활성이라 실차에도 없다 — 이쪽은 차이가 아니다.

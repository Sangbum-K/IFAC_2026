control:
  ros__parameters:
    # ROS interfaces shared by every environment.
    control_rate: 40.0
    local_waypoints_topic: /local_waypoints
    odom_topic: /pf/pose/odom
    frenet_odom_topic: /car_state/frenet/odom
    imu_topic: /sensors/imu/raw
    ackermann_topic: /ackermann_cmd
    estop_topic: /safety/emergency_stop
    service_name: /control/set_mode
    autonomous_on_start: false

    # Fail-closed lease used only by real_car.yaml. The PF publishes a latched
    # false until /initialpose is accepted and scan-map quality is consecutively
    # OK, then refreshes the lease on every processed scan.
    "localization_gate/enabled": false
    "localization_gate/ready_topic": /pf/localization_ready
    "localization_gate/status_timeout_sec": 0.50

    waypoint_timeout_sec: 0.25
    odom_timeout_sec: 0.25
    frenet_odom_timeout_sec: 0.25
    imu_acceleration_sign: -1.0
    # Receipt 시각만 갱신되는 stale-republish를 막기 위해 원본 header도 검사한다.
    "source_freshness/require_header_stamp": true
    "source_freshness/future_tolerance_sec": 0.1

    # 공용 파일은 control 단독 bench 운용을 위해 false. 실차/race/sim 환경
    # 프로파일은 planning stack과 함께 쓸 때 true로 덮어쓴다.
    # 두 토픽은 paired lease로 검증하며 stale·불일치·알 수 없는 상태는 모두 정지.
    "recovery/state_topic": /planner/recovery/state
    "recovery/target_speed_topic": /planner/recovery/target_speed
    "recovery/require_supervisor": false
    "recovery/command_timeout_sec": 0.25
    "recovery/pair_max_skew_sec": 0.10
    # 전용 후진 조향 경로와 후방 coverage가 없으므로 STOP-only가 기본.
    "recovery/allow_reverse": false
    "recovery/max_reverse_speed_mps": 0.30
    "recovery/max_forward_override_mps": 1.0

    # ETH Forza MAP/L1 controller parameters.
    "map/t_clip_min": 0.5
    "map/t_clip_max": 8.0
    # 2026-08-21: 0.47 -> 0.50. run_0821_035422/041225에서 직선 L1 중앙값은
    # 3.04m였고 s=10~12m 직선 횡오차 p90은 0.30~0.34m였다. 직선 L1을 약
    # 0.18m 늘리되, 곡선은 curvature_factor 0.03->0.05로 상쇄해 유지한다.
    #
    # c7a0fb5 의 근거(기록으로 남긴다): my_track0818 실측(run_0819_150244) 후
    # 코너가 위험해 보인다는 관찰 -> L1 실제 사용치가 코너 구간(4~5 m/s) 평균
    # 1.79m 로 이 트랙 최소 코너 반경(R_min 1.78m)과 거의 같았다 -- 조준점이
    # 도는 곡선 자체의 반경만큼 멀어 코너를 자르는 기하가 성립. m_l1 스윕
    # (0.25~0.47, 폐루프 시뮬): 0.34~0.38 에서 랩타임 7.50s 로 바닥, 백스톱
    # 발화 33->0회, |lat err|max 0.291->0.241m.
    #
    # 되돌린 이유: 그 스윕은 my_track0818 폐루프 **시뮬**만의 결과이고, 실제로
    # 배선된 궤적은 my_track0817(max 7.00 m/s / mu 0.90)이라 튜닝이 이뤄진
    # 조합이 아니다. m_l1 은 회피 중에도 항상 걸리는 조향 컨트롤러 게인이라
    # 전체 주행에 영향을 주는데, 0.35 로 실차를 달려본 적이 없다.
    # 0.35 재적용은 (a) 대응하는 궤적을 함께 배선하고 (b) 저속부터 실차 검증한
    # 뒤에 할 것.
    # run_0821_042527: 6.5m/s 이상 직선 L1 중앙값 3.30m, |d| p90 0.19m.
    # 고속 직선에서 약 5~7cm 더 보도록 0.50 -> 0.51로 소폭 조정한다.
    "map/m_l1": 0.51
    "map/q_l1": -0.2
    # Unicorn ROS1 adaptive L1:
    #   L1 = m_l1*v + q_l1 - curvature_factor*mean(|kappa[i+10:i+20]|)*v^2
    # 원본 FIESTA1의 0.145는 현 레이스라인 대입 시 중앙값 36%, 상위 10% 70%를
    # 줄여 너무 강하다. 0.03은 중앙값 7.5%, 상위 10% 14.8% 단축이며 현재
    # 프로파일에서는 0.5m 하한에 붙는 점이 없어 초기 실차 계수로 사용한다.
    # 2026-08-21: m_l1 증가분이 곡선 L1까지 늘리지 않도록 0.03 -> 0.05,
    # run_0821_042527 고속 직선 미세 조정과 함께 0.05 -> 0.06.
    "map/curvature_factor": 0.06
    # 2026-08-22 run_0822_hth 3개 백: 직선/완만한 구간은 위 0.06 식을
    # 그대로 두고 급코너에서만 강화한다. kappa <= 0.20 은 기존 식과 정확히
    # 같고, 0.20~0.32 에서 smoothstep 으로 전환해 kappa >= 0.32 에서
    # 0.07*max(|kappa_now|, mean(|kappa_preview|))*v^2 를 전부 적용한다.
    # 0.07 재대입 결과: 오른쪽 최급구간 L1 1.74->1.28m, 왼쪽 긴 코너
    # 1.77->1.66m. 0.08은 오른쪽 1.16m로 첫 실차 적용에는 공격적이었다.
    "map/corner_curvature_factor": 0.07
    "map/corner_curvature_start": 0.20
    "map/corner_curvature_full": 0.32
    # 0.25 유지. 2026-07-31 폐루프 스윕에서 0.35~0.6은 직선 투영이 코너
    # 건너편 웨이포인트 속도를 잡아 전부 악화 — 이 트랙 크기에선 0.25가 최적.
    # 제동 여유는 여기가 아니라 raceline 프로파일 mu 마진(build_map.py
    # MU_PROFILE 0.65 < 물리 0.75)으로 확보한다.
    "map/speed_lookahead": 0.25
    # ── 정지 발진 하한 [m] (2026-08-22) ──────────────────────────────────
    # 위 speed_lookahead 는 거리가 아니라 **초**다 (v 를 곱해 쓴다). v=0 이면
    # 조회 지점이 0 m 앞 = 차 발밑이고, 회피 경로의 그 점은 플래너의 머리
    # 앵커 때문에 vx=0 이다 -> 명령 0 -> v=0 이 스스로를 유지한다.
    #   run_0822_001734: 정지+회피 1773 사이클 중 87.5 % 가 계획 선두속도 0.
    #   회피가 없는 903 사이클은 0.7 % / 중앙 5.65 m/s. 6 에피소드 37.0 s
    #   (백 195.2 s 의 19.0 %) 를 전부 사람이 차를 들어 옮겨서 풀었다.
    # 이 값만큼은 경로를 따라 앞의 점을 읽는다. 같은 백에서 0.25 m 면
    # 계획속도 중앙 1.00 m/s, vx=0 사이클 0 %.
    # 플래너가 "세워 둘 의도가 없다"고 알린 사이클에만 열린다
    # (/planner/avoidance/evade_committed). 회피 경로 채택 + 정지를 거부한
    # 트레일링(정적 콘)이 여기 들어가고, 진짜 정지 계획은 빠진다.
    #   2026-08-22 run_0822_143207/_144702: 게이트가 trailing 을 통째로
    #   막고 있어 정지 교착 4 에피소드(191.8 s, 두 백의 51 %) 가 그대로
    #   남았다 — 전부 trailing 이었고 명령 0 이 99.7 %.
    # v x 0.25 초가 이 값을 넘는 1.0 m/s 이상에서는 자연히 무효 — 정상
    # 주행에는 영향이 없다. 0 이면 종전 동작.
    "map/speed_lookahead_min_m": 0.25
    "map/lat_err_coeff": 0.0
    "map/acc_scaler_for_steer": 1.0
    "map/dec_scaler_for_steer": 1.0
    "map/start_scale_speed": 6.5
    "map/end_scale_speed": 10.0
    "map/downscale_factor": 0.5
    "map/speed_lookahead_for_steer": 0.0
    "map/max_lateral_error_m": 0.5
    "map/max_curvature_reference": 0.8
    "map/velocity_steer_gain_max": 1.0
    # local window 앞부분만 nearest 후보로 사용해 근접 평행/S자 구간 branch jump 방지.
    "map/nearest_search_horizon_m": 3.0

    # ── L1 거리의 기준 속도 (control_node.cpp:1194-1241) ───────────────────
    # L1 거리는 **실측** 속도로, 조향 명령의 분자
    #   lateral_acceleration = 2*speed_for_lookup^2 / L1 * sin(eta)
    # 는 **경로 계획** 속도로 계산된다. 발진 순간 이 둘이 최대로 벌어져서,
    # 실측 0 m/s 가 L1 을 하한까지 눌러 놓는데 분자는 계획 속도의 제곱이 된다.
    #   run_0815_191056: 그리드 오프셋 0.40m 로 정지 중 조향이 한계의 99.4%에
    #   7.2초간 고정 → 발진 후 d 진동 peak-to-peak 1.30m.
    #   모델상 오프셋 0.10m 에서도 요구 횡가속 22.9 m/s^2 (실측 그립 8.76의
    #   2.6배) — 레이스라인 위에 정확히 놓아도 포화한다.
    #   true  → L1 을 실측/계획 두 속도가 만드는 거리 중 **긴 쪽**으로 잡는다.
    #           요구 횡가속이 9.05*e (오프셋에만 비례, 속도 무관) 가 되어
    #           0.85m 오프셋까지 포화하지 않는다. L1 은 길어지기만 하므로
    #           새 포화를 만들 수 없고, 계획 <= 실측 구간(제동/트레일링,
    #           run_0815 기준 34%)에서는 종전과 완전히 동일하다.
    #   false → 종전(실측 전용). A/B 비교 목적으로만 끌 것.
    "map/l1_speed_uses_path_plan": true

    # ── 조향 룩업 계획속도 하한 (calc_steering_angle) ──────────────────────
    # 위 항목이 고친 건 **L1 거리**뿐이다. 분자
    #   lateral_acceleration = 2*speed_for_lookup^2 / L1 * sin(eta)
    # 는 여전히 계획 속도만 쓰고, 계획이 0 이면 a_lat=0 -> LUT 의 a_lat=0 행
    # -> **조향 0.000 rad**. 실측 속도는 어디에도 안 들어가므로 차가 달리는
    # 중에도 앞바퀴가 똑바로 선다. 이건 정지 계획이 아니라 개루프 직진이다.
    #   run_0817_123650 좌벽 충돌: 1프레임 유령(nobs=0) -> trailing v_target=0.1
    #   -> 회피상실 홀드가 130점 전부 0.06 m/s 캡 -> 12.58~13.05s(0.47초,
    #   20 사이클) 계획 0.000 / 실측 4.39 m/s / 조향 0.000 rad.
    #   룩어헤드는 정상이었다(eta 가 -0.34 -> -1.03 rad 로 벌어지는 내내).
    #   d 가 -0.11 -> +1.11 로 밀려 좌벽(1.12)을 0.9초 긁었고 s=13->24 통과가
    #   5.80s (정상 2.45~2.68s) — 손실 3.2초.
    # 계획이 이 값 아래로 무너졌는데 차가 그보다 빠르면 실측으로 대체한다.
    #   0.3 → run_0817 기준 20 사이클 (위 충돌 창만)
    #   0.5 → 24/5385 = 0.45%. run_0817의 near-zero 붕괴만 덮던 값
    #   1.0 → 160 사이클 (2.97%, 창 19개)
    # run_0821_051629: 크게 밀린 15개 랩 모두 코너 직전 정적 장애물 오인식
    # -> TRAILING으로 계획속도가 1.50~1.59m/s까지 떨어졌다. 실속은 약 6m/s인데
    # 조향 분자가 계획속도의 제곱을 써서 정상 대비 약 1/14로 줄었다. 1.6은
    # 이 TRAILING floor만 포함하고 정상 계획속도에는 개입하지 않는 최소 문턱.
    # ⚠ 올린다고 더 안전하지 않다. 이 구제의 전제는 "계획이 무너진 경우만"
    #   이다. 정상 제동까지 삼키기 시작하면(계획<실측 인 사이클이 31%) 그건
    #   조향 게인 변경이라 별도 실차 검증이 필요하다 — 노드가 2.0 초과를 거부.
    # ⚠ 0 = 비활성. 옛 동작("계획 0 -> 조향 0")으로 돌아간다.
    # 회복 조향도 max_steering_rate_radps(2.0)와 max_left/right_steering_angle_rad 안에서
    # 들어가므로 스텝 입력이 되지 않는다.
    "map/steer_plan_speed_min_mps": 1.6

    # ── 추종 백스톱 (control_node.cpp:914-973) ─────────────────────────────
    # "차가 경로를 못 따라가고 있으면 속도를 강제로 깎는다"는 런타임 안전망.
    # raceline CSV와 무관하다. 플래너의 속도 계획이 실제 그립보다 낙관적일 때
    # 컨트롤러 단에서 받아내는 마지막 방어선이다.
    #
    # 트리거 두 개(경로오차 / 조향포화)가 OR로 묶여 있고, 각자 cap을 계산해
    # 낮은 쪽이 이긴다. 2026-08-08 이후 두 분기 모두 같은 비례식을 쓴다:
    #
    #     cap = speed_now - over * (speed_now - backstop_min_speed_mps)
    #
    # over(0~1)는 각 분기의 심각도다. 낙폭이 "현재 속도에서 하한까지 남은
    # 거리"에 비례하므로 이미 느리면 거의 안 깎이고 빠를수록 크게 깎인다.
    # 마지막에 하한으로 clamp되고, 지금 속도 명령보다 낮을 때만 적용된다.

    # 백스톱 전체 on/off.
    #   false → 안전망이 통째로 사라진다. ETH 원본의 횡오차 감속
    #           (map/lat_err_coeff)은 현재 0.0이라 no-op이므로 **대체 장치가
    #           하나도 없다.** 디버깅 목적으로만 끌 것.
    #   true  → 아래 두 트리거가 동작.
    "map/backstop_enabled": true

    # [트리거 1] 경로오차 램프의 시작점 [m].
    # 여기서 재는 오차는 raceline 기준 d(frenet_odom.y)가 아니라 **지금 따라가는
    # 로컬 경로**의 최근접 waypoint까지의 거리다. 회피 중에는 d가 커지는 게
    # 정상이라 d로 트리거하면 회피할 때마다 오발화한다.
    # 램프는 이 값에서 0%, **이 값의 2배**에서 100%다 (0.30 → 0.60 m).
    #   올리면 → 늦게·약하게 개입. 코너를 더 공격적으로 돌 수 있지만 트랙 이탈
    #            여유가 줄어든다. 0806 run_235014 사고는 오차가 1초 안에
    #            0.22 → 0.40 → 0.67로 벌어져 벽을 뚫었다. 0.5 이상으로 올리면
    #            그 사고를 못 잡는다 = 사실상 무력화.
    #   내리면 → 일찍·강하게 개입. 정상 주행의 추종 오차에 걸리기 시작한다.
    #            현재 레이스라인(코너 기울기 0.117)의 |lat err|max가 0.173이므로
    #            0.18 아래로 내리면 코너마다 상시 감속한다.
    # run_0821_044422: 0.25m에서는 주행 사이클의 21.1%가 발화했고, 주행
    # 27.1초 부근 path_err 0.36~0.40m에서 cap이 약 2.6m/s까지 내려갔다.
    # 0.30m로 완화하면 같은 지점 예상 cap은 약 3.3m/s이며 안전망은 유지된다.
    "map/backstop_path_error_m": 0.30

    # [트리거 2] 조향포화 램프의 **시작점** (트리거점이 아니다).
    # 포화율 = |조향각| / map/backstop_steering_reference_rad.
    # 좌우 물리 한계와 분리해 첫 비대칭 조향 배포에서도 기존 0.3578 rad 기준과
    # 감속 안전망을 유지한다. 좌측 추가 조향에서는 포화율이 1.0을 넘을 수 있지만
    # control_node의 감속 램프가 1.0에서 포화되므로 감속 강도는 더 커지지 않는다.
    #
    # 2026-08-08 이전에는 이 값을 넘는 순간 하한으로 **즉시** 잘랐다. 그게
    # 오발화했다: 0808 run_202157의 apex 5곳에서 경로오차가 3~7cm(추종은
    # 완벽)인데 계획된 레이스라인 자체가 20°를 요구해 포화만 87~96%로 떴고,
    # 그때마다 2.2~2.5 m/s를 1.5로 통째로 잘랐다. 145s 중 109s가 발화 상태,
    # 그중 87%가 하한 클램프. 지금은 비례 램프라 1.5에 닿으려면 포화 100%
    # (= 진짜 풀락)여야 한다.
    #
    # **올리고 내리는 방향이 목적에 따라 반대다:**
    #   올리면 (0.85 → 0.90) → 감속이 약해진다. 포화 96%에서 소진 비율이
    #            73% → 60%. 대신 램프 폭이 0.15 → 0.10으로 좁아져 게인이 커진다.
    #            LUT가 speed_now를 받아 조향각을 내므로 "감속 → 요구조향 감소
    #            → 포화 감소 → 해제 → 재가속" 폐루프가 있고, 게인이 크면 apex
    #            속도가 떨 수 있다.
    #   내리면 (0.85 → 0.80) → 더 일찍 개입하지만 램프가 넓어져 부드러워진다.
    #            apex에서 속도가 떠는 게 보이면 이 방향으로 갈 것. 직관과
    #            반대 방향이니 주의.
    #   1.0으로 두면 → 포화가 정확히 100%일 때만 걸려 사실상 비활성.
    # "약하게" + "부드럽게"를 동시에 원하면 이 값 대신 아래 하한을 올릴 것.
    "map/backstop_steer_sat_ratio": 0.85
    "map/backstop_steering_reference_rad": 0.3578

    # [트리거 2 보조] 조향포화 분기가 열리기 위한 **최소 경로오차** [m].
    # 2026-08-12 추가. 포화 분기의 전제는 "조향이 포화면 기하를 못 만들고
    # 있다"인데, 추종이 완벽한데도 계획된 레이스라인 자체가 큰 조향을 요구하면
    # 포화만 뜬다. 그때 깎는 것은 방어가 아니라 순손실이다.
    #   run_0812_013630 오발화 12건 (경로오차 2~10cm = 추종 완벽):
    #     0.06m / 99% -> 3.80 -> 1.54 (-59%)   0.10m / 92% -> 3.61 -> 2.53 (-30%)
    #     0.07m / 93% -> 3.05 -> 2.28 (-25%)   0.02m / 90% -> 2.95 -> 2.62 (-11%)
    #   (0808 run_202157 apex 5곳과 같은 패턴. 램프 전환은 낙폭만 줄였고
    #    발화 자체는 남아 있었다.)
    #   올리면 → 포화 분기가 늦게 열린다. backstop_path_error_m(0.30) 에
    #            가까워질수록 경로오차 분기에 흡수돼 무의미해진다. 코드가
    #            backstop_path_error_m 이상은 거부한다.
    #   내리면 → 옛 동작에 가까워진다. 0 이면 포화 단독 발화(2026-08-12 이전).
    # 2026-08-21: 0.12 -> 0.15. run_0821_051629에서 경로오차 0.12~0.14m,
    # 조향포화 86~99%의 저오차 감속이 throttle 로그 16건 반복됐다. 반면 실제
    # 추종 실패는 0.63~0.70m였고 0.30m 경로오차 분기가 독립적으로 잡는다.
    # 0.15는 경로오차 임계 0.30의 절반이라 포화 분기도 선행 지표로 남는다.
    "map/backstop_sat_min_path_error_m": 0.15

    # 백스톱이 내려갈 수 있는 **바닥** [m/s]. 백스톱은 감속만 하고 정지는
    # 시키지 않는다(정지는 E-stop/recovery의 몫).
    #   올리면 → 최대 낙폭이 줄어 apex가 덜 느려진다. "감속이 너무 세다"에
    #            가장 직접적인 노브다. 대신 심각한 추종 실패에서도 이 속도
    #            밑으로 못 내려가 방어력이 약해진다. 참고로 아래 주석의 근거
    #            (BlendDist 조향 기하 하한 ≈ 2.4 m/s)를 따르면 2.0~2.4가
    #            현재 1.5보다 오히려 정합적이다.
    #   내리면 → 더 깊이 깎을 수 있다. 다만 약 2.4 m/s 아래로는 회피에 필요한
    #            조주거리가 더 줄지 않으므로 실익 없이 장애물 조우 시간만
    #            길어져 정지 라치 영역으로 들어간다.
    #
    # ⚠ 이 값이 프로파일의 vehicle/max_speed_mps 이상이면 **백스톱이 통째로
    #   무력화된다.** cap이 항상 하한으로 clamp되어 속도 명령보다 커지므로
    #   발화 조건(cap < speed_command)이 성립하지 않는다. 현재 race_map(1.0)과
    #   mapping(0.75) 프로파일이 그 상태다 — 저속 주행이라 의도상 문제는 없지만,
    #   **백스톱을 시험하려면 real_car(7.0) 프로파일이어야 한다.**
    "map/backstop_min_speed_mps": 1.5

    # Default to the temporary low-speed real-car LUT. Environment profiles
    # override this value where needed (for example, sim.yaml uses the SIM LUT).
    # 2026-08-08 NUC6_glc -> NUC2_hangar: 0807/0808 백 실측 15,386 쌍 채점에서
    # NUC2 가 전 속도대에서 더 정합(근거는 environments/real_car.yaml 주석).
    # 이제 mapping/race_map/real_car 가 모두 NUC2 로 일치한다.
    "map/steering_lut_file": "NUC2_hangar_pacejka_lookup_table.csv"

    # Vehicle geometry and command limits.
    "vehicle/wheelbase_m": 0.33
    "vehicle/max_speed_mps": 1.0
    # Limited by servo_max (0.70) on the right side: beyond servo ~0.7196 the
    # servo stalls against a mechanical stop, so hardware clips at 0.70.
    # With the 2026-08-11 calibration (gain -0.8564 / offset 0.3935) that is
    #   right (0.70-0.3935)/-0.8564 = -0.357894 rad (20.51 deg)  <- binding side
    #   left  (0.05-0.3935)/-0.8564 = +0.401098 rad (22.98 deg)
    # 0.3578 is the binding right-hand limit itself, rounded down only enough
    # to stay inside it (0.03%). The left stand test reached 0.395 rad without
    # driver clipping; deployment starts at 0.380 rad to retain servo margin
    # before the 0.401098 rad electrical limit.
    # ⚠️ No margin is left for the unresolved neutral jump (TUNING_STATUS.md
    # section 11: up to 0.036 servo between runs). When the neutral drifts
    # right, near-full-lock commands clip at servo_max, so the controller's
    # saturation ratio reads 1.0 while the car is still under-steering.
    # Planning remains symmetric and conservative at min(left, right)=0.3578.
    # Control alone may use the extra left range to recover tracking error.
    "vehicle/max_left_steering_angle_rad": 0.3800
    "vehicle/max_right_steering_angle_rad": 0.3578
    "vehicle/max_steering_rate_radps": 2.0
    "vehicle/max_accel_mps2": 5.5
    # 2026-07-31: 7.0 -> 4.0 (run_0731_223152 실측 제동 ~4.2 m/s²). 7.0이면
    # 속도 명령이 차가 못 따라가는 기울기로 떨어져 코너 진입 과속이 됨.
    # build_map.py A_DEC_MAX와 동일 유지할 것.
    "vehicle/max_decel_mps2": 4.0
    "vehicle/speed_scale": 1.0

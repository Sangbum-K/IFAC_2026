control:
  ros__parameters:
    # ROS interfaces shared by every environment.
    control_rate: 40.0
    local_waypoints_topic: /local_waypoints
    odom_topic: /pf/pose/odom
    frenet_odom_topic: /car_state/frenet/odom
    imu_topic: /sensors/imu/raw
    ackermann_topic: /ackermann_cmd
    estop_topic: /safety/emergency_stop
    service_name: /control/set_mode
    autonomous_on_start: false

    waypoint_timeout_sec: 0.25
    odom_timeout_sec: 0.25
    frenet_odom_timeout_sec: 0.25
    imu_acceleration_sign: -1.0
    # Receipt 시각만 갱신되는 stale-republish를 막기 위해 원본 header도 검사한다.
    "source_freshness/require_header_stamp": true
    "source_freshness/future_tolerance_sec": 0.1

    # 공용 파일은 control 단독 bench 운용을 위해 false. 실차/race/sim 환경
    # 프로파일은 planning stack과 함께 쓸 때 true로 덮어쓴다.
    # 두 토픽은 paired lease로 검증하며 stale·불일치·알 수 없는 상태는 모두 정지.
    "recovery/state_topic": /planner/recovery/state
    "recovery/target_speed_topic": /planner/recovery/target_speed
    "recovery/require_supervisor": false
    "recovery/command_timeout_sec": 0.25
    "recovery/pair_max_skew_sec": 0.10
    # 전용 후진 조향 경로와 후방 coverage가 없으므로 STOP-only가 기본.
    "recovery/allow_reverse": false
    "recovery/max_reverse_speed_mps": 0.30
    "recovery/max_forward_override_mps": 1.0

    # ETH Forza MAP/L1 controller parameters.
    "map/t_clip_min": 0.5
    "map/t_clip_max": 8.0
    "map/m_l1": 0.47
    "map/q_l1": -0.2
    # 0.25 유지. 2026-07-31 폐루프 스윕에서 0.35~0.6은 직선 투영이 코너
    # 건너편 웨이포인트 속도를 잡아 전부 악화 — 이 트랙 크기에선 0.25가 최적.
    # 제동 여유는 여기가 아니라 raceline 프로파일 mu 마진(build_map.py
    # MU_PROFILE 0.65 < 물리 0.75)으로 확보한다.
    "map/speed_lookahead": 0.25
    "map/lat_err_coeff": 0.0
    "map/acc_scaler_for_steer": 1.0
    "map/dec_scaler_for_steer": 1.0
    "map/start_scale_speed": 6.5
    "map/end_scale_speed": 10.0
    "map/downscale_factor": 0.5
    "map/speed_lookahead_for_steer": 0.0
    "map/max_lateral_error_m": 0.5
    "map/max_curvature_reference": 0.8
    "map/velocity_steer_gain_max": 1.0
    # local window 앞부분만 nearest 후보로 사용해 근접 평행/S자 구간 branch jump 방지.
    "map/nearest_search_horizon_m": 3.0

    # ── 추종 백스톱 (control_node.cpp:914-973) ─────────────────────────────
    # "차가 경로를 못 따라가고 있으면 속도를 강제로 깎는다"는 런타임 안전망.
    # raceline CSV와 무관하다. 플래너의 속도 계획이 실제 그립보다 낙관적일 때
    # 컨트롤러 단에서 받아내는 마지막 방어선이다.
    #
    # 트리거 두 개(경로오차 / 조향포화)가 OR로 묶여 있고, 각자 cap을 계산해
    # 낮은 쪽이 이긴다. 2026-08-08 이후 두 분기 모두 같은 비례식을 쓴다:
    #
    #     cap = speed_now - over * (speed_now - backstop_min_speed_mps)
    #
    # over(0~1)는 각 분기의 심각도다. 낙폭이 "현재 속도에서 하한까지 남은
    # 거리"에 비례하므로 이미 느리면 거의 안 깎이고 빠를수록 크게 깎인다.
    # 마지막에 하한으로 clamp되고, 지금 속도 명령보다 낮을 때만 적용된다.

    # 백스톱 전체 on/off.
    #   false → 안전망이 통째로 사라진다. ETH 원본의 횡오차 감속
    #           (map/lat_err_coeff)은 현재 0.0이라 no-op이므로 **대체 장치가
    #           하나도 없다.** 디버깅 목적으로만 끌 것.
    #   true  → 아래 두 트리거가 동작.
    "map/backstop_enabled": true

    # [트리거 1] 경로오차 램프의 시작점 [m].
    # 여기서 재는 오차는 raceline 기준 d(frenet_odom.y)가 아니라 **지금 따라가는
    # 로컬 경로**의 최근접 waypoint까지의 거리다. 회피 중에는 d가 커지는 게
    # 정상이라 d로 트리거하면 회피할 때마다 오발화한다.
    # 램프는 이 값에서 0%, **이 값의 2배**에서 100%다 (0.25 → 0.50 m).
    #   올리면 → 늦게·약하게 개입. 코너를 더 공격적으로 돌 수 있지만 트랙 이탈
    #            여유가 줄어든다. 0806 run_235014 사고는 오차가 1초 안에
    #            0.22 → 0.40 → 0.67로 벌어져 벽을 뚫었다. 0.5 이상으로 올리면
    #            그 사고를 못 잡는다 = 사실상 무력화.
    #   내리면 → 일찍·강하게 개입. 정상 주행의 추종 오차에 걸리기 시작한다.
    #            현재 레이스라인(코너 기울기 0.117)의 |lat err|max가 0.173이므로
    #            0.18 아래로 내리면 코너마다 상시 감속한다. 지금 0.25는 그
    #            0.173 대비 31% 여유를 둔 값이고, 이 여유를 지키려고 코너
    #            기울기를 0.114(오차 0.250) 대신 0.117로 골랐다.
    "map/backstop_path_error_m": 0.25

    # [트리거 2] 조향포화 램프의 **시작점** (트리거점이 아니다).
    # 포화율 = |조향각| / vehicle/max_steering_angle_rad. 0.36 rad 기준
    # 0.85 = 17.5°다. 조향각은 calc_steering_angle 말미에서 ±max로 클램프되므로
    # 포화율은 1.0을 넘지 못한다 → 램프 끝은 1.0 고정이고 별도 파라미터가 없다.
    #
    # 2026-08-08 이전에는 이 값을 넘는 순간 하한으로 **즉시** 잘랐다. 그게
    # 오발화했다: 0808 run_202157의 apex 5곳에서 경로오차가 3~7cm(추종은
    # 완벽)인데 계획된 레이스라인 자체가 20°를 요구해 포화만 87~96%로 떴고,
    # 그때마다 2.2~2.5 m/s를 1.5로 통째로 잘랐다. 145s 중 109s가 발화 상태,
    # 그중 87%가 하한 클램프. 지금은 비례 램프라 1.5에 닿으려면 포화 100%
    # (= 진짜 풀락)여야 한다.
    #
    # **올리고 내리는 방향이 목적에 따라 반대다:**
    #   올리면 (0.85 → 0.90) → 감속이 약해진다. 포화 96%에서 소진 비율이
    #            73% → 60%. 대신 램프 폭이 0.15 → 0.10으로 좁아져 게인이 커진다.
    #            LUT가 speed_now를 받아 조향각을 내므로 "감속 → 요구조향 감소
    #            → 포화 감소 → 해제 → 재가속" 폐루프가 있고, 게인이 크면 apex
    #            속도가 떨 수 있다.
    #   내리면 (0.85 → 0.80) → 더 일찍 개입하지만 램프가 넓어져 부드러워진다.
    #            apex에서 속도가 떠는 게 보이면 이 방향으로 갈 것. 직관과
    #            반대 방향이니 주의.
    #   1.0으로 두면 → 포화가 정확히 100%일 때만 걸려 사실상 비활성.
    # "약하게" + "부드럽게"를 동시에 원하면 이 값 대신 아래 하한을 올릴 것.
    "map/backstop_steer_sat_ratio": 0.85

    # 백스톱이 내려갈 수 있는 **바닥** [m/s]. 백스톱은 감속만 하고 정지는
    # 시키지 않는다(정지는 E-stop/recovery의 몫).
    #   올리면 → 최대 낙폭이 줄어 apex가 덜 느려진다. "감속이 너무 세다"에
    #            가장 직접적인 노브다. 대신 심각한 추종 실패에서도 이 속도
    #            밑으로 못 내려가 방어력이 약해진다. 참고로 아래 주석의 근거
    #            (BlendDist 조향 기하 하한 ≈ 2.4 m/s)를 따르면 2.0~2.4가
    #            현재 1.5보다 오히려 정합적이다.
    #   내리면 → 더 깊이 깎을 수 있다. 다만 약 2.4 m/s 아래로는 회피에 필요한
    #            조주거리가 더 줄지 않으므로 실익 없이 장애물 조우 시간만
    #            길어져 정지 라치 영역으로 들어간다.
    #
    # ⚠ 이 값이 프로파일의 vehicle/max_speed_mps 이상이면 **백스톱이 통째로
    #   무력화된다.** cap이 항상 하한으로 clamp되어 속도 명령보다 커지므로
    #   발화 조건(cap < speed_command)이 성립하지 않는다. 현재 race_map(1.0)과
    #   mapping(0.75) 프로파일이 그 상태다 — 저속 주행이라 의도상 문제는 없지만,
    #   **백스톱을 시험하려면 real_car(7.0) 프로파일이어야 한다.**
    "map/backstop_min_speed_mps": 1.5

    # Default to the temporary low-speed real-car LUT. Environment profiles
    # override this value where needed (for example, sim.yaml uses the SIM LUT).
    # 2026-08-08 NUC6_glc -> NUC2_hangar: 0807/0808 백 실측 15,386 쌍 채점에서
    # NUC2 가 전 속도대에서 더 정합(근거는 environments/real_car.yaml 주석).
    # 이제 mapping/race_map/real_car 가 모두 NUC2 로 일치한다.
    "map/steering_lut_file": "NUC2_hangar_pacejka_lookup_table.csv"

    # Vehicle geometry and command limits.
    "vehicle/wheelbase_m": 0.33
    "vehicle/max_speed_mps": 1.0
    # Limited by servo_max on the right side: beyond servo 0.7196 the servo
    # stalls against a mechanical stop. See ~/TUNING_STATUS.md.
    "vehicle/max_steering_angle_rad": 0.36
    "vehicle/max_steering_rate_radps": 2.0
    "vehicle/max_accel_mps2": 5.5
    # 2026-07-31: 7.0 -> 4.0 (run_0731_223152 실측 제동 ~4.2 m/s²). 7.0이면
    # 속도 명령이 차가 못 따라가는 기울기로 떨어져 코너 진입 과속이 됨.
    # build_map.py A_DEC_MAX와 동일 유지할 것.
    "vehicle/max_decel_mps2": 4.0
    "vehicle/speed_scale": 1.0

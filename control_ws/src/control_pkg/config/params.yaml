control:
  ros__parameters:
    # ROS interfaces shared by every environment.
    control_rate: 40.0
    local_waypoints_topic: /local_waypoints
    odom_topic: /pf/pose/odom
    frenet_odom_topic: /car_state/frenet/odom
    imu_topic: /sensors/imu/raw
    ackermann_topic: /ackermann_cmd
    estop_topic: /safety/emergency_stop
    service_name: /control/set_mode
    autonomous_on_start: false

    waypoint_timeout_sec: 0.5
    odom_timeout_sec: 0.5
    frenet_odom_timeout_sec: 0.5
    imu_acceleration_sign: -1.0

    # ETH Forza MAP/L1 controller parameters.
    "map/t_clip_min": 0.5
    "map/t_clip_max": 8.0
    "map/m_l1": 0.47
    "map/q_l1": -0.2
    "map/speed_lookahead": 0.25
    "map/lat_err_coeff": 0.0
    "map/acc_scaler_for_steer": 1.0
    "map/dec_scaler_for_steer": 1.0
    "map/start_scale_speed": 6.5
    "map/end_scale_speed": 10.0
    "map/downscale_factor": 0.5
    "map/speed_lookahead_for_steer": 0.0
    "map/max_lateral_error_m": 0.5
    "map/max_curvature_reference": 0.8
    "map/velocity_steer_gain_max": 1.0

    # Default to the temporary low-speed real-car LUT. Environment profiles
    # override this value where needed (for example, sim.yaml uses the SIM LUT).
    "map/steering_lut_file": "NUC6_glc_pacejka_lookup_table.csv"

    # Vehicle geometry and command limits.
    "vehicle/wheelbase_m": 0.33
    "vehicle/max_speed_mps": 1.0
    # Limited by servo_max on the right side: beyond servo 0.7196 the servo
    # stalls against a mechanical stop. See ~/TUNING_STATUS.md.
    "vehicle/max_steering_angle_rad": 0.36
    "vehicle/max_steering_rate_radps": 2.0
    "vehicle/speed_scale": 1.0

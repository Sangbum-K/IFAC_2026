# 레이스 맵 (real_car와 동일 인터페이스: TF map 변환 발행)
obstacle_detector_node:
  ros__parameters:
    scan_topic: /scan
    obstacle_topic: /perception/obstacles
    target_frame: map
    # real_car.yaml과 동일한 이유: timeout>0이면 rclpy가 20ms sleep 폴링으로
    # executor를 블로킹해 TF 콜백이 굶고, 0.15 max_age는 PF TF 지연 실측
    # (p90 123ms)의 경계선이라 전멸했다 (real_car.yaml 주석 참고).
    tf_timeout_sec: 0.0
    tf_allow_latest_fallback: true
    tf_max_age_sec: 0.3
    # time-travel lookup (real_car.yaml 주석 참고)
    tf_fixed_frame: odom
    range_max: 12.0
    # 클러스터링 임계값은 params.yaml의 lambda_angle_deg/sigma가 담당한다.
    gating_distance: 0.45
    track_timeout: 19        # 2026-08-11: 8 -> 19 (real_car.yaml 과 동일한 2.33x 재스케일)
    # 맵 벽 필터 — real_car.yaml과 동일한 이유 (좁은 트랙에서 벽이 통째로
    # 한 클러스터가 되어 트랙 한복판에 반경 수 m짜리 가짜 장애물이 생김).
    # 근거와 값 선정은 real_car.yaml 주석 참고.
    use_map_filter: true
    map_topic: /map
    wall_dist_min_m: 0.25
    # 0.35 -> 0.55 (2026-08-24). real_car 는 3b3af85 에서 이미 올렸는데 대회
    # 프로파일만 남아 있었다. 0.35 는 "이 크기를 넘는 원본은 벽으로 보고
    # 통째로 폐기"하는 선인데, 지금 트랙에 놓는 물체의 라이다 원시 반경이
    # p50 0.28~0.36 / p90 0.41 / max 0.478 이라 상당수 프레임에서 콘 자체가
    # 벽으로 분류돼 사라진다 — 브릿지 band 상한 0.44 보다 낮으면 "고정은
    # 하겠다는데 detector 가 먼저 버리는" 모순이라 불변식
    # test_static_cylinder_model_cannot_understate_extent 가 그 위를 막는다.
    # real_car 의 실차 근거: 0.35 는 상대차 측면(반경 0.28)까지는 통과시키지만
    # 실주행에서 상대차 클러스터가 잘려 나가는 경우가 있었다.
    max_cluster_radius_m: 0.55
    # 원본 반경 상한을 넘긴 것은 벽으로 보고 통째로 폐기한다. 분할하면 벽
    # fringe가 정상 장애물로 재생성돼 플래너 입력에 섞인다.
    cluster_split_enabled: false
    min_cluster_size: 8
    # 벽에서 0.50m 이상 떨어진 클러스터는 벽 fringe일 수 없으므로 4점까지
    # 허용한다. min_cluster_size 8은 벽 fringe 억제용인데, 그 대가로 벽에서
    # 먼 작은 물체(폭 0.2m = 4.5m 거리에서 ~4점)까지 잘렸다 —
    # run_0806_155621에서 15프레임 미검출로 통로에 '가짜 틈'이 생겼다.
    # 막힌 통로를 열렸다고 오판하면 그 틈으로 회피를 시도하므로 위험하다.
    min_cluster_size_open: 4
    open_space_dist_m: 0.50
    # 트랙 경계(Frenet) 필터 — real_car.yaml과 동일한 이유·값.
    # 전역 레이스라인이 있어야 동작하고, 없으면 조용히 미적용된다(fail-open).
    use_track_filter: true
    global_waypoints_topic: /global_waypoints
    track_bound_inflation_m: 0.10
    # 6.0 유지 — run_0806_155621 재생 스윕 결과(2026-08-06):
    #   view  유령율(초반 874프레임)  접근 장애물 최초 검출
    #    6      7.0%                  61.41s
    #    8      8.1%                  60.99s  (0.42s 빠름)
    #   10      8.5%                  60.99s  (8 대비 이득 없음)
    # 0.42s(3.8 m/s에서 ~1.6m)를 위해 유령을 +1.1%p 늘릴 값은 아니다.
    # 남은 유령의 주 원인은 s19.4~20.2 맵-실제 배리어 불일치이므로,
    # 그 맵을 고친 뒤 8.0을 재평가할 것.
    max_view_ahead_m: 6.0
    max_view_behind_m: 2.0

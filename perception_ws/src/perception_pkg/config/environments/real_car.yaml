obstacle_detector_node:
  ros__parameters:
    # real-car LiDAR topic from the IFAC hardware stack
    scan_topic: /scan
    obstacle_topic: /perception/obstacles
    # localization particle_filter의 map->odom TF + hardware TF(base_link->laser)
    # 체인이 있어야 한다. TF가 없으면 스캔을 스킵한다 (잘못된 좌표 발행 방지).
    #
    # base_link가 아니라 map이어야 한다. 트래킹/정적·동적 판별이 전부 이
    # 프레임에서 돌기 때문에, base_link로 두면 차가 달릴 때 정지한 장애물의
    # 좌표가 매 프레임 뒤로 흘러 속도(v_thresh)와 위치분산(dynamic_pos_std)이
    # 둘 다 튄다 -> 정적 장애물이 동적으로 오분류된다.
    # race_map.yaml은 원래부터 map이었고, real_car만 어긋나 있었다.
    # real_car.launch.py는 PF 수렴 게이트를 통과한 뒤에 스택을 띄우므로
    # 이 시점엔 map->base_link TF가 이미 있다.
    target_frame: map
    tf_timeout_sec: 0.05
    range_max: 12.0
    cluster_eps: 0.16
    gating_distance: 0.45
    track_timeout: 8
    # boundary_polygon_xy: 미설정 = 비활성 (빈 리스트 []는 rclpy 타입오류 유발 — 쓰지 말 것)
    #
    # ---- 맵 벽 필터 (필수) ----
    # 트랙이 11x9m라 range_max 12m 안에 맞은편 벽까지 전부 들어온다. 벽 리턴은
    # 연속이라 breakpoint 클러스터링이 벽 전체를 한 덩어리로 묶고, centroid가
    # 트랙 한복판에 반경 수 m짜리 가짜 장애물로 찍힌다.
    # run_0803_204743 실측: r=5.17m 장애물이 레이스라인 314점 중 207점을 덮어
    # "회피 포기(트랙경계)" -> TRAILING -> 정지, 이후 재출발 못 함.
    # boundary_polygon으로는 못 막는다 (루프 트랙 주행영역은 고리라 단일
    # 폴리곤으로 표현 불가). /map EDT로 클러스터링 전에 벽 포인트를 제거한다.
    use_map_filter: true
    map_topic: /map
    # PF 보정 오차보다 작아야 진짜 장애물이 안 깎이고, 벽 리턴 산포보다는
    # 커야 벽이 샌다. 차폭 0.30m -> 벽에 붙은 상대도 중심은 >=0.15m 떨어져
    # 있어 트랙쪽 면 포인트가 남는다.
    wall_dist_min_m: 0.15
    # 2차 방어선: F1TENTH 차량(0.30x0.55m)의 클러스터 반경은 ~0.32m.
    # 맵 필터가 PF 오차로 흔들려 벽 리턴이 새더라도 이 크기를 넘으면 장애물이
    # 아니다. 트래킹 전에 버려 재식별/코스팅으로 되살아나지 않게 한다.
    max_cluster_radius_m: 0.60

obstacle_detector_node:
  ros__parameters:
    # real-car LiDAR topic from the IFAC hardware stack
    scan_topic: /scan
    obstacle_topic: /perception/obstacles
    # localization particle_filter의 map->odom TF + hardware TF(base_link->laser)
    # 체인이 있어야 한다. TF가 없으면 스캔을 스킵한다 (잘못된 좌표 발행 방지).
    #
    # base_link가 아니라 map이어야 한다. 트래킹/정적·동적 판별이 전부 이
    # 프레임에서 돌기 때문에, base_link로 두면 차가 달릴 때 정지한 장애물의
    # 좌표가 매 프레임 뒤로 흘러 속도(v_thresh)와 위치분산(dynamic_pos_std)이
    # 둘 다 튄다 -> 정적 장애물이 동적으로 오분류된다.
    # race_map.yaml은 원래부터 map이었고, real_car만 어긋나 있었다.
    # real_car.launch.py는 PF 수렴 게이트를 통과한 뒤에 스택을 띄우므로
    # 이 시점엔 map->base_link TF가 이미 있다.
    target_frame: map
    # tf_timeout은 반드시 0으로. rclpy Buffer는 timeout>0이면 20ms 단위
    # sleep 폴링을 하므로(geometry2 #327) 0.005를 줘도 매 스캔 최소 20ms씩
    # executor를 블로킹해 /tf 콜백이 굶는다. exact-time lookup은 어차피
    # 구조적으로 실패한다: PF가 map->odom을 scan 시각 stamp로 ~60-100ms
    # 늦게 발행하므로, 처리 시점에 그 scan 시각을 커버하는 TF는 없다.
    # 0이면 즉시 실패 -> latest 폴백으로 넘어가고 sleep 루프를 안 탄다.
    tf_timeout_sec: 0.0
    tf_allow_latest_fallback: true
    # scan시각-최신TF시각 간격 실측: p50 83ms / p90 123ms / max 240ms
    # (run_0731_221633). 0.15는 경계선이라 노드 내부 지연이 더해지면 전멸
    # -> 출발 불가 재발. 0.3 = p90 + 여유.
    tf_max_age_sec: 0.3
    # time-travel lookup: laser->odom은 scan 정시각, odom->map은 latest로
    # 합성. latest 폴백의 주행 중 오차(속도 x TF지연, 6m/s x 0.3s = 최대
    # 1.8m)가 PF 보정 드리프트 수준으로 줄어든다. odom->base_link
    # (vesc_to_odom, ~47Hz)가 scan 시각을 아직 못 덮은 스캔은 자동으로
    # latest 폴백(위 0.3s 게이트)으로 내려간다.
    tf_fixed_frame: odom
    range_max: 12.0
    # 클러스터링 임계값은 params.yaml의 lambda_angle_deg/sigma가 담당한다
    # (거리 적응형이라 환경별 고정 eps가 불필요 — 구 cluster_eps 제거).
    #
    # 장애물 인지 재활성화 (2026-08-06). 08-05에 걸어둔 킬스위치
    # (min_cluster_size: 100000)를 제거했다. 그때 끈 이유는 벽이 반경 2m대
    # 클러스터로 잡혀 트랙 폭을 통째로 덮고 spliner가 Trailing(v_target=0)으로
    # 떨어져 출발 자체를 못 한 것이었다 (run_0805_001936). 그 원인인 벽/장애물
    # 구별을 아래 3단 필터로 잡았고, rosbag_0801 두 런(5487스캔) 재생으로
    # 검증했다 — 레이스라인을 막는 유령 프레임 25.8%/17.0% -> 5.4%/8.6%,
    # 한 프레임 최대 유령 수 4~5개 -> 2~3개, 장애물 검출률은 동일.
    #
    # 최소 클러스터 점수. ForzaETH detect의 min_size_n(=10)에 해당한다.
    # 5 -> 8: 벽 fringe(맵 필터를 통과한 벽 리턴 몇 점)가 대부분 8점 미만이라
    # 여기서 걸린다. 0801 재생에서 유령 프레임 14.2% -> 11.8%. 상한은 검출률이
    # 정한다: 4.5m 거리의 0.30m 폭 차량이 ~15점이고 SAFETY_FACTOR 0.5의 과분할이
    # 겹치므로, 10 이상이면 벽에 붙은 장애물 검출이 94% -> 59%로 무너진다.
    #
    # ⚠️ 이 값을 크게 잡으면 장애물 검출이 통째로 꺼진다. jaldallim a104228 이
    # 실험용으로 10000000 을 넣어뒀던 것을 병합(2026-08-07)에서 8 로 되돌렸다.
    # 검출을 끄고 싶으면 여기 말고 launch 에서 노드를 빼라 — 값으로 끄면 위
    # 근거 주석과 어긋난 채 남아 다음 사람이 켜져 있다고 믿는다.
    #
    # ══ 2026-08-24: 8 -> 6. 물체가 절반이 됐다 (지름 0.58 -> 0.30 실측) ═══
    # 점 수는 물체 폭에 비례하므로 임계를 그대로 두면 탐지 여유가 사라진다.
    # Hokuyo UST 0.25 deg/beam (sensors.yaml cluster:1 skip:0), 과분할은
    # kSafetyFactor 1.0 이라 없다 (clustering.hpp, 08-18 원식 복귀).
    # 지름 0.30 물체가 받는 점 수:
    #     2.5 m 27.5 pt | 4 m 17.2 | 6 m 11.5 | 8 m 8.6 | 11 m 6.3
    # 실제로 쓰이는 상한은 range_max 가 아니라 **max_view_ahead_m 8.0** 이고,
    # 그 지점에서의 여유가 판단 기준이다:
    #     임계 8 -> 8.6 pt,  여유 +7 %   <- 부분 가림 한 번이면 떨어진다
    #     임계 6 -> 8.6 pt,  여유 +43 %  <- 채택
    #     임계 4 -> 8.6 pt,  여유 +115 % <- 벽 fringe 를 너무 연다
    #
    # 4 가 아니라 6 인 이유는 **코너**다. 맵 벽거리 필터가 코너에서 놓치는
    # 벽 위 유령이 이 저장소의 실측 사고다 (실측 d=-0.85 가 경계 1.32 를
    # 통과, 4434 점 전부 벽 — bridge 의 wall_dist_min_m 주석). 접선 입사에서는
    # 자세가 조금만 틀어져도 기대 벽거리가 미터 단위로 튀므로 (use_ray_filter
    # 주석: 5~6 m 에서 31.7 %, 6~7 m 에서 53.0 % 의 빔이 0.5 m 넘게 흔들림)
    # 코너 fringe 는 점 수가 적은 형태로 새어 들어온다. 8 은 그 4~7 점짜리를
    # 걸러 주던 값이고 (0801 재생 5 -> 8 로 유령 프레임 14.2 % -> 11.8 %),
    # 4 로 내리면 그 억제가 통째로 사라진다. 6 은 그중 4~5 점짜리를 계속
    # 막으면서 8 m 지점 여유를 +7 % -> +43 % 로 회복한다.
    #
    # ⚠️ 그래도 6~7 점짜리 fringe 는 새로 들어온다. **첫 실주행 백에서 유령
    #    프레임 비율을 재고 판단할 것** — 11.8 % 대비 얼마나 오르는지가 기준이고,
    #    특히 코너 구간(s 별 분포)을 따로 볼 것. 남은 방어선은 맵 벽거리
    #    (wall_dist_min_m 0.25) + 트랙경계 Frenet 필터 + max_cluster_radius_m
    #    셋뿐이다. 유령이 회랑을 막아 못 가는 것이 08-05 의 실패 모드다.
    # ⚠️ 되돌리려면 8 / 4 로. 그때는 8 m 지점 여유가 +7 % 로 돌아간다.
    min_cluster_size: 6
    # 벽에서 0.50m 이상 떨어진 클러스터는 벽 fringe일 수 없으므로 더 낮은
    # 임계까지 허용한다. min_cluster_size는 벽 fringe 억제용인데, 그 대가로
    # 벽에서 먼 작은 물체까지 잘렸다 — run_0806_155621에서 15프레임 미검출로
    # 통로에 '가짜 틈'이 생겼다. 막힌 통로를 열렸다고 오판하면 그 틈으로
    # 회피를 시도하므로 위험하다.
    # 2026-08-24: 4 -> 3 (위와 같은 비율 유지, base:open = 2:1).
    # 지름 0.30 / 임계 3 이면 22.9 m 까지 검출되어 max_view_ahead 8 m 전
    # 구간을 크게 덮는다. 2 로 더 내리지 않은 이유: 2 점 클러스터는 반경
    # 추정이 사실상 없고, 브릿지 band 하한 0.02 가 그런 프레임도 고정 반경
    # 0.15 로 발행하므로 노이즈 2 점이 **없는 30 cm 장애물**이 된다.
    min_cluster_size_open: 3
    open_space_dist_m: 0.50
    gating_distance: 0.45
    # 2026-08-11: 8 -> 19. params.yaml 의 2.33x 프레임 재스케일과 같은 이유이며,
    # track_timeout 은 **모든 env 오버레이가 베이스를 덮으므로** 여기도 같이
    # 고쳐야 실차에 반영된다 (베이스만 고치면 죽은 값이 된다).
    # 8 @6.6Hz = 1.21s -> 19 @15.4Hz = 1.23s.
    # 재스케일 안 하면 0.52s 로 줄어 reid_timeout_sec 1.0 보다 짧아지고,
    # occlusion 구간에서 트랙이 먼저 죽어 재식별에만 의존하게 된다.
    track_timeout: 19
    # 스캔 처리율 상한 [Hz]. 코드 기본값(20.0)과 같은 값을 **명시**한다 —
    # 위 track_timeout 을 비롯한 프레임 단위 상수 5개(params.yaml 의 2.33x 블록)가
    # 전부 "15.4Hz 로 돈다"는 가정 위에 서 있는데, 그 Hz 를 결정하는 유일한
    # 노브가 이 값이었고 지금까지 어느 yaml 에도 없어서 가정이 코드 기본값에
    # 암묵적으로 매달려 있었다. 여기를 바꾸면 그 5개를 같이 다시 계산해야 한다.
    #
    # 2026-08-11 차량 실측(Jetson Orin Nano Super, run_0810_233206 재생):
    #   20.0        -> 출력 15.49 Hz, dt {50,70,80}ms, CPU p50 7.3%
    #   40.0        -> 출력 22.54 Hz, dt p50 49.9ms,   CPU p50 8.0%
    # 스캔이 20/30ms 이봉이라 스로틀이 항상 한 프레임을 더 걸러내서, 어떤
    # 설정을 줘도 스캔율(39.9Hz)의 40~57% 만 처리된다.
    #
    # 2026-08-12: 20.0 -> 60.0 (= 스로틀 사실상 해제, 스캔당 1회 = ~40 Hz).
    # 위 "프레임 상수 5개와 한 세트로 움직여야 한다"는 경고는 params.yaml 의
    # 초 단위 창(track_timeout_sec / n_confirm_sec / n_release_sec /
    # dynamic_release_sec / pos_hist_sec)이 들어오면서 해소됐다 — 노드가 실측
    # 처리주기 EMA 로 프레임 수를 재환산하므로(refresh_frame_windows) Hz 가
    # 바뀌어도 벽시계 창이 보존된다. rosbag0812 run_0812_013630 로그에서
    # 15.4 Hz 기준 track_timeout=12 / n_confirm=12 로 재환산되는 것을 확인했다
    # (env 의 track_timeout: 19 프레임값은 이미 죽은 값이다).
    # min_period_ = 1/60 = 16.7ms < 스캔 최단 도착간격 20ms 이므로 모든 스캔이
    # 통과한다. 40.0 은 min_period 25ms 라 20ms 도착분을 계속 걸러낸다.
    #
    # 얻는 것: 프레임 도메인 게이트인 min_hits(3)의 벽시계 지연이
    #   0.19s @15.5Hz -> 0.075s @40Hz. 6.5 m/s 직선에서 1.2m -> 0.5m.
    # rosbag0812 실측으로 이 지연이 문제인 게 확인됐다 — 안정 검출거리
    # 2.5m(0.38s) 대비 필요 예산 4.3m(0.66s: 기동 0.32 + 계획지연 0.15 + 확정).
    # 비용: CPU 15.5->22.5Hz 에서 7.3->8.0% 였으므로 40Hz 도 ~12% 예상(1코어).
    process_rate_hz: 60.0
    # boundary_polygon_xy: 미설정 = 비활성 (빈 리스트 []는 rclpy 타입오류 유발 — 쓰지 말 것)
    #
    # ---- 맵 벽 필터 (필수) ----
    # 트랙이 11x9m라 range_max 12m 안에 맞은편 벽까지 전부 들어온다. 벽 리턴은
    # 연속이라 breakpoint 클러스터링이 벽 전체를 한 덩어리로 묶고, centroid가
    # 트랙 한복판에 반경 수 m짜리 가짜 장애물로 찍힌다.
    # run_0803_204743 실측: r=5.17m 장애물이 레이스라인 314점 중 207점을 덮어
    # "회피 포기(트랙경계)" -> TRAILING -> 정지, 이후 재출발 못 함.
    # boundary_polygon으로는 못 막는다 (루프 트랙 주행영역은 고리라 단일
    # 폴리곤으로 표현 불가). /map EDT로 클러스터링 전에 벽 포인트를 제거한다.
    use_map_filter: true
    map_topic: /map
    # 0.15 -> 0.25. 스캔-맵 정합 오차(run_0805 실측 p99 0.70m) 때문에 0.15로는
    # 벽 리턴이 그대로 샌다. rosbag_0801 재생 실측(3m 앞 반경 0.15m 기둥 주입):
    #   0.15 : 유령 프레임 54.6%/88.0%
    #   0.25 : 유령 프레임 14.2%/19.0%, 벽에서 0.15~0.30m 장애물 검출 94%
    #   0.30 : 유령 프레임 17.1%/19.0%, 같은 장애물 검출 73%  <- 과함
    # 0.30이 오히려 유령이 늘어나는 건 포인트가 더 지워져 클러스터가 쪼개지고
    # max_cluster_radius_m에 안 걸리게 되기 때문이다. 0.25가 양쪽 다 최적.
    wall_dist_min_m: 0.25
    # ---- 레이 일관성 필터 (2026-08-16) ----
    # 위 wall_dist_min_m 이 못 잡는 반대편을 막는다. 벽거리 필터는 "벽에 가까운"
    # 점을 지우는데, 배리어를 **넘어간** 빔이 물고 온 점은 정의상 어느 벽에서도
    # 멀리 떨어져 있어 그대로 통과한다.
    #
    # run_0815_191056 실측 (tools/bag_analysis_0815/diagonal.py):
    #   벽보다 0.4m 이상 뒤에서 온 빔  중앙 2.5% / p90 12.6% / 최대 52.8%
    #   초과 거리 중앙 2.64m, 넘긴 벽까지 거리 중앙 3.36m
    #   거리 의존   0.5~1m 0.84%  ->  5.5~6m 35.6%
    #   피치 의존   0.5~1m -0.05%p(무관)  ->  6~6.5m +23.8%p
    #   종가속 U자  감속 5.65 / 정속 3.31 / 가속 7.32 %  (양쪽 다 오름 = 피치)
    # 그 점들이 코리도를 가로지르는 직선으로 찍혀 레이스라인을 막았다
    # (t=46.49: 직선 잔차 1.1cm, 길이 2.5m, s=31.2 d=-0.37 -> s=33.2 d=+1.15,
    #  785개 스캔·랩 0~7 에서 같은 자리 반복).
    #
    # ⚠️⚠️ 2026-08-16 정정: 위 "빔이 배리어를 넘는다"는 **틀린 해석이다.**
    #    실측 배리어 높이가 35 cm 이고 라이다는 base_link 위 0.1374 m 라,
    #    넘으려면 21.3 cm 를 올라가야 한다 = 2m 에서 6.10도 / 4m 에서 3.05도.
    #    1:10 차는 브레이킹으로 그만큼 숙이거나 들리지 않는다 (이 백에서 잡힌
    #    유일한 실제 지면-히트 사건의 피치가 1.7~2.1도, 그것도 4576 중 5프레임).
    #    위 종가속 U자도 반증이다 — 빔이 넘는 거라면 코가 들리는 **가속에서만**
    #    늘어야 하는데 감속(코 숙임)에서도 기준선 3.31 -> 5.65% 로 늘었다.
    #
    #    실제 정체는 **접선 입사 + 자세 오차의 정합 아티팩트**다. 빔은 배리어를
    #    정상적으로 맞았는데 맵이 말하는 벽 위치와 어긋나 "벽보다 뒤"로 계산된다.
    #    피치와 상관이 나온 건 피치가 PF 를 흔들기 때문이다 (|wy| 0~5 deg/s 에서
    #    PF OK 72.1% -> 20~40 deg/s 에서 37.3%). 가감속 양쪽이 다 PF 를 흔드니
    #    U자가 나온다. 그래서 **배리어 높이는 손댈 것이 없고**, 이 필터를 켤 수
    #    없는 이유도 여기 있다 — 정합 오차를 스캔 포인트를 버려서 고치려 하면
    #    맵이 국소적으로 어긋난 자리마다 진짜 장애물을 같이 버린다.
    #    근본 대책은 s24~32 구간 측위 개선이고 그건 localization 소관이다.
    # ⛔ 2026-08-16 현재 **비활성**. 구현·단위테스트는 끝났지만 백 A/B 가
    #    켜면 안 된다고 말한다 (tools/bag_analysis_0815/ab_rayfilter.py).
    #
    #    run_0815 재생 (벽필터 통과 21,596점 · 실물 콘 근처 5,912점):
    #      여유  넘김제거   실물 오검출
    #      1.5    74.2%     196점 (3.32%)   <- 기본값
    #      3.0    63.5%     100점 (1.69%)
    #      6.0    22.7%      49점 (0.83%)
    #    **어떤 여유에서도 실물 오검출이 0 이 되지 않는다.** 안정성 게이트를
    #    0.5 -> 0.25 로 조여도 오검출은 3.32 -> 3.03% 로 거의 안 줄고 넘김
    #    제거만 74 -> 62% 로 무너진다.
    #
    #    원인: 오검출이 접선 입사(게이트가 잡는 종류)가 아니다. 그 빔들은
    #    실측 4.65m / 기대 2.46m 로, **맵에 있는 벽을 실제 빔이 통과**했다 =
    #    맵에 실물에 없는 벽이 있다. 레이캐스트가 일관되게 그 유령 벽을 맞으니
    #    섭동 게이트로는 구조적으로 못 거른다.
    #
    #    그리고 원래 잡으려던 대각선(t=46.49)은 이 필터의 대상이 아니었다 —
    #    27점 전부 기대거리보다 **짧게** 왔고(차이 -0.66 ~ -11.05m), 6개 방위는
    #    맵 레이캐스트가 13.5m 안에서 벽을 아예 못 찾았다. 즉 그 대각선은
    #    "배리어를 넘어온 빔"이 아니라 **맵에 없는 실물 구조물**이다.
    #
    #    => 선행 조건은 맵 수정이다. s31~34 구간의 누락 경계와, 위 오검출을
    #       만드는 유령 벽을 함께 고친 뒤 이 A/B 를 다시 돌릴 것. 실물 오검출이
    #       0 이 되면 그때 켠다. 그 전에 켜면 통로가 열렸다고 오판한다
    #       (min_cluster_size 주석의 run_0806_155621 '가짜 틈'과 같은 사고).
    use_ray_filter: false
    # 1.5m — **작게 잡지 말 것**. 접선 입사에서는 자세가 조금만 틀어져도 기대
    # 벽거리가 미터 단위로 튄다. 같은 백에서 자세를 ±0.10m/±1.5도 흔들었을 때
    # 기대거리가 0.5m 넘게 흔들린 빔이 4~5m 15.7% / 5~6m 31.7% / 6~7m 53.0% 였고,
    # 하필 거기가 실물 최초 검출이 몰린 구간이다(중앙 4.82m, 94%가 4m 이상).
    # 넘김 초과가 중앙 2.64m 라 1.5m 여유로도 절반 이상은 여전히 걸린다.
    ray_filter_margin_m: 1.5
    # 안정성 게이트 — 빔 방향을 ±이만큼 흔들어 기대거리가 아래 값 이상
    # 흔들리면 그 빔은 판단하지 않고 살린다(fail-open). 거리 R 에서 R*dtheta
    # 의 횡변위라 5m·1.5도 = 13cm 로 위치오차 섭동을 덮는다.
    ray_filter_probe_deg: 1.5
    ray_filter_unstable_m: 0.5
    # 2차 방어선: F1TENTH 차량(0.30x0.55m)의 클러스터 반경은 ~0.32m.
    # 맵 필터가 PF 오차로 흔들려 벽 리턴이 새더라도 이 크기를 넘으면 장애물이
    # 아니다. 트래킹 전에 버려 재식별/코스팅으로 되살아나지 않게 한다.
    # 0.60 -> 0.35: 0.60은 차량 반경(0.32)의 두 배라 사실상 아무것도 못 막았다.
    # 0.35는 상대차 측면(0.55m -> 반경 0.28)까지 통과시키면서 벽 덩어리는 자른다.
    # 0.35 -> 0.55 (3b3af85): 0.35 는 상대차 측면(반경 0.28)까지는 통과시키는
    # 값이었지만 실주행에서 상대차 클러스터가 잘려 나가는 경우가 있었다.
    max_cluster_radius_m: 0.55
    # 초대형 원본은 벽으로 보고 통째로 폐기한다. 분할은 원본 반경을 잃어
    # 벽 fringe를 여러 정상 장애물로 재생성하므로 실차에서는 금지한다.
    # 상대차와 벽이 병합된 경우를 복구하는 실험은 bag A/B에서만 명시적으로
    # true로 바꾸고, 벽-fringe 발행률과 회피선 연속성을 함께 확인할 것.
    cluster_split_enabled: false
    # ---- 트랙 경계(Frenet) 필터 — ForzaETH laserPointOnTrack 이식 ----
    # 맵 벽거리와 직교하는 2차 기준. 벽거리만으로는 정합 오차 fringe를 못 잡고,
    # 문턱을 더 올리면 코리도(폭 0.96~2.42m)를 먹는다. 근거는 track_filter.py.
    use_track_filter: true
    global_waypoints_topic: /global_waypoints
    # 트랙 경계를 안쪽으로 줄이는 여유 (ForzaETH boundaries_inflation과 같은 값).
    track_bound_inflation_m: 0.10
    # 전방 s 시야창. 이게 이 트랙에서 제일 크게 먹힌다 — 29.6m 루프라 반대편
    # 벽이 유클리드로는 range_max 12m 안이지만 s로는 반 바퀴 밖이다.
    # 0801 재생에서 레이스라인을 막는 유령의 s는 p50 8.0m / p90 11.3m로 전부
    # 실효 인지거리(run_0805 실측 ~4.5m) 밖이었다. 4.0으로 더 줄이면 5m 앞
    # 장애물 검출이 0%가 되므로 6.0이 하한이다.
    # 6.0 유지 — run_0806_155621 재생 스윕 결과(2026-08-06):
    #   view  유령율(초반 874프레임)  접근 장애물 최초 검출
    #    6      7.0%                  61.41s
    #    8      8.1%                  60.99s  (0.42s 빠름)
    #   10      8.5%                  60.99s  (8 대비 이득 없음)
    # 0.42s(3.8 m/s에서 ~1.6m)를 위해 유령을 +1.1%p 늘릴 값은 아니다.
    # 남은 유령의 주 원인은 s19.4~20.2 맵-실제 배리어 불일치이므로,
    # 그 맵을 고친 뒤 8.0을 재평가할 것.
    # 2026-08-10 시뮬 재확인: 6 -> 10 으로 올려도 플래너가 보는 가용거리가
    # 4.7 -> 4.0 m 로 **안 늘었다**. 실제 제한은 이 필터가 아니라 코너에서의
    # 라이다 가림 + 검출 지연이다 (실차 실측 유효 인지거리 ~4.5m 와 같은 결론).
    # 유령 +1.1%p 를 지불할 이유가 없으므로 6.0 유지.
    #
    # 2026-08-13: 6.0 -> 8.0. 위 "맵을 고친 뒤 8.0을 재평가할 것"의 실행이다
    # (my_track0813 이 그 새 맵). run_0813_165312 t=104.7 구간을 스캔부터
    # 단계별로 재현해 확정했다 — s=1.90 의 실물(맵 벽에서 0.50m)을 라이다는
    # t=103.6(거리 10.4m)부터 8~17점으로 계속 보고 있었고 벽 필터도 통과했는데,
    # 이 s 게이트가 전부 버렸다. 살아난 첫 프레임의 s갭이 정확히 6.00m 였다:
    #     s갭 6.40/6.20/6.10 -> 트랙필터 후 0점
    #     s갭 6.00           -> 9점,  5.90 -> 19점 -> t=104.82 발행
    # 즉 검출을 늦춘 건 min_cluster_size(그 순간 이미 9~19점)도 벽 필터도 아닌
    # 이 값 하나다. 8.0 이면 같은 물체를 t=104.40 / 거리 8.0m 에서 잡는다
    # (0.38s · 2.3m 빠름 — 위 0806 스윕의 0.42s 와 일치).
    #
    # 지불하는 값: 위 스윕 기준 유령 +1.1%p. 그 유령의 주원인이던 s19.4~20.2
    # 맵 불일치가 my_track0813 에서 사라졌다는 게 이 변경의 전제이므로,
    # 0813 백 6.0 vs 8.0 A/B 검증 후 8.0을 유지했다. 세부 결과는 validation artifacts 참조.
    #
    # 필요한 이유: 발행 시점 거리 5.73m @ v=5.8m/s = 반응 예산 0.99s 인데,
    # 주석에 적힌 필요 예산 0.66s 는 3.8m/s 기준이라 기동거리가 더 긴
    # 5.8m/s 에서는 여유가 사실상 없다.
    max_view_ahead_m: 8.0
    max_view_behind_m: 2.0

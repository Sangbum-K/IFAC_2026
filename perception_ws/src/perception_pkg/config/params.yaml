obstacle_detector_node:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /odom
    imu_topic: /sensors/imu/raw
    obstacle_topic: /perception/obstacles
    # 노드가 TF로 laser -> target_frame 실좌표 변환 후 발행한다
    # (구 frame_id_override는 라벨만 바꿔 좌표가 어긋나던 버그로 제거됨).
    target_frame: map
    base_frame: base_link
    tf_timeout_sec: 0.05
    # 고속주행 안전 계약: scan 원본 시각의 exact-time TF만 사용한다.
    require_source_stamp: true
    max_source_age_sec: 0.20
    source_future_tolerance_sec: 0.05
    tf_allow_latest_fallback: false
    tf_max_age_sec: 0.05
    # Bounded, timestamped scan geometry. IMU/odom callbacks only append to
    # these buffers; all beam timestamps are interpolated in one vectorized pass.
    odom_buffer_size: 200
    imu_buffer_size: 200
    sensor_sync_wait_sec: 0.005
    max_odom_interp_gap_sec: 0.08
    max_imu_interp_gap_sec: 0.08
    deskew_enabled: true
    deskew_max_scan_duration_sec: 0.05
    deskew_translation_scale: 1.0
    # Current VESC driver units are deg/s and g.
    imu_angular_velocity_scale: 0.017453292519943295
    imu_linear_acceleration_scale: 9.80665
    # Used only until base_link -> IMU TF becomes available.
    base_to_imu_rpy_deg: [0.0, 0.0, 0.0]
    level_reference_samples: 20
    level_reference_max_gyro_rad_s: 0.12
    level_reference_accel_tolerance_mps2: 2.5
    # Disabled in the generic profile. Real car enables it after loading its
    # measured 6DoF base_link -> laser transform.
    ground_filter_enabled: false
    ground_z_m: 0.0
    ground_range_tolerance_m: 0.08
    ground_range_tolerance_ratio: 0.04
    ground_endpoint_z_tolerance_m: 0.05
    ground_min_component_beams: 6
    ground_min_component_angle_deg: 4.0
    ground_min_component_span_m: 0.30
    max_planar_elevation_deg: 4.0
    degraded_offplane_fraction: 0.55
    degraded_ground_fraction: 0.70
    attitude_fallback_tilt_deg: 4.0
    attitude_ground_evidence_fraction: 0.05
    attitude_ground_evidence_min_beams: 6
    attitude_evidence_max_abs_angle_deg: 80.0
    degraded_valid_fraction: 0.25
    ground_min_retained_beams: 20
    range_min: 0.1
    range_max: 10.0
    fov_min_deg: -80.0
    fov_max_deg: 80.0
    median_kernel: 3
    # adaptive breakpoint 클러스터링 (구 cluster_eps 대체).
    # 임계값이 센서 거리에 비례해 커지므로 환경별 eps 튜닝이 필요 없다.
    lambda_angle_deg: 10.0    # 허용 표면 입사각 — 클수록 관대(덜 쪼갬)
    sigma: 0.015              # 라이다 거리 노이즈 [m]
    min_cluster_size: 5
    # 0.5 -> 0.25. 게이트가 실제 클러스터 분리거리보다 크면 한 ID가 서로 다른
    # 물체 사이를 왕복한다 — rosbag_0806 run_234734 #53 실측: 반경 0.157m
    # 실물(2.05,0.13)과 반경 0.005m 파편(2.35,0.10)이 0.30m 떨어져 있는데
    # 게이트 0.45가 둘 다 받아들여 KF 속도가 0.47 m/s로 튀었다.
    # 20Hz에서 상대속도 2 m/s면 프레임당 0.10m이고 KF가 예측하므로 잔차는
    # 그보다 훨씬 작다 — 0.25는 충분한 여유다. occlusion 후 재획득은
    # reid_distance(0.7)가 따로 담당한다.
    gating_distance: 0.25
    # 크기 일관성 게이트: 트랙이 보던 반경 대비 후보 반경 비가 이 배수를
    # 넘으면 매칭하지 않는다. 위 #53 사례는 반경비가 31배였다.
    # 실제 물체의 프레임 간 반경 변동(부분 가림)은 2배 안쪽이라 4.0은 여유.
    radius_ratio_max: 4.0
    track_timeout: 10
    # 재식별(occlusion 후 같은 id 부활) + 미확정 트랙 게이팅
    reid_distance: 0.7        # 소멸 트랙 예측위치와 이 거리 이내 재등장이면 같은 id
    reid_timeout_sec: 1.0     # 소멸 트랙을 이 시간 동안 재식별 후보로 보관
    min_hits: 3               # 이만큼 관측돼야 장애물로 발행 (1~2프레임 노이즈 억제)
    # 정적/동적 판별: 속도 + map 프레임 위치분산 + 상대 정체성
    #
    # 임계값은 "정지 물체가 실제로 얼마나 흔들려 보이는가"보다 커야 한다.
    # rosbag_0806 실측(자차가 **정지**한 구간이라 ego 이동/TF 지연 무관,
    # 같은 구간 PF는 std 0.006m로 안정):
    #   centroid 산포 p50 0.08 / p90 0.16~0.55 m,  KF |v| p90 0.24~0.48 max 1.20
    # 기존 0.25/0.20은 이 노이즈 아래라 정지 물체의 30%가 동적으로 분류됐다.
    # 트래커 관측 재생 A/B (4런 4147관측):
    #   gate .45 / 게이트없음 / v .25 / ps .20  ->  동적 27.4%, 플립 44
    #   gate .25 + rr 4.0                       ->  동적 19.8%, 플립 43
    #   gate .25 + rr 4.0 + v .40 / ps .30      ->  동적 13.7%, 플립 28   <- 채택
    #   gate .25 + rr 4.0 + v .50 / ps .35      ->  동적  8.4%, 플립 19
    # 0.50/0.35가 수치는 더 좋지만 실제로 느린 상대(0.4~0.5 m/s)를 정적으로
    # 볼 여지가 커진다. 0.40/0.30이면 그런 상대도 pos_hist_len(20프레임=1s)
    # 안에 0.30m 이상 움직여 분산 조건에 걸린다.
    v_thresh: 0.40            # 동적 판별 속도 임계 [m/s]
    n_confirm: 5              # 동적 확정 연속 프레임
    n_release: 8              # (일반 트랙) 정적 복귀 연속 프레임
    static_pos_std: 0.08      # 위치분산 이 미만 = 정적 근거 [m]
    dynamic_pos_std: 0.30     # 위치분산 이 초과 = 동적 근거 [m] (저속이어도)
    dynamic_release: 40       # 상대(한번 동적)의 정적 복귀 연속 프레임 (정체성 유지)
    pos_hist_len: 20          # 위치분산 판별 윈도우 [frames]
    # boundary_polygon_xy: 미설정 = 비활성 (빈 리스트 []는 rclpy 타입오류 유발 — 쓰지 말 것)
    # 맵 벽 필터: 기본 비활성 (맵 없이도 돌아야 하는 개발/디버그 기본값).
    # 실차/레이스는 environments/*.yaml에서 켠다 — 좁은 트랙에서는 필수.
    use_map_filter: false
    map_topic: /map
    wall_dist_min_m: 0.15
    # use_map_filter=true면 맵 수신 전까지 장애물 발행을 보류한다(벽 파편이
    # 유령으로 나가는 것 방지). 이 시간을 넘기면 시끄러운 error와 함께
    # 필터 없이 진행 — 맵서버가 죽었을 때 조용히 영구 침묵하지 않게.
    map_wait_timeout_sec: 10.0
    max_cluster_radius_m: 0.0   # 0 = 비활성
    # 트랙 경계(Frenet) 필터 — ForzaETH laserPointOnTrack 이식.
    # 맵 벽거리와 직교하는 2차 기준(근거는 track_filter.py). 전역 레이스라인
    # (/global_waypoints)이 필요하므로 여기서도 기본 비활성이고, 실차/레이스
    # 프로파일(environments/*.yaml)에서 켠다.
    use_track_filter: false
    global_waypoints_topic: /global_waypoints
    track_bound_inflation_m: 0.10   # 트랙 경계를 안쪽으로 줄이는 여유 [m]
    max_view_ahead_m: 6.0           # 자차 기준 전방 s 시야창 [m]
    max_view_behind_m: 2.0          # 후방 s 시야창 [m]

# 인지 결과 -> RViz 마커 (monitor.rviz "Obstacles" 디스플레이).
# 순수 구독자라 인지/플래닝 동작에는 영향이 없다.
obstacle_viz_node:
  ros__parameters:
    viz/input_topic: /perception/obstacles
    viz/output_topic: /perception/obstacle_markers
    # 0이면 무한 — 인지가 죽어도 마커가 남아 있어 오히려 위험하다. 유한값 유지.
    viz/marker_lifetime_sec: 0.5
    viz/body_height_m: 0.3
    viz/text_size_m: 0.25
    viz/min_diameter_m: 0.05

obstacle_detector_node:
  ros__parameters:
    scan_topic: /scan
    obstacle_topic: /perception/obstacles
    # 노드가 TF로 laser -> target_frame 실좌표 변환 후 발행한다
    # (구 frame_id_override는 라벨만 바꿔 좌표가 어긋나던 버그로 제거됨).
    target_frame: map
    tf_timeout_sec: 0.05
    # 고속주행 안전 계약: scan 원본 시각의 exact-time TF만 사용한다.
    require_source_stamp: true
    max_source_age_sec: 0.20
    source_future_tolerance_sec: 0.05
    tf_allow_latest_fallback: false
    tf_max_age_sec: 0.05
    range_min: 0.1
    range_max: 10.0
    fov_min_deg: -80.0
    fov_max_deg: 80.0
    median_kernel: 3
    # adaptive breakpoint 클러스터링 (구 cluster_eps 대체).
    # 임계값이 센서 거리에 비례해 커지므로 환경별 eps 튜닝이 필요 없다.
    # 허용 표면 입사각. ⚠️ 2026-08-18 정정: 예전 주석은 "클수록 관대(덜 쪼갬)"
    # 이라고 적혀 있었지만 **반대다**. d_max = r*sin(dphi)/sin(lambda-dphi) 라
    # lambda 가 커지면 분모가 커져 문턱이 작아지고 **더 쪼갠다**.
    # (실효 문턱은 clustering.hpp 의 kSafetyFactor 가 함께 정한다.)
    lambda_angle_deg: 10.0
    sigma: 0.015              # 라이다 거리 노이즈 [m]
    min_cluster_size: 5
    # 0.5 -> 0.25. 게이트가 실제 클러스터 분리거리보다 크면 한 ID가 서로 다른
    # 물체 사이를 왕복한다 — rosbag_0806 run_234734 #53 실측: 반경 0.157m
    # 실물(2.05,0.13)과 반경 0.005m 파편(2.35,0.10)이 0.30m 떨어져 있는데
    # 게이트 0.45가 둘 다 받아들여 KF 속도가 0.47 m/s로 튀었다.
    # 20Hz에서 상대속도 2 m/s면 프레임당 0.10m이고 KF가 예측하므로 잔차는
    # 그보다 훨씬 작다 — 0.25는 충분한 여유다. occlusion 후 재획득은
    # reid_distance(0.7)가 따로 담당한다.
    gating_distance: 0.25
    # 크기 일관성 게이트: 트랙이 보던 반경 대비 후보 반경 비가 이 배수를
    # 넘으면 매칭하지 않는다. 위 #53 사례는 반경비가 31배였다.
    # 실제 물체의 프레임 간 반경 변동(부분 가림)은 2배 안쪽이라 4.0은 여유.
    radius_ratio_max: 4.0
    # ⚠ 아래 track_timeout / n_confirm / n_release / dynamic_release /
    #   pos_hist_len 은 전부 **프레임 수**이고, 발행 주기가 바뀌면 의미가 같이
    #   바뀐다. 파이썬 detector 는 process_rate_hz 20 을 못 지키고 6.6Hz(0.246s)
    #   로 돌았고(planning params.yaml:239 의 run_0803_213313 분석) 이 상수들은
    #   전부 그 6.6Hz 기준으로 튜닝됐다. C++ 재작성(8706837) 후 rosbag0810
    #   run_0810_233206 재생 실측이 15.4Hz(dt p50 69.6ms / p95 80.2ms) 라
    #   **스케일 2.33x** 로 벽시계 창을 보존한다.
    #   재측정으로 Hz 가 바뀌면 2.33 만 갈아끼우면 된다.
    #
    #   ✅ 2026-08-19 해소 — 위 "근본 해결은 초 단위로 바꾸는 것" 을 했다.
    #   다섯 중 **track_timeout 만** 아직 프레임이고(그건 misses 와 비교하며
    #   misses 는 발행 사이클마다 오르므로 프레임이 맞다), 나머지 넷은
    #   *_sec 이 그대로 classifier/tracker 로 내려간다. 프레임 값들은
    #   *_sec 가 없을 때의 **폴백**으로만 남아 있다 (kLegacyTuneHz 15.4 로 환산).
    #
    #   왜 환산이 틀렸었나: 이 넷의 카운터는 **측정 프레임에서만** 전진하는데
    #   (classify_track 이 코스팅이면 즉시 반환) 노드는 **발행 주기**로 나눴다.
    #   run_0818 실측 발행 39.8 Hz / 이동 장애물 실측률 33% -> 실효 13 Hz 라
    #   n_confirm 0.78 s 창이 실제로는 2.33 s 로 동작했고, 조우가 1.5~3 s 라
    #   확정 전에 끝났다 (이동 트랙 50개 중 23개만 동적 확정).
    #
    #   2026-08-11 차량 컴퓨트(Jetson Orin Nano Super, MAXN_SUPER, 6코어)에서
    #   같은 백을 real_car 프로파일 + 맵 벽 필터 활성으로 재생해 확인:
    #       출력 15.49 Hz / dt p50 69.5 · p95 80.0 · max 83.3 ms
    #       detector CPU p50 7.3% / max 8.6% (1코어 기준)
    #   개발 PC 수치와 사실상 동일하므로 위 2.33x 는 차량에서도 유효하다.
    #
    #   ⚠ 다만 15.49 Hz 는 **연산 한계가 아니다** (CPU 여유 90% 이상). 아래
    #   process_rate_hz 스로틀과 스캔 지터의 맥놀이다:
    #     · /scan 도착 간격이 20ms / 30ms 이봉분포 (평균 25.05ms = 39.9Hz)
    #     · min_period_ = 1/20 = 50ms 이므로 직전 처리 이후 누적이 50ms 를
    #       넘는 첫 스캔만 통과 -> 출력 dt 가 {50, 70, 80} ms 로 양자화된다
    #     · 실제 관측 dt min 50.0 / p50 69.5 / max 83.3 이 정확히 그 집합이다
    #   따라서 rate 는 부하가 아니라 **LiDAR 지터 분포**에 따라 움직이고,
    #   같은 스로틀로도 이론상 12.5Hz(80ms) ~ 20Hz(50ms) 범위를 갖는다.
    #   = 아래 프레임 상수들이 뜻하는 벽시계 창에 ±30% 밴드가 있다는 뜻이다
    #     (track_timeout 23 -> 1.15s @20Hz ~ 1.84s @12.5Hz).
    #   process_rate_hz 를 40 으로 올려도 22.5Hz 까지만 오른다(같은 이유로
    #   25ms 스로틀이 20ms 도착분을 걸러낸다). 프레임 상수를 초 단위로
    #   바꾸기 전까지는 이 밴드를 안고 가는 것이고, 그래서 이 파일에서
    #   기준 Hz 를 바꾸는 유일한 노브인 process_rate_hz 를 실차 프로파일에
    #   **명시**해 둔다 (environments/real_car.yaml).
    track_timeout: 23         # was 10 @6.6Hz (1.52s) -> 23 @15.4Hz (1.49s)
    # ── 초 단위 창 (2026-08-11) ────────────────────────────────────────────
    # 위 프레임 상수들의 "근본 해결"로 예고돼 있던 것. 노드가 자기 실측 처리
    # 주기(EMA)로 프레임 수를 환산하므로, LiDAR 지터/스로틀 맥놀이로 출력이
    # 12.5~20 Hz 를 오가도 벽시계 창이 유지된다. 0 이면 비활성(프레임 값 사용).
    #
    # 값은 위 프레임 상수의 @15.4Hz 벽시계 길이를 그대로 옮긴 것이다 —
    # 이번 변경의 목적은 "창 길이를 바꾸는 것"이 아니라 "Hz 에 안 흔들리게"다.
    # 단 하나 track_timeout 만 1.49 -> 0.80 s 로 **줄인다**: 이게 coasting
    # (미관측 외삽) 길이이고, rosbag_0811 에서 유령의 수명이 0.9~1.4 s 로
    # 정확히 이 창이었다. 0.80 은 실물 콘이 가려지는 실측 최장 구간(코너 진입
    # ~0.6 s)보다 길고 유령 수명보다 짧다.
    track_timeout_sec: 0.80
    # 코너에서 CV 예측이 primary gate를 잠깐 벗어났을 때만 쓰는 2차 매칭.
    # 일반 association gate는 넓히지 않는다. 마지막 실측 후 0.25초 안이고
    # 반경이 맞는 이미 확정된 동적 트랙만 후보가 된다.
    dynamic_reacquire_gate_multiplier: 1.6
    # 0.20초는 코너 진입에서 한두 스캔이 빠졌을 때 너무 짧아, 여전히 살아 있는
    # 동적 트랙 대신 새 ID가 생길 수 있었다. 0.25초는 그 짧은 재획득 창만
    # 늘리며 일반 정적 트랙의 association/retire 수명은 바꾸지 않는다.
    dynamic_reacquire_timeout_sec: 0.25
    # active coast가 끝난 뒤 코너/FOV 이탈로 재등장한 상대는, map 좌표 CV
    # 직선 예측 대신 레이스라인 Frenet 진행량(s)·횡방향(d)으로만 보조 Re-ID한다.
    # 일반/정적 트랙에는 적용하지 않으며 후보가 하나일 때만 같은 ID를 복원한다.
    # 이 값은 retired cache의 추가 보관 시간이다. KF ghost 발행 시간은
    # track_timeout_sec(0.80s)로 그대로 제한된다.
    dynamic_frenet_reid_timeout_sec: 1.25
    dynamic_frenet_reid_lateral_gate_m: 0.45
    dynamic_frenet_reid_progress_slack_m: 0.80
    dynamic_frenet_reid_backtrack_m: 0.30
    # ── 확정 지연이 회피 진입거리를 먹는다 (2026-08-23) ──────────────────
    # 0.78 -> 0.40. 이 값은 물리량이 아니라 legacy 프레임 수(12 @15.4Hz)를
    # 초로 환산한 값이었다. 그런데 플래너 쪽에서 재면 **회피 예산 전체보다
    # 크다**:
    #   run 60초 실측 (ifac_roboracer, 정적 콘 1개)
    #     · LiDAR 최초 관측 ~6.4 m  (range_max 12.0, 헤어핀 시선)
    #     · 확정 지연 0.78 s x 4.3 m/s = -3.4 m
    #     · 플래너 최초 수신 3.03 m  (id 466/477 첫 프레임 nobs=0)
    #     · 차 반길이 -0.28 m -> 가용 2.35 m
    #   같은 지점(s=30.1, kappa 0.70)에서 0.5 m 회피에 **감속으로도 못 줄이는**
    #   진입거리 하한이 3.17 m 다. 즉 0.8 m 가 모자라 lane/spline/원호가 전부
    #   거부되고 트레일링으로 떨어졌다 (98/107 사이클 = 92%).
    # 0.40 이면 가용이 3.9 m 가 되어 하한을 넘긴다.
    #
    # ⚠️ 이건 유령 방어를 절반으로 줄이는 값이다. 남는 방어선:
    #    · 맵 벽 필터(use_map_filter) / 트랙경계 필터(use_track_filter)
    #    · spliner 의 cls_min_nb_meas(5) — 정적/동적 분류
    #    · spliner 의 commit_min_obs(7) — 회피 경로 **동결**
    #    확정과 커밋을 이중으로 걸어 도합 1.0 s(≈4.4 m)를 쓰고 있었다.
    #    "발행은 일찍, 동결은 늦게"가 이 구조의 원래 의도다.
    # ⚠️ sim/실차 공통값이다 (sim_real_car.yaml 이 이 키를 덮지 않는다). 실차
    #    투입 전에 유령 확정률을 반드시 다시 재라 — 지표는 spliner 의
    #    /pitwall/outcome_cluster_merge_blocks_track 과
    #    /pitwall/reject_escape_not_visible_static.
    # ── 2026-08-24 되돌림 (run_0824_164445) ──────────────────────────────
    # 위 블록이 요구한 실차 측정("유령 확정률을 반드시 다시 재라")을 했고,
    # 되돌림 조건이 충족됐다. 08-23 10:11 런(0.78)과 이번 런(0.40) 비교,
    # **주행거리로 정규화**하고 v>2 m/s 에서 새로 등장한 id 만 셌다:
    #     새 id            4.63 -> 19.12 개/100 m   (4.1 배)
    #     그중 수명<1.0 s   0.99 ->  7.60 개/100 m   (7.7 배)
    #     유령 비율          21% ->    40%           (레이아웃 무관 지표)
    #     프레임당 장애물    0.41 ->   1.44 개
    # 이 블록이 지목한 지표도 같이 갔다:
    #     /pitwall/outcome_cluster_merge_blocks_track  13.9 -> 1175.6 /100 s
    #     /pitwall/reject_escape_not_visible_static    47.3 ->   85.2 /100 s
    # 그리고 회피 성공률이 떨어졌다:
    #     /pitwall/outcome_ok_lane_switch              31.1 ->   12.2 /100 s
    # 확정 지연이 회피 진입거리를 먹는다는 위 논지 자체는 맞다. 다만 그 예산은
    # 유령 방어를 절반으로 깎아서 살 것이 아니라 회피 기하 쪽에서 벌어야 한다.
    # 되돌리기: 이 한 줄을 0.40 으로 (위 지표를 같이 재는 조건에서만).
    n_confirm_sec: 0.78
    n_release_sec: 1.23
    dynamic_release_sec: 6.04
    pos_hist_sec: 2.99
    rate_ema_alpha: 0.05
    # 재식별(occlusion 후 같은 id 부활) + 미확정 트랙 게이팅
    reid_distance: 0.7        # 소멸 트랙 예측위치와 이 거리 이내 재등장이면 같은 id
    reid_timeout_sec: 1.0     # 소멸 트랙을 이 시간 동안 재식별 후보로 보관
    # min_hits 만 프레임 수로 유지한다 — 이건 시간 창이 아니라 "센서 노이즈는
    # 프레임 단위로 뜬다"는 프레임 도메인 게이트다. 유지하면 검출 지연이
    # 0.45s(@6.6Hz) -> 0.195s(@15.4Hz) 로 줄어드는 순이득이고, 이게 이번
    # C++ 전환에서 planning 이 얻는 가장 큰 항목이다 (7m/s 에서 약 1.8m).
    min_hits: 3               # 이만큼 관측돼야 장애물로 발행 (1~2프레임 노이즈 억제)
    # 정적/동적 판별: 속도 + map 프레임 위치분산 + 상대 정체성
    #
    # 임계값은 "정지 물체가 실제로 얼마나 흔들려 보이는가"보다 커야 한다.
    # rosbag_0806 실측(자차가 **정지**한 구간이라 ego 이동/TF 지연 무관,
    # 같은 구간 PF는 std 0.006m로 안정):
    #   centroid 산포 p50 0.08 / p90 0.16~0.55 m,  KF |v| p90 0.24~0.48 max 1.20
    # 기존 0.25/0.20은 이 노이즈 아래라 정지 물체의 30%가 동적으로 분류됐다.
    # 트래커 관측 재생 A/B (4런 4147관측):
    #   gate .45 / 게이트없음 / v .25 / ps .20  ->  동적 27.4%, 플립 44
    #   gate .25 + rr 4.0                       ->  동적 19.8%, 플립 43
    #   gate .25 + rr 4.0 + v .40 / ps .30      ->  동적 13.7%, 플립 28   <- 채택
    #   gate .25 + rr 4.0 + v .50 / ps .35      ->  동적  8.4%, 플립 19
    # 0.50/0.35가 수치는 더 좋지만 실제로 느린 상대(0.4~0.5 m/s)를 정적으로
    # 볼 여지가 커진다. 0.40/0.30이면 그런 상대도 pos_hist_len(20프레임=1s)
    # 안에 0.30m 이상 움직여 분산 조건에 걸린다.
    v_thresh: 0.40            # 동적 판별 속도 임계 [m/s]
    # 아래 네 개는 이제 **폴백값**이다 — 실제로는 아래 *_sec 가 쓰인다
    # (2026-08-19, 위 ✅ 블록 참조). 값은 이력 보존을 위해 남겨 둔다.
    n_confirm: 12             # was 5  @6.6Hz (0.76s) -> 12 @15.4Hz (0.78s)
    n_release: 19             # was 8  @6.6Hz (1.21s) -> 19 @15.4Hz (1.23s)
    static_pos_std: 0.08      # 위치분산 이 미만 = 정적 근거 [m]
    dynamic_pos_std: 0.30     # 위치분산 이 초과 = 동적 근거 [m] (저속이어도)
    dynamic_release: 93       # was 40 @6.6Hz (6.06s) -> 93 @15.4Hz (6.04s)
    # 재스케일 안 하면 1.30s 로 줄어 rosbag_0806 으로 잡은 static_pos_std 0.08 /
    # dynamic_pos_std 0.30 의 근거(3초 창의 위치분산)가 통째로 무효가 된다.
    pos_hist_len: 46          # was 20 @6.6Hz (3.03s) -> 46 @15.4Hz (2.99s)
    # boundary_polygon_xy: 미설정 = 비활성 (빈 리스트 []는 rclpy 타입오류 유발 — 쓰지 말 것)
    # 맵 벽 필터: 기본 비활성 (맵 없이도 돌아야 하는 개발/디버그 기본값).
    # 실차/레이스는 environments/*.yaml에서 켠다 — 좁은 트랙에서는 필수.
    use_map_filter: false
    map_topic: /map
    wall_dist_min_m: 0.15
    # use_map_filter=true면 맵 수신 전까지 장애물 발행을 보류한다(벽 파편이
    # 유령으로 나가는 것 방지). 이 시간을 넘기면 시끄러운 error와 함께
    # 필터 없이 진행 — 맵서버가 죽었을 때 조용히 영구 침묵하지 않게.
    map_wait_timeout_sec: 10.0
    # ---- 레이 일관성 필터 ----
    # 맵 벽거리 필터의 반대편. 저쪽은 벽에 '너무 가까운' 점을, 이쪽은 벽보다
    # '뒤에서' 온 점을 버린다. 2D 에서 빔은 벽에 막히므로 벽보다 먼 거리를
    # 보고한 빔은 경계를 통과한 것이다 (차체 피치로 스캔 평면이 떠서 낮은
    # 배리어를 넘는다 — run_0815_191056 실측, 근거는 노드 주석).
    # use_map_filter=true 가 전제다(기대 벽거리 출처). 기본 비활성 — 맵 필터와
    # 같은 이유로 실차/레이스 프로파일에서 켠다.
    use_ray_filter: false
    ray_filter_margin_m: 1.5
    ray_filter_probe_deg: 1.5
    ray_filter_unstable_m: 0.5
    max_cluster_radius_m: 0.0   # 0 = 비활성
    # 초대형 원본은 벽으로 보고 통째로 버린다. 분할은 원본 크기 정보를
    # 잃어 벽 fringe를 정상 장애물로 되살리므로, 오프라인 A/B 외에는 금지.
    cluster_split_enabled: false
    # 트랙 경계(Frenet) 필터 — ForzaETH laserPointOnTrack 이식.
    # 맵 벽거리와 직교하는 2차 기준(근거는 track_filter.py). 전역 레이스라인
    # (/global_waypoints)이 필요하므로 여기서도 기본 비활성이고, 실차/레이스
    # 프로파일(environments/*.yaml)에서 켠다.
    use_track_filter: false
    global_waypoints_topic: /global_waypoints
    track_bound_inflation_m: 0.10   # 트랙 경계를 안쪽으로 줄이는 여유 [m]
    max_view_ahead_m: 6.0           # 자차 기준 전방 s 시야창 [m]
    max_view_behind_m: 2.0          # 후방 s 시야창 [m]

# 인지 결과 -> RViz 마커 (monitor.rviz "Obstacles" 디스플레이).
# 순수 구독자라 인지/플래닝 동작에는 영향이 없다.
obstacle_viz_node:
  ros__parameters:
    viz/input_topic: /perception/obstacles
    viz/output_topic: /perception/obstacle_markers
    # 0이면 무한 — 인지가 죽어도 마커가 남아 있어 오히려 위험하다. 유한값 유지.
    viz/marker_lifetime_sec: 0.5
    viz/body_height_m: 0.3
    viz/text_size_m: 0.25
    viz/min_diameter_m: 0.05
    # 주황 점/선 = 현재 KF posterior에서 이 시간 뒤의 CV 예상 위치.
    # 청록 구 + "KF COAST"는 이번 프레임에 실측이 없는 외삽 상태다.
    viz/prediction_horizon_sec: 0.30
    viz/prediction_marker_diameter_m: 0.16

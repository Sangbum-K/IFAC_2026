# =============================================================================
# Head-to-Head Local Planner 파라미터 (path_selection / frenet 공용)
#
# - 이 파일이 튜닝의 단일 진입점. 코드 안에 숨은 매직넘버 없음.
# - 키 이름은 ROS2 파라미터 스타일(계층형)로 맞춰둠 → 나중에 C++ 노드로 포팅 시
#   declare_parameter("local_planner/lattice/n_candidates") 식으로 1:1 대응.
# - 하드웨어 전제: Traxxas 순정 섀시/서보/모터 + NVIDIA Jetson Xavier NX
# =============================================================================

vehicle:
  # --- 기하 (실차 실측: 전폭 30 cm / 전장 55 cm) ---
  wheelbase_m: 0.33           # 축거. 실차 실측 = hardware vesc.yaml wheelbase
  length_m: 0.55              # 범퍼 포함 전장. 충돌 판정/추월 완료 판정에 사용
  width_m: 0.30               # 전폭. 트랙 경계 여유 계산에 사용 (반폭 0.15)
  # --- 조향 (실차 검증값) ---
  max_steer_rad: 0.36         # 최대 조향각 20.7deg. 실측 서보 포화 한계로,
                              #   순정 명목 24deg(0.4189)가 아님. TUNING_STATUS 기준.
                              #   control_pkg vehicle/max_steering_angle_rad와 동일 유지
  max_steer_rate_radps: 4.5   # 서보 속도 한계(60deg/0.17s@6V 무부하 -> 부하 고려 감축).
                              #   값을 올리면 심이 낙관적이 됨. 실차 잰 값으로 교체 권장
  # --- 종방향 (Velineon 3500kV + VXL-3s, 기존 raceline CSV 통계에서 도출) ---
  v_max_mps: 7.0              # 계획 최고속. 배터리 3S면 여유 있음. 트랙션 한계가 먼저 옴
  # 2026-07-31 run_0731_231343 실측으로 하향 (build_map.py A_ACC/A_DEC_MAX와 동일):
  # 가속은 모터 전류 30 A 포화(2.2 m/s²), 감속은 VESC 제동 전류가 전혀 없어
  # 코스팅 항력(~1.5 m/s²)뿐. VESC 제동이 생기면 실측 후 함께 올릴 것.
  a_acc_max_mps2: 2.2         # 최대 가속 (실측 p90 2.23)
  a_dec_max_mps2: 1.3         # 최대 감속 (코스팅 전용 실측 -1.5에 여유)
  mu: 0.85                    # 타이어-노면 마찰계수. 순정 타이어+실내 바닥 기준.
                              #   횡가속 한계 = mu * 9.81. 미끄러지면 제일 먼저 내릴 값

local_planner:
  # --- 공통 (local_trajectory_node 인터페이스와 호환) ---
  output_num_waypoints: 80    # 출력 로컬 웨이포인트 수. local_trajectory_node의
                              #   num_local_waypoints=80과 동일하게 유지 (controller 호환)
  output_ds_m: 0.1            # 출력 웨이포인트 간격. raceline CSV 간격과 동일
  planning_horizon_m: 25.0    # planner 내부 충돌/후보 판단 거리 (출력 8m보다 길게).
                              #   상대속도 3m/s로 따라잡을 때 ~8s 내다보는 거리.
                              #   늘리면 일찍 회피 시작하지만 예측 불확실성 증가
  replan_hz: 20.0             # 재계획 주기. Jetson NX에서 Python은 20Hz 권장,
                              #   C++ 포팅 시 40Hz(local_trajectory loop_rate와 동일) 가능
  # --- 안전 마진 (충돌 판정용, Frenet 좌표계) ---
  safety_s_base_m: 0.8        # 종방향 기본 마진 (차 길이 외 추가 여유)
  safety_s_gain_s: 0.25       # 속도 비례 종방향 마진 [s]: margin += gain * v_ego.
                              #   상대 추정 지연(perception latency)이 크면 늘릴 것
  safety_d_m: 0.25            # 횡방향 마진 (차 폭 외 추가 여유).
                              #   추월이 너무 소심하면 줄이고, 접촉 나면 늘릴 것
  # --- 관측 불확실성 -> 마진 확장 (Obstacle.msg의 s_var/d_var/vs_var 사용) ---
  uncertainty_gain: 1.0       # 마진 확장 = gain * sigma. 종방향 sigma는
                              #   sqrt(s_var + vs_var*t^2)로 예측 시간에 비례 성장.
                              #   0이면 분산 무시(기존 동작). 노이즈 환경에서
                              #   너무 소심해지면 0.5로, 접촉 나면 1.5로
  uncertainty_margin_max_m: 1.0  # 불확실성 마진 상한. 긴 호라이즌(3.5s)에서
                              #   sigma가 무한정 커져 전 후보가 막히는 것 방지
  track_margin_m: 0.05        # 트랙 경계 '추가' 여유. raceline CSV의 d_left/d_right엔
                              #   이미 생성 margin(0.15m)이 차감돼 있으므로 여긴 소폭만.
                              #   크게 잡으면 좁은 구간에서 회피 후보 전멸 -> follow만 함

  # ===========================================================================
  # 방식 1: Path Selection (lattice) — d-offset 후보 경로 중 최소 비용 선택
  # 특징: 계산 싸고 강건. 상대 추정 노이즈에 둔감. 해상도는 후보 개수에 묶임
  # ===========================================================================
  lattice:
    n_candidates: 11          # 횡방향 후보 수 (홀수 권장: 중앙=raceline 포함).
                              #   Jetson NX 예산: 11개 × 100샘플 벡터화 ≈ 1-3ms.
                              #   후보 간격이 성기면 15~21로 상향
    d_max_m: 1.2              # 후보 offset 상한 [m]. 후보는 '가용 코리도 비율'로
                              #   깔리고(호라이즌 내 최소 가용폭 기준) 이 값으로 캡.
                              #   가용폭 = min(d_left|d_right) - 차반폭 - track_margin
    transition_length_m: 6.0  # 현재 d → 목표 d 전환 구간 길이 (quintic).
                              #   짧으면 급조향(서보 한계 초과 위험), 길면 회피 굼뜸.
                              #   최소값 가이드: v * 1.0s (7m/s면 7m)
    # --- 비용 가중치 (상대 스케일만 의미 있음) ---
    w_progress: 1.0           # 속도 손실 페널티 (빠른 경로 선호)
    w_deviation: 0.35         # raceline 이탈 |d| 페널티 (라인 복귀 선호).
                              #   너무 크면 추월 안 하고 뒤에 붙음
    w_smoothness: 0.5         # 횡가속(곡률 변화) 페널티. 서보 무리/미끄러짐 억제
    w_safety: 1.5             # 상대와의 근접 페널티 (1/clearance).
                              #   접촉 사고 나면 제일 먼저 올릴 값
    w_switch: 0.8             # 이전 선택 대비 변경 페널티 (hysteresis).
                              #   후보 간 진동(채터링) 생기면 올릴 것
    follow_gap_s: 1.2         # 추월 불가 시 추종 시간 간격 (ACC 방식).
                              #   앞차 뒤 v_opp * gap 거리 유지

  # ===========================================================================
  # 방식 2: Frenet Optimal (Werling) — (s(t), d(t)) 시공간 다항식 샘플링
  # 특징: 시간축까지 계획해서 추월 타이밍이 정교. 계산 무겁고 예측 품질에 민감
  # ===========================================================================
  frenet:
    # --- 횡방향 후보: quintic d(t), (d0,d0',d0'') → (d_target, 0, 0) ---
    d_target_fractions: [-1.0, -0.66, -0.33, 0.0, 0.33, 0.66, 1.0]
                              # 종단 횡 offset 후보를 '가용 코리도 비율'로 지정
                              #   (-1=우측 한계, +1=좌측 한계, 0=raceline).
                              #   실제 [m]는 매 replan마다 트랙 폭에서 환산.
                              #   개수를 늘리면 품질↑ 계산량↑ (NX 예산 주의)
    t_horizons_s: [1.5, 2.5, 3.5]  # 기동 완료 시간 후보들.
                              #   짧은 T = 공격적 회피, 긴 T = 완만한 회피.
                              #   min(t_horizons) * v_max > transition 거리 확보할 것
    # --- 종방향 후보: quartic s(t) (velocity keeping) ---
    n_v_targets: 3            # 목표 속도 후보 수. {호라이즌 내 raceline 최저속 ~
                              #   현재 raceline 속도, 상대 추종 속도} 범위를 linspace.
                              #   코너 진입 시 감속 후보 확보를 위해 최저속 포함 필수.
                              #   총 후보 = |d|×|T|×n_v ≈ 63개 → NX ~3-5ms.
                              #   코너 옆 추월이 어색하면 4~5로 상향
    dt_eval_s: 0.1            # 궤적 평가 시간 해상도. 충돌 체크 정밀도와 직결.
                              #   0.05로 내리면 정밀↑ 계산 2배
    # --- 비용 가중치 (Werling 논문 구조: jerk + time + 종단상태 편차) ---
    k_jerk: 0.1               # 횡+종 jerk 적분 페널티. 승차감/서보 보호.
                              #   실차에서 조향 덜덜거리면 올릴 것
    k_time: 0.5               # 기동 시간 T 페널티 (짧은 기동 선호)
    k_d: 1.0                  # 종단 |d| 페널티 (raceline 복귀 선호)
    k_v: 0.7                  # 종단 속도-기준속도 편차 페널티
    k_safety: 1.5             # 상대와의 최소 시공간 거리 페널티
    k_switch: 0.5             # 직전 계획과 종단 d 변경 페널티 (채터링 억제)
    k_block: 3.0              # '전방 차단' 시 상대가 막은 코리도에 남는 후보 페널티.
                              #   순수 Werling 비용만으론 느린 추종이 항상 최저비용이라
                              #   추월 1단계(옆 코리도로 이동)가 시작되지 않음.
                              #   추월 시도가 소심하면 올리고, 무리한 끼어들기면 내림.
                              #   k_v * (v_opp - v_race)^2 보다 커야 효과 있음
    # --- k_block 연속 가중치 폭 (블로킹 판정을 이진 대신 부드러운 램프로) ---
    # 노이즈 낀 관측(vs, d_center)에 하드 threshold를 걸면 replan마다(20Hz)
    # 판정이 뒤집혀 후보가 계속 바뀌는 '플리커'가 생긴다 (H2H 레이스에서
    # frenet이 노이즈 조건에 유독 약했던 원인). 대신 판정 경계 주변에
    # soft_band 폭의 선형 램프를 둬서, 노이즈 한 스텝 정도의 흔들림은
    # 비용에 완만하게만 반영되게 한다. 폭은 opponent.noise 표준편차의
    # 약 2~2.5배로 잡아뒀다 (그 이상 벌어진 값만 "확실한 신호"로 취급).
    block_speed_margin_mps: 1.5    # 상대가 '나보다 느리다'로 보는 기준 속도차 중심
    block_speed_soft_band_mps: 1.0 # 위 기준 주변 전환 폭. vs_std_mps(0.4)의 ~2.5배.
                                   #   노이즈에 여전히 민감하면 늘릴 것 (최대 반응 둔화)
    block_d_soft_band_m: 0.35      # '상대 코리도에 걸쳐있다' 판정 전환 폭.
                                   #   d_std_m(0.15)의 ~2.3배
    mode_threshold_m: 0.05         # dbg 표시용 global/overtake 모드 경계 (안전판정과 무관)
    # --- 하드 제약 슬랙 (다항식 후보의 수치적 오버슛 허용치, 튜닝 대상 아님) ---
    v_slack_mps: 0.3               # v_max 초과 허용치. quartic이 종단 속도에
                                   #   수렴하며 살짝 오버슛하는 것을 기각하지 않기 위함
    acc_slack_mps2: 0.5            # a_dec_max 초과 허용치 (같은 이유)

opponent:
  # 상대 차량 모델 & 관측 노이즈 (Obstacle.msg의 s/d/vs/vd + *_var 필드에 대응)
  speed_factor: 0.75          # 상대 속도 = raceline vx * factor (0.6=쉬움, 0.9=어려움)
  detection_range_m: 20.0     # 이 거리 안에서만 상대 관측 가능 (LiDAR 실효 범위 반영)
  noise:
    enabled: false            # true면 관측에 가우시안 노이즈 (실차 perception 모사)
    s_std_m: 0.30             # 종방향 위치 표준편차
    d_std_m: 0.15             # 횡방향 위치 표준편차
    vs_std_mps: 0.40          # 종방향 속도 표준편차 (속도 추정이 제일 부정확)
    latency_s: 0.10           # 관측 지연 (tracking 파이프라인 지연 모사)

# =============================================================================
# 실전형 레이스 모드 (race_h2h.py): frenet 차량 vs path_selection 차량이
# 동일 성능으로 동시 출발. 속도 우위 없음 -> planner 실력 차이만 승부에 반영.
# 관측 노이즈는 기본 ON (opponent.noise.* 값 사용, --no-noise로 끔)
# =============================================================================
race:
  laps: 2                     # 완주 랩 수 (먼저 완주하는 쪽이 승리)
  stagger_s_m: 2.0            # 스타트 그리드 전후 간격. F1TENTH H2H 규정처럼
                              #   전후+좌우로 엇갈려 출발 (0이면 완전 나란히 -> 충돌 위험)
  stagger_d_m: 0.35           # 스타트 그리드 좌우 오프셋 (서로 반대편)
  lead_change_hysteresis_m: 0.5  # 리드 교대 카운트용 히스테리시스.
                              #   노이즈성 앞뒤 출렁임을 교대로 세지 않기 위한 최소 격차
  max_time_s: 150.0           # 레이스 타임아웃 (2랩 기준 ~110s + 여유)

sim:
  dt_s: 0.01                  # 물리 스텝. 컨트롤러는 매 스텝, planner는 replan_hz로 실행
  max_time_s: 60.0            # 시나리오 타임아웃
  start_gap_m: 6.0            # 시작 시 ego가 상대보다 뒤에 있는 거리
  collision_dist_m: 0.42      # 중심 간 충돌 판정 거리 (차폭 0.30 원 근사 + 여유).
                              #   보수적으로 보려면 0.5로
  overtake_hold_m: 3.0        # ego가 상대보다 이만큼 앞서면 추월 성공 판정

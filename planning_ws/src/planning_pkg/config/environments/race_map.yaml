# --- 대회 당일 프로파일: real_car와 동일한 인터페이스 + 당일 생성 맵 ---
# 사용: ros2 launch planning_pkg planner_stack.launch.py env:=race_map \
#          trajectory_csv_file:=<당일맵>_iqp_*.csv overtaking_csv_file:=<당일맵>_sp_*.csv \
#          centerline_csv_file:=<당일맵>_centerline.csv
# 당일 맵 raceline 생성: slam 맵(png+yaml)을 maps/에 넣고
#   python3 scripts/global_traj_sim/build_map.py <당일맵>
# (속도/마찰/여유는 build_map.py 상단 설정 블록에서 변경)
# 후 colcon build (install에 CSV 복사).
# velocity_scale은 control의 vehicle/max_speed_mps와 짝을 맞출 것 (근거는
# real_car.yaml의 동일 블록 참조). scale = (control cap) / (raceline v-max).
global_trajectory_node:
  ros__parameters:
    # 현재 control race_map cap 1.0 m/s와 정합. 고속 승격 시 두 workspace를
    # 원자적으로 바꾸고 실제 속도 회귀시험을 통과시킬 것.
    global_trajectory/velocity_scale: 0.1666

frenet_frame_node:
  ros__parameters:
    frenet_frame/odom_mode: real

perception_obstacle_bridge_node:
  ros__parameters:
    bridge/input_topic: /perception/obstacles
    bridge/output_topic: /perception/obstacles_frenet
    bridge/target_frame: map
    bridge/min_confidence: 0.0       # detector가 확정한 저신뢰/coasting 트랙도 보존
    bridge/wall_margin_m: 0.10
    bridge/vel_lpf_alpha: 0.3
    bridge/track_forget_sec: 2.0
    bridge/tf_timeout_sec: 0.05
    bridge/tf_allow_latest_fallback: false
    bridge/tf_max_age_sec: 0.05
    # real_car.yaml 동일 블록 주석 참조 — detector 출력 지연 p90 0.306s에
    # 0.20 게이트가 스트림을 통째로 끊어 정지 라치를 만들었다 (0803).
    bridge/max_source_age_sec: 0.40
    bridge/source_future_tolerance_sec: 0.05
    bridge/require_source_stamp: true
    bridge/projection_window_wpnts: 80
    bridge/projection_reacquire_distance_m: 1.5
    bridge/max_abs_vs_mps: 10.0
    bridge/max_abs_vd_mps: 4.0
    # 맵 벽거리 필터: frenet d-경계 필터가 코너에서 놓치는 벽 위 유령
    # (실측 d=-0.85, 경계 1.32 통과, 4434점 전부 벽) 을 /map EDT 실거리로
    # 차단. 유령은 벽에서 0~0.1m, 진짜 콘은 최소 반폭 이상 떨어져 분리 명확.
    # ⚠️ wall_dist_min < PF 오차면 유령이 새고, 크면 벽 근처 진짜를 버린다.
    #    활성화 후 map/거리변환이 준비되지 않으면 frame 전체를 거부한다.
    # 2026-08-03 활성화 (real_car.yaml 동일 블록 주석 참조 — detector 포인트
    # 단위 맵 필터의 2차 방어선).
    # 2026-08-03(2차): centroid 벽거리 기준으로 판정식 수정 (real_car.yaml
    # 동일 블록 주석 참조). 임계는 detector와 같은 0.15.
    bridge/use_map_filter: true
    bridge/wall_dist_min_m: 0.15
    bridge/map_topic: /map
    bridge/map_timeout_sec: 5.0

# (제거) pose_odom_bridge_node: /pf/pose/odom은 localization particle_filter가 직접 발행.
# 당일 맵 사용 시 particle_filter/config/localize.yaml의 map_server.map도 당일 맵으로 교체할 것.

spliner_node:
  ros__parameters:
    spliner/obstacle_topic: /perception/obstacles_frenet
    # perception range_max(12.0)와 정합 — 8.0이면 12m에서 보이는 장애물을
    # 8m까지 버려 고속(5~6 m/s) 조기 레인스위치·감속 예산을 스스로 깎는다
    # (근거 수치는 real_car.yaml 동일 항목 주석 참조)
    spliner/lookahead_m: 12.0
    spliner/loop_rate_hz: 30.0          # 6 m/s에서 재계획 간 이동 0.30 -> 0.20 m
    # 대회 맵 = my_track(실폭 median 1.25 m, min 1.0 m). 예전 대형 트랙 값 0.75는
    # 벽 클램프로 회피가 상시 abort → 소형 트랙 값 0.35로 정렬 (real_car.yaml과 동일).
    # 당일 맵이 확연히 넓으면 0.5~0.75로 다시 올릴 것.
    spliner/evasion_dist: 0.35
    # 1.0 = 고정 배율 사용 안 함. 코너 안쪽 회피 감속은 offset_grip_cap이
    # 물리 기반으로 대신한다 (레이스라인이 그 지점에서 쓰던 kappa*v^2를
    # 오프셋 곡률에 그대로 적용 -> sqrt(1 - d*kappa)배). 예전 0.7은 곡률과
    # 무관한 30% 고정 감속이라 완만한 코너에서 순손실이었다.
    spliner/inside_speed_scale: 1.0
    # 좁은 코리도(폭~1.25 m)에서 0.20은 유효 회피경로를 과도히 배제 → 0.15로 정렬.
    spliner/path_check_margin: 0.15
    spliner/boundary_tracking_margin_m: 0.10
    spliner/cmd_speed_scale: 1.0

opponent_predictor_node:
  ros__parameters:
    predictor/obstacle_topic: /perception/obstacles_frenet

recovery_supervisor_node:
  ros__parameters:
    recovery/obstacle_topic: /perception/obstacles_frenet
    recovery/stuck_timeout_sec: 1.5
    # 차량 반폭 0.15 + 추가여유 0.10 = center-to-wall 최소 0.25m.
    recovery/boundary_stop_margin_m: 0.10
    recovery/boundary_persist_sec: 0.10
    recovery/rear_check_dist_m: 2.0
    recovery/allow_reverse: false
    recovery/rear_coverage_confirmed: false
    recovery/recovery_reverse_speed_mps: 0.30
    recovery/recovery_max_reverse_distance_m: 0.4
    recovery/recovery_max_attempts: 1
    recovery/align_speed_mps: 0.4
    recovery/pose_odom_topic: /pf/pose/odom

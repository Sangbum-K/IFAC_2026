# --- 대회 당일 프로파일: real_car와 동일한 인터페이스 + 당일 생성 맵 ---
# 사용: ros2 launch planning_pkg planner_stack.launch.py env:=race_map \
#          trajectory_csv_file:=<당일맵>_iqp_*.csv overtaking_csv_file:=<당일맵>_sp_*.csv \
#          centerline_csv_file:=<당일맵>_centerline.csv
# 당일 맵 raceline 생성: slam 맵(png+yaml)을 maps/에 넣고
#   python3 scripts/global_traj_sim/build_map.py <당일맵>
# (속도/마찰/여유는 build_map.py 상단 설정 블록에서 변경)
# 후 colcon build (install에 CSV 복사).
# velocity_scale은 control의 vehicle/max_speed_mps와 짝을 맞출 것 (근거는
# real_car.yaml의 동일 블록 참조). scale = (control cap) / (raceline v-max).
global_trajectory_node:
  ros__parameters:
    # 현재 control race_map cap 1.0 m/s와 정합 = 1.0 / RACELINE_V_MAX(7.0).
    # 2026-08-07: 0.1666 은 V_MAX 6.0 시절 값(1.0/6.0)이라, V_MAX 가 7.0 으로
    # 오른 뒤에는 계획 최고속 1.17 m/s > cap 1.0 이 되어 control이 상단을
    # clamp했다. 그러면 조향 LUT를 wpnt 계획속도로 조회하는 구조 때문에
    # 필요조향이 과대 산출된다 (real_car.yaml 상단 주석 참조).
    # 고속 승격 시 두 workspace를 원자적으로 바꾸고 실제 속도 회귀시험을 통과시킬 것.
    global_trajectory/velocity_scale: 0.1429

frenet_frame_node:
  ros__parameters:
    frenet_frame/odom_mode: real

perception_obstacle_bridge_node:
  ros__parameters:
    bridge/input_topic: /perception/obstacles
    bridge/output_topic: /perception/obstacles_frenet
    bridge/target_frame: map
    bridge/min_confidence: 0.0       # detector가 확정한 저신뢰/coasting 트랙도 보존
    bridge/wall_margin_m: 0.10
    # 2026-08-14: 브릿지 발행 32->39.8 Hz 복귀에 맞춘 시정수 보존 (real_car.yaml 주석)
    bridge/vel_lpf_alpha: 0.25
    bridge/track_forget_sec: 2.0
    bridge/tf_timeout_sec: 0.05
    bridge/tf_allow_latest_fallback: false
    bridge/tf_max_age_sec: 0.05
    # real_car.yaml 동일 블록 주석 참조 — detector 출력 지연 p90 0.306s에
    # 0.20 게이트가 스트림을 통째로 끊어 정지 라치를 만들었다 (0803).
    bridge/max_source_age_sec: 0.40
    bridge/source_future_tolerance_sec: 0.05
    bridge/require_source_stamp: true
    bridge/projection_window_wpnts: 80
    bridge/projection_reacquire_distance_m: 1.5
    bridge/max_abs_vs_mps: 10.0
    bridge/max_abs_vd_mps: 4.0
    # 맵 벽거리 필터: frenet d-경계 필터가 코너에서 놓치는 벽 위 유령
    # (실측 d=-0.85, 경계 1.32 통과, 4434점 전부 벽) 을 /map EDT 실거리로
    # 차단. 유령은 벽에서 0~0.1m, 진짜 콘은 최소 반폭 이상 떨어져 분리 명확.
    # ⚠️ wall_dist_min < PF 오차면 유령이 새고, 크면 벽 근처 진짜를 버린다.
    #    활성화 후 map/거리변환이 준비되지 않으면 frame 전체를 거부한다.
    # 2026-08-03 활성화 (real_car.yaml 동일 블록 주석 참조 — detector 포인트
    # 단위 맵 필터의 2차 방어선).
    # 2026-08-03(2차): centroid 벽거리 기준으로 판정식 수정 (real_car.yaml
    # 동일 블록 주석 참조).
    # 2026-08-08: 0.15 -> 0.30. 대회 프로파일만 rosbag_0806 재측정 반영에서
    # 누락돼 real_car(0.30)의 절반 임계로 돌고 있었다 — 0806 기준 0.15 는
    # 유령 제거율 0%, 0.30 은 23%. "임계는 detector와 같은 0.15"라던 옛 주석은
    # 사실도 아니었다(detector 의 real_car/race_map 값은 0.25이고, 그쪽은
    # 개별 포인트 마스크라 centroid 거리인 이 값과 같을 이유도 없다).
    bridge/use_map_filter: true
    bridge/wall_dist_min_m: 0.30
    # real_car.yaml과 동일: 작은 visible static 후보만 0.30 -> 0.25m.
    bridge/visible_static_wall_slack_m: 0.05
    bridge/visible_static_hold_sec: 0.75
    # H2H dynamic shadow — run_0822_hth에서 상대 옆 벽 반사가 새 static id로
    # 갈라지는 경우만 quarantine한다. 값/근거는 real_car.yaml을 따른다.
    bridge/dynamic_static_shadow_enabled: true
    bridge/dynamic_static_shadow_ahead_m: 2.50
    bridge/dynamic_static_shadow_behind_m: 0.25
    bridge/dynamic_static_shadow_d_m: 1.00
    bridge/dynamic_static_shadow_hold_sec: 2.50
    bridge/dynamic_static_shadow_wall_max_m: 0.60
    bridge/force_low_confidence_dynamic_static: false
    # ── 정적 고정 원통 (2026-08-24 추가) ────────────────────────────────
    # 이 세 줄이 여기에 **없어서** 대회 프로파일만 브릿지 선언부 기본값
    # (radius 0.15 / band [0.05, 0.25]) 으로 돌고 있었다. 0.15 는 대회 규격
    # 콘(지름 30 cm) 시절 값이고, 지금 트랙에 놓는 물체는 run_0822_192752
    # 스캔 원 적합으로 반경 0.289 다 — 즉 폭을 절반으로 보고 라인을 그렸다.
    # 더 나쁜 쪽은 band 다: 그 물체의 원시 반경 분포(p50 0.28~0.36 / p90 0.41)
    # 가 [0.05, 0.25] 를 통째로 벗어나 적용률이 13~41% 로 떨어지고, 발행 폭이
    # 프레임마다 고정값 <-> 원시값을 왕복해 회피 레인 판정이 사이클마다
    # 뒤집혔다 (명령속도 2.57 <-> 0.55 m/s, 랩당 1.32 s 손실).
    # 값·근거·되돌리는 법은 전부 real_car.yaml 의 동일 블록 주석에 있다.
    # ⚠️ 세 값은 real_car 와 **같이** 움직여야 한다 (불변식
    #    test_static_cylinder_model_cannot_understate_extent 가 강제).
    bridge/static_cylinder_radius_m: 0.30
    bridge/static_cylinder_band_m: [0.02, 0.44]
    bridge/static_cylinder_open_space_m: 0.30
    bridge/map_topic: /map
    bridge/map_timeout_sec: 5.0

# (제거) pose_odom_bridge_node: /pf/pose/odom은 localization particle_filter가 직접 발행.
# 당일 맵 사용 시 particle_filter_cpp/config/localize.yaml의 map_server.map도 당일 맵으로 교체할 것.

spliner_node:
  ros__parameters:
    spliner/obstacle_topic: /perception/obstacles_frenet
    # perception range_max(12.0)와 정합 — 8.0이면 12m에서 보이는 장애물을
    # 8m까지 버려 고속(5~6 m/s) 조기 레인스위치·감속 예산을 스스로 깎는다
    # (근거 수치는 real_car.yaml 동일 항목 주석 참조)
    spliner/lookahead_m: 12.0
    spliner/loop_rate_hz: 30.0          # 6 m/s에서 재계획 간 이동 0.30 -> 0.20 m
    # 2026-08-08: 아래 5개는 real_car 에만 있고 여기엔 없어서, "real_car와 동일한
    # 인터페이스"라고 선언한 대회 프로파일이 실제로는 params.yaml 기본값으로
    # 떨어지고 있었다 (lane_blend_out_m 5.0->2.5, obs_traj_tresh 0.45->0.3 등
    # 회피 기하가 실차에서 검증한 것과 달라짐). real_car 와 같은 값으로 정렬.
    spliner/blend_lat_acc_max: 5.0      # 횡 전환에 배정할 그립 [m/s^2]
    spliner/blend_dist_max_m: 8.0       # 전환 거리 상한 [m]
    spliner/path_lat_acc_max: 6.6       # 오프셋 경로 횡그립 [m/s^2] (mu*g = 6.67)
    spliner/path_decel_max: 6.0         # 회피 궤적 역방향 감속 한계 [m/s^2]
    spliner/lane_blend_out_m: 5.0       # 복귀 블렌드 하한 [m] — 예산 계산값과 max 결합
    spliner/obs_traj_tresh: 0.45        # 0.3은 6 m/s 횡추적오차보다 좁아 옆 장애물을 놓친다
    # 대회 맵 = my_track(실폭 median 1.25 m, min 1.0 m). 예전 대형 트랙 값 0.75는
    # 벽 클램프로 회피가 상시 abort → 소형 트랙 값 0.35로 정렬 (real_car.yaml과 동일).
    # 당일 맵이 확연히 넓으면 0.5~0.75로 다시 올릴 것.
    spliner/evasion_dist: 0.35
    # (spliner/inside_speed_scale 제거: 오프셋 곡률 마찰원 캡이 대체. real_car.yaml 참조)
    # 좁은 코리도(폭~1.25 m)에서 0.20은 유효 회피경로를 과도히 배제 → 0.15로 정렬.
    spliner/path_check_margin: 0.15
    spliner/boundary_tracking_margin_m: 0.10
    spliner/cmd_speed_scale: 1.0

opponent_predictor_node:
  ros__parameters:
    predictor/obstacle_topic: /perception/obstacles_frenet

recovery_supervisor_node:
  ros__parameters:
    recovery/obstacle_topic: /perception/obstacles_frenet
    recovery/stuck_timeout_sec: 1.5
    # 후진/시도 한도는 base params.yaml 값 사용 (allow_reverse true, 후진 0.5m,
    # 같은 지점 연속 3회). 2026-08-22: "완전히 박았을 때"만 발동 —
    # stuck + 노즈 벽 접촉 + 완전 정지 3조건 (run_0822_191159 근거).
    recovery/pose_odom_topic: /pf/pose/odom

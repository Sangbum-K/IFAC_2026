# --- gym sim + 실차 플래너 파라미터 (stack.launch.py env:=sim_real_car) ---
#
# 원칙: **거동 파라미터는 real_car.yaml과 한 글자도 다르지 않게 유지**하고,
# 배선(odom 소스·장애물 토픽)만 sim으로 둔다. real_car.yaml을 고치면 여기도
# 같이 고칠 것 — 두 파일이 어긋나면 "sim에선 됐는데 실차에선 안 되는" 원인이
# 파라미터인지 물리인지 구분할 수 없게 된다.
#
# 배선이 실차와 다른 지점은 아래 2곳뿐이다:
#   1) (없어짐) frenet odom_mode 는 실차와 **같은** 'real' 이다. sim에서도
#      pf:=true 로 진짜 particle_filter 가 돌아 /pf/pose/odom 을 그대로 쓴다.
#   2) bridge/input_topic: /perception/obstacles -> /perception/obstacles_detected
#      (실차는 perception 팀 토픽, sim은 perception_pkg detector 출력)
#
# 차량 물리(mu·a_max·조향한계)는 ROS 파라미터가 아니라 gym 쪽이다 —
# sim_race.launch.py의 vehicle:=real_car가 담당한다.
global_trajectory_node:
  ros__parameters:
    # real_car.yaml과 반드시 같아야 한다 (test_sim_real_car_profiles_mirror_real_car).
    # 2026-08-11: 1.0 -> 0.96. 8706837(0810 재캘리브레이션)이 real_car 를 0.96 으로
    # 내렸는데 여기만 1.0 으로 남아 sim 이 실차보다 4% 빠르게 돌았다. 같은 종류의
    # 드리프트가 08-04 에도 있었다(그때는 sim 이 26% 느렸다) — 한쪽만 고치지 말 것.
    #
    # bag 근거(rosbag_0805): /global_waypoints vx = [2.73, 5.94] m/s.
    # rosout 에 "velocity_scale 1.083 exceeds certified maximum 1.000" 경고가
    # 런당 ~100회 찍혔다 — 런타임에 1.083 을 요청했지만
    # global_trajectory_node 가 max_velocity_scale=1.0 으로 clamp 했다.
    global_trajectory/velocity_scale: 0.96

frenet_frame_node:
  ros__parameters:
    # 실차와 동일한 'real' (/pf/pose/odom 구독, frenet_frame_node.cpp:127).
    # 예전의 'sim_pf' 는 real 과 동작이 완전히 같은 중복 모드라 노드에서
    # 제거됐고, 지금 지정하면 std::invalid_argument 로 노드가 즉사한다.
    frenet_frame/odom_mode: real

# perception 장애물(카르테시안) -> frenet 변환 브릿지.
# input_topic만 sim(detector 출력)이고 나머지는 real_car.yaml과 동일하다.
perception_obstacle_bridge_node:
  ros__parameters:
    bridge/input_topic: /perception/obstacles_detected  # 실차: /perception/obstacles
    bridge/output_topic: /perception/obstacles_frenet
    bridge/target_frame: map
    # 0.2 — real_car.yaml과 동일 (2026-08-11 rosbag_0811 분석. coasting 트랙이
    # 두 콘 사이에 유령을 만드는 걸 confidence 문턱으로 막는다 — 근거는
    # real_car.yaml 참조). 여기 있던 0.0 은 그 갱신 전 값이 그대로 남은
    # 드리프트였다.
    bridge/min_confidence: 0.2
    bridge/wall_margin_m: 0.10
    bridge/vel_lpf_alpha: 0.3
    bridge/track_forget_sec: 2.0
    bridge/tf_timeout_sec: 0.05
    bridge/tf_allow_latest_fallback: false
    bridge/tf_max_age_sec: 0.05
    # 0.15 — real_car.yaml과 동일 (2026-08-11, perception C++ 재작성 후
    # 구독자 실측 age p99 6.3 / max 16.5 ms 기준. 근거는 real_car.yaml 참조).
    # 여기 있던 0.40 은 그 갱신 전 값이 그대로 남은 드리프트였다
    # (test_sim_real_car_profiles_mirror_real_car 가 이제 이 드리프트를 막는다).
    bridge/max_source_age_sec: 0.15
    bridge/source_future_tolerance_sec: 0.05
    bridge/require_source_stamp: true
    bridge/projection_window_wpnts: 80
    bridge/projection_reacquire_distance_m: 1.5
    bridge/max_abs_vs_mps: 10.0
    bridge/max_abs_vd_mps: 4.0
    # real_car.yaml과 동일. A/B로 끄고 싶으면 launch에서 map_filter:=false —
    # yaml을 고치지 말 것 (launch 인자가 env yaml보다 나중에 적용된다).
    bridge/use_map_filter: true
    # 0.15 -> 0.30 (2026-08-07). real_car.yaml이 커밋 b934d0e에서 0.30으로
    # 올라갔는데 여기만 08-06 값으로 남아 있었다. 브릿지 필터는 클러스터
    # centroid의 맵 벽거리(EDT)만 보므로 임계값이 곧 유령 제거율이다 —
    # rosbag_0806 실측으로 0.30이 유령의 23%를 지우면서 실물 제거는 1~5%로
    # 묶인다(제거율 표는 real_car.yaml 같은 블록). 0.15면 유령 제거율 0%라
    # sim만 "브릿지 필터가 없는" 상태로 회피를 검증하게 된다.
    bridge/wall_dist_min_m: 0.30
    # 정적 장애물 고정 원통 — 근거는 real_car.yaml 같은 블록.
    # ⚠️ 시뮬 합성 장애물은 virtual_obstacle_node 가 각도 구간에 일정 거리를
    #    쓰므로 radius 가 거의 안 흔들린다. 즉 **심에서는 이 변경의 효과가
    #    거의 안 보인다** — 검증은 실차 백 재생으로 할 것.
    bridge/static_cylinder_radius_m: 0.15
    bridge/static_cylinder_band_m: [0.05, 0.25]
    bridge/static_cylinder_open_space_m: 0.30
    bridge/map_topic: /map
    bridge/map_timeout_sec: 5.0

# --- 이하 real_car.yaml과 완전히 동일 (근거 주석은 real_car.yaml 참조) ---
spliner_node:
  ros__parameters:
    spliner/obstacle_topic: /perception/obstacles_frenet
    # ── 원호 이탈 (2026-08-11, real_car.yaml과 동일) ────────────────────────
    # 965badf 가 real_car.yaml에 추가한 뒤 여기 반영이 빠져 있었다 — 이 다섯
    # 개가 없으면 sim 은 escape_arc 기능 자체가 꺼진 채로 돈다(코드 기본값
    # false/0). 근거 주석은 real_car.yaml 참조.
    spliner/escape_arc_enabled: true
    # 2026-08-12: 5.5 -> 7.85 (real_car.yaml 과 동일, 근거는 그쪽 주석).
    spliner/escape_arc_lat_acc: 7.85
    spliner/escape_arc_min_speed: 1.2
    spliner/escape_arc_max_heading_rad: 0.80   # 2026-08-12: 0.70 -> 0.80
    spliner/commit_break_requires_visible: true
    spliner/lookahead_m: 12.0
    spliner/loop_rate_hz: 30.0
    spliner/blend_lat_acc_max: 7.85            # 2026-08-12: 5.0 -> 7.85
    spliner/blend_dist_max_m: 8.0
    # 레이스라인 생성 MU_PROFILE(0.80) x g. real_car.yaml 과 동일 (근거는 그쪽 주석).
    spliner/path_lat_acc_max: 7.85
    spliner/path_decel_max: 6.0
    spliner/lane_blend_out_m: 5.0
    # 조기 라인 스위치 (real_car.yaml과 동일). 곡률이 이보다 작은 직선 구간에서만
    # 회피 라인으로 미리 전환하고 헤어핀은 기존대로 늦게 전환한다.
    spliner/early_switch_kappa_max: 0.10
    # (spliner/steer_kappa_scale 오버레이 없음 — real_car.yaml 과 같이
    #  params.yaml 의 1.0 을 쓴다.
    #  2026-08-10 에 "타이어 교체 후 잘 돈다"를 근거로 여기에 1.10 을 넣고
    #  주석에 "real_car.yaml 과 동일"이라고 적었는데, 8706837 이 real_car 에서
    #  1.10 을 뺀 뒤로 사실이 아니게 됐다. 시뮬만 조향 한계가 10% 넓은 채로
    #  A/B 를 돌리면 회피 성립 판정이 실차와 무관해진다 — 되돌린다.
    #  ⚠️ gym 물리는 타이어 교체를 모른다. 여기서 회피가 성립하는 것은
    #     "계획이 통과한다"는 증거일 뿐 "실차가 그 곡률을 돈다"는 증거가 아니다.)
    spliner/obs_traj_tresh: 0.45
    spliner/evasion_dist: 0.35
    # (spliner/inside_speed_scale 제거 — real_car.yaml과 동일. 코너 안쪽 회피
    #  감속은 오프셋 곡률 마찰원 캡이 담당하고, 고정 배율은 이미
    #  1.0(항등)이라 코드에서 함께 삭제됐다.)
    spliner/path_check_margin: 0.15
    spliner/boundary_tracking_margin_m: 0.10
    spliner/cmd_speed_scale: 1.0

opponent_predictor_node:
  ros__parameters:
    predictor/obstacle_topic: /perception/obstacles_frenet

recovery_supervisor_node:
  ros__parameters:
    recovery/obstacle_topic: /perception/obstacles_frenet
    recovery/stuck_timeout_sec: 1.5
    recovery/boundary_stop_margin_m: 0.10
    recovery/boundary_persist_sec: 0.10
    recovery/rear_check_dist_m: 2.0
    recovery/allow_reverse: false
    recovery/rear_coverage_confirmed: false
    recovery/recovery_reverse_speed_mps: 0.30
    recovery/recovery_max_reverse_distance_m: 0.4
    recovery/recovery_max_attempts: 1
    recovery/align_speed_mps: 0.4
    # 실차와 동일 — sim에서도 pf:=true라 이 토픽이 실제로 존재한다.
    recovery/pose_odom_topic: /pf/pose/odom

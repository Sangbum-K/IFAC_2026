# --- gym sim + 실차 플래너 파라미터 (stack.launch.py env:=sim_real_car) ---
#
# 원칙: **거동 파라미터는 real_car.yaml과 한 글자도 다르지 않게 유지**하고,
# 배선(odom 소스·장애물 토픽)만 sim으로 둔다. real_car.yaml을 고치면 여기도
# 같이 고칠 것 — 두 파일이 어긋나면 "sim에선 됐는데 실차에선 안 되는" 원인이
# 파라미터인지 물리인지 구분할 수 없게 된다.
#
# 배선이 실차와 다른 지점은 아래 2곳뿐이다:
#   1) (없어짐) frenet odom_mode 는 실차와 **같은** 'real' 이다. sim에서도
#      pf:=true 로 진짜 particle_filter 가 돌아 /pf/pose/odom 을 그대로 쓴다.
#   2) bridge/input_topic: /perception/obstacles -> /perception/obstacles_detected
#      (실차는 perception 팀 토픽, sim은 perception_pkg detector 출력)
#
# 차량 물리(mu·a_max·조향한계)는 ROS 파라미터가 아니라 gym 쪽이다 —
# sim_race.launch.py의 vehicle:=real_car가 담당한다.
global_trajectory_node:
  ros__parameters:
    # real_car.yaml과 반드시 같아야 한다 (test_sim_real_car_profiles_mirror_real_car).
    # 2026-08-11: 1.0 -> 0.96. 8706837(0810 재캘리브레이션)이 real_car 를 0.96 으로
    # 내렸는데 여기만 1.0 으로 남아 sim 이 실차보다 4% 빠르게 돌았다. 같은 종류의
    # 드리프트가 08-04 에도 있었다(그때는 sim 이 26% 느렸다) — 한쪽만 고치지 말 것.
    #
    # bag 근거(rosbag_0805): /global_waypoints vx = [2.73, 5.94] m/s.
    # rosout 에 "velocity_scale 1.083 exceeds certified maximum 1.000" 경고가
    # 런당 ~100회 찍혔다 — 런타임에 1.083 을 요청했지만
    # global_trajectory_node 가 max_velocity_scale=1.0 으로 clamp 했다.
    # 2026-08-22 run_0822_050644에서 복귀한 실차 동작점과 동일하게 유지.
    global_trajectory/velocity_scale: 0.96
    # ── 조향 능력 속도캡 (2026-08-23) ────────────────────────────────────
    # control 의 map/steering_lut_file(IFAC_realcar_v3_pooled11bag, 실차 11 백
    # Pacejka 피팅)을 뒤집어 얻은 표: **최대 조향 0.3578 rad 에서 낼 수 있는
    # 횡가속 [m/s^2]**. 여기서 kappa_max(v) = a/v^2 가 나온다:
    #     v     a_lat   kappa   R[m]   플래닝이 쓰던 1.133 대비
    #    1.5     2.27   1.009   0.99      89 %
    #    2.0     3.63   0.907   1.10      80 %
    #    3.0     6.72   0.747   1.34      66 %
    #    4.0     9.69   0.606   1.65      53 %
    #    5.0     8.27   0.331   3.02      29 %
    #    6.0     6.00   0.167   6.00      15 %
    # (4 m/s 위에서 a_lat 가 도로 줄어드는 것은 표의 그립 천장이다.)
    #
    # 왜 켜는가 — my_track0823 레이스라인 344 점 중 **167 점(48.5 %)** 이
    # 계획 속도에서 낼 수 없는 곡률을 요구하고 있었다(요구/가능 최대 2.02 배).
    # 그 결과 s=0~4.5 코너에서 차는 **장애물이 없을 때도** |d| p90 0.63 m /
    # 최대 0.81 m 로 밀렸고(다른 구간은 p90 0.13~0.31), 두 백의 정적 충돌
    # 4 건이 전부 그 코너에서 났다. 그중 3 건은 **회피할 쪽이 첫 관측부터
    # 열려 있었다**(좌측 개방률 78~92 %) — 경로가 없어서가 아니라 그린 경로를
    # 차가 못 따라가서 난 사고다.
    #
    # 대가 (같은 CSV 로 재계산):
    #     계획 랩타임  6.43 s -> 6.79 s  (+5.6 %)
    #     s 0~4.5 계획속도  4.98 -> 4.16 m/s
    #   그런데 **실측** 평균 랩은 이미 7.44 s (계획 대비 +16 %) 였다 —
    #   밀려나가며 잃던 시간이 새로 내는 시간보다 크므로 실측 랩타임은
    #   나빠지지 않을 가능성이 높다. 첫 런에서 그것부터 확인할 것.
    #
    # ⚠️ 이 표는 **차량 + 타이어 + 노면**에 붙는다. control 의
    #    map/steering_lut_file 을 바꾸면 이 표도 같이 다시 뽑을 것.
    # ⚠️ 되돌리기: 두 배열을 [] 로 비우면 종전 동작으로 정확히 돌아간다.
    #    더 보수적으로 가려면 steer_lat_acc_margin 을 0.9 등으로 내린다.
    #    (spliner/steer_lat_acc_* 와 **같은 값**을 유지할 것.)
    global_trajectory/steer_lat_acc_speed_brk: [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0]
    global_trajectory/steer_lat_acc_max_at: [2.27, 3.63, 5.26, 6.72, 8.14, 9.69, 9.60, 8.27, 6.41, 6.00, 5.49, 4.93]
    global_trajectory/steer_lat_acc_margin: 1.0

frenet_frame_node:
  ros__parameters:
    # 실차와 동일한 'real' (/pf/pose/odom 구독, frenet_frame_node.cpp:127).
    # 예전의 'sim_pf' 는 real 과 동작이 완전히 같은 중복 모드라 노드에서
    # 제거됐고, 지금 지정하면 std::invalid_argument 로 노드가 즉사한다.
    frenet_frame/odom_mode: real

# perception 장애물(카르테시안) -> frenet 변환 브릿지.
# input_topic만 sim(detector 출력)이고 나머지는 real_car.yaml과 동일하다.
perception_obstacle_bridge_node:
  ros__parameters:
    bridge/input_topic: /perception/obstacles_detected  # 실차: /perception/obstacles
    bridge/output_topic: /perception/obstacles_frenet
    bridge/target_frame: map
    # 0.2 — real_car.yaml과 동일 (2026-08-11 rosbag_0811 분석. coasting 트랙이
    # 두 콘 사이에 유령을 만드는 걸 confidence 문턱으로 막는다 — 근거는
    # real_car.yaml 참조). 여기 있던 0.0 은 그 갱신 전 값이 그대로 남은
    # 드리프트였다.
    bridge/min_confidence: 0.2
    bridge/wall_margin_m: 0.10
    # 2026-08-14: 브릿지 발행 32->39.8 Hz 복귀에 맞춘 시정수 보존 (real_car.yaml 주석)
    bridge/vel_lpf_alpha: 0.25
    bridge/track_forget_sec: 2.0
    bridge/tf_timeout_sec: 0.05
    bridge/tf_allow_latest_fallback: false
    bridge/tf_max_age_sec: 0.05
    # 0.15 — real_car.yaml과 동일 (2026-08-11, perception C++ 재작성 후
    # 구독자 실측 age p99 6.3 / max 16.5 ms 기준. 근거는 real_car.yaml 참조).
    # 여기 있던 0.40 은 그 갱신 전 값이 그대로 남은 드리프트였다
    # (test_sim_real_car_profiles_mirror_real_car 가 이제 이 드리프트를 막는다).
    bridge/max_source_age_sec: 0.15
    bridge/source_future_tolerance_sec: 0.05
    bridge/require_source_stamp: true
    bridge/projection_window_wpnts: 80
    bridge/projection_reacquire_distance_m: 1.5
    bridge/max_abs_vs_mps: 4.0   # real_car 미러 (근거는 real_car.yaml)
    bridge/max_abs_vd_mps: 4.0
    # real_car.yaml과 동일. A/B로 끄고 싶으면 launch에서 map_filter:=false —
    # yaml을 고치지 말 것 (launch 인자가 env yaml보다 나중에 적용된다).
    bridge/use_map_filter: true
    # 0.15 -> 0.30 (2026-08-07). real_car.yaml이 커밋 b934d0e에서 0.30으로
    # 올라갔는데 여기만 08-06 값으로 남아 있었다. 브릿지 필터는 클러스터
    # centroid의 맵 벽거리(EDT)만 보므로 임계값이 곧 유령 제거율이다 —
    # rosbag_0806 실측으로 0.30이 유령의 23%를 지우면서 실물 제거는 1~5%로
    # 묶인다(제거율 표는 real_car.yaml 같은 블록). 0.15면 유령 제거율 0%라
    # sim만 "브릿지 필터가 없는" 상태로 회피를 검증하게 된다.
    bridge/wall_dist_min_m: 0.30
    # real_car.yaml과 동일: 작은 visible static 후보만 0.30 -> 0.25m.
    bridge/visible_static_wall_slack_m: 0.05
    bridge/visible_static_hold_sec: 0.75
    # H2H dynamic shadow — real_car.yaml과 동일. 새 벽 static id만 raw dynamic
    # 상대의 shadow에서 quarantine하며, 확정 정적 장애물은 유지한다.
    bridge/dynamic_static_shadow_enabled: true
    bridge/dynamic_static_shadow_ahead_m: 2.50
    bridge/dynamic_static_shadow_behind_m: 0.25
    bridge/dynamic_static_shadow_d_m: 1.00
    bridge/dynamic_static_shadow_hold_sec: 2.50
    bridge/dynamic_static_shadow_wall_max_m: 0.60
    bridge/force_low_confidence_dynamic_static: false
    # 정적 장애물 고정 원통 — 근거는 real_car.yaml 같은 블록.
    # ⚠️ 시뮬 합성 장애물은 virtual_obstacle_node 가 각도 구간에 일정 거리를
    #    쓰므로 radius 가 거의 안 흔들린다. 즉 **심에서는 이 변경의 효과가
    #    거의 안 보인다** — 검증은 실차 백 재생으로 할 것.
    # 0.25 -> 0.30 -> 0.29 / 대역 [0.05,0.25] -> [0.02,0.44] (세 프로파일
    # 동시) — 근거는 real_car.yaml 같은 블록 (run_0822_192752 스캔 원 적합:
    # 물체 실반경 0.289, 원시 반경 p90 0.41 로 옛 대역 밖).
    # 위 ⚠️ 그대로: 심에서는 radius 흔들림이 없으니 **대역 확대의 효과는 심에서
    # 안 보이고**, 고정값 5 cm 상향의 효과만 보인다 (회피 목표 오프셋이 양쪽
    # 0.30 -> 0.29 (2026-08-23): 위 스캔 원 적합 실반경 0.289 m에 맞춘다.
    # 대역 상한 0.44 대비 최대 축소도 0.15 m로 안전 불변식 경계 안이다.
    #
    # ── 다른 방식으로 잰 값이 더 작다 (2026-08-23, run_0823 분석) ───────────
    # 같은 물체를 원 적합이 아니라 **점군의 시선 수직 최대 폭**(= 회랑을 막는
    # 방향)으로 재면 더 작게 나온다. 가시 정적 트랙 8 개, 근거리(0.7~2.5 m)
    # 프레임만, 물체 표면점만:
    #     트랙별 중앙값 0.246 / 0.328 / 0.333 / 0.339 / 0.363 / 0.364 /
    #                   0.371 / 0.375 m   -> 중앙 0.35, 최댓값 0.462
    #   즉 이 척도로는 반경 0.18~0.23 이고, 반경 0.25(폭 0.50)면 관측
    #   최댓값 + 2 cm 다.
    # 두 값이 갈리는 이유는 라이다가 **앞면 현(chord)** 만 본다는 데 있다.
    # 얕은 호에 원을 맞추면 적합이 불안정해 반경이 과대해지기 쉽고, 반대로
    # 수직 폭은 보이는 만큼만 재므로 물체가 원통이 아니거나 뒤가 더 넓으면
    # 과소평가가 된다. 즉 **0.29 는 안전한 쪽, 0.25 는 공격적인 쪽**이다.
    # 대가는 이만큼이다 (같은 두 백, 08-23 의 나머지 변경 전부 반영,
    #  "좌/우 통로가 둘 다 막힌 계획 사이클" 비율 — 043254 / 044748):
    #     폭 0.60 (반경 0.30)   19.9 %  /  46.0 %
    #     폭 0.58 (반경 0.29)   16.0 %  /  41.2 %   <- 지금 값
    #     폭 0.50 (반경 0.25)    2.3 %  /  20.2 %
    # 좌/우 개폐를 가르는 여유가 중앙 4.3 cm (043254) / 7.9 cm (044748) 이라
    # 반경 몇 cm 가 판정을 통째로 뒤집는다.
    # ⚠️ 더 내리려면 이 값과 아래 band 상한을 **함께** 내릴 것 (invariant:
    #    band_hi - radius <= 0.15). 반경 0.25 의 짝은 [0.02, 0.39] 다.
    # ⚠️ 결론을 내려면 콘 참위치가 필요하다 — 통과 직후 스캔에서 물체 표면까지
    #    최소거리를 재는 도구가 있으면 이 4 cm 를 실측으로 끝낼 수 있다.
    bridge/static_cylinder_radius_m: 0.29
    bridge/static_cylinder_band_m: [0.02, 0.44]
    bridge/static_cylinder_open_space_m: 0.30
    bridge/map_topic: /map
    bridge/map_timeout_sec: 5.0
    # ── 랩 기억 — 값은 real_car.yaml 과 동일 (근거 주석도 그쪽) ──────────
    # memory_enabled 를 여기만 다르게 두고 싶었지만
    # test_sim_real_car_profiles_mirror_real_car 가 막는다. 그 테스트가 옳다 —
    # sim 이 실차와 **다른 행동**으로 돌면 "sim 에선 됐다"가 실차와 대응되지
    # 않는다. 그래서 세 프로파일(real_car / sim_real_car / sim)이 같은 값을
    # 갖고, 켜고 끌 때는 셋을 같이 한다.
    # 2026-08-17: off -> on (run_0817_124904 정면충돌. 근거는 real_car.yaml).
    # 2026-08-17 (2): on -> off 로 되돌림 — 실차 미검증 거동 변경을 지금
    # 감수하지 않는다. 다시 켤 조건도 real_car.yaml 에 있다.
    bridge/memory_enabled: false
    bridge/memory_confirm_laps: 2
    bridge/memory_forget_misses: 2
    bridge/memory_match_s_m: 0.60
    bridge/memory_match_d_m: 0.35
    bridge/memory_inject_ahead_m: 12.0
    bridge/memory_close_requires_match_m: 3.0
    bridge/memory_dynamic_poison_min_dist_m: 1.0
    bridge/memory_dynamic_suppress_m: 1.5
    bridge/memory_relevant_margin_m: 0.25
    bridge/memory_pos_std_m: 0.12
    # 2026-08-17: 스캔 카빙 + 중심 매칭 게이트 (근거는 real_car.yaml).
    bridge/memory_scan_carve_enabled: true
    bridge/memory_scan_topic: /scan
    bridge/memory_scan_clear_frames: 15
    bridge/memory_scan_range_min_m: 0.3
    bridge/memory_scan_range_max_m: 7.0
    bridge/memory_scan_slack_m: 0.25
    bridge/memory_scan_min_pass_beams: 3
    bridge/memory_match_latch_cost: 0.5
    bridge/ego_frenet_topic: /car_state/frenet/odom
    bridge/ego_frenet_timeout_sec: 0.5

# --- 이하 real_car.yaml과 완전히 동일 (근거 주석은 real_car.yaml 참조) ---
spliner_node:
  ros__parameters:
    spliner/obstacle_topic: /perception/obstacles_frenet
    # ── 원호 이탈 (2026-08-11, real_car.yaml과 동일) ────────────────────────
    # 965badf 가 real_car.yaml에 추가한 뒤 여기 반영이 빠져 있었다 — 이 다섯
    # 개가 없으면 sim 은 escape_arc 기능 자체가 꺼진 채로 돈다(코드 기본값
    # false/0). 근거 주석은 real_car.yaml 참조.
    spliner/escape_arc_enabled: true
    # 08-12: 5.5 -> 7.85, 08-13: -> 8.83 (real_car.yaml 과 동일, 근거는 그쪽 주석).
    spliner/escape_arc_lat_acc: 8.83
    spliner/escape_arc_min_speed: 1.2  # 2026-08-17 부터 거부 게이트 아님 (real_car.yaml)
    spliner/escape_arc_max_heading_rad: 0.80   # 2026-08-12: 0.70 -> 0.80
    # 2026-08-17: 정지 워치독 (근거는 real_car.yaml)
    spliner/standstill_watchdog_sec: 2.0
    spliner/standstill_speed_eps: 0.20
    spliner/commit_break_requires_visible: true
    spliner/lookahead_m: 12.0
    spliner/loop_rate_hz: 30.0
    spliner/blend_lat_acc_max: 13.734          # 08-22: validation_mu/MU_PROFILE 1.40과 정합
    spliner/blend_dist_max_m: 8.0
    # 레이스라인 생성 MU_PROFILE(1.40) x g. real_car.yaml 과 동일 (근거는 그쪽 주석).
    spliner/path_lat_acc_max: 13.734
    spliner/path_decel_max: 6.0
    spliner/lane_blend_out_m: 5.0
    # 조기 라인 스위치 (real_car.yaml과 동일). 곡률이 이보다 작은 직선 구간에서만
    # 회피 라인으로 미리 전환하고 헤어핀은 기존대로 늦게 전환한다.
    spliner/early_switch_kappa_max: 0.10
    # (spliner/steer_kappa_scale 오버레이 없음 — real_car.yaml 과 같이
    #  params.yaml 의 1.0 을 쓴다.
    #  2026-08-10 에 "타이어 교체 후 잘 돈다"를 근거로 여기에 1.10 을 넣고
    #  주석에 "real_car.yaml 과 동일"이라고 적었는데, 8706837 이 real_car 에서
    #  1.10 을 뺀 뒤로 사실이 아니게 됐다. 시뮬만 조향 한계가 10% 넓은 채로
    #  A/B 를 돌리면 회피 성립 판정이 실차와 무관해진다 — 되돌린다.
    #  ⚠️ gym 물리는 타이어 교체를 모른다. 여기서 회피가 성립하는 것은
    #     "계획이 통과한다"는 증거일 뿐 "실차가 그 곡률을 돈다"는 증거가 아니다.)
    spliner/obs_traj_tresh: 0.45
    spliner/evasion_dist: 0.35
    # (spliner/inside_speed_scale 제거 — real_car.yaml과 동일. 코너 안쪽 회피
    #  감속은 오프셋 곡률 마찰원 캡이 담당하고, 고정 배율은 이미
    #  1.0(항등)이라 코드에서 함께 삭제됐다.)
    spliner/path_check_margin: 0.15
    spliner/boundary_tracking_margin_m: 0.10
    # 벽 예비의 속도 의존분 — 근거는 real_car.yaml 의 같은 키 주석
    # (run_0815_191056 실측 횡오차 p90). 실차와 반드시 같아야 한다.
    # ── 속도별 조향 능력 표 (2026-08-23) ─────────────────────────────────
    # global_trajectory/steer_lat_acc_* 와 **같은 값**이어야 한다 (그쪽 주석에
    # 표의 출처와 근거가 있다). 레이스라인을 자른 기준과 회피 기동을 판정하는
    # 기준이 어긋나면 "라인은 되는데 회피만 안 되는" 구간이 생긴다.
    # 이 표는 spliner 에서 세 곳에 쓰인다:
    #   (1) BlendDist  — 횡 전환 거리를 그 속도의 실제 그립으로 계산
    #   (2) BlendGeomFeasible/Floor/SpeedCap — 기동 기하 가부. 특히
    #       BlendSpeedCap 은 "안 되면 0(정지)"이 아니라 **되는 더 낮은 속도**를
    #       돌려준다 (그래야 회피가 감속으로 살아난다).
    #   (3) ApplySpeedProfile — 발행 경로의 점별 속도캡
    # 경로를 **버리는** 하드 기각은 종전대로 속도 무관 기하 한계를 쓰므로,
    # 이 표 때문에 새로 기각되는 경로는 없다 (감속만 늘어난다).
    spliner/steer_lat_acc_speed_brk: [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0]
    spliner/steer_lat_acc_max_at: [2.27, 3.63, 5.26, 6.72, 8.14, 9.69, 9.60, 8.27, 6.41, 6.00, 5.49, 4.93]
    spliner/steer_lat_acc_margin: 1.0
    # ── 회피 사이드 히스테리시스 [m] (2026-08-23) ─────────────────────────
    # 0.10 = "반대쪽 기동 여유가 10 cm 이상 더 좋을 때만 갈아탄다".
    # 근거: 좌/우 개폐를 가르는 여유 마진이 중앙 4.3 cm (run_0823_043254) /
    # 7.9 cm (run_0823_044748) 인데, 같은 정적 장애물 하나의 관측 중심이
    # 접근하는 동안 표준편차 3.4~5.6 cm, 범위 14~20 cm 로 흔들린다.
    # 즉 매 프레임 다시 고르면 판정이 노이즈다 — 실제로 조우 1 건당 개방
    # 사이드가 평균 1.2 회 뒤집혔고, 그 뒤집힘이 90.7 / 124.5 / 133.0 /
    # 152.0 s 충돌 직전에 전부 있었다.
    # 문턱을 관측 흔들림(범위 14~20 cm)의 절반 근처로 잡았다. 더 키우면
    # "처음 잘못 고른 쪽"을 오래 붙잡는 쪽으로 위험이 옮겨간다.
    # 0 으로 두면 종전 동작.
    spliner/side_switch_hysteresis_m: 0.10
    # ── 접촉 회피 후보가 없을 때의 트레일링 속도 바닥 [m/s] (2026-08-23) ──
    # 트레일링 구제 스캔이 "차체가 안 닿는 후보"를 하나도 못 찾은 사이클에서만
    # 쓰인다. 종전에는 그럴 때도 **덜 나쁜 쪽**으로 옮겨 갔는데, 실측에서
    # 그 구제가 고른 후보가 100 % 여유 < 0 이었다 (043254 9/9, 044748 43/43,
    # 여유 중앙 -0.10 / -0.14 m). 043254 는 9 회 전부 좌우 부호를 뒤집으며
    # 중앙 0.58 m 를 건너뛰라고 지시했고, 90.7 s 충돌이 그 지시의 결과다.
    # 이제 옮기지 않고 속도를 낮춘다 — 접촉 에너지는 v^2 이라
    # 1.5 -> 0.8 m/s 면 3.5 분의 1 이다.
    # ⚠️ 0 금지 (정적 앞 완전 정지는 스스로 못 푸는 라치, d809831).
    #    음수면 비활성 = 종전 동작.
    spliner/trailing_contact_floor_mps: 0.8
    spliner/boundary_tracking_speed_ref: 3.5
    # ── 2026-08-23: gain 0.08 -> 0.0 ────────────────────────────────────
    # 위 논리("빠를수록 추종오차가 크니 벽 예비를 키운다")는 관측으로는
    # 맞지만, **원인을 예비로 덮는 처방**이었다. 고속 추종오차의 정체가
    # 밝혀졌기 때문에 원인 쪽을 고치고 이 보정은 걷는다:
    #   레이스라인의 48.5 % 가 계획 속도에서 조향으로 낼 수 없는 곡률을
    #   요구하고 있었고(steer_grip_model.hpp), 그래서 차가 코너에서
    #   장애물 없이도 |d| p90 0.63 m 로 밀렸다. 이제 global_trajectory /
    #   spliner 의 조향 능력 속도캡이 그 구간을 실제로 낼 수 있는 속도까지
    #   낮추므로, "고속에서 커지는 오차" 자체가 생기지 않는다.
    # 걷어야 하는 이유 — 이 항이 회랑을 스스로 닫고 있었다:
    #   같은 두 백 재구성, 벽 예비 속도항만 제거했을 때
    #     "양쪽 다 막힘"  38.0 % -> 29.8 %  (run_0823_043254)
    #                     65.7 % -> 58.2 %  (run_0823_044748)
    #   실제 벽 여유는 최대 0.22 -> 0.10 m 로 준다. 같은 백에서 차가 실제로
    #   쓴 우벽 여유가 p1 0.06 / 최소 -0.07 m 였으므로, 0.10 은 그 실측
    #   분포의 위쪽이다 (즉 0.22 는 실주행이 한 번도 지키지 못한 값이었다).
    # ⚠️ 조향 능력 속도캡(steer_lat_acc_*)을 끄면 이 값도 0.08 로 되돌릴 것.
    #    둘은 한 쌍이다 — 캡 없이 gain 만 0 으로 두면 고속 코너에서 벽
    #    여유가 실제로 얇아진다.
    spliner/boundary_tracking_speed_gain: 0.0
    spliner/boundary_tracking_margin_max: 0.22
    # ↓ real_car.yaml 과 반드시 같아야 한다 (test_sim_profiles_mirror_real_car).
    #   근거·득실은 params.yaml / real_car.yaml 주석 참조.
    spliner/boundary_arrival_decel_mps2: 2.0
    spliner/trailing_ramp_obstacle_check: true
    spliner/cmd_speed_scale: 1.0

opponent_predictor_node:
  ros__parameters:
    predictor/obstacle_topic: /perception/obstacles_frenet

recovery_supervisor_node:
  ros__parameters:
    recovery/obstacle_topic: /perception/obstacles_frenet
    recovery/stuck_timeout_sec: 1.5
    # 후진/시도 한도는 base params.yaml 값 사용 (allow_reverse true, 후진 0.5m,
    # 같은 지점 연속 3회). 2026-08-22: "완전히 박았을 때"만 발동 —
    # stuck + 노즈 벽 접촉 + 완전 정지 3조건 (run_0822_191159 근거).
    # 실차와 동일 — sim에서도 pf:=true라 이 토픽이 실제로 존재한다.
    recovery/pose_odom_topic: /pf/pose/odom

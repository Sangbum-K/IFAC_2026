# --- 실차 프로파일 (params.yaml 기본값 override) ---
# 사용: ros2 launch planning_pkg planner_stack.launch.py env:=real_car
# 전제(팀 인터페이스, 2026-07-20 확인):
#   perception: /perception/obstacles (f1tenth_perception_msgs/ObstacleArray, laser frame)
#   localization: particle_filter (backend:=particle_filter) — /pf/pose/odom을 직접 발행
#     (map frame pose + body frame twist.linear.x, publish_odom: 1) + TF map->odom.
#     플래닝 쪽 pose 브릿지는 제거됨 — 이중 발행 금지.
#   control: /local_waypoints + /pf/pose/odom + /car_state/frenet/odom 구독,
#     /autonomy/ackermann_cmd 발행 (hardware ackermann_cmd_mux가 /ackermann_cmd로 중계)
#   hardware: /odom (vesc), /scan, /safety/emergency_stop (latched)
# velocity_scale은 control의 vehicle/max_speed_mps와 반드시 짝을 맞출 것.
# raceline v-max(6.0)가 control cap보다 높으면 control이 전 구간을 clamp해서
# (a) 속도 프로파일이 cap 상수로 뭉개지고 (b) 조향 LUT를 wpnt 속도로 조회하는
# 구조(control_node.cpp calc_steering_angle의 speed_for_lookup) 때문에 실제
# 필요조향의 1.7~2.0배가 나온다. scale = (control cap) / 6.0 으로 계산.
global_trajectory_node:
  ros__parameters:
    # 2026-08-01: 5 m/s 단계(scale 0.83/cap 5.0) 실차 성공 → 6 m/s 단계 승격
    # (control cap 6.0, build_map cpp_real_car 게이트 프로파일과 한 변경으로
    # 동기화). 프로파일 v-max는 실측 가감속(A_ACC 2.2/A_DEC 1.3) 한계로
    # ~5.4 m/s — cap 6.0은 클램프 없이 프로파일을 그대로 통과시킨다.
    # scale 스윕(my_track0801 폐루프 게이트): 1.00 FAIL(footprint 벽 침범,
    # t=3.82s), 0.97 PASS lap 8.93s |lat err|max 0.202 m(5 m/s 성공 배포의
    # 0.207과 동급 마진), 0.99 PASS지만 0.212 m + 절벽 한 칸 옆이라 미채택.
    # 이력: 2026-07-31 run_0731_223152에서 구판 프로파일(A_DEC 7.0 가정)로
    # scale 1.0 직행 실패(헤어핀 이탈 + PF 발산) → MU_PROFILE 0.65 + 실측
    # 가감속 반영 재생성 후 단계 승격으로 회복.
    # ⚠️ PF가 4.5 m/s 이상에서 발산 이력 있음(erpm gain 미캘리브레이션) — 주행 시
    # PF 점프/발산 재현되면 즉시 0.83으로 복귀할 것.
    global_trajectory/velocity_scale: 1.0

frenet_frame_node:
  ros__parameters:
    frenet_frame/odom_mode: real            # /pf/pose/odom (localization particle_filter가 발행)

# perception 팀 장애물(laser frame 카르테시안) -> frenet 변환 브릿지
perception_obstacle_bridge_node:
  ros__parameters:
    bridge/input_topic: /perception/obstacles          # perception 팀 발행 (f1tenth_perception_msgs)
    bridge/output_topic: /perception/obstacles_frenet  # spliner/recovery가 구독
    bridge/target_frame: map
    bridge/min_confidence: 0.0       # detector가 확정한 저신뢰/coasting 트랙도 보존
    bridge/wall_margin_m: 0.10       # 트랙 경계 밖(벽 반사) 클러스터 제거 여유
    bridge/vel_lpf_alpha: 0.3        # vs/vd 유한차분 LPF
    bridge/track_forget_sec: 2.0
    bridge/tf_timeout_sec: 0.05
    bridge/tf_allow_latest_fallback: false
    bridge/tf_max_age_sec: 0.05
    # detector 실측 출력 지연(scan stamp 기준) p50 0.258s / p90 0.306s /
    # max 0.445s (run_0803_213313). 0.20이면 511프레임 중 508개가 거부돼
    # 장애물 스트림이 사실상 끊기고, 우연히 통과한 3프레임이 spliner를
    # TRAILING(v=0)에 넣은 뒤 stale fail-safe 정지로 라치됐다.
    # 0.40 = p99(0.356s) + 여유. 장애물 좌표는 detector가 scan 정시각 TF로
    # 이미 변환했으므로 age 완화가 위치 오차를 키우지 않는다.
    # ⚠️ 근본 수정은 detector on_scan 처리시간(~150ms/scan) 단축이다.
    #    그게 끝나면 이 값을 다시 조여야 stale 장애물이 안 샌다.
    bridge/max_source_age_sec: 0.40
    bridge/source_future_tolerance_sec: 0.05
    bridge/require_source_stamp: true
    bridge/projection_window_wpnts: 80
    bridge/projection_reacquire_distance_m: 1.5
    bridge/max_abs_vs_mps: 10.0
    bridge/max_abs_vd_mps: 4.0
    # 맵 벽거리 필터 (근거·주의사항은 race_map.yaml 동일 블록 주석 참조).
    # localization.launch.py의 map_server가 /map을 latched 발행.
    # 활성화 후 map/거리변환이 준비되지 않으면 해당 perception frame 전체를
    # 거부해 건강한 "빈 관측"으로 위장하지 않는다.
    # 2026-08-03 활성화: run_0803_204743에서 벽 유령(r=2.9~5.2m)이 레이스라인
    # 대부분을 덮어 정지 — 장애물이 하나도 없던 주행이었다. 1차 방어는
    # perception detector의 포인트 단위 맵 필터(use_map_filter)이고, 이
    # centroid 단위 필터는 detector 쪽이 무력화됐을 때의 2차 방어선.
    # 2026-08-03(2차) 판정식 수정: 예전 `wall_dist + radius < min`은 radius가
    # min보다 크면 중심이 벽 위여도 삭제 불가라 무력했다. 이제 centroid의
    # 벽거리만 본다 — 0.20이면 벽에 붙은 진짜 차(중심 >=0.15m)를 지울 수
    # 있으므로 detector와 같은 0.15로 맞춘다.
    bridge/use_map_filter: true
    bridge/wall_dist_min_m: 0.15
    bridge/map_topic: /map
    bridge/map_timeout_sec: 5.0

# (제거) pose_odom_bridge_node: localization particle_filter가 /pf/pose/odom을
# 직접 발행하므로 브릿지 불필요. PF가 죽으면 /pf/pose/odom이 끊겨
# control odom_timeout(0.5s)이 정지시키는 안전 체인은 그대로 유지된다.

spliner_node:
  ros__parameters:
    spliner/obstacle_topic: /perception/obstacles_frenet   # 브릿지 출력
    # perception real_car range_max(12.0)와 일치. 8.0이면 12 m에서 이미 보이는
    # 장애물을 8 m까지 버려서 (a) 조기 레인스위치를 못 하고 (b) 6 m/s에서
    # 정적 장애물 앞 정지가 불가능하다 (8 m: 5.70 m/s가 한계, 12 m: 7.25 m/s).
    # 실제 감속 engage는 max(6.0, v*1.6+3.0) = 6 m/s에서 12.6 m 이므로 12가 정합.
    spliner/lookahead_m: 12.0
    spliner/loop_rate_hz: 30.0          # 6 m/s에서 재계획 간 이동 0.30 -> 0.20 m
    # 정적 장애물 회피 예산 (6 m/s). 상수 거리 대신 그립으로 전환 거리를 잡는다.
    spliner/blend_lat_acc_max: 5.0      # 6 m/s, d 0.42 -> 진입/복귀 4.3 m (3.0은 5.5 m
                                        # 로 반응 지연 — 상향 근거는 params.yaml 주석)
    spliner/blend_dist_max_m: 8.0
    spliner/path_lat_acc_max: 7.0       # raceline은 7.36(0.75g)까지 씀 — 회피는 약간 보수적
    spliner/path_decel_max: 6.0         # raceline 프로파일 최대 요구 6.27과 정합
    spliner/lane_blend_out_m: 5.0       # 하한. 위 예산 계산값과 max로 결합
    spliner/obs_traj_tresh: 0.45        # 0.3은 6 m/s 횡추적오차보다 좁아 옆 장애물을 놓친다
    spliner/evasion_dist: 0.35          # my_track 실폭 median 1.2m라 실차도 0.35가 상한
                                        # (0.75는 벽 클램프로 회피 상시 abort). 섹터/비섹터 공통
    spliner/inside_speed_scale: 0.7     # 회피 구간 감속 강화
    spliner/path_check_margin: 0.15
    # recovery의 center-to-wall 0.25m 계약과 같은 경로만 생성.
    spliner/boundary_tracking_margin_m: 0.10
    # (제거) stop_margin_m / stop_ramp_dist_m: spliner에 없는 파라미터였음 —
    # 정지 거동은 trailing_gap_m / trailing_decel / trailing_engage_dist_m가 담당
    # 실차 컨트롤러는 wpnt 속도를 그대로 사용 -> 반드시 1.0 (sim은 0.5).
    # 틀리면 동적 상대 trailing에서 상대보다 느리게 따라가 격차가 벌어진다.
    spliner/cmd_speed_scale: 1.0

opponent_predictor_node:
  ros__parameters:
    predictor/obstacle_topic: /perception/obstacles_frenet

recovery_supervisor_node:
  ros__parameters:
    recovery/obstacle_topic: /perception/obstacles_frenet  # 브릿지 출력 (spliner와 동일 소스)
    recovery/stuck_timeout_sec: 1.5
    # 차량 반폭 0.15 + 추가여유 0.10 = center-to-wall 최소 0.25m.
    # 이보다 좁은 OT 후보는 recovery가 의도적으로 fail-closed 정지시킨다.
    recovery/boundary_stop_margin_m: 0.10
    recovery/boundary_persist_sec: 0.10
    recovery/rear_check_dist_m: 2.0
    recovery/allow_reverse: false
    recovery/rear_coverage_confirmed: false
    recovery/recovery_reverse_speed_mps: 0.30
    recovery/recovery_max_reverse_distance_m: 0.4
    recovery/recovery_max_attempts: 1   # 실차: 자동 복구 1회만
    recovery/align_speed_mps: 0.4
    recovery/pose_odom_topic: /pf/pose/odom

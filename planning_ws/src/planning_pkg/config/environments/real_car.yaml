    # ── 0.10(실측 그대로)이 아니라 0.15 인 이유: 그 5 cm 가 공짜다 ────────
    # ifac_roboracer 기하로 정중앙 장애물이 통과 가능한 랩 비율
    # (필요 폭 = 2*(R + dist_min 0.29 + 벽여유 0.25),
    #  그 트랙 사용가능 폭 min 1.490 / p05 1.540 / p50 1.865 m):
    #     R 0.10 -> 필요 1.28 m -> 100.0 %
    #     R 0.15 -> 필요 1.38 m -> 100.0 %   <- 채택
    #     R 0.20 -> 필요 1.48 m -> 100.0 %
    #     R 0.22 -> 필요 1.52 m ->  96.0 %   <- 여기서 처음 대가가 생긴다
    #     (참고: R 0.30 -> 필요 1.68 m -> 76.4 %, 못 지나는 구간 10.1 m)

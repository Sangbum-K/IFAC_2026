    # 고정값을 실측에 딱 맞추는 것은 이득 없이 마진만 버리는 선택이다.
    #
    # 얹은 5 cm 가 사는 경우: 라이다가 보는 것은 **앞면 현(chord)** 이라
    # 물체가 완전한 원통이 아니거나(밑판·받침) 뒤가 더 넓으면 실측이 최대폭을
    # 놓친다. 그 방향의 오류는 곧 접촉이고, 반대 방향의 오류는 "회피를 덜
    # 시도한다"로만 나타난다 — 위 표가 그 "덜"이 0 임을 보인다.
    #
    # ⚠️ 트랙이 바뀌면 위 표를 다시 뽑을 것. 폭이 좁은 트랙에서는 5 cm 가

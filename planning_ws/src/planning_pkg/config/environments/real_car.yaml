    #   -> lane_switch <-> trailing 왕복, 명령속도 2.57 <-> 0.55 m/s,
    #      0.4 초에 committed_break(path_collision) 3 회. 랩당 1.32 s 손실.
    # 백 재계산(같은 프레임에 새 대역 적용):
    #   적용률 13~41% -> 98~99%, 발행 half std 0.067~0.070 -> 0.013~0.025,
    #   d_left std 0.073~0.082 -> 0.033~0.042,

# --- 실차 프로파일 (params.yaml 기본값 override) ---
# 사용: ros2 launch planning_pkg planner_stack.launch.py env:=real_car
# 전제(팀 인터페이스, 2026-07-20 확인):
#   perception: /perception/obstacles (f1tenth_perception_msgs/ObstacleArray, laser frame)
#   localization: particle_filter (backend:=particle_filter) — /pf/pose/odom을 직접 발행
#     (map frame pose + body frame twist.linear.x, publish_odom: 1) + TF map->odom.
#     플래닝 쪽 pose 브릿지는 제거됨 — 이중 발행 금지.
#   control: /local_waypoints + /pf/pose/odom + /car_state/frenet/odom 구독,
#     /autonomy/ackermann_cmd 발행 (hardware ackermann_cmd_mux가 /ackermann_cmd로 중계)
#   hardware: /odom (vesc), /scan, /safety/emergency_stop (latched)
planning:
  ros__parameters:
    planning_horizon: 5.0
    input_topic: /perception/objects
    output_topic: /planning/plan
    service_name: /planning/compute_plan

# ⚠️ [저속 테스트 임시 · 2026-07-24] control이 vehicle/max_speed_mps: 1.0으로
#    묶여 있는 동안만 유효한 값들. raceline v-min이 2.64 m/s라 그대로 두면
#    control의 clamp가 전 구간에서 물려 (a) 속도 프로파일이 1.0 상수로 뭉개지고
#    (b) 조향 LUT를 wpnt 속도(최대 6)로 조회해 실제 필요조향의 1.7~2.0배가 나온다
#    (control_node.cpp calc_steering_angle의 speed_for_lookup = wpnt 속도).
#    아래 "TEMP" 표시된 값을 되돌리면 6 m/s 세팅으로 복귀.
global_trajectory_node:
  ros__parameters:
    # TEMP (원복: 1.0) — 6.00 * 0.1666 = 1.00 m/s. 프로파일 형상은 유지한 채
    # 전 구간이 control cap 이하로 내려가 clamp가 물리지 않는다 (0.44~1.00 m/s).
    # 주행 중 상향은 ros2 param set /global_trajectory_node ... 로 가능.
    global_trajectory/velocity_scale: 0.1666

frenet_frame_node:
  ros__parameters:
    frenet_frame/odom_mode: real            # /pf/pose/odom (localization particle_filter가 발행)

# perception 팀 장애물(laser frame 카르테시안) -> frenet 변환 브릿지
perception_obstacle_bridge_node:
  ros__parameters:
    bridge/input_topic: /perception/obstacles          # perception 팀 발행 (f1tenth_perception_msgs)
    bridge/output_topic: /perception/obstacles_frenet  # spliner/recovery가 구독
    bridge/target_frame: map
    bridge/min_confidence: 0.0       # perception confidence 필터 (팀과 협의 후 상향)
    bridge/wall_margin_m: 0.10       # 트랙 경계 밖(벽 반사) 클러스터 제거 여유
    bridge/vel_lpf_alpha: 0.3        # vs/vd 유한차분 LPF
    bridge/track_forget_sec: 2.0
    bridge/tf_timeout_sec: 0.1

# (제거) pose_odom_bridge_node: localization particle_filter가 /pf/pose/odom을
# 직접 발행하므로 브릿지 불필요. PF가 죽으면 /pf/pose/odom이 끊겨
# control odom_timeout(0.5s)이 정지시키는 안전 체인은 그대로 유지된다.

spliner_node:
  ros__parameters:
    spliner/obstacle_topic: /perception/obstacles_frenet   # 브릿지 출력
    # TEMP (원복: 8.0) — 1 m/s에선 8 m = 8초 앞. 감지 즉시 회피/감속이 시작돼
    # 트랙 1/4을 회피 상태로 달린다. trailing_engage_dist_m(2.0) 이상이고
    # 스플라인 절점 범위(pre -2.5 ~ post +2.5 = 5 m)는 덮는 최소값.
    spliner/lookahead_m: 5.0
    spliner/evasion_dist: 0.35          # my_track 실폭 median 1.2m라 실차도 0.35가 상한
                                        # (0.75는 벽 클램프로 회피 상시 abort). 섹터/비섹터 공통
    # TEMP (원복: 6.0 = params.yaml 기본값) — 6 m/s 제동거리 7.2 m 기준이었음.
    # 1 m/s면 v^2/2a = 0.2 m라 2.0 m도 10배 여유.
    spliner/trailing_engage_dist_m: 2.0
    # TEMP (원복: 3.0 = params.yaml 기본값) — 위와 같은 이유.
    spliner/squeeze_brake_dist_m: 1.0
    # TEMP (원복: 0.7) — 감속 배율은 raceline 속도에 곱해지므로 저속에선
    # 0.7 * 0.44 = 0.31 m/s까지 떨어져 구동이 정지 마찰에 걸린다.
    spliner/inside_speed_scale: 0.9
    # TEMP (원복: 0.35 = params.yaml 기본값) — 같은 이유. 0.35면 0.15 m/s.
    # 애초에 이 감속은 고속 추적오차 대비용이라 1 m/s에선 불필요.
    spliner/squeeze_speed_scale: 0.8
    spliner/path_check_margin: 0.15
    # (제거) stop_margin_m / stop_ramp_dist_m: spliner에 없는 파라미터였음 —
    # 정지 거동은 trailing_gap_m / trailing_decel / trailing_engage_dist_m가 담당
    # 실차 컨트롤러는 wpnt 속도를 그대로 사용 -> 반드시 1.0 (sim은 0.5).
    # 틀리면 동적 상대 trailing에서 상대보다 느리게 따라가 격차가 벌어진다.
    spliner/cmd_speed_scale: 1.0

recovery_supervisor_node:
  ros__parameters:
    recovery/obstacle_topic: /perception/obstacles_frenet  # 브릿지 출력 (spliner와 동일 소스)
    recovery/stuck_timeout_sec: 1.5
    # my_track: ot_bound_mindist가 0.15로 내려가 회피 경로가 벽 0.15m까지 접근하므로
    # boundary 정지 판정은 반드시 그보다 작아야(안 그럼 회피 중 오탐 정지) → 0.10.
    recovery/boundary_stop_margin_m: 0.10
    recovery/boundary_persist_sec: 0.2
    recovery/rear_check_dist_m: 2.0
    recovery/recovery_reverse_speed_mps: 0.4
    recovery/recovery_max_reverse_distance_m: 0.4
    recovery/recovery_max_attempts: 1   # 실차: 자동 복구 1회만
    recovery/align_speed_mps: 0.4
    recovery/pose_odom_topic: /pf/pose/odom

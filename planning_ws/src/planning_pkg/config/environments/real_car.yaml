# --- 실차 프로파일 (params.yaml 기본값 override) ---
# 사용: ros2 launch planning_pkg planner_stack.launch.py env:=real_car
# 전제(팀 인터페이스, 2026-07-20 확인):
#   perception: /perception/obstacles (f1tenth_perception_msgs/ObstacleArray, laser frame)
#   localization: particle_filter (backend:=particle_filter) — /pf/pose/odom을 직접 발행
#     (map frame pose + body frame twist.linear.x, publish_odom: 1) + TF map->odom.
#     플래닝 쪽 pose 브릿지는 제거됨 — 이중 발행 금지.
#   control: /local_waypoints + /pf/pose/odom + /car_state/frenet/odom 구독,
#     /autonomy/ackermann_cmd 발행 (hardware ackermann_cmd_mux가 /ackermann_cmd로 중계)
#   hardware: /odom (vesc), /scan, /safety/emergency_stop (latched)
# velocity_scale은 control의 vehicle/max_speed_mps와 반드시 짝을 맞출 것.
# raceline v-max(deployment_profiles.RACELINE_V_MAX, 2026-08-07부터 7.0)가
# control cap보다 높으면 control이 전 구간을 clamp해서
# (a) 속도 프로파일이 cap 상수로 뭉개지고 (b) 조향 LUT를 wpnt 속도로 조회하는
# 구조(control_node.cpp calc_steering_angle의 speed_for_lookup) 때문에 실제
# 필요조향의 1.7~2.0배가 나온다. scale = (control cap) / RACELINE_V_MAX 로 계산.
global_trajectory_node:
  ros__parameters:
    # 2026-08-01: 5 m/s 단계(scale 0.83/cap 5.0) 실차 성공 → 6 m/s 단계 승격
    # (control cap 6.0, build_map cpp_real_car 게이트 프로파일과 한 변경으로
    # 동기화). 프로파일 v-max는 실측 가감속(A_ACC 2.2/A_DEC 1.3) 한계로
    # ~5.4 m/s — cap 6.0은 클램프 없이 프로파일을 그대로 통과시킨다.
    # scale 스윕(my_track0801 폐루프 게이트): 1.00 FAIL(footprint 벽 침범,
    # t=3.82s), 0.97 PASS lap 8.93s |lat err|max 0.202 m(5 m/s 성공 배포의
    # 0.207과 동급 마진), 0.99 PASS지만 0.212 m + 절벽 한 칸 옆이라 미채택.
    # 이력: 2026-07-31 run_0731_223152에서 구판 프로파일(A_DEC 7.0 가정)로
    # scale 1.0 직행 실패(헤어핀 이탈 + PF 발산) → MU_PROFILE 0.65 + 실측
    # 가감속 반영 재생성 후 단계 승격으로 회복.
    # ⚠️ PF가 4.5 m/s 이상에서 발산 이력 있음(erpm gain 미캘리브레이션) — 주행 시
    # PF 점프/발산 재현되면 즉시 0.83으로 복귀할 것.
    #
    # 2026-08-10 타이어 교체: 1.0 -> 0.96.
    # 유효 구름둘레가 +3.9% 커졌는데 speed_to_erpm_gain(4255.1)은 그대로다.
    # PF 실측 경로길이 / odom 적분 = 08-09 0.957 -> 08-10 0.994 (TUNING_STATUS §11 ①).
    # 즉 **08-09 까지의 모든 실차 검증은 차가 명령보다 4% 느리게 달린 상태**에서
    # 이뤄졌고, 그 마진이 사라졌다. 두 가지가 동시에 어긋난다:
    #   · 횡: a_lat = kappa*v^2 이므로 실제 횡가속은 계획의 0.957^2 = 0.916 배였다.
    #     36랩을 돈 my_track0809(MU_PROFILE 0.80)는 실효 mu 0.73 으로만 검증된
    #     셈이고, scale 1.0 으로 그대로 달리면 그 라인이 처음으로 0.80 을 전부
    #     요구한다. MU(0.90) 대비 여유가 12.5% -> 0% 로 줄어든다.
    #   · 종: A_ACC_MAX 4.5 / A_DEC_MAX 1.4 는 0805·0806 백의 **odom** 실측이라
    #     같은 4.5% 만큼 과대평가다 (실제 ~4.31 / ~1.34). 그대로 my_track0810
    #     manifest 의 plant_accel/plant_decel_planned 에 구워져 있다.
    # 0.96(정확히는 0.957)은 08-09 에 차가 실제로 냈던 속도를 그대로 재현하는
    # 값이다 — 새 값 실험이 아니라 검증된 동작점 복원이다.
    # 되돌리는 순서: 08-10 이후 백으로 A_ACC/A_DEC 를 odom 이 아닌 PF 기준으로
    # 재측정 -> deployment_profiles 갱신 -> 궤적 재생성 -> 그 다음에 1.0 재시도.
    # (control 의 vehicle/max_speed_mps 7.0 은 그대로 둔다: 계획 최대가
    #  0.96*7.0 = 6.72 라 클램프가 걸리지 않는다. 7.0 아래로 내리면 안 된다.)
    global_trajectory/velocity_scale: 0.96

frenet_frame_node:
  ros__parameters:
    frenet_frame/odom_mode: real            # /pf/pose/odom (localization particle_filter가 발행)

# perception 팀 장애물(laser frame 카르테시안) -> frenet 변환 브릿지
perception_obstacle_bridge_node:
  ros__parameters:
    bridge/input_topic: /perception/obstacles          # perception 팀 발행 (f1tenth_perception_msgs)
    bridge/output_topic: /perception/obstacles_frenet  # spliner/recovery가 구독
    bridge/target_frame: map
    # 2026-08-11 rosbag_0811 분석으로 0.0 -> 0.2.
    # coasting(미관측 외삽) 트랙이 그대로 통과해 두 콘 사이에 "유령"을 만들었다.
    # 자기 위치 반경 0.25m 안의 스캔 점: 실물 콘 67~75% vs 유령 9%(중앙값 0점).
    # confidence 중앙값도 실물 0.47~0.53 vs 유령 0.06(p90 0.16)으로 갈린다.
    # 0.2 = 실물 관측 77% 유지 / 유령 92% 제거 (run_0811_165619 실측).
    # 버려지는 실물 23%는 전부 미측정(coasting) 프레임이라 물체가 사라지지 않는다.
    # ⚠️ 이 값을 0으로 되돌리려면 is_visible 소비(spliner/require_visible_for_*)가
    #    켜져 있는지 먼저 확인할 것 — 둘 다 꺼지면 유령이 그대로 복귀한다.
    bridge/min_confidence: 0.2
    bridge/wall_margin_m: 0.10       # 트랙 경계 밖(벽 반사) 클러스터 제거 여유
    # vs/vd 유한차분 LPF. dt 는 소스 헤더 스탬프 차분이라 지연 지터에는
    # 영향받지 않지만, **프레임 주기가 바뀌면 시정수가 바뀐다.**
    # 2026-08-14 브릿지 벡터화로 발행이 32.0 -> 39.8 Hz(주기 31 -> 25 ms)로
    # 돌아왔다. 같은 크기의 중심점 튐이 24% 큰 속도로 읽히므로, 그대로 두면
    # 정적->동적 오분류가 그만큼 쉬워진다 — run_0813_221645 에서 이미 트랙
    # 151개 중 34개(23%)가 뒤집혔고, 뒤집힘이 s 6.1~6.5(네모코너 콘)와
    # s 28.4~30.6(직선 콘) 즉 **콘 바로 앞**에 몰려 있다.
    # 1-(1-0.3)^(25/31) = 0.2505 로 낮춰 시정수를 보존한다.
    bridge/vel_lpf_alpha: 0.25
    bridge/track_forget_sec: 2.0
    bridge/tf_timeout_sec: 0.05
    bridge/tf_allow_latest_fallback: false
    bridge/tf_max_age_sec: 0.05
    # detector 실측 출력 지연(scan stamp 기준) p50 0.258s / p90 0.306s /
    # max 0.445s (run_0803_213313). 0.20이면 511프레임 중 508개가 거부돼
    # 장애물 스트림이 사실상 끊기고, 우연히 통과한 3프레임이 spliner를
    # TRAILING(v=0)에 넣은 뒤 stale fail-safe 정지로 라치됐다.
    # 0.40 = p99(0.356s) + 여유. 장애물 좌표는 detector가 scan 정시각 TF로
    # 이미 변환했으므로 age 완화가 위치 오차를 키우지 않는다.
    # ⚠️ 근본 수정은 detector on_scan 처리시간(~150ms/scan) 단축이다.
    #    그게 끝나면 이 값을 다시 조여야 stale 장애물이 안 샌다.
    #
    # 2026-08-11: 0.40 -> 0.15. 위 ⚠️ 가 지시한 "그게 끝나면" 이 왔다 —
    # perception 이 C++ 로 재작성(8706837)되면서 처리시간이 사라졌다.
    # 차량 컴퓨트(Jetson Orin Nano Super) 실측, 같은 백 run_0810_233206 재생,
    # real_car 프로파일, 구독자에서 잰 age(= now - obstacle.header.stamp,
    # detector 는 scan header 를 그대로 물려준다 obstacle_detector_node.cpp:791):
    #     p50 -3.9 ms / p90 0.9 / p99 6.3 / max 16.5 ms
    # (음수는 Hokuyo 가 스캔을 앞 시각으로 스탬프하기 때문이고,
    #  source_future_tolerance_sec 0.05 안이라 문제되지 않는다.)
    # 옛 0.40 은 파이썬 detector 의 p50 0.258s 를 덮으려던 값이라 이제
    # 실측 최대의 24배다 — 그만큼 stale 장애물이 그대로 통과한다.
    # 0.15 = 실측 max 의 9배. 차량에서는 PF/control/planning 이 같은 6코어를
    # 나눠 쓰므로 재생보다 스케줄링 지터가 크다고 보고 여유를 크게 잡았다.
    # ⚠️ 더 조이지 않는 이유: 여기서 거부된 프레임은 브릿지 출력에서 통째로
    #    빠지고, 그 공백은 하류 spliner/obs_timeout_sec(0.30) 예산을 먹는다.
    #    두 값은 한 세트다 — 여기를 조이려면 그쪽 여유를 먼저 확인할 것.
    bridge/max_source_age_sec: 0.15
    bridge/source_future_tolerance_sec: 0.05
    bridge/require_source_stamp: true
    bridge/projection_window_wpnts: 80
    bridge/projection_reacquire_distance_m: 1.5
    # 10.0 -> 4.0 (2026-08-19). 이 값은 이제 **기각 문턱**이다 — 브릿지가 LPF
    # 앞에서 raw 를 검사해 넘으면 프레임을 통째로 버린다(직전 속도 유지).
    # 근거: run_0818 두 백에서 실제 상대 최고속도가 2.1 m/s 였고, 이동 트랙의
    # |vs| p90 이 2.02~2.06 이다. 4.0 은 그 두 배라 진짜 상대는 절대 안 걸리고,
    # 순간이동(20 ms 에 0.709 m = 34.85 m/s)만 걸러낸다.
    # ⚠️ 다른 맵(더 빠른 상대)으로 옮기면 재검토할 것. 이 트랙 전용 값이다.
    bridge/max_abs_vs_mps: 4.0
    bridge/max_abs_vd_mps: 4.0
    # 맵 벽거리 필터 (근거·주의사항은 race_map.yaml 동일 블록 주석 참조).
    # localization.launch.py의 map_server가 /map을 latched 발행.
    # 활성화 후 map/거리변환이 준비되지 않으면 해당 perception frame 전체를
    # 거부해 건강한 "빈 관측"으로 위장하지 않는다.
    # 2026-08-03 활성화: run_0803_204743에서 벽 유령(r=2.9~5.2m)이 레이스라인
    # 대부분을 덮어 정지 — 장애물이 하나도 없던 주행이었다. 1차 방어는
    # perception detector의 포인트 단위 맵 필터(use_map_filter)이고, 이
    # centroid 단위 필터는 detector 쪽이 무력화됐을 때의 2차 방어선.
    # 2026-08-03(2차) 판정식 수정: 예전 `wall_dist + radius < min`은 radius가
    # min보다 크면 중심이 벽 위여도 삭제 불가라 무력했다. 이제 centroid의
    # 벽거리만 본다 — 0.20이면 벽에 붙은 진짜 차(중심 >=0.15m)를 지울 수
    # 있으므로 detector와 같은 0.15로 맞춘다.
    bridge/use_map_filter: true
    # 0.15 -> 0.30. 브릿지 필터는 클러스터 **centroid**의 맵 벽거리(EDT)를 본다.
    # rosbag_0806 4런의 발행 장애물 centroid 벽거리 실측:
    #   run_234533 (장애물을 하나도 안 놓은 런 = 222건 전부 유령)
    #        p10 0.25 / p25 0.30 / p50 0.35 / p75 0.45 / p90 0.56
    #   run_234734/235014/234247 (실제 장애물 있음)
    #        p50 0.45 / 0.61 / 0.52
    # 임계값별 제거율 (유령전용 런 vs 실물 있던 런):
    #   0.25 ->  0.0%  vs  0.0 / 3.3 / 0.3 %
    #   0.30 -> 23.0%  vs  1.2 / 4.8 / 1.6 %      <- 채택
    #   0.35 -> 44.6%  vs 10.4 / 7.4 / 3.0 %
    #   0.40 -> 61.7%  vs 10.4 / 9.8 / 7.9 %
    # 0.35/0.40이 유령을 더 지우지만, 이 트랙 최협부가 1.09m라 양쪽 0.35를
    # 빼면 가운데 0.39m만 남아 그 구간의 진짜 장애물을 지울 위험이 있다.
    # 0.30은 0.49m를 남기면서 유령의 1/4을 지운다.
    # ⚠️ 부분적 개선이다. 남은 유령은 벽에서 0.30~0.56m로 트랙 안쪽에 있어
    #    벽거리만으로는 분리되지 않는다 — 근본 원인은 맵-실제 배리어 불일치
    #    (perception real_car.yaml max_view_ahead_m 주석의 s19.4~20.2 참조)라
    #    맵을 다시 뜬 뒤 재평가할 것.
    bridge/wall_dist_min_m: 0.30
    # 정적 장애물 고정 원통 (근거 주석은 perception_obstacle_bridge_node.py
    # 선언부). detector radius 가 매 프레임 재측정되어 같은 콘의 트랙 내
    # 변동폭이 p50 0.14 m 이고, 그게 obs.d_left/d_right 를 ±0.07 m 흔든다 —
    # 회피 레인 개폐 마진(6 cm)보다 크다. run_0812_013630 실측.
    # ⚠️ radius 는 **콘 실치수 + 안전 마진**이다. 대회 기준 콘은 최대 지름
    #    30 cm = 반경 0.15 이고, 나머지 0.02 는 의도적으로 얹은 마진이다.
    #    더 큰 콘으로 테스트하는 동안에는 그 콘 값 + 마진으로 올릴 것 —
    #    안 그러면 매 프레임 작게 본다.
    #
    # 0.15 -> 0.17 (2026-08-18). 크기를 고정하면 안전 여유를 **여기서 직접**
    # 책임져야 한다는 것이 근거다. 고정 전에는 원시 반경의 흔들림이 여유
    # 노릇을 하고 있었는데, run_0817_194156 실측으로 그게 여유가 아니라
    # 동전 던지기였음이 확인됐다 — 대역 안 원시 반경 중 50% 가 0.15 **미만**
    # (고정이 키운다, 중앙 +6.6 cm), 50% 가 초과 (고정이 줄인다, 중앙 -6.1 cm).
    # 즉 원시값에 기대는 것은 절반의 확률로 여유를 빼앗기는 것이었다.
    #
    # 고정 뒤 남는 실질 여유는 차체~콘 표면 기준으로
    #   max(path_check_margin 0.15, 차반폭 0.15) + 불확실성(<=0.12) - 차반폭
    #   = 0.12 m
    # 뿐이고, 그 0.12 는 원래 **위치** 불확실성용 예산이다(max_uncertainty_m).
    # 크기를 고정한 지금은 그 하나가 위치 오차와 크기 가정을 겸하고 있다.
    # 2 cm 를 반경에 얹어 크기 가정 몫을 분리한다.
    # 근거가 되는 관측 안정성 (가시 정적 트랙 131 개, 트랙 수명 내 표준편차):
    #   중심 d 2.4 cm (p90 4.6) / 중심 s 2.6 cm / **폭 5.4 cm (p90 12.7)**
    #   -> 위치는 크기보다 2.2 배 안정적이다. 아는 상수(콘 규격)를 못 재는
    #      센서로 매 프레임 다시 추정할 이유가 없다는 것이 고정의 근거이고,
    #      그 대가로 마진을 명시적으로 드러내는 것이 이 2 cm 다.
    # 회피 성립성 영향은 무시할 수준이다 — 성립한 사이드의 여유가 중앙 59 cm
    # (정적 트레일링 1339 사이클 실측)라 양쪽 2 cm 는 그 3% 다.
    # ⚠️ 아직 실차 미검증. 통과 여유를 백에서 직접 재려면 콘 참위치가 필요한데
    #    인지 추정치를 쓰면 검증이 순환이 된다 — 통과 직후 스캔에서 콘 표면까지
    #    최소거리를 재는 도구가 있어야 이 2 cm 가 충분한지 말할 수 있다.
    bridge/static_cylinder_radius_m: 0.17
    # 상한 = 최대 피해량의 상한 (0.25 - 0.15 = 0.10 m). 0.22 이하로 내리면
    # 흔들림을 만드는 소수 프레임이 대역 밖으로 빠져 이득이 0 이 된다.
    bridge/static_cylinder_band_m: [0.05, 0.25]
    # 장애물 **중심**이 벽에서 이만큼 떨어져야 고정한다. 벽 근처는 클러스터가
    # 벽 점을 물어 extent 가 실제로 커진다 — 중심 0~0.30 m 에서만 radius p50 이
    # 0.20 으로 뜨고, 0.30~0.50 m 는 0.13 으로 오히려 가장 깨끗하다.
    # 가장자리 기준(wd - raw_half)으로 두면 사실상 0.48 을 요구해 그 깨끗한
    # 구간을 버린다 — 적용률 34% vs 69%, 위험은 동일. 근거는 브릿지 선언부.
    bridge/static_cylinder_open_space_m: 0.30
    bridge/map_topic: /map
    bridge/map_timeout_sec: 5.0
    # ── 랩 기억 (정적 장애물 Frenet 앵커) ────────────────────────────────
    # ⚠️ 이 기능은 인지가 보지 못한 장애물을 플래너에 **주입**하므로, 잘못되면
    #    없는 것을 피하려고 감속한다(최악은 trailing_retry_speed, 2026-08-15
    #    부터 2.5 m/s — 횡 목표가 깎이면 _degraded 1.5 로 내려간다).
    #    끄려면 아래 memory_enabled 한 줄만 false 로 바꾼다 (세 프로파일 동시).
    #
    # 2026-08-17 (2): **on -> off 로 되돌린다.** 아래 on 근거는 그대로 유효하고
    # 지워두지 않았다 — 다시 켤 때 쓸 근거다. 되돌리는 이유는 근거가 틀렸기
    # 때문이 아니라 **실차 미검증 상태로 거동이 바뀌는 것**을 지금 감수하지
    # 않기로 한 것이다. 이 기능은 인지가 못 본 장애물을 주입하므로 잘못되면
    # 없는 것을 피하려고 감속하고, 헛발질이 채택 조합에서 39% 다.
    # 다시 켤 조건: 3랩 이상 도는 실차 런에서 주입 앵커의 위치가 실물과
    # 맞는지 먼저 확인. 오프라인 재생(rosbag_0813)은 이미 통과한 상태다.
    #
    # 2026-08-17: **off -> on.** run_0817_124904 t=59.80 에서 헤어핀 탈출 직선
    # (s≈33.2)의 고정 장애물을 4.3 m/s 로 정면 충돌했다. 인과는 인지 지연이다:
    #   · 이 장애물은 우측 벽에 붙어 있어 랩0~4 전부 **3.6~4.0 m** 에서야 발행
    #     (5~7 m 구간은 접선 입사 + wall_dist_min 0.25 로 벽과 한 덩어리)
    #   · 결정 시점(59.22) 남은 거리 2.58 m / v 4.80 -> 필요 횡가속
    #     6·A·v²/L² = 15.5 vs blend_lat_acc_max 8.83 (1.76배 초과) -> 기하 거부
    #   · 제동도 불가 — 발행 시점 3.70 m 남았는데 정지거리 5.15 m (A_DEC 1.75)
    #   랩0~3 은 같은 자리를 필요 3.5~8.6 으로 통과했다. 즉 **원래 여유가 없었고
    #   랩4 만 0.5 m/s 빨라서 넘어간 것**이라 인지거리를 늘리지 않는 한 재발한다.
    # 12 m 주입이면 같은 조건에서 필요 횡가속이 0.7 로 떨어지고, 제동만으로도
    # 선다. 이 트랙은 장애물이 고정 배치라 아래 "헛발질 39%" 의 실질 비용이
    # 거의 없다 — 같은 자리에 실제로 매 랩 있다.
    # ⚠️ 실차 미검증 상태로 켜는 것이다. 처음 도는 랩은 기억이 없으므로
    #    (confirm 2랩) 종전과 동일하게 동작한다 — 3랩째부터 거동이 바뀐다.
    # ⚠️ 기억 장애물은 is_visible=false 로 주입된다. Tier 2c(원호 이탈)가
    #    is_visible 을 요구하므로(spliner_node.cpp:3293) 기억만으로는 원호
    #    이탈이 안 뜬다. Tier1/2 는 정상이고, 커밋 해제 경로는 이미 대비돼 있다.
    #
    # 아래 값은 전부 rosbag_0813/run_0813_165312(22랩) 오프라인 재생으로
    # 정한 것이다 (tools/bag_analysis_0813/memory_replay.py).
    #   · 랩 간 위치 재현성 : s std 0.022~0.131 m / d std 0.007~0.062 m
    #   · 판단거리(5~8 m) d 추정 std 0.091 vs 근접(0~0.5 m) 0.029  -> 3배 정확
    #   · 접촉 5건(전부 S/F) 선행 인지거리 5.7 m -> 11.8~12.0 m
    #   · POISON 0건 (근거리 동적 오분류 7건이 기억을 파괴하지 않음)
    #
    # confirm/forget 조합 실측 (헛발질 = 주입했는데 그 랩에 실물이 없던 통과):
    #   confirm=2 forget=1 : 헛발질 28%, 그러나 **접촉 1건이 보호를 잃는다**
    #   confirm=2 forget=2 : 헛발질 39%, 접촉 5/5 보호        <- 채택
    #   confirm=3 forget=1 : 헛발질 24%, 접촉 3건 보호 상실
    #   confirm=3 forget=2 : 헛발질 33%, 접촉 2건 보호 상실
    # 즉 5건 전부를 덮는 조합은 2/2 뿐이고, 그 대가가 헛발질 39% 다.
    bridge/memory_enabled: false
    bridge/memory_confirm_laps: 2
    bridge/memory_forget_misses: 2
    # 같은 물리 장애물로 볼 반경. 0.6~1.0 스윕에서 결과가 사실상 같아
    # (앵커 6개 / 선행거리 동일) 실측 std 근거가 있는 작은 값을 쓴다.
    bridge/memory_match_s_m: 0.60
    bridge/memory_match_d_m: 0.35
    # spliner/lookahead_m(12.0)과 같은 값. 더 크게 줘도 spliner 가 자른다.
    bridge/memory_inject_ahead_m: 12.0
    # 근거리 게이트: 이번 통과에 실측이 안 붙은 기억은 이 거리에서 손을 뗀다.
    # 실측 스윕(5 m 안쪽 주입 프레임 중 헛발질 비율):
    #   0.0 m -> 56%   2.0 m -> 43%   3.0 m -> 34%   4.0 m -> 22%
    # 어느 값에서도 접촉 5건 선행거리는 11.8~12.0 m 로 **손실 0** 이다.
    # 3.0 은 실측 첫 탐지거리 p50(3.69 m)보다 작아서, 정상 검출되는 물체는
    # 이 게이트가 걸리기 전에 이미 matched 다. 4.0 은 그 가정을 넘어선다.
    bridge/memory_close_requires_match_m: 3.0
    # 먼 거리에서 동적으로 보인 자리만 영구 배제한다. 이 거리를 0 으로 두면
    # (=거리 무관 배제) run_0813 의 접촉 후 오분류 7건이 그대로 기억을
    # 파괴한다 — 그 7건은 전부 최근접 0.05~0.47 m 에서 났다.
    bridge/memory_dynamic_poison_min_dist_m: 1.0
    # 살아 있는 동적 트랙 반경 안에서는 주입하지 않는다 (동적 우선).
    # ⚠️ 이 백에는 동적 장애물이 없어 **이 경로만 미검증**이다.
    bridge/memory_dynamic_suppress_m: 1.5
    # raceline 을 실제로 밀어내는 것만 기억한다: |d| - half - 차반폭 > 이 값이면
    # 앵커를 만들지 않는다. 접촉 5건과 s12 크리프의 앵커는 전부 |d| <= 0.31,
    # 한 번도 문제가 없던 벽 근처 파편은 |d| >= 0.53 이다.
    # 이 밴드가 없으면 주입이 프레임당 0.69 -> 1.28 개로 늘고 레지스트리의
    # 절반이 |d| 0.74~1.8 의 벽 구조물이 된다.
    bridge/memory_relevant_margin_m: 0.25
    # 기억이 보고하는 위치 표준편차. 랩 간 d std 실측 최대 0.062 의 두 배 —
    # 기억을 실측보다 더 확신하지 않게 한다.
    bridge/memory_pos_std_m: 0.12
    # ── 스캔 빈자리 카빙 (2026-08-17, run_0817_150059/_145548) ───────────
    # 랩 경계 carving 은 차가 서면 영원히 안 온다. 앵커 자리를 /scan 빔이
    # 관통하는 프레임이 연속 15개(≈0.375 s)면 주입을 즉시 멈춘다.
    #   150059: 유령 앵커 2개가 트랙을 닫아 14초 정지 (수동 개입)
    #   145548: 콘이 0.57 m 밀린 뒤 옛 자리 앵커 + 실물이 회랑을 닫아 접촉
    # 둘 다 이 카빙이면 접근 중에 유령이 지워진다 (오프라인 재생 검증
    # tools/bag_analysis_0817/carve_replay.py).
    # ⚠️ 운영 절차: 콘을 옮기거나 재배치했으면 **브릿지 노드를 재시작**할 것.
    #    카빙이 옛 자리를 지워 주지만, 그 앵커가 시야에 들어오고 0.4초가
    #    지나기 전까지는 옛 자리를 믿는다 — 재시작이 항상 더 깨끗하다.
    bridge/memory_scan_carve_enabled: true
    bridge/memory_scan_topic: /scan
    bridge/memory_scan_clear_frames: 15
    bridge/memory_scan_range_min_m: 0.3
    bridge/memory_scan_range_max_m: 7.0
    bridge/memory_scan_slack_m: 0.25
    bridge/memory_scan_min_pass_beams: 3
    # 중심 매칭 게이트: 밴드 가장자리 1프레임(cost 1.03)이 유령의 근거리
    # 게이트를 끄고 misses 를 리셋하던 것을 막는다 (150059). 실물 매칭은
    # 중심에 붙는다 — 벽 콘의 랩당 1프레임 실측도 cost 0.18 로 통과.
    bridge/memory_match_latch_cost: 0.5
    bridge/ego_frenet_topic: /car_state/frenet/odom
    bridge/ego_frenet_timeout_sec: 0.5

# (제거) pose_odom_bridge_node: localization particle_filter가 /pf/pose/odom을
# 직접 발행하므로 브릿지 불필요. PF가 죽으면 /pf/pose/odom이 끊겨
# control odom_timeout(0.5s)이 정지시키는 안전 체인은 그대로 유지된다.

spliner_node:
  ros__parameters:
    # 1.0 -> 1.25 (2026-08-19). **동적/준정적 전용** 이다 — 정적 회피는 항상 1.0
    # (spliner_node.cpp 의 ot_boost_ok). 상대보다 빨리 지나가려면 속도 우위가
    # 필요한데 이 값이 1.0 이라 추월 부스트가 사실상 꺼져 있었다.
    # 물리 캡(sqrt(a_lat/k)·조향 한계)이 그대로 걸려 직선에서만 살아난다.
    # ⚠️ A/B 필수: a_lat p90 이 포락선(8.76)의 86~105% 로 여유가 없다.
    spliner/ot_speed_scale: 1.25
    spliner/obstacle_topic: /perception/obstacles_frenet   # 브릿지 출력
    # ── 원호 이탈 (2026-08-11) ─────────────────────────────────────────────
    # 라인스위치/스플라인이 **조향 기하 하한**으로 거부했을 때만 도는 마지막
    # 회피. 평행 복귀를 포기하고 한쪽으로만 꺾어(2A/L², S자는 6A/L²) 필요
    # 거리를 58%로 줄인다. rosbag_0811 기하불가 기각 표본 기준 LaneSwitch
    # 기각의 48% / FreeSpline 기각의 67%가 이 모델에서는 성립한다.
    spliner/escape_arc_enabled: true
    # 통상 전환(blend_lat_acc_max)보다 크게 잡되 path_lat_acc_max 이하.
    # 여기서 아끼면 그 다음은 정지다.
    #
    # 2026-08-12: 5.5 -> 7.85 (= path_lat_acc_max 상한). run_0812_013630 실측으로
    # 5.5 가 근거 없이 보수적임이 확인됐다 (tools/bag_analysis_0812/grip.py):
    #   실제 달성 횡가속도 p90 6.59 / p95 7.46 / p99 8.76 m/s^2 이고,
    #   조향 응답비(실측 요레이트/자전거모델)가 a_lat 4.5->9.5 구간에서
    #   0.63 -> 0.88 로 **상승**한다 = 그 범위에 슬립 포화가 없다.
    #   IMU 요레이트x속도와 가속도계 두 경로 교차검증(상관 0.964, 기울기 1.02).
    # 5.5 는 실측 p99 의 63% 였다. 이 런의 2:37 미회피가 그 직접 결과다 —
    #   EscapeArc 가 원호 하한 1.34 m 에 가용 1.30 m 로 **4 cm 부족**해서 기각.
    #   kappa_use=0.63 이 곧 5.5/2.9^2 로, 조향 한계(1.042)가 아니라 그립
    #   예산이 구속이었다. 7.85 면 하한 1.10 m 로 통과한다.
    # escape 는 254 s 동안 0/7597 샘플 발동했다 (기각 65건 중 geom_floor 38).
    # ⚠️ 상한이 path_lat_acc_max 라 코드가 강제한다(spliner_node.cpp:337).
    #    더 올리려면 path_lat_acc_max 를 먼저 올려야 하고, 그건 레이스라인
    #    재생성이 필요하다 (아래 path_lat_acc_max 주석).
    # 2026-08-13: 7.85 -> 8.83 (MU_PROFILE 0.80 -> 0.90 동반 상향).
    spliner/escape_arc_lat_acc: 8.83
    # 2026-08-17: 저속 **거부 게이트가 아니게 됐다** — kappa_grip(a/v²) 계산의
    # 속도 하한으로만 쓰인다. run_0817_145548 t=23.9 에서 v=0.48 로 기던 차의
    # 유일한 성립 회피(원호 하한 1.66 m / 가용 1.87 m)를 이 게이트가 죽여
    # 13.8초 정지가 됐고 t=176 에 같은 자리에서 재발했다 (spliner_node.cpp
    # BuildEscapeArc 주석). "느리면 정상 회피 성립" 전제는 조향 곡률
    # 한계(속도 무관)를 놓친 것.
    spliner/escape_arc_min_speed: 1.2
    # 2026-08-12: 0.70 -> 0.80 (46도). run_0812 2:37 에서 기동 끝 헤딩이 정확히
    # 40.0 도로 상한에 걸려 escape_heading_over 로 기각됐다 (3건). 코드 검증
    # 상한은 1.0 rad. 복귀가 벽으로 가는지는 회피 중 /pitwall/lat_err 로 확인.
    spliner/escape_arc_max_heading_rad: 0.80
    # ── 정지 워치독 (2026-08-17, run_0817_150059/_145548) ────────────────
    # 정지가 이만큼 이어지면 escape 의 is_visible 요구만 해제한다 (is_static
    # 과 기하/충돌/경계 검증은 유지). 150059 유령 정지 14초의 잠금 셋 중
    # 하나를 끊는다 — 나머지 둘은 bridge 스캔 카빙과 min_speed 게이트 삭제.
    # 2.0 s: 인지 드롭아웃 최대 0.745 s + coasting 만료 track_forget 2.0 s 를
    # 덮는 값. eps 0.20 은 정지 크리프(실측 0.0~0.15)와 저속 주행을 가른다.
    spliner/standstill_watchdog_sec: 2.0
    spliner/standstill_speed_eps: 0.20
    # coasting(is_visible=false) 장애물에게 커밋 파기 권한을 주지 않는다.
    # rosbag_0811에서 두 콘 사이 committed_break가 전부 유령 때문이었다.
    spliner/commit_break_requires_visible: true
    # perception real_car range_max(12.0)와 일치. 8.0이면 12 m에서 이미 보이는
    # 장애물을 8 m까지 버려서 (a) 조기 레인스위치를 못 하고 (b) 6 m/s에서
    # 정적 장애물 앞 정지가 불가능하다 (8 m: 5.70 m/s가 한계, 12 m: 7.25 m/s).
    # 실제 감속 engage는 max(6.0, v*1.6+3.0) = 6 m/s에서 12.6 m 이므로 12가 정합.
    spliner/lookahead_m: 12.0
    spliner/loop_rate_hz: 30.0          # 6 m/s에서 재계획 간 이동 0.30 -> 0.20 m
    # 정적 장애물 회피 예산 (6 m/s). 상수 거리 대신 그립으로 전환 거리를 잡는다.
    # 2026-08-12: 5.0 -> 7.85. params.yaml 이 "path_lat_acc_max 와 같은 예산으로
    # 통일한다 — 서로 다르면 blend_use_spare_grip 켜짐/꺼짐에 따라 회피 기하가
    # 말없이 달라진다"고 명시하는데 이 오버레이만 5.0 으로 남아 있었다
    # (params.yaml 은 이미 7.85). blend_use_spare_grip=true 라 평소엔 마찰원
    # 잔여가 쓰이지만, gb_wpnts 가 비었거나 span 이 무효일 때의 폴백과
    # trailing d램프/return_speed_cap 이 이 값을 직접 쓴다 — 거기서만 몰래
    # 5.0 이 적용되고 있었다. 실측 근거는 위 escape_arc_lat_acc 주석.
    # 2026-08-13: 7.85 -> 8.83 (MU_PROFILE 0.80 -> 0.90 동반 상향).
    spliner/blend_lat_acc_max: 8.83     # = path_lat_acc_max (params.yaml 불변식)
    spliner/blend_dist_max_m: 8.0
    # 이 값은 마찰원 예산이라 **레이스라인을 생성한 MU_PROFILE 과 같아야** 한다
    # (manifest 의 validation.mu_profile x 9.81). 낮으면 BlendLatAcc 의 잔여 그립
    # sqrt(budget² - lat_ref²) 가 음수로 죽어 하한 2.0 으로 클램프되고, 회피 진입
    # 속도 캡이 필요 이상으로 낮아진다.
    # 2026-08-10: 6.6(mu 0.68 시절) -> 7.85. 08-08 에 build_map MU_PROFILE 이
    # 0.80 으로 오르면서 params.yaml 과 global_trajectory/validation_mu 는 따라
    # 올랐는데 이 오버레이만 남았다. my_track0809 실측: 코너 진입 s=11.99 에서
    # 레이스라인 자신이 a_lat 6.58 을 쓰는데 예산이 6.6 이라 잔여가 0 -> 하한 2.0,
    # 그 결과 코너 출구 정적 장애물 회피가 4.3 -> 3.5 m/s 로 감속했다.
    # 7.85 면 잔여 4.29 -> 진입 캡 4.55 m/s 로 감속이 사라진다.
    # ⚠️ 실차 미검증 — 회피는 라인 밖을 도는 동작이라 mu 0.80 을 그대로 쓸 수
    #    있는지는 실차 확인이 필요하다.
    #
    # 2026-08-12: **값은 안 올렸다. 여유가 있다는 근거만 남긴다.**
    # run_0812_013630 실측 달성 a_lat p99 = 8.76 m/s^2 (= mu 0.893). 이건 이 문서가
    # "물리 타이어 한계"로 적어둔 MU 0.90 x 9.81 = 8.83 과 거의 정확히 일치한다.
    # 즉 차는 이미 물리 한계까지 쓰고 있고, 7.85(mu 0.80)의 0.10 mu 는 위 주석대로
    # 컨트롤러 추종 보정 몫이다.
    # 그런데 이 값은 위 174-177 줄대로 **레이스라인 생성 MU_PROFILE 과 같아야**
    # 한다. 올리려면 build_map MU_PROFILE -> manifest validation.mu_profile ->
    # 궤적 재생성까지 한 묶음으로 가야 하고, 여기만 올리면 마찰원 잔여가
    # 레이스라인이 배정하지 않은 그립을 가정한다.
    # 그래서 이번엔 상한 안에서 쓸 수 있는 escape/blend 만 7.85 로 맞췄다.
    #
    # 2026-08-13: **7.85 -> 8.83 으로 올렸다.** 위 문단이 요구한 "재생성과 함께"
    # 를 이번에 같이 했다 — build_map MU_PROFILE 0.80 -> 0.90, params.yaml
    # validation_mu 0.80 -> 0.90, my_track0813 궤적 재생성이 한 묶음이다.
    # (물리 한계 MU 는 1.00 으로 별도라 추종 보정 몫 0.10 mu 는 남아 있다.)
    # ⚠️ 위 문단이 함께 요구한 실차 검증 — 회피 중 /pitwall/lat_err 가 벽 여유
    #    0.35 m 안인지 — 은 **아직 통과하지 않았다.** 회피가 실제로 걸리는 첫
    #    주행에서 확인할 것. 그 전까지 이 값은 근거가 반쪽이다.
    spliner/path_lat_acc_max: 8.83      # 오프셋 경로 횡그립 [m/s^2] (MU_PROFILE 0.90 x g)
    # 회피 궤적 정형용 상한. 옛 주석의 "raceline 프로파일 최대 요구 6.27과 정합"은
    # 틀렸다 — my_track0810 CSV 실측 ax 는 [-2.38, +4.50] 이라 최대 제동 요구가
    # 2.38(=A_DEC_PLANNED)이다. 6.27 은 mu 0.68 시절 값. 플랜트 제동 능력은
    # 이 값이 아니라 spliner/plant_decel_mps2(2.38)가 담당한다 (params.yaml 주석).
    spliner/path_decel_max: 6.0
    spliner/lane_blend_out_m: 5.0       # 하한. 위 예산 계산값과 max로 결합
    # 조기 라인 스위치 (근거는 params.yaml 주석). 2026-08-10부터 오프셋 경로의
    # 유효 곡률과 비교하지만, 임계값은 실차 검증된 0.10 을 유지한다.
    spliner/early_switch_kappa_max: 0.10
    # spliner/steer_kappa_scale: 오버레이 없음 -> params.yaml 의 1.0 을 쓴다.
    #
    # 2026-08-10 에 "타이어 교체 후 훨씬 잘 돈다"는 주행 관찰을 근거로 1.10 이
    # 제안됐으나(kappa_max 1.141 -> 1.255 rad/m, 최소 선회반경 0.877 -> 0.797 m
    # — 여긴 기구 한계 0.3677 이 아니라 플래닝 상한 0.36 기준이다),
    # 그 관찰의 정체가 밝혀져서 채택하지 않았다:
    #
    #   (1) 그 "더 돈다"는 조향 gain 오차였고, vesc.yaml 이 이미 고쳤다.
    #       gain 이 -0.8206 -> -0.8320 으로 바뀌었으므로, 옛 설정에서 차가 실제로
    #       낸 각도는 명령의 0.8206/0.8320 = 98.6% 였다. 즉 기록된 모든 백에서
    #       실차 달성 곡률/모델 예측 = 0.986 이었는데 플래닝은 1.0 을 썼다 —
    #       1.4% 낙관이었지 여유가 아니었다. gain 수정으로 그 비율이 1.00 이
    #       되므로 **1.0 은 이제 보수값이 아니라 정확값**이고, 관찰된 여유는
    #       이미 소진됐다. 여기서 1.10 을 얹으면 순수한 10% 낙관이 된다.
    #   (2) 조향 중립점이 런 사이에 최대 0.036 servo(2.5 deg)씩 튄다 — 기계적
    #       슬립이라 yaml 로 못 잡는다 (TUNING_STATUS §11). 미보정 2.5 deg 바이어스
    #       위에 "기구 한계보다 9% 안쪽으로 돈다"는 가정을 얹으면 안 된다.
    #
    # ⚠️ (1)의 따름정리: 새 gain 은 아직 한 번도 주행되지 않았다. ~08-10 백에서
    #    뽑은 조향 관련 수치는 전부 달성률 0.986 상태의 것이라, 같은 명령이
    #    이제 1.4% 더 돈다. 특히 control 의 NUC2_hangar LUT(0807/0808 백 기준)는
    #    그만큼 오버스티어 쪽으로 치우친다 — 첫 주행에서 /monitor/steering_input
    #    과 실제 요레이트를 대조할 것.
    #
    # 중립점을 기계적으로 수리한 뒤 재평가할 것. 올릴 때의 검증 절차는
    # (a) 회피 중 /pitwall/lat_err 가 벽 여유(최소 0.35 m) 안인가
    # (b) control 백스톱(map/backstop_steer_sat_ratio 0.85) 발화가 늘지 않는가.
    spliner/obs_traj_tresh: 0.45        # 0.3은 6 m/s 횡추적오차보다 좁아 옆 장애물을 놓친다
    spliner/evasion_dist: 0.35          # my_track 실폭 median 1.2m라 실차도 0.35가 상한
                                        # (0.75는 벽 클램프로 회피 상시 abort). 섹터/비섹터 공통
    # (spliner/inside_speed_scale 제거: 코너 안쪽 회피 감속은 오프셋 곡률에 대한
    #  마찰원 캡 v <= sqrt(path_lat_acc_max/kappa_offset) 이 물리 기반으로 담당한다.
    #  고정 배율은 이미 1.0(항등)이라 코드에서 함께 삭제.
    #  2026-08-11: 한때 offset_grip_cap 이 이 역할이라고 적혀 있었으나 그 캡은
    #  false 로 껐다 — 근거는 params.yaml 의 offset_grip_cap 주석.)
    spliner/path_check_margin: 0.15
    # recovery의 center-to-wall 0.25m 계약과 같은 경로만 생성.
    spliner/boundary_tracking_margin_m: 0.10
    # ── 벽 예비의 속도 의존분 (2026-08-16) ────────────────────────────────
    # 근거: run_0815_191056 (bag_analysis_0815/trackerr.py, 4571 프레임).
    # 계획 대비 **벽 방향** 횡오차 p90 [m], |d_plan|>0.15 구간:
    #     v<2   0.046
    #     2~3   0.092
    #     3~4   0.078
    #     4~5   0.214
    #     5~9   0.222
    # 즉 3.5 m/s 아래에서는 0.10 예비가 p90 을 덮지만 그 위에서는 절반이다.
    # 같은 로그에서 발행 경로의 벽예비는 s=31~37 (5~6.7 m/s)에서 정확히
    # 0.100 에 붙어 있었다 — 지점별 클램프가 경로를 이 값까지 밀어붙이므로
    # 이 파라미터가 곧 고속 구간의 실제 여유였고, 실주행 벽예비는 그 구간에서
    # 최소 +0.02 m 까지 떨어졌다.
    #   ref 3.5 / gain 0.08 / max 0.22  ->  v=5.0 에서 0.22 (= p90 을 덮음)
    # ⚠️ 저속(<=3.5)에서는 예전과 완전히 같은 값이다 — 좁은 저속 코너
    #    (s=7 헤어핀1, s=28~30 헤어핀2 출구)의 회피 성립률을 건드리지 않기
    #    위한 것이고, 그 구간은 실측 오차도 작다. ref 를 내리면 그 코너의
    #    회피가 죽으므로 내리기 전에 bag_analysis 로 성립률을 다시 볼 것.
    spliner/boundary_tracking_speed_ref: 3.5
    spliner/boundary_tracking_speed_gain: 0.08
    spliner/boundary_tracking_margin_max: 0.22
    # 벽 여유를 도착 속도로 재기 위한 감속 크레딧 [m/s^2] (params.yaml 주석).
    # 2.0 은 실측 근거가 있는 값이다 — run_0819_180345 의 트레일링 접근
    # 267.00~267.70 실측 감속이 2.29 m/s^2 였고, plant_decel_mps2(2.38)가
    # 그 상한이다. 2.0 은 그보다 16% 보수적이고, 문제의 프레임에서 좌측 상한을
    # 0.775 -> 0.825 로 올려 필요치 0.781 을 44 mm 여유로 넘긴다.
    # 크레딧을 1.4 아래로 내리면 이 사례가 다시 닫힌다(0.775~0.80).
    # 효과: 문제의 구간에서 좌측 통로가 열려 있는 시간이 3 프레임(0.05 s) ->
    # 13 프레임(0.27 s) 이 되고, 목표가 반대쪽으로 뒤집힌 267.048 프레임이
    # 열린 채 유지된다 (retry_d_target_ 유지창 0.70 s 안에 통과가 끝난다).
    spliner/boundary_arrival_decel_mps2: 2.0
    # 트레일링 횡 램프의 장애물 검사 (params.yaml 주석). 실차 켬.
    # 되돌리려면 이 한 줄을 false 로 — 재빌드 없이 launch 재시작만 하면 된다.
    spliner/trailing_ramp_obstacle_check: true
    # (제거) stop_margin_m / stop_ramp_dist_m: spliner에 없는 파라미터였음 —
    # 정지 거동은 trailing_gap_m / trailing_decel / trailing_engage_dist_m가 담당
    # 실차 컨트롤러는 wpnt 속도를 그대로 사용 -> 반드시 1.0 (sim은 0.5).
    # 틀리면 동적 상대 trailing에서 상대보다 느리게 따라가 격차가 벌어진다.
    spliner/cmd_speed_scale: 1.0

opponent_predictor_node:
  ros__parameters:
    predictor/obstacle_topic: /perception/obstacles_frenet

recovery_supervisor_node:
  ros__parameters:
    recovery/obstacle_topic: /perception/obstacles_frenet  # 브릿지 출력 (spliner와 동일 소스)
    recovery/stuck_timeout_sec: 1.5
    # 차량 반폭 0.15 + 추가여유 0.10 = center-to-wall 최소 0.25m.
    # 이보다 좁은 OT 후보는 recovery가 의도적으로 fail-closed 정지시킨다.
    recovery/boundary_stop_margin_m: 0.10
    recovery/boundary_persist_sec: 0.10
    recovery/rear_check_dist_m: 2.0
    recovery/allow_reverse: false
    recovery/rear_coverage_confirmed: false
    recovery/recovery_reverse_speed_mps: 0.30
    recovery/recovery_max_reverse_distance_m: 0.4
    recovery/recovery_max_attempts: 1   # 실차: 자동 복구 1회만
    recovery/align_speed_mps: 0.4
    recovery/pose_odom_topic: /pf/pose/odom

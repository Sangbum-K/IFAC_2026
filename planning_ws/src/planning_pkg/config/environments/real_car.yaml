    # 지름 20 cm 원통. 고정값은 거기에 안전 5 cm 를 얹은 0.15.
    #
    # ⚠️ 바로 앞 08-24 (2) 는 "실측 지름 30 cm (= 반경 0.15)" 라고 적고 그
    #    위에 안전 2 cm 를 얹어 0.17 로 잡았는데, **그 30 cm 자체가 오기였다.**
    #    0.15 는 물리 반경이 아니라 이미 안전 마진이 들어간 고정값이고,
    #    거기에 2 cm 를 또 얹은 이중 패딩이었다 (실반경 0.10 대비 +7 cm).
    #    아래 표와 min_cluster_size 재계산이 전부 그 틀린 30 cm 를 재료로
    #    썼으므로, 08-24 (2) 의 수치는 그대로 믿지 말 것.
    # 위 08-22/08-23 논쟁 전체가 "실제 크기를 모른다"는 전제 위에 있었고,
    # 그 전제는 사라졌다. 위 근거들은 지우지 않고 남긴다 — 다른 물체로
    # 연습할 때 다시 쓸 판단 재료다.

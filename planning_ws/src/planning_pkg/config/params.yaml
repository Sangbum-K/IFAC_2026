    #  0.9 와의 불일치만 사라진다.)
    # (spliner/bypass_speed_profile 제거 — 2026-08-10)
    #  회피 경로의 감속·속도캡·feasibility 를 통째로 끄는 임시 테스트 스위치.
    #  2026-08-07 에 true 로 켠 채 rosbag0807_obs 5런을 주행했고, 진입 블렌드
    #  요구 횡가속이 6.3~20.5 m/s² 로 마찰원을 15건 중 6건 초과한 것이 확인돼
    #  false 로 복원됐다. 이후 실사용처가 없는데 모든 속도 계산 지점이 분기를
    #  달고 있어 코드에서 제거했다.
    # true면 오프셋으로 곡률이 커진 구간에서 그 지점 레이스라인이 쓰던
    # 횡가속(kappa*v^2)을 넘지 않게 캡한다 -> v = v_gb*sqrt(kappa_ref/kappa_off).
    # 곡률이 줄어드는 바깥쪽 회피는 캡하지 않는다(속도가 오르지도 않는다).
    #
    # 2026-08-11 true -> false. rosbag0810 두 런 분석 결과, 이 캡은 **막아야 할
    # 곳에서는 아무것도 안 막고 안 막아야 할 곳에서만 걸린다**.
    #
    # my_track0810(323점)에서 회피 S자가 곡률을 +0.08 더할 때 이 캡이 강제하는
    # 속도 (레이스라인 대비):
    #   kappa>0.35  헤어핀   120점 -> 0.92배   <- 거의 안 자름
    #   kappa 0.15~0.35     85점 -> 0.87배
    #   kappa 0.05~0.15     46점 -> 0.74배
    #   kappa 0.02~0.05     34점 -> 0.52배   <- 거의 직선인데 반토막
    # 헤어핀에서 안 걸리는 이유는 거기서 레이스라인이 이미 마찰 한계(7.85)를
    # 다 쓰고 있어서 "레이스라인만큼만"이 "예산 다 써라"와 같은 말이 되기
    # 때문이다. 반대로 직선에서는 레이스라인이 힘을 안 쓰니 "쓰지 마라"가 된다.
    #
    # 실제 피해 (run_0810_233521, 콘이 직선 우벽에 밀착, 좌측 여유 1.36 m):
    #   회피가 성공해 커밋된 958프레임의 속도가 레이스라인의 29% (1.82 / 6.28 m/s).

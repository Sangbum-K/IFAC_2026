    #  — 2026-08-23. 직선 인코스 레이트브레이크 추월을 폐기했다. 동적 상대에
    #  대한 횡 기동이 하나도 남지 않았으므로 이 네 개의 소비처가 없다.)
    spliner/trailing_engage_dist_m: 6.0
    spliner/obs_traj_tresh: 0.3          # raceline에서 이 이내 장애물만 대상 [m]

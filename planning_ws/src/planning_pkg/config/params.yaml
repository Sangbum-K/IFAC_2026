planning:
  ros__parameters:
    planning_horizon: 5.0
    input_topic: /perception/objects
    output_topic: /planning/plan
    service_name: /planning/compute_plan

# ---------------------------------------------------------------------------
# raceline 추종 파이프라인 (planner_stack.launch.py로 실행되는 4개 노드)
# CSV는 share/planning_pkg/config/{global_trajectory,centerline}/ 에서 로드.
# raceline 재생성: scripts/global_traj_sim/step4_main.py (오프라인 도구)
# ---------------------------------------------------------------------------
global_trajectory_node:
  ros__parameters:
    global_trajectory/trajectory_csv_file: Spielberg_map_iqp_max7.00ms_margin0.15m_mu0.85.csv
    # SP 추월 라인 -> /global_waypoints/overtaking (H2H lane-change용, 없으면 미발행)
    global_trajectory/overtaking_csv_file: Spielberg_map_sp_max7.00ms_margin0.15m_mu0.85.csv
    global_trajectory/publish_rate_hz: 2.0
    global_trajectory/velocity_scale: 1.0   # 주행 중 ros2 param set으로 0.5~1.4 조정 가능

frenet_frame_node:
  ros__parameters:
    frenet_frame/loop_rate_hz: 40.0
    frenet_frame/odom_mode: sim_gt          # sim_gt | sim_pf | real

local_trajectory_node:
  ros__parameters:
    local_trajectory/loop_rate_hz: 40.0
    local_trajectory/num_local_waypoints: 80
    local_trajectory/avoidance_timeout_sec: 0.5   # 이보다 오래된 회피 궤적은 무시

# 장애물 회피 스플라인 플래너 (ForzaETH/unicorn spliner C++ 포팅)
# /perception/obstacles가 없으면 회피 발행 없음 -> raceline 추종에 영향 없음
spliner_node:
  ros__parameters:
    spliner/loop_rate_hz: 20.0
    spliner/lookahead_m: 10.0            # 이 거리 안 전방 장애물만 회피
    spliner/evasion_dist: 0.65           # 장애물 가장자리 - apex 횡간격 [m]
                                         # 주의: 이 raceline(safe-dist 0.5)은 한쪽 벽 여유가 대개 ~1.05m라
                                         # 0.7 이상이면 트랙경계 abort로 회피가 무산된다 (0.65 = 실질 최대)
    spliner/obs_traj_tresh: 0.3          # raceline에서 이 이내 장애물만 대상 [m]
    spliner/spline_bound_mindist: 0.2    # 회피 궤적 - 트랙 경계 최소 간격 [m]
    spliner/pre_apex_dists: [-4.0, -3.0, -1.5]   # apex 앞 스플라인 절점 [m]
    spliner/post_apex_dists: [2.0, 3.0, 4.0]     # apex 뒤 스플라인 절점 [m]
    spliner/fixed_pred_time: 0.15        # 동적 장애물 등속 전파 시간 [s]
    spliner/outside_spline_scale: 1.75   # 코너 바깥 추월 시 스플라인 완만화 배율
    spliner/inside_speed_scale: 0.9      # 코너 안쪽 통과 시 속도 스케일
    spliner/side_switch_d_tresh: 0.25    # |d|가 이보다 크면 추월 사이드 변경 금지 [m]
    spliner/obs_timeout_sec: 0.5         # 이보다 오래된 장애물 메시지는 무시 (perception 두절 대비)
    spliner/use_prediction: true         # Predictive Spliner: 예측 충돌구간이 원시 관측 대체
    # 회피 불가(트랙경계 abort) 시 TRAILING 폴백: raceline 유지 + 장애물 뒤
    # trailing_gap에서 장애물 속도(정적이면 0)까지 감속 — 정면 돌진 방지
    spliner/trailing_gap_m: 1.5
    spliner/trailing_decel: 3.0

# --- 시뮬레이션 전용 (sim_race.launch.py) ---
waypoint_tracker_node:
  ros__parameters:
    tracker/t_lookahead: 0.5             # lookahead = clip(t*v, min, max) [s]
    tracker/min_lookahead_m: 1.2
    tracker/max_lookahead_m: 3.0
    tracker/wheelbase_m: 0.33
    tracker/max_steer_rad: 0.4
    tracker/speed_scale: 0.5             # 데모 중 감속하려면 낮출 것
    tracker/waypoint_timeout_sec: 0.5    # 로컬 경로 두절 시 정지
    # 벽 충돌 복구 (gym은 충돌 시 차를 정지시킴 -> 후진으로 탈출)
    tracker/stuck_detect_sec: 0.6        # 전진 명령인데 이 시간 동안 정지면 스턱 판정
    tracker/reverse_speed_mps: 1.2       # 후진 속도
    tracker/reverse_max_sec: 3.0         # 최대 후진 시간
    tracker/reverse_min_dist_m: 0.3      # 최소 후진 거리
    tracker/resume_speed_cap_mps: 2.0    # 복구 직후 임시 속도 제한
    tracker/resume_cap_sec: 1.5

virtual_obstacle_node:
  ros__parameters:
    virtual_obstacle/publish_rate_hz: 10.0
    virtual_obstacle/obstacle_size_m: 0.3
    virtual_obstacle/remove_radius_m: 0.5   # 이 반경 내 재클릭 시 장애물 제거
    virtual_obstacle/laser_offset_m: 0.275  # lidar_overlay: base_link->laser 오프셋

# 상대 차량 드라이버 (gym 2번째 에이전트, RViz 2D Goal Pose로 스폰)
opponent_driver_node:
  ros__parameters:
    opponent/mode: path              # path | ftg | manual (패널/토픽으로 런타임 변경)
    opponent/max_speed_mps: 2.0      # 패널 ±0.5 버튼으로 조절되는 공통 상한
    opponent/speed_scale: 0.3        # path 모드: raceline 속도 대비 (tracker 0.5보다 느리게)
    opponent/size_m: 0.4
    opponent/drive_rate_hz: 40.0
    opponent/wheelbase_m: 0.33
    opponent/max_steer_rad: 0.4
    opponent/park_x: -79.81          # '제거' 시 주차 위치 (launch sx1/sy1과 일치)
    opponent/park_y: -31.26
    opponent/park_radius_m: 5.0
    opponent/ftg_max_range_m: 8.0    # FTG: 스캔 클리핑 거리
    opponent/ftg_bubble_m: 0.4       # FTG: 최근접점 safety bubble 반경
    opponent/ftg_gap_min_m: 1.5      # FTG: 통과 가능 갭 최소 거리


# Predictive Spliner 상대 예측 (arXiv:2410.04868)
opponent_predictor_node:
  ros__parameters:
    predictor/min_samples: 40        # GP 학습 시작 최소 관측 수
    predictor/sample_min_ds: 0.15    # 관측 데시메이션 간격 [m]
    predictor/max_samples: 600
    predictor/gp_length_scale: 3.0   # RBF 길이 스케일 [m]
    predictor/gp_sigma_n: 0.08
    predictor/refit_every: 20        # N 관측마다 GP 재학습
    predictor/horizon_sec: 8.0       # 따라잡기 탐색 호라이즌
    predictor/catch_gap_m: 0.8
    predictor/pass_length_m: 1.2
    predictor/publish_rate_hz: 10.0

planner_visualizer_node:
  ros__parameters:
    planning_viz/loop_rate_hz: 10.0
    planning_viz/centerline_csv_file: Spielberg_map_centerline.csv

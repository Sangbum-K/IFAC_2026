    spliner/pre_apex_dists: [-2.5, -1.8, -0.9]   # apex 앞 스플라인 절점 [m] (was [-4,-3,-1.5])
    spliner/post_apex_dists: [1.2, 1.8, 2.5]     # apex 뒤 스플라인 절점 [m] (was [2,3,4])

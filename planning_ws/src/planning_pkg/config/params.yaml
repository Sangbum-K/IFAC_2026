# ---------------------------------------------------------------------------
# raceline 추종 파이프라인 (planner_stack.launch.py로 실행되는 4개 노드)
# CSV는 share/planning_pkg/config/{global_trajectory,centerline}/ 에서 로드.
# raceline 재생성: scripts/global_traj_sim/build_map.py <맵이름> (오프라인 도구)
# ---------------------------------------------------------------------------
global_trajectory_node:
  ros__parameters:
    # my_track0807 실차: v-max 7, 계획 mu 0.68 (raceline 재생성 시 접미사 함께 교체)
    # margin 0.08 = 소형 트랙 회피 corridor 확보용 (build_map MARGIN, 주행선 불변)
    # 랩 31.3 m, safe_dist는 adaptive 0.37~0.55 m (CSV 첫 줄 헤더에 기록).
    # 2026-08-07: 옛 my_track 라인은 b05264b에서 삭제됐는데 이 기본값만 남아
    # install에 남은 유령 CSV로 주행하고 있었다 — 현행 맵으로 교체.
    # ⚠️ 실제 주행 속도는 environments/<env>.yaml의 velocity_scale이 결정한다 —
    # control의 vehicle/max_speed_mps와 짝을 맞출 것 (real_car.yaml 주석 참조).
    global_trajectory/trajectory_csv_file: my_track0807_iqp_max7.00ms_margin0.08m_mu0.68.csv
    # SP는 전 구간 경계/조향 검증을 통과한 파일만 map:= 또는 CLI로 원자적으로
    # 연결한다. 현재 기본 SP는 R_min 한계 위반이라 안전 기본값은 비활성.
    global_trajectory/overtaking_csv_file: ""
    global_trajectory/publish_rate_hz: 2.0
    # 0.6667 -> 0.5714: 이 기본값은 sim control cap 4.0 / 당시 v-max 6.0 이었다.
    # eba6d2c 가 RACELINE_V_MAX 를 7.0 으로 올리면서 real_car/race_map 은 재계산됐지만
    # base 만 남아 7.0*0.6667 = 4.67 로 sim cap 4.0 을 17% 초과했다 (control 이 전 구간
    # 클램프 -> 조향 LUT 를 wpnt 속도로 조회하는 구조 때문에 조향 과다).
    # 불변식: csv_vmax * velocity_scale == control 의 vehicle/max_speed_mps.
    global_trajectory/velocity_scale: 0.5714   # 주행 중 안전 범위 0.1~1.0에서 slew 적용
    global_trajectory/min_velocity_scale: 0.10
    global_trajectory/max_velocity_scale: 1.0  # 1 초과는 v²κ 한계를 깨므로 CSV 재생성 필요
    global_trajectory/velocity_scale_slew_per_sec: 0.10
    # 0.75 -> 0.68: 궤적 생성기의 계획 마찰계수(build_map MU_PROFILE, manifest
    # validation.mu_profile)와 같은 값이어야 한다. 게이트만 0.75 로 두면 mu 0.75 를
    # 가정해 만든 CSV 와 0.68 로 만든 CSV 를 구별하지 못한다.
    # 2026-08-08: 0.68 -> 0.80. build_map MU_PROFILE 이 0.80 으로 올라가면서 이 값을
    # 안 따라 올려서 my_track0808 CSV 가 런타임에서 거부됐다 — global_trajectory_node
    # 가 "row 44 combined 6.889 > 6.671" 로 abort(exit -6) 하고, 그 뒤 전 노드가
    # "Waiting for global waypoints" 로 멈췄다. 이 값은 **CSV 를 재생성할 때마다**
    # manifest 의 validation.mu_profile 과 맞춰야 한다.
    global_trajectory/validation_mu: 0.80
    global_trajectory/validation_wheelbase_m: 0.33
    global_trajectory/validation_max_steer_rad: 0.36
    global_trajectory/validation_tolerance: 0.03
    global_trajectory/validation_ax_tolerance: 1.0
    # strict | advisory. strict 는 위 마찰원/조향 한계 위반을 거부해 노드를 안 띄운다.
    # advisory 는 경고만 남기고 띄운다 — 레이스라인 튜너로 사람이 직감으로 손본
    # 라인(<맵>_tuned_iqp_*.csv)을 실차에서 시험하기 위한 것이고, 형식 검사
    # (NaN/s 단조/간격 균일/폐루프/ax↔v 정합)는 두 모드 모두 그대로 거부한다.
    # ⚠️ 여기서 손으로 advisory 로 바꾸지 말 것. planner_stack.launch.py 가
    #    map:=<맵>_tuned 일 때만 자동으로 덮어쓴다 — 원본 라인은 항상 strict 다.
    global_trajectory/validation_mode: strict

frenet_frame_node:
  ros__parameters:
    frenet_frame/loop_rate_hz: 40.0
    frenet_frame/odom_mode: sim_gt          # sim_gt | real
    frenet_frame/odom_receive_timeout_sec: 0.20
    frenet_frame/odom_source_timeout_sec: 0.20
    frenet_frame/odom_future_tolerance_sec: 0.05
    frenet_frame/projection_search_segments: 40
    frenet_frame/projection_reacquire_distance_m: 2.0
    frenet_frame/projection_heading_weight_m2: 0.25
    frenet_frame/projection_progress_weight: 0.02
    frenet_frame/min_frenet_jacobian: 0.20

local_trajectory_node:
  ros__parameters:
    local_trajectory/loop_rate_hz: 40.0
    # 12m perception/spliner horizon 전체를 control에 전달한다.
    local_trajectory/num_local_waypoints: 130
    local_trajectory/avoidance_timeout_sec: 0.20
    # Spliner 장애/종료 시 global raceline으로 fail-open하지 않고 발행을 멈춘다.
    local_trajectory/require_avoidance_heartbeat: true
    # frenet odom이 이보다 오래되면 /local_waypoints 발행을 멈춘다. 계속
    # 발행하면 위치추정이 죽어도 구독자(control/recovery) 눈에는 경로가
    # 신선해 보여서 stale 검출이 통째로 무력화된다.
    local_trajectory/frenet_odom_timeout_sec: 0.20
    local_trajectory/frenet_odom_source_timeout_sec: 0.20
    local_trajectory/future_stamp_tolerance_sec: 0.05
    # frenet_frame/min_frenet_jacobian 과 반드시 같은 값. 예전엔 local 쪽만 0.20
    # 리터럴로 박혀 있어서, frenet 쪽을 내리면 frenet 은 계속 발행하는데 local 이
    # 거부해 /local_waypoints 가 끊기고 control waypoint timeout 으로 차가 섰다.
    local_trajectory/min_frenet_jacobian: 0.20
    local_trajectory/max_avoidance_step_m: 1.0
    local_trajectory/minimum_horizon_sec: 1.5
    local_trajectory/minimum_braking_decel_mps2: 2.5
    local_trajectory/minimum_stop_buffer_m: 1.5

# 장애물 회피 스플라인 플래너 (ForzaETH/unicorn spliner C++ 포팅)
# /perception/obstacles가 없으면 회피 발행 없음 -> raceline 추종에 영향 없음
spliner_node:
  ros__parameters:
    spliner/loop_rate_hz: 20.0
    # ── 라인 스위치 (기본 maneuver) ─────────────────────────────────────────
    # true면 오프셋 레인(±apex)으로 ease-on→hold→ease-back(rule-based)을 1순위로
    # 시도하고, 우선/반대 사이드가 모두 막힐 때만 DoSpline(free-form)을 폴백으로
    # 호출한다. false면 기존처럼 DoSpline을 1순위로 쓴다.
    spliner/use_lane_switch: true
    # ── 소형 트랙(my_track: 랩 31.5 m, 실폭 median 1.2 m, R_min 1.35 m, v 3~6 m/s)
    #    전용 스케일. 이전 값은 Spielberg/Budapest(랩 340 m, 폭 1.5 m, v 15 m/s)
    #    기준이라 회피 스플라인 한 번(13 m)이 트랙의 40%를 먹어 회피가 무산됐다.
    spliner/lane_blend_out_m: 2.5        # raceline 복귀 블렌드 길이 [m] (was 5.0)
    # 진입 블렌드는 원래 "그립상 최소 전환거리 x 1.2"만 쓰고 장애물 직전에서야
    # 시작했다(blend_start = hold_start - blend_in). 그래서 회피가 성공해도
    # 항상 최소 거리에서 최대 횡가속으로 실행된다. 늦게 시작하는 근거는
    # run_0806_155621(긴 진입이 상류의 좁은 구간을 오프셋 상태로 통과해 벽에
    # 걸림)인데, 그건 상류가 좁을 때만 성립한다.
    #   0808 run_185049: 장애물 s=31.7 앞 직선(kappa~0, 좌벽 1.07m)이 4.7m
    #   비어 있는데 횡이동은 마지막 1.0~2.5m에서 일어났고, 6랩 중 4랩에서
    #   조향이 하드웨어 한계(20.6도)에 포화하고 rate까지 clip됐다. 통과 속도는
    #   레이스라인 계획 6.2 m/s 대비 1.9~2.3 m/s.
    # 진입 구간 내내 목표 오프셋이 벽 안에 들어가고(MinWallInSpan) 그 구간
    # 곡률이 이 값 이하이면 가용 거리를 다 써서 완만하게 옮긴다. 피크 횡가속은
    # 6A/L²이라 L을 1.8배로 늘리면 3분의 1이 된다 (d 0.55/v 4.5: 5.3 -> 1.6 m/s²).
    # 0.10 = 반경 10m. 0으로 두면 이 완화가 꺼지고 옛 동작으로 돌아간다.
    # 상한은 blend_dist_max_m가 그대로 담당한다 (너무 일찍 피해 라인을 오래
    # 벗어나는 것 방지).
    spliner/early_switch_kappa_max: 0.10
    spliner/lookahead_m: 10.0            # 이 거리 안 전방 장애물만 회피/감속 (was 20.0)
                                         # 31.5 m 랩·6 m/s에선 10 m면 감속·횡이동 예고 충분.
                                         # 반드시 trailing_engage_dist_m 이상일 것 (아래 6.0)
    spliner/evasion_dist: 0.35           # 장애물 가장자리 - apex "목표" 횡간격 [m] (was 0.65)
                                         # 좁은 트랙: 목표를 낮춰야 벽 클램프 전에 성립.
                                         # 벽이 좁으면 evasion_dist_min까지 줄여서라도 시도
    spliner/evasion_dist_min: 0.20       # 축소 허용 하한 [m] = 차 반폭 0.15 + 여유 0.05 (was 0.35)
    # (spliner/evasion_side_space_min 제거: cc22ca9 도입 당시엔 passable_width 와 같은
    #  값(0.40)이었으나 ff8c934 가 첫 항을 RequiredObstacleClearance(= 같은 항 +
    #  UncertaintyMargin>=0)로 바꾼 뒤로 max() 의 승자가 될 수 없었다. 회피 가부 판정의
    #  실제 하한은 RequiredObstacleClearance + RequiredBoundaryMargin 이다.)
    # (spliner/squeeze_speed_scale, squeeze_brake_dist_m 제거: apex 가 벽 마진으로
    #  축소된 회피에 배율 감속을 걸던 장치. 좁은 corridor 의 속도 제한은 오프셋
    #  곡률 기반 물리 캡(OffsetKappa + path_lat_acc_max + offset_grip_cap)이
    #  담당하므로 임의 배율을 걷어냈다. 주의: 벽 여유(RequiredBoundaryMargin)는
    #  아직 고정값이라 추적오차의 속도 의존분은 보상되지 않는다 — 좁은 구간
    #  실차 검증 시 벽 최소거리를 반드시 계측할 것.)
    # --- 접근 공격성: 감속은 장애물 직전에서만, 접근 구간은 기존 속도 유지 ---
    # (감지 즉시 감속하면 접근 내내 느려져 상대를 못 따라잡고 꽁무니만 쫓는다)
    spliner/trailing_engage_dist_m: 6.0  # trailing 감속 시작: 정지 목표점 앞 이 거리부터 [m] (was 12.0)
                                         # 6 m/s 제동거리 v^2/2a = 36/(2*2.5) = 7.2 m지만
                                         # 실차 캡이 낮다. lookahead(10) 이하여야 함
    # 880e01f 에서 1.4 -> 1.15. 아래 두 줄에 있던 "1.4 를 정당화하는" 옛 주석
    # (1.15에선 나란히 달리며 결정적 순간을 놓친다)은 현재 값과 모순이라 제거했다.
    # 1.15 는 물리 cap(마찰원·조향률) 아래에서만 쓰는 soft 목표라는 뜻이다.
    spliner/dyn_pass_speed_ratio: 1.15   # 동적 상대 추월 중 최소 속도 = 상대 속도 x 이 배율
    spliner/obs_traj_tresh: 0.3          # raceline에서 이 이내 장애물만 대상 [m]
    spliner/spline_bound_mindist: 0.20   # center-to-wall 최소: 차반폭 0.15+추적여유 0.05
    spliner/pre_apex_dists: [-2.5, -1.8, -0.9]   # apex 앞 스플라인 절점 [m] (was [-4,-3,-1.5])
    spliner/post_apex_dists: [1.2, 1.8, 2.5]     # apex 뒤 스플라인 절점 [m] (was [2,3,4])
    spliner/fixed_pred_time: 0.15        # 동적 장애물 등속 전파 시간 [s]
    spliner/outside_spline_scale: 1.75   # 코너 바깥 추월 시 스플라인 완만화 배율
    # (spliner/inside_speed_scale 제거: cc22ca9 가 "고정 배율 -> 물리 기반"으로
    #  offset_grip_cap 을 도입하며 대체한다고 명시했는데 DoSpline 의 곱셈만 남아
    #  있었다. 배포 yaml 3개가 모두 1.0(항등)이라 실동작 변화는 없고, 코드 기본값
    #  0.9 와의 불일치만 사라진다.)
    # ── 임시 테스트 스위치 (2026-08-07) ─────────────────────────────────
    # true면 회피 경로의 감속 요소를 전부 끄고 글로벌 레이스라인 속도를
    # 그대로 따라간다: OT 배율, 진입·복귀 속도 캡, v_floor,
    # ApplySpeedProfile 전체(오프셋 곡률 캡·조향률 캡·역방향 감속·
    # 순방향 가속 envelope·jerk shaping·현재상태 feasibility 거부).
    # trailing(회피 불가 시 장애물 뒤 감속/정지)은 회피가 아니라 충돌 방지라
    # 영향 없음. 물리 성립성을 검증하지 않으므로 테스트 후 반드시 false로.
    #
    # 2026-08-07 16:35에 true로 켠 채 rosbag0807_obs 5런을 전부 주행했다.
    # 그 결과 spliner가 진입 속도 캡을 **계산해서 로그까지 남기고 버렸다**:
    #   164326 t=39.10 "LaneSwitch 속도 캡 2.69 m/s" <-> 같은 사이클 발행 4.56
    #   164326 t=60.33 "속도 캡 3.50" <-> 발행 4.56  (5회 확인)
    # 진입 블렌드 요구 횡가속이 6.3~20.5 m/s²까지 올라가 마찰원(6.67)을
    # 15건 중 6건 초과했고, 초과량과 실측 장애물 여유의 상관이 rho=-0.81이다
    # (164326 랩0 OBS-B 표면간격 3.7cm). 예측상 false로 되돌리면 그 랩의
    # 요구 횡가속이 20.5 -> 8.4 m/s²로 59% 줄어든다. => false 복원.
    spliner/bypass_speed_profile: false
    # true면 오프셋으로 곡률이 커진 구간에서 그 지점 레이스라인이 쓰던
    # 횡가속(kappa*v^2)을 넘지 않게 캡한다 -> v = v_gb*sqrt(kappa_ref/kappa_off).
    # 곡률이 줄어드는 바깥쪽 회피는 캡하지 않는다(속도가 오르지도 않는다).
    spliner/offset_grip_cap: true
    spliner/side_switch_d_tresh: 0.20    # |d|가 이보다 크면 추월 사이드 변경 금지 [m] (was 0.25)
    # perception 스트림 lease. 초과하면 마지막 장애물 유지도 클리어도 아닌
    # fail-safe 정지 궤적(전 점 vx=0)을 발행하므로, 반드시 detector 실측
    # 발행 주기의 2배 이상이어야 한다. 0.20은 detector 실측 주기 0.246s
    # (6.6Hz)보다 짧아서 프레임 사이마다 정지가 깜빡였고, 브릿지 age 게이트와
    # 겹치며 run_0803_213313에서 28.6초 정지 라치가 됐다.
    # 0.50 = 6.6Hz 스트림의 3프레임 분. detector가 목표대로 >=15Hz가 되면
    # 다시 조일 것.
    spliner/obs_timeout_sec: 0.50
    spliner/use_prediction: true         # Predictive Spliner: 예측 충돌구간이 원시 관측 대체
    # 회피 불가(트랙경계 abort) 시 TRAILING 폴백: raceline 유지 + 장애물 뒤
    # trailing_gap에서 장애물 속도(정적이면 0)까지 감속.
    # 고속 안전 기본값: 해가 없으면 raceline 전속 복귀가 아니라 감속/정지.
    # (spliner/use_trailing 제거: 880e01f 이후 생성자가 false 를 무조건 true 로
    #  되돌려 스위치로서 기능하지 않았다. trailing 은 항상 켜져 있다.)
    spliner/trailing_gap_m: 1.5   # 회피 불가 시 정지할 장애물 뒤 간격 [m]
    # 2.5 -> 1.0: 2.5는 실제로 낼 수 없는 감속도다. VESC는 속도 명령만 받고
    # 능동 제동을 안 하므로(0806 4런에서 /commands/motor/brake 83~507개뿐)
    # 정지 직전에는 사실상 타행이다. 명령 0 하강엣지 3건 실측:
    #   v0=1.37 -> 0.72m/0.94s (1.30 m/s²)
    #   v0=1.06 -> 0.72m/0.79s (0.79 m/s²)
    #   v0=0.95 -> 0.50m/0.67s (0.92 m/s²)
    # 2.5로 두면 프로파일이 rem = v²/5 까지 감속을 시작하지 않아
    # trailing_gap 1.5m를 0.8~1.3m 오버슛했고(실제 정지 간격 0.24~0.68m),
    # 그 거리에서는 탈출 기동의 조향 기하 하한(1.51m)을 못 채워 영구 정지
    # 라치가 됐다 (run_0806_234734 35초 / 235014 20초 / 234247 7.7초).
    spliner/trailing_decel: 1.0
    # 속도 명령 -> 실제 감속 시작까지의 구동계 지연 [s]. 정지 조건을
    # rem >= v·T + (v²-v_target²)/(2a) 로 만들어 지연 중 굴러간 거리를 보상한다.
    # 위 실측의 정지 시간(0.67~0.94s)에서 순수 감속분을 뺀 보수치.
    spliner/trailing_lag_sec: 0.3
    # 정지 프로파일이 "계단"이 되지 않도록 하는 최대 감속률 [m/s^2].
    # 0807 실측: 브레이크 활성 54구간 중앙 1.60, 1초 이상 지속 6건 1.46~1.78,
    # 164216 초기 제동 구간 약 3.0. 2.0은 그 대역의 중앙이다.
    # 이 값이 필요한 이유:
    #   BuildTrailing은 장애물이 trailing_gap 안쪽이면 span=0으로 접혀
    #   전 점 vx=0을 발행했다 (164645에서 4.25 -> 0이 단일 사이클 24ms).
    #   차가 따라갈 수 없는 명령일 뿐 아니라, MAP 컨트롤러가 조향을
    #   waypoint의 vx_mps로 계산하므로(control_node.cpp:1057) 조향이 통째로
    #   0이 된다 — 0807 4개 런의 코스아웃이 전부 이 구간에서 났다.
    #   현재 속도에서 이 감속률로 내려오는 곡선을 하한으로 깔아 램프로 만든다.
    spliner/trailing_ramp_decel: 2.0
    # Tier1/2가 "조향 기하 하한 초과"가 **아닌** 사유(충돌검사 거부, 벽 축소,
    # 이미 장애물 구간 내부, 스팬 초과 …)로 실패했을 때의 목표 속도 [m/s].
    # 이 실패들은 일시적이라 정지가 정당하지 않다 — rosbag_0806 4런에서
    # 트레일링 1345프레임 중 트랙이 실제로 막힌 건 4프레임(0.3%)뿐이었다.
    # 감속 자체가 BlendDist를 줄여 다음 사이클의 회피 성립 확률을 올린다.
    spliner/trailing_retry_speed: 1.5
    # ApexFor의 목표 간격을 CheckPathCollision 요구치보다 이만큼 더 준다 [m].
    # 동률이면 목표 apex가 충돌박스 경계 위에 놓여 수 mm 오차로 뒤집힌다 —
    # 0807 run_164326의 랩당 16회 "회피 실패"가 전부 이것이었다
    # (재구성 관통량 -0.11 ~ -10.3 mm). 0.05면 15/15가 뒤집힌다.
    spliner/apex_clearance_eps_m: 0.05
    # 이미 커밋된 정적 회피 경로를 **파기할 수 있는** 최소 관측 수.
    # 0807 run_164819: t=3.09에 여유 0.35m의 유효 회피를 확보했는데
    # t=4.321에 뜬 유령 id8 하나가 25ms 만에 그 커밋을 파기했다.
    # 유령 소멸 -> 회복(5.051), 재등장 -> 재거부(5.615)로 인과가 3번 확인됐다.
    # 3프레임은 perception min_hits와 같은 성격의 게이트다.
    # (재계획 경로의 충돌 검증에는 적용하지 않는다 — 거기선 fail-closed가 맞다.)
    spliner/commit_break_min_obs: 3
    # 컨트롤러의 wpnt 속도 스케일과 반드시 일치 (sim tracker/speed_scale 0.30, 실차 1.0).
    # 불일치 시 동적 상대 trailing에서 상대보다 느리게 따라가 격차가 벌어진다.
    spliner/cmd_speed_scale: 0.30
    # --- 고속 회피 예산 -----------------------------------------------------
    # 횡 전환(진입/복귀/트레일링 d램프) 거리를 상수로 두면 피크 횡가속이
    # 6*A*v^2/L^2 로 속도의 제곱에 비례해 커진다. 실제로 복귀 2.5m 고정은
    # 4 m/s에서 0.65g, 6 m/s에서 1.46g를 요구했다 (mu 0.75 한계 0.75g).
    # 아래 예산으로 L = v*sqrt(6A/a_max) 를 매 사이클 계산한다.
    spliner/blend_lat_acc_max: 5.0    # 횡 전환에 배정할 그립 [m/s^2] (0.51g)
                                      # 3.0(0.31g)은 raceline(0.75g) 대비 과보수 —
                                      # 6 m/s 전환 6.0 m(1s)로 반응이 늦었다. 5.0이면
                                      # 4.6 m(0.77s). 스월브 자체 곡률 상한(1b 패스)이
                                      # 과속 전환을 다시 눌러주므로 상향 여지가 생김
    spliner/blend_dist_max_m: 8.0     # 전환 거리 상한 [m] — 장애물을 너무 일찍
                                      # 피해 라인을 오래 벗어나지 않게
    # true면 전환 거리 계산에 마찰원 잔여 그립(sqrt(path_lat_acc_max² - lat_ref²))을
    # 쓰고, false면 blend_lat_acc_max 고정값만 쓴다. 코드 기본값이었는데 yaml에
    # 없어서 params.yaml만 보면 존재를 알 수 없었다.
    spliner/blend_use_spare_grip: true
    # 진입 속도 캡이 0으로 접혔을 때 정지 라치를 벗어나기 위한 크리프 속도 [m/s].
    spliner/creep_escape_speed: 0.6
    # 위치/속도 분산 3σ footprint 팽창의 상한 [m]. collision_sigma를 올려도
    # 여기서 잘리므로 두 값을 같이 봐야 한다.
    spliner/max_uncertainty_m: 0.25
    # 회피 궤적은 raceline을 d만큼 옮긴 경로라 곡률이 kappa/(1-d*kappa)로 변한다.
    # 아래 두 값으로 (1) 오프셋 곡률 기반 속도 상한, (2) 역방향 감속 패스를
    # 적용한다. 직선(kappa~0)에서는 아무것도 깎지 않아 가속이 유지되고,
    # 코너 진입 전에서만 감속이 커진다.
    # 7.0 -> 6.6: 이 값이 마찰원 예산이라 mu*g를 넘으면 안 된다.
    # my_track0807 궤적 manifest의 validation.mu_profile = 0.68 이므로
    # mu*g = 0.68*9.81 = 6.67 m/s². 7.0은 그 예산을 5% 초과해 BlendLatAcc의
    # 잔여 그립(sqrt(budget^2 - lat_ref^2))을 실제보다 크게 보고, 진입
    # 속도 캡이 물리적으로 못 내는 값으로 계산됐다. 6.6은 mu*g 바로 아래.
    # ("raceline은 7.36 사용"이라던 옛 주석은 mu 0.75 시절 값이라 폐기.)
    spliner/path_lat_acc_max: 6.6     # 오프셋 경로 횡그립 [m/s^2] (mu*g = 6.67)
    spliner/path_decel_max: 6.0       # 회피 궤적 역방향 감속 한계 [m/s^2]
                                      # (raceline 프로파일 최대 요구 6.27과 정합)
    spliner/path_accel_max: 3.0       # 회피 중 보수적 재가속 한계 [m/s²]
    spliner/path_jerk_max: 8.0        # 현재 상태에서 도달 가능한 감속 변화율 [m/s³]
    spliner/planning_delay_sec: 0.15  # 인지→계획→제어 지연을 충돌 ETA에 포함
    spliner/vehicle_half_length_m: 0.275
    spliner/vehicle_half_width_m: 0.15
    spliner/boundary_tracking_margin_m: 0.05
    spliner/collision_sigma: 3.0       # 위치/속도 분산의 3σ footprint 충돌검사
    # 정적 장애물의 "속도 분산 x 도착시각" 성장 상한 [s].
    # perception 브릿지가 모든 장애물에 vd_var/vs_var를 상수 0.25로 붙이는데,
    # is_static에도 도착시각 t를 그대로 곱하면 3σ_d = 3*sqrt(t²*0.25) ≈ 1.5t다.
    # run_0806_155621에서 정지 상태로 5.4 m 앞 장애물을 회피하려던 경로는
    # 도달 t≈2 s -> 요구 횡여유 3 m > 트랙 폭 1.79 m 로 CheckPathCollision이
    # 전부 거부했다 (어떤 정적 회피도 검증 통과 불가). 정적 물체는 시간이
    # 지나도 안 움직이므로 성장분을 여기서 자른다 — 분류 오류 대비 완충만 남김.
    spliner/static_time_uncertainty_cap: 0.3
    # 회피 기하(BlendDist·절점 간격)를 계산할 때 쓰는 최소 속도 [m/s].
    # v=0이면 BlendDist가 0이라 횡전환 거리가 붕괴하고, 기하곡률이 조향 한계
    # (tan0.36/0.33 = 1.14 rad/m)를 넘어 ApplySpeedProfile이 경로를 조용히
    # 버린다 — 한 번 멈춘 차가 회피를 다시 만들지 못하는 라치의 원인.
    # 차는 회피 지점에 정지 상태로 도달하지 않으므로 "그때 낼 속도"로 짠다.
    # 제동/속도 프로파일 등 실측 속도가 필요한 경로에는 적용하지 않는다.
    spliner/plan_speed_floor: 1.5
    spliner/sp_mapping_max_residual_m: 0.50
    spliner/vehicle_wheelbase_m: 0.33
    spliner/vehicle_max_steering_rad: 0.36
    spliner/vehicle_max_steering_rate_radps: 2.0
    # 추월 섹터: 벽 여유가 충분한 s 구간을 자동 산출해 그 안에서만 회피 시도.
    # 밖에서는 TRAILING으로 따라가다 섹터에서 공격 모드(마진 완화+속도 부스트)로 승부.
    # RViz /planner/ot_sectors/markers (초록 라인)로 섹터 확인 가능.
    spliner/sector_gating: true
    spliner/ot_min_clearance: 0.50       # 섹터 판정 최소 벽 여유 [m] (was 0.95)
                                         # = 장애물반폭(0.15)+evasion_dist_min(0.20)+경계여유(0.15)
                                         # my_track 넓은쪽 벽여유 mean 0.57/max 0.72라 0.95는 섹터 0개.
                                         # 0.50이면 직선부 3구간(~15 m, 랩의 47%)이 섹터로 잡힘
    spliner/ot_max_kappa: 0.4            # 섹터 판정 최대 곡률 [rad/m] (was 0.1, R>=2.5m)
                                         # my_track은 R_min 1.35m·평균 R 3.6m라 0.1(R>=10m)이면
                                         # 직선이 하나도 없다. 0.4로 완만한 구간만 섹터에 포함
    # SP(최단거리) 추월 라인 레인체인지: 동적 상대 추월 시 IQP 오프셋 대신
    # SP 라인으로 갈아타 통과 (라인이 상대와 겹치는 구간이면 자동 폴백)
    # 런타임/CSV 양쪽 검증을 모두 통과한 SP를 만든 뒤에만 true.
    spliner/sp_lane_change: false
    spliner/lc_pass_clear_m: 2.5         # 추월 완료 판정: 상대 앞머리가 ego 뒤로 이만큼
                                         # 벌어져야 raceline 복귀 (was 4.0, 소형 트랙)
    spliner/ot_sector_min_len_m: 3.0     # 이보다 짧은 구간은 섹터에서 제외 (was 8.0)
                                         # 31.5 m 랩엔 8 m 연속 직선이 없어 섹터 0개였음
    # spliner/ot_sectors: [10.0, 50.0]   # 수동 지정 [s0,s1, s0,s1,...] — 주석이면 자동 산출
                                         # (빈 리스트 []는 rclcpp 타입 오류로 노드가 죽으니 금지)
    # (spliner/ot_bound_mindist 제거: 섹터 안/밖에서 경계 마진을 바꾸려던 장치였는데
    #  spline_bound_mindist 와 같은 값(0.20)인 데다 모든 소비처가
    #  RequiredBoundaryMargin() = max(요청, 차반폭 + boundary_tracking_margin_m) 를
    #  거치므로 실차(0.15+0.10=0.25)에서는 어떤 경우에도 0.25 로 수렴했다.
    #  섹터별 완화를 실제로 살리려면 boundary_tracking_margin_m 쪽을 나눠야 한다.)
    spliner/ot_speed_scale: 1.0          # 안전 프로파일 밖의 런타임 속도 부스트 금지
    spliner/path_check_margin: 0.20      # 차 반폭 0.15 + 최소 불확실성 여유
    # 장애물 클러스터링: 사이를 통과 못 하는 배치를 하나의 박스로 병합해
    # "바깥으로 크게 도는" 회피를 후보에 넣는다. 원시 상대와 예측
    # 충돌구간(수 m 앞)이 한 박스로 합쳐지는 역할도 겸한다.
    spliner/cluster_gap_s_m: 3.0         # 이 s 간격 이내면 병합 후보 [m] (was 8.0, 소형 트랙)
    spliner/cluster_gap_d_m: 0.6         # 사이 corridor가 이보다 좁으면 병합 [m] (was 0.8)
    # 정적/동적 재분류 (unicorn perception/multi_tracking.py 이식):
    # 위치 std 투표(min/max_std) + 정지 재분류(vs_reset)로 perception의
    # is_static을 덮어쓴다 — 파킹한 상대를 동적으로 두면 예측 유령·섹터
    # 게이팅·커밋 비활성이 겹쳐 회피가 무너진다.
    spliner/cls_min_nb_meas: 5           # 분류 시작 최소 관측 수
    spliner/cls_min_std: 0.16            # std_s/std_d 둘 다 미만이면 정적 표 [m]
    spliner/cls_max_std: 0.2             # 하나라도 초과하면 정적 표 리셋 [m]
    spliner/cls_vs_reset: 0.1            # 최근 |vs| 평균 미만이면 정지 재분류 [m/s]

# 벽 충돌/진행불능(stuck) 판정·복구 감독 (mina Task 4).
# Planning은 판정+요청만: /planner/recovery/state (String),
# /planner/recovery/target_speed (Float64; DRIVING=NaN, 정지=0.0, 후진=음수).
# 실행(최종 속도·조향, 후진 하드리밋, E-stop)은 control_node 책임.
# STOP은 래치 — /planner/recovery/reset (Bool true)로만 해제.
# sim tracker와 C++ control 모두 state/target을 짧은 paired lease로 소비한다.
recovery_supervisor_node:
  ros__parameters:
    # control_node의 lease 기반 safety override와 연결됨. 입력 미준비/stale은 STOP.
    # 현재 recovery 체인 전체 비활성 (launch recovery:=true opt-in 시에만 기동).
    recovery/enabled: false
    recovery/loop_rate_hz: 20.0
    recovery/stuck_timeout_sec: 1.0            # 전진 명령인데 이 시간 무진행 -> stuck
    recovery/stuck_min_progress_m: 0.10        # stuck 판정 최소 s 진행량 [m]
    recovery/min_forward_cmd_mps: 0.2          # 이 이상이 "전진 명령"으로 간주 [m/s]
    # 차량 half-width(0.15m)에 더하는 추적/위치 여유. 즉 기본 요구
    # center-to-wall clearance는 최소 0.20m다.
    recovery/boundary_stop_margin_m: 0.05
    recovery/boundary_persist_sec: 0.10        # 현재 footprint 위반은 debounce 없이 즉시 정지
    recovery/vehicle_width_m: 0.30
    recovery/vehicle_length_m: 0.55
    recovery/boundary_reaction_time_sec: 0.20
    # 4.0 -> 2.0: 0806 실측 재계산으로 확정된 배포 상수는 코스팅 A_DEC_MAX 1.4,
    # 브레이크 크레딧 포함 A_DEC_PLANNED 2.0 이다 (deployment_profiles.py).
    # 4.0 은 실제의 2배라 제동 horizon 이 절반으로 짧아지는 fail-open 오차였다
    # (5 m/s: 계산 4.4 m vs 실제 필요 7.5 m). horizon 이 2배가 되므로 recovery 를
    # 다시 켤 때는 STOP 빈도부터 확인할 것.
    recovery/boundary_braking_decel_mps2: 2.0
    recovery/require_boundary_horizon: true
    recovery/front_check_dist_m: 1.5
    recovery/rear_check_dist_m: 1.5
    # 후방 전용 coverage와 reverse 경로가 검증되기 전까지 STOP-only.
    recovery/allow_reverse: false
    recovery/rear_coverage_confirmed: false
    recovery/recovery_reverse_speed_mps: 0.30
    recovery/recovery_max_reverse_distance_m: 0.5
    recovery/recovery_timeout_sec: 4.0
    recovery/recovery_max_attempts: 2
    recovery/align_tolerance_rad: 0.35         # 재정렬 완료 heading 오차 [rad]
    recovery/align_speed_mps: 0.5              # 재정렬/재출발 저속 [m/s]
    recovery/odom_timeout_sec: 0.20            # receipt와 원본 header 둘 다 검사
    recovery/perception_timeout_sec: 0.25
    recovery/local_wpnts_timeout_sec: 0.20
    recovery/source_stamp_future_tolerance_sec: 0.10
    recovery/require_source_stamps: true
    recovery/readiness_dwell_sec: 0.20
    recovery/stopped_speed_threshold_mps: 0.05
    recovery/stopped_dwell_sec: 0.20
    recovery/pose_odom_topic: /pf/pose/odom    # yaw 소스 (sim launch가 /ego_racecar/odom로 override)

# --- 시뮬레이션 전용 (sim_race.launch.py) ---
waypoint_tracker_node:
  ros__parameters:
    tracker/t_lookahead: 0.5             # lookahead = clip(t*v, min, max) [s]
    tracker/min_lookahead_m: 0.6         # my_track: R_min 1.38m 헤어핀(안쪽 벽 0.17m)에서
                                         # 1.2m는 apex 건너편을 겨눠 안쪽 벽으로 컷→스핀.
                                         # lookahead < 코너 R 이어야 함 (was 1.2)
    tracker/max_lookahead_m: 1.2         # S-bend 변곡 오버슛 억제 (was 3.0)
    tracker/wheelbase_m: 0.33
    tracker/max_steer_rad: 0.36          # 실차 검증 조향 한계 20.7° (was 0.4).
                                         # control_pkg vehicle/max_steering_angle_rad와
                                         # 일치시켜 sim이 실차보다 낙관적이지 않게 함
    tracker/speed_scale: 0.30            # my_track: 연속 R~1.4m 헤어핀+S-bend라 저속이어야
                                         # pure-pursuit 조향 반전이 오버슛 없이 따라감
    tracker/waypoint_timeout_sec: 0.20   # receipt와 원본 header stale 시 정지
    tracker/odom_timeout_sec: 0.20
    tracker/require_source_stamps: true
    tracker/source_future_tolerance_sec: 0.05
    tracker/safety_watchdog_hz: 40.0
    # 구형 자체 후진은 센서 coverage와 supervisor 계약이 없어 기본 비활성.
    tracker/recovery_state_topic: /planner/recovery/state
    tracker/recovery_target_speed_topic: /planner/recovery/target_speed
    tracker/estop_topic: /safety/emergency_stop
    tracker/recovery_required: false
    tracker/recovery_command_timeout_sec: 0.25
    tracker/recovery_pair_max_skew_sec: 0.10
    tracker/recovery_allow_reverse: false
    tracker/recovery_max_reverse_speed_mps: 0.30
    tracker/recovery_max_forward_override_mps: 1.0
    # (tracker 자체 스턱-후진 상태머신 제거: internal_stuck_recovery_enabled 와
    #  recovery_allow_reverse 두 게이트가 모두 false 로 고정돼 REVERSE 분기에 도달할
    #  수 없었고, 관련 파라미터 6개(stuck_detect_sec / reverse_speed_mps /
    #  reverse_max_sec / reverse_min_dist_m / resume_speed_cap_mps / resume_cap_sec)도
    #  같이 죽어 있었다. 스턱 처리는 STOP 래치 + supervisor 의 RECOVER_REVERSE 경로만
    #  남는다.)
    # 정상 TRACK/ALIGN 명령의 액추에이터 변화율 제한. 안전정지는 즉시 0.
    tracker/max_steering_rate_radps: 2.0
    tracker/max_accel_mps2: 5.5
    tracker/max_decel_mps2: 7.0
    tracker/min_command_dt_sec: 0.001
    tracker/max_command_dt_sec: 0.10

virtual_obstacle_node:
  ros__parameters:
    virtual_obstacle/publish_rate_hz: 10.0
    virtual_obstacle/obstacle_size_m: 0.3
    virtual_obstacle/remove_radius_m: 0.5   # 이 반경 내 재클릭 시 장애물 제거
    virtual_obstacle/laser_offset_m: 0.275  # lidar_overlay: base_link->laser 오프셋

# 상대 차량 드라이버 (gym 2번째 에이전트, RViz 2D Goal Pose로 스폰)
opponent_driver_node:
  ros__parameters:
    opponent/mode: path              # path | ftg | manual (패널/토픽으로 런타임 변경)
    # 실제 F1TENTH 대회 페이스 기준 (ForzaETH, IROS 2024: 평균 ~5 m/s,
    # 직선 최고 7~10 m/s): ego 실속 1.9~7.5 평균 ~4는 대회 수준과 일치.
    # opp는 ego의 ~85% 페이스 — 살짝 느린 경쟁자.
    # 0.42 -> 0.255: 0.42 는 tracker/speed_scale 이 0.5 이던 시절의 85% 였는데
    # 9acf1e5 가 tracker 를 0.30 으로 내린 뒤로 0.42/0.30 = ego 의 140% 가 되어
    # 상대를 애초에 따라잡을 수 없었다 (추월 시나리오·predictor 검증이 무의미).
    # 두 노드가 같은 raceline vx 에 배율만 다르게 곱하므로 0.30*0.85 = 0.255.
    opponent/max_speed_mps: 7.0      # raceline v-max 7.0과 정합 (was 8.0 -> 6.0)
    opponent/speed_scale: 0.255      # path 모드: raceline 속도 대비 (ego의 ~85%)
    opponent/size_m: 0.3             # F1TENTH 실차 폭 (was 0.4)
    opponent/drive_rate_hz: 40.0
    opponent/wheelbase_m: 0.33
    opponent/max_steer_rad: 0.36     # 상대도 동급 F1TENTH -> 실차 조향 한계 동일
    # (opponent/park_x, park_y 제거: sim_race.launch.py 가 PARK_POSES[map] 값을
    #  params_file 뒤에 항상 덮어쓰고, opponent_driver 를 띄우는 launch 는 그것뿐이라
    #  여기 값은 어떤 실행 경로에서도 쓰이지 않았다. 남아 있던 -79.81/-31.26 은
    #  Spielberg_map 좌표라 현행 기본 맵과도 무관했다.)
    opponent/park_radius_m: 5.0
    opponent/ftg_max_range_m: 8.0    # FTG: 스캔 클리핑 거리
    opponent/ftg_bubble_m: 0.3       # FTG: 최근접점 safety bubble 반경 (was 0.4)
    opponent/ftg_gap_min_m: 1.5      # FTG: 통과 가능 갭 최소 거리


# Predictive Spliner 상대 예측 (arXiv:2410.04868)
opponent_predictor_node:
  ros__parameters:
    predictor/min_samples: 40        # GP 학습 시작 최소 관측 수
    predictor/sample_min_ds: 0.15    # 관측 데시메이션 간격 [m]
    predictor/max_samples: 600
    predictor/gp_length_scale: 3.0   # RBF 길이 스케일 [m]
    predictor/gp_sigma_n: 0.08      # 주행라인(d) GP 관측 노이즈
    predictor/gp_sigma_n_v: 0.2     # 속도(vs) GP — 예측 튜브 크기를 지배
    predictor/refit_every: 20        # N 관측마다 GP 재학습
    predictor/horizon_sec: 6.0       # 따라잡기 탐색 호라이즌 (was 8.0, 소형 트랙)
    predictor/catch_gap_m: 0.8
    predictor/pass_length_m: 3.5     # 추월 소요 동안 상대가 전진하는 거리까지 커버
                                     # (was 5.0, 소형 트랙 저속이라 축소)
    predictor/publish_rate_hz: 10.0
    predictor/vs_reset: 0.1          # 최근 실측 |vs| 평균 미만이면 정지 상대로 보고 예측 중단 [m/s]
    predictor/obstacle_topic: /perception/obstacles
    predictor/odom_timeout_sec: 0.20
    predictor/obstacle_timeout_sec: 0.30
    predictor/track_forget_sec: 2.0              # 사라진 상대의 버퍼/GP 폐기 (브릿지와 동일)
    predictor/global_waypoints_timeout_sec: 2.0  # /global_waypoints(2 Hz) stale 검사
    predictor/require_source_stamp: true
    predictor/source_future_tolerance_sec: 0.05
    predictor/uncertainty_sigma: 3.0
    predictor/min_pass_relative_speed_mps: 0.5
    predictor/max_prediction_span_ratio: 0.45
    predictor/max_fit_ms: 30.0

planner_visualizer_node:
  ros__parameters:
    planning_viz/loop_rate_hz: 10.0
    planning_viz/centerline_csv_file: my_track0807_centerline.csv

    # ⚠️ 그래서 이 값은 **건드리지 말 것.** 하한 아래로 내리면 다시 묻히고,
    #    크게 올리면 target 이 항상 이겨서 balanced 가 또 항등이 된다.
    #    max_uncertainty_m 이나 path_check_margin 을 바꾸면 이 부등식
    #    (evasion_dist > 하한)을 먼저 다시 확인할 것.
    spliner/evasion_dist: 0.35
    # (spliner/evasion_dist_min 제거 — 2026-08-10)
    #  "벽이 좁으면 여기까지 줄여서라도 시도"하는 하한이었으나, 모든 소비처가
    #  max(evasion_dist_min, RequiredObstacleClearance) 로 썼고 후자가 항상 더
    #  컸다(0.20 vs 0.35~0.45). max 의 승자가 될 수 없는 파라미터라 삭제하고
    #  RequiredObstacleClearance 하나를 회피 가부의 단일 하한으로 남겼다.
    # (spliner/evasion_side_space_min 제거: cc22ca9 도입 당시엔 passable_width 와 같은
    #  값(0.40)이었으나 ff8c934 가 첫 항을 RequiredObstacleClearance(= 같은 항 +
    #  UncertaintyMargin>=0)로 바꾼 뒤로 max() 의 승자가 될 수 없었다. 회피 가부 판정의
    #  실제 하한은 RequiredObstacleClearance + RequiredBoundaryMargin 이다.)
    # (spliner/squeeze_speed_scale, squeeze_brake_dist_m 제거: apex 가 벽 마진으로
    #  축소된 회피에 배율 감속을 걸던 장치. 좁은 corridor 의 속도 제한은 오프셋
    #  곡률 기반 물리 캡(OffsetKappa + path_lat_acc_max + offset_grip_cap)이
    #  담당하므로 임의 배율을 걷어냈다. 주의: 벽 여유(RequiredBoundaryMargin)는
    #  아직 고정값이라 추적오차의 속도 의존분은 보상되지 않는다 — 좁은 구간
    #  실차 검증 시 벽 최소거리를 반드시 계측할 것.)
    # --- 접근 공격성: 감속은 장애물 직전에서만, 접근 구간은 기존 속도 유지 ---
    # (감지 즉시 감속하면 접근 내내 느려져 상대를 못 따라잡고 꽁무니만 쫓는다)
    # trailing 감속 시작: 정지 목표점 앞 이 거리부터 [m].
    # ⚠️ 실제 사용값은 max(이 값, 현재속도*1.6 + 3.0) 이라 **1.9 m/s 이상에서는

    # 0.10 = 반경 10m (실차 검증값 유지). 0.25 로 올려 코너에서도 조기 전환이
    # 열리게 해 봤으나 코너 출구 정적 장애물에는 효과가 없었다 — 이 게이트에
    # 닿기 전에 진입 속도 캡/기하 하한에서 거부되고 있었다 (근본 원인은
    # path_lat_acc_max 가 레이스라인 생성 mu 보다 낮았던 것, 그쪽 주석 참조).
    # 그게 잡힌 뒤 다시 평가할 것.
    # 0으로 두면 이 완화가 꺼지고 옛 동작으로 돌아간다.
    # 상한은 blend_dist_max_m가 그대로 담당한다 (너무 일찍 피해 라인을 오래

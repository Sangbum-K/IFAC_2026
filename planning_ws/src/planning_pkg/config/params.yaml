    # fail-safe 정지 궤적(전 점 vx=0)을 발행하므로, 반드시 detector 실측
    # 발행 주기의 2배 이상이어야 한다. 0.20은 detector 실측 주기 0.246s
    # (6.6Hz)보다 짧아서 프레임 사이마다 정지가 깜빡였고, 브릿지 age 게이트와
    # 겹치며 run_0803_213313에서 28.6초 정지 라치가 됐다.
    # 0.50 = 6.6Hz 스트림의 3프레임 분. detector가 목표대로 >=15Hz가 되면
    # 다시 조일 것.
    #   -> 2026-08-11 조임. perception C++ 재작성(8706837) 후 rosbag0810
    #      run_0810_233206 재생 실측 15.4Hz (dt p50 69.6ms / p95 80.2ms /
    #      max 83.3ms). 0.25 는 관측 최대 간격의 3.0배이고 여전히 위 조건
    #      "실측 주기의 2배 이상"을 만족한다(3.8배). 0.20 으로 더 내리지 않은
    #      이유는 p95 80ms 기준 여유가 2.5배로 얇아져 run_0803 정지 라치의
    #      재발 마진이 줄기 때문.
    #      ⚠ 실측은 개발 PC 재생 기준이다. 차량 컴퓨트에서 15.4Hz 를 못 내면
    #        이 값부터 되돌릴 것 — 미달 시 증상이 fail-safe 정지 깜빡임이다.
    #
    #   -> 2026-08-11(2) 0.25 -> 0.30. 위 ⚠ 를 차량 컴퓨트(Jetson Orin Nano
    #      Super, MAXN_SUPER)에서 직접 확인했다. 같은 백 run_0810_233206 재생,
    #      real_car 프로파일, 맵 벽 필터 활성:
    #        출력 15.49 Hz / dt p50 69.5 · p95 80.0 · max 83.3 ms
    #        detector CPU p50 7.3% / max 8.6% (1코어 기준)
    #      개발 PC 수치와 사실상 동일하므로 15.4Hz 가정은 차량에서도 성립한다.
    #
    #      그런데 **이 게이트가 재는 것은 detector 가 아니라 브릿지 출력**이다.
    #      obstacles_stamp_ 는 수신시각(this->now())이고, 그 앞에 파이썬
    #      perception_obstacle_bridge 가 있다. 브릿지는 프레임을 통째로 버리고
    #      return 하는 경로가 5개다 (TF 실패 / source age / malformed / 맵 미준비
    #      / 중복 id) — 실제로 real_car.yaml 의 max_source_age 주석이 "511프레임
    #      중 508개 거부" 사례를 기록하고 있다.
    #      즉 예산은 detector dt 뿐 아니라 브릿지 드롭까지 흡수해야 한다:
    #        0.25 = 3.00 x 83.3ms  -> 2프레임 연속 드롭(250ms)에서 정확히 경계
    #        0.30 = 3.60 x 83.3ms  -> 2프레임 드롭 + 20% 여유          <- 채택
    #      완화 쪽 비용은 장애물이 50ms 더 오래 남는 것(7 m/s 에서 0.35 m)이고,
    #      조임 쪽 비용은 run_0803 의 28.6초 정지 라치 재발이다. 후자가 훨씬 크다.
    #      옛 0.50 대비로는 여전히 40% 조인 값이다.
    spliner/obs_timeout_sec: 0.30
    # 회피 불가(트랙경계 abort) 시 TRAILING 폴백: raceline 유지 + 장애물 뒤
    # trailing_gap에서 장애물 속도(정적이면 0)까지 감속.
    # 고속 안전 기본값: 해가 없으면 raceline 전속 복귀가 아니라 감속/정지.
    # (spliner/use_trailing 제거: 880e01f 이후 생성자가 false 를 무조건 true 로
    #  되돌려 스위치로서 기능하지 않았다. trailing 은 항상 켜져 있다.)
    spliner/trailing_gap_m: 1.5   # 회피 불가 시 정지할 장애물 뒤 간격 [m]
    # 2.5 -> 1.0: 2.5는 실제로 낼 수 없는 감속도다. VESC는 속도 명령만 받고
    # 능동 제동을 안 하므로(0806 4런에서 /commands/motor/brake 83~507개뿐)
    # 정지 직전에는 사실상 타행이다. 명령 0 하강엣지 3건 실측:
    #   v0=1.37 -> 0.72m/0.94s (1.30 m/s²)
    #   v0=1.06 -> 0.72m/0.79s (0.79 m/s²)
    #   v0=0.95 -> 0.50m/0.67s (0.92 m/s²)
    # 2.5로 두면 프로파일이 rem = v²/5 까지 감속을 시작하지 않아
    # trailing_gap 1.5m를 0.8~1.3m 오버슛했고(실제 정지 간격 0.24~0.68m),
    # 그 거리에서는 탈출 기동의 조향 기하 하한(1.51m)을 못 채워 영구 정지
    # 라치가 됐다 (run_0806_234734 35초 / 235014 20초 / 234247 7.7초).
    spliner/trailing_decel: 1.0
    # ── 접촉 임박 전용 제동 감속도 [m/s^2] (2026-08-22) ──────────────────
    # 위 trailing_decel 은 "상대를 따라가는" 곡선이라 올리면 추종이 늦게
    # 제동한다. 반면 램프가 장애물과 충돌하는 것이 **확정된** 분기는 차의
    # 실제 제동 능력을 써야 한다 — 두 값을 분리했다.
    # run_0822_172617 실측 제동 능력(0.3s 창): 최대 4.19 m/s²(브레이크 7A),
    # 상시 3.3~3.9. 3.0 은 그 아래로 잡은 값이다.
    # 근거: spliner_node.cpp 5001줄이 이미 진단해 둔 것 — decel 1.0 에서는
    # 이 분기의 v_stop 이 정지 곡선이 아니라 reachable_v 에 눌린 "가속 금지"
    # 캡으로만 동작한다. run_0822_172617 t=167.5 에서 stop_dist 2.03m /
    # v 4.51 인데 무제동으로 통과해 2.9 m/s 로 관통했다.
    # 불변식: trailing_decel <= trailing_brake_decel <= 20 (노드가 검증).
    spliner/trailing_brake_decel: 3.0
    # 속도 명령 -> 실제 감속 시작까지의 구동계 지연 [s]. 정지 조건을
    # rem >= v·T + (v²-v_target²)/(2a) 로 만들어 지연 중 굴러간 거리를 보상한다.
    # 위 실측의 정지 시간(0.67~0.94s)에서 순수 감속분을 뺀 보수치.
    spliner/trailing_lag_sec: 0.3
    # 정지 프로파일이 "계단"이 되지 않도록 하는 최대 감속률 [m/s^2].
    # 0807 실측: 브레이크 활성 54구간 중앙 1.60, 1초 이상 지속 6건 1.46~1.78,
    # 164216 초기 제동 구간 약 3.0. 2.0은 그 대역의 중앙이다.
    # 이 값이 필요한 이유:
    #   BuildTrailing은 장애물이 trailing_gap 안쪽이면 span=0으로 접혀
    #   전 점 vx=0을 발행했다 (164645에서 4.25 -> 0이 단일 사이클 24ms).
    #   차가 따라갈 수 없는 명령일 뿐 아니라, MAP 컨트롤러가 조향을
    #   waypoint의 vx_mps로 계산하므로(control_node.cpp:1057) 조향이 통째로
    #   0이 된다 — 0807 4개 런의 코스아웃이 전부 이 구간에서 났다.
    #   현재 속도에서 이 감속률로 내려오는 곡선을 하한으로 깔아 램프로 만든다.
    spliner/trailing_ramp_decel: 2.0
    # Tier1/2가 "조향 기하 하한 초과"가 **아닌** 사유(충돌검사 거부, 벽 축소,
    # 이미 장애물 구간 내부, 스팬 초과 …)로 실패했을 때의 목표 속도 [m/s].
    # 이 실패들은 일시적이라 정지가 정당하지 않다 — rosbag_0806 4런에서
    # 트레일링 1345프레임 중 트랙이 실제로 막힌 건 4프레임(0.3%)뿐이었다.
    # 감속 자체가 BlendDist를 줄여 다음 사이클의 회피 성립 확률을 올린다.
    # 2026-08-15: 1.5 -> 2.5. 근거와 함정은 아래 _degraded 주석 참조.
    # ⚠️ 이 값은 곧 **정적 장애물과 접촉할 때의 속도**다. allow_stop =
    #    !is_static 이라 정적에는 완전 정지 경로가 없다 (spliner_node.cpp
    #    1176줄 트레이드 주석). 1.5 -> 2.5 는 운동에너지 2.8배다.
    spliner/trailing_retry_speed: 2.5
    # 횡 목표가 축소/포기된 트레일링(= 실제로는 못 비켜 가는 상태)의 바닥.
    # 위 값을 올리면 BlendDist = v·sqrt(6A/a_lat) 가 **속도에 정비례**해
    # 커져 횡 램프가 안 들어가고, "횡목표 포기 -> 현재 d 유지 -> 직진"이
    # 같이 늘어난다. run_0814_191443 실측(트레일링 1851 사이클):
    #     v<1.5      포기  0.0~0.2%
    #     v1.5~2.5   포기  9.7~10.0%
    #     v>3.0      포기 31.4%
    # 그 분기가 7:23 접촉(t=444.27, 차 중심이 장애물 스팬 안, 여유 0.000)을
    # 만들었다. 그래서 빠른 바닥은 **회피가 실제로 진행 중일 때만** 쓰고,
    # 목표가 깎이면 종전 1.5 로 되돌린다.
    # 불변식: 0 <= degraded <= trailing_retry_speed (노드가 검증한다).
    spliner/trailing_retry_speed_degraded: 1.5
    # ── 크리프 바닥 [m/s]: 완전 정지 프로파일을 두지 않는다 (2026-08-22) ──
    # 정지 권한이 열려도(회랑 봉쇄 래치/동적 정지) 목표를 0 이 아니라 이
    # 값으로 둔다. 운영 요구: 접촉하더라도 스택이 죽지 않고, 장애물만
    # 치우면 스스로 다시 진행해야 한다.
    # 0 을 명령하면 두 함정이 동시에 열린다 —
    #   (a) 래치가 trailing_no_stop 을 닫아 evade_committed 가 내려가고,
    #       그러면 컨트롤러의 발진 하한(map/speed_lookahead_min_m 0.25)까지
    #       닫혀 v=0 자기유지 고정점이 된다 (사람이 개입해야 풀린다).
    #   (b) 전 점 vx=0 은 MAP 컨트롤러의 조향을 죽인다 (0807 코스아웃).
    # 접촉 속도를 낮추는 일은 이 바닥이 아니라 trailing_brake_decel 이 한다.
    # 불변식: 0 <= trailing_creep_speed <= trailing_retry_speed (노드 검증).
    spliner/trailing_creep_speed: 1.5
    # ── 동적 트레일링 목표 속도의 노이즈 제거 (2026-08-18) ────────────────
    # BuildTrailing 의 v_target 은 obs.vs 를 그대로 쓰는데, 그 vs 는 브릿지가
    # id별 (s,d) 유한차분 + LPF(alpha 0.3) 로 만든 값이라 노이즈 바닥이 신호와
    # 같은 크기다. **정지가 증명된 트랙**(3.3초에 0.59 m 이동)에서 실측:
    #     vs 표준편차 0.43~0.45 m/s / 순간 |vs| 최대 1.36~1.51 m/s
    #     22개 트랙 전체 vs std  p50 0.23 / p90 0.42 m/s   (run_0815)
    # 이 값을 목표 속도로 쓰면 상대가 정속으로 가도 명령이 매 사이클 흔들려
    # 가속·제동을 반복한다. 지금 있는 완충 v_corner_actual 은 **상한**이라
    # 하향 스파이크를 못 막는다.
    # true 면 ClassifyObstacles 가 이미 쌓고 있는 관측 창(vs_hist, 10프레임)의
    # 평균을 쓴다. 새 자료구조가 없고, 정적은 어차피 vs=0 이라 영향이 없다.
    # ⚠️ 대가는 상대 급감속 대응이 창 길이만큼(~0.25 s @40Hz) 늦어지는 것이다.
    #    trailing_gap_m(2.5) 가 그 지연을 흡수하는 완충이다.
    spliner/trailing_vs_filter: true
    # ApexFor의 목표 간격을 CheckPathCollision 요구치보다 이만큼 더 준다 [m].
    # 동률이면 목표 apex가 충돌박스 경계 위에 놓여 수 mm 오차로 뒤집힌다 —
    # 0807 run_164326의 랩당 16회 "회피 실패"가 전부 이것이었다
    # (재구성 관통량 -0.11 ~ -10.3 mm). 0.05면 15/15가 뒤집힌다.
    spliner/apex_clearance_eps_m: 0.05
    # 이미 커밋된 정적 회피 경로를 **파기할 수 있는** 최소 관측 수.
    # 0807 run_164819: t=3.09에 여유 0.35m의 유효 회피를 확보했는데
    # t=4.321에 뜬 유령 id8 하나가 25ms 만에 그 커밋을 파기했다.
    # 유령 소멸 -> 회복(5.051), 재등장 -> 재거부(5.615)로 인과가 3번 확인됐다.
    # 3프레임은 perception min_hits와 같은 성격의 게이트다.
    # (재계획 경로의 충돌 검증에는 적용하지 않는다 — 거기선 fail-closed가 맞다.)
    #   -> 2026-08-11: 3 -> 7. 이 값이 실제로 방어하는 건 프레임 수가 아니라
    #      "유령이 얼마나 오래 버텨야 커밋을 깰 수 있나"라는 시간이다.
    #      0807 사건 당시 6.6Hz 에서 3프레임 = 0.45s 였는데, perception C++
    #      재작성 후 실측 15.4Hz 에서 3프레임은 0.19s 로 방어가 절반 이하로
    #      약해진다. 7프레임 = 0.45s 로 그때의 방어력을 복원한다.
    #      (perception 쪽 프레임 게이트 재스케일과 한 세트 —
    #       perception_ws/.../config/params.yaml 의 2.33x 주석 참조.)
    spliner/commit_break_min_obs: 7
    # --- 커밋을 **만드는** 쪽의 게이트 (2026-08-17) -------------------------
    # 종전에는 만드는 쪽에 게이트가 하나도 없었다 — FilterObstacles 는
    # 유한성·lookahead·회랑만 보므로 1프레임짜리 유령 하나로 7m 커밋이
    # 성립했고, 깨려면 commit_break_min_obs(7)회 관측이 필요했다.
    #   run_0815_191056 실측: 플래너가 받은 트랙 94개 중 1프레임 21개,
    #   7프레임 미만 67개(71%) — 전부 "만들 수는 있는데 깰 수는 없는" 부류다.
    #   그 결과 장애물 0개인 커밋이 10.7초 유지되며 발진 속도계획을 동결했다.
    # 생성자 검증이 commit_min_obs >= commit_break_min_obs 를 강제한다.
    # 회피 경로 생성 자체는 이 게이트 앞이라 회피 반응은 늦지 않는다 —
    # 늦어지는 것은 "얼리는" 시점뿐이고, 실측 비용은 7번째 관측까지
    # 중앙 151ms / 0.43m (lookahead 10m 의 4.3%) 다.
    spliner/commit_min_obs: 7
    # 이 속도 미만에서는 커밋을 만들지 않는다. 정지 중 만들어진 커밋은
    # 머리 속도가 vx=0 으로 굳어(ApplySpeedProfile 이 cur_vs_ 에 앵커)
    # local_trajectory 의 회피상실 홀드가 전 구간 0 m/s 캡을 걸고,
    # pos < span 이 계속 참이라 path_end 로도 만료되지 않는다.
    spliner/commit_min_speed_mps: 0.3
    # 전방에 아무 장애물도 없는 상태가 이만큼 이어지면 커밋을 해제한다.
    # 0 = 비활성(종전 동작: 경로 끝까지 주행해야만 만료).
    # 판정은 관측수/가시성 게이트를 거치지 않은 **원시** 전방 목록으로 한다 —
    # stable_ahead 로 하면 실물이 잠깐 가려진 것만으로 풀려서 0811 에서 막은
    # coasting fail-open 이 되살아난다. 임계는 관측된 인지 드롭아웃
    # (0812 실측 중앙 275ms / 최대 745ms)보다 크게 잡는다.
    spliner/commit_release_empty_sec: 1.0
    # 커밋 재검증이 커밋 경로 **전체**를 보면, raceline 복귀 꼬리(d≈0)가
    # 하류 콘에 반드시 걸려 기동의 14% 지점에서 커밋이 통째로 파기된다.
    # 그러면 재계획은 대상 콘이 0.5m 앞일 때 일어나고 기하 하한에 걸려
    # 트레일링으로 떨어진다 (run_0817_194156: 트레일링 에피소드의 87%가
    # 직전 committed_break, 파기 원인의 40%가 4m 이상 앞의 장애물).
    # 충돌이 기동 구간 밖이면 파기 대신 경로를 잘라 이 거리만큼 앞에서
    # 만료시킨다 — 다음 장애물을 처음 계획하는 거리가 곧 이 값이다.
    # 실효값 = max(이 값, BlendDist(차단 장애물 진폭, BlendPlanSpeed) + 반길이).
    # 값의 근거는 같은 백의 "정적 장애물 거리별 재계획 성공률"이다:
    #   0~1m 4% / 1~2m 14% / 2~3m 38% / 3~4m 27% / 4~6m 90% / 6~9m 100%
    # 4 m 에서 계단이 진다. commit_tail.py 스윕(유예 건수 / fail-open):
    #   3.0 -> 28건 / 0    3.5 -> 23건 / 0    4.0 -> 20건 / 0
    #   4.5 -> 10건 / 0    5.0 ->  6건 / 0
    # fail-open 은 어느 값에서도 0 이므로 안전이 아니라 이득이 기준이다.
    # 4.0 이 "모든 유예가 90% 이상 성공 구간에 드는 최소값"이다 — 그보다
    # 키우면 유예 건수만 절반으로 준다.
    # 0 이면 꼬리 절단 비활성(종전 동작).
    spliner/commit_tail_release_lead_m: 4.0
    # 커밋 파기 확정에 필요한 연속 충돌 사이클. 어느 트랙을 세느냐엔 관측 7회
    # 게이트가 있는데 "얼마나 깊이/몇 번 걸렸나"엔 문턱이 없어서, 박스가 한
    # 프레임 부푼 것만으로 9m 회피 계획이 통째로 버려졌다.
    #   run_0817_194156: path_collision 파기 115건 중 70건(61%)이 딱 한
    #   프레임짜리 충돌. 6사이클 이상 지속된 진짜는 32건(28%)뿐.
    #   기동 구간 내 파기 50건 중 46건(92%)이 커밋의 대상 장애물 자신이고,
    #   98%에서 커밋 생성 후 박스가 넓어졌다(가장자리 이동 중앙 10~12cm,
    #   파기 시점 관측 폭 중앙 54cm — 실제 콘 30cm).
    # 2 = 33ms(5m/s에서 0.17m) 늦추는 대신 74건(64%)을 살린다. 3으로 늘려도
    # 4건밖에 못 얻으므로 2가 계단. 1 = 종전 동작.
    # ⚠️ 차체 접촉(contact_slack <= 0)은 이 값과 무관하게 항상 즉시 파기한다.
    #    지연이 적용되는 것은 분산 여유만 갉아먹은 얕은 충돌뿐이다.
    # ⚠️ 회피 경로를 **새로 만드는** 쪽 충돌검사는 종전대로 한 번에 거부한다.
    # 잔여 위험 (commit_confirm.py 실측, 감출 것 없이 적는다):
    #   유예된 56건 중 다음 사이클에도 충돌이 남은 30건에서, 2건이 그 33ms
    #   동안 접촉 여유 -1.1cm 까지 내려간다. 즉시파기 문턱을 0 대신 양수로
    #   올려 봤지만 소용없다 (문턱 0/1/2/3/5cm -> 잔여 2/2/2/1/1건, 5cm 는
    #   유예를 56->44 로 깎으면서 1건을 못 없앤다). 그 2건은 여유가 한
    #   사이클에 5cm 이상 붕괴하는 경우라 정적 문턱으로 못 거른다. 그래서
    #   문턱은 0 으로 둔다.
    #   판단 근거: (1) -1.1cm 는 **관측 박스** 기준인데 그 박스는 5프레임에
    #   1번꼴로 25cm 부푼다. (2) 한 사이클 일찍 파기해도 결과가 안 바뀐다 —
    #   폴백(트레일링)이 경로를 바꾸는 데 다음 사이클이 걸리고 차의 횡위치가
    #   움직이는 데는 훨씬 더 걸린다.
    spliner/commit_break_confirm_cycles: 2
    # ── 자차 횡이탈 해제 (2026-08-22) ──────────────────────────────────────
    # 커밋 해제 사유가 경로/장애물만 보고 **자차가 그 경로에서 얼마나 벗어났는지**
    # 는 안 봤다. 못 타는 경로를 끝까지 재생한다.
    #   run_0822_000933 t=30.06~31.56: 경로오차 0.51 -> 1.01 m 로 벌어지는
    #   1.5 초 동안 committed_hold 유지, 속도는 백스톱이 1.9 -> 0.00 으로
    #   깎아 정지. 커밋은 결국 장애물 소멸로만 풀렸다.
    # 문턱은 같은 백에서 갈랐다 (발행 회피경로 대비 자차 |Δd|):
    #   정상 회피 1299 사이클  p50 0.002 / p90 0.072 / p99 0.188 / max 0.532
    #   사건  3구간  261 사이클  p50 0.331 / p90 0.724 / max 1.006
    #   0.40 m -> 정상 발화 1 사이클 / 사건 120 사이클. 연속 3 을 요구하면
    #   그 1 건은 살아남지 못한다. 0.60 은 두 번째 사건을 아예 못 잡는다.
    # 0 이면 기능 off (종전 동작).
    spliner/commit_break_lat_dev_m: 0.40
    spliner/commit_break_lat_dev_cycles: 3
    # 컨트롤러의 wpnt 속도 스케일과 반드시 일치 (sim tracker/speed_scale 0.30, 실차 1.0).
    # 불일치 시 동적 상대 trailing에서 상대보다 느리게 따라가 격차가 벌어진다.
    spliner/cmd_speed_scale: 0.30
    # --- 고속 회피 예산 -----------------------------------------------------
    # 횡 전환(진입/복귀/트레일링 d램프) 거리를 상수로 두면 피크 횡가속이
    # 6*A*v^2/L^2 로 속도의 제곱에 비례해 커진다. 실제로 복귀 2.5m 고정은
    # 4 m/s에서 0.65g, 6 m/s에서 1.46g를 요구했다 (mu 0.75 한계 0.75g).
    # 아래 예산으로 L = v*sqrt(6A/a_max) 를 매 사이클 계산한다.
    # 8.83 = build_map.py 의 MU_PROFILE(0.90) * 9.81. path_lat_acc_max와
    # 같은 예산으로 통일한다 — 서로 다르면 blend_use_spare_grip 켜짐/꺼짐에
    # 따라 회피 기하가 말없이 달라진다. (실제로 이 값이 쓰이는 곳은
    # blend_use_spare_grip=false일 때와 trailing d램프/return_speed_cap 뿐.)
    # 2026-08-13: 7.85 -> 8.83 (MU_PROFILE 0.80 -> 0.90 동반).
    # 2026-08-22: 생성기/validation_mu가 1.40으로 올라간 뒤에도 이 예산만
    # 0.90g에 남아, |kappa|*v^2 > 8.83인 코너에서 BlendLatAcc의 남은 그립이
    # 0으로 접혔다. 회피 진입을 막던 설정 드리프트를 없애기 위해 같은 1.40g.
    spliner/blend_lat_acc_max: 13.734  # 횡 전환 폴백 예산 [m/s^2] (1.40g)
                                      # 3.0(0.31g)은 raceline(0.75g) 대비 과보수 —
                                      # 6 m/s 전환 6.0 m(1s)로 반응이 늦었다. 5.0이면
                                      # 4.6 m(0.77s). 스월브 자체 곡률 상한(1b 패스)이
                                      # 과속 전환을 다시 눌러주므로 상향 여지가 생김
    spliner/blend_dist_max_m: 8.0     # 전환 거리 상한 [m] — 장애물을 너무 일찍
                                      # 피해 라인을 오래 벗어나지 않게
    # true면 전환 거리 계산에 마찰원 잔여 그립(sqrt(path_lat_acc_max² - lat_ref²))을
    # 쓰고, false면 blend_lat_acc_max 고정값만 쓴다. 코드 기본값이었는데 yaml에
    # 없어서 params.yaml만 보면 존재를 알 수 없었다.
    spliner/blend_use_spare_grip: true
    # 진입 속도 캡이 0으로 접혔을 때 정지 라치를 벗어나기 위한 크리프 속도 [m/s].
    # 이 속도 이하에서만 "횡전환을 장애물 옆(hold 구간)까지 끌고 간다"를
    # 허용한다. 환경별로 올릴 수 있다 — environments/*.yaml 의 근거·대가 참조.
    spliner/creep_escape_speed: 0.6
    # 마지막 유효 회피경로 폴백 수명 [s]. 0 = off (종전 BuildTrailing 폴백).
    # 근거는 spliner_node.hpp 의 last_good_wpnts_ 선언부.
    # ── 2026-08-24 폐기 (run_0824_164445) ────────────────────────────────
    # 0 = off. Tier-0 재생은 실차에서 단 한 번도 설계대로 동작하지 않았다:
    #   · ReplayLastGoodEvasion 이 out_wpnts 를 **메시지 통째로** 대입해
    #     Run() 이 찍은 header.stamp 까지 덮었다 -> 스탬프가 최대 0.97 s 고정
    #     -> local_trajectory 가 duplicate/out-of-order + source age 로 전량
    #     기각 -> require_avoidance_heartbeat 로 /local_waypoints 발행 중단.
    #     실측 공백 50 회 / 47.3 s (주행의 9.2%), 그 구간 티어 결과의 98% 가
    #     last_good_replay.
    #   · 커밋(committed_hold)이 충돌로 파기한 경로를 되살렸다 — 파기 29 회 중
    #     17 회, 그중 11 회가 path_collision.
    #   · commit_candidate 가 !last_good_replay_now 를 요구하므로 재생 중에는
    #     커밋 승격이 **구조적으로 불가능**했다. s=28.8 콘 실측: nobs 가 7 에
    #     도달한 357.00 에 좌측 경로가 커밋됐어야 하는데 재생이 물고 있어
    #     357.64 에 만료된 뒤 우측(여유 +0.05 m)으로 뒤집혔다. 4 랩 전부 동일.
    # 하려던 일("티어 실패 시 raceline 복귀 대신 직전 라인 유지")은 이미
    # committed_hold 가 한다 — 그쪽은 `.wpnts` 만 대입해 헤더가 살아 있다.
    # 되돌리기: 2.0. 단, 위 셋을 먼저 고치지 않으면 같은 사고가 재현된다.
    spliner/last_good_hold_sec: 0.0
    # 위치/속도 분산 footprint 팽창의 상한 [m].
    # ⚠️ 이 값은 "이상치 차단"이어야 하는데 실제로는 **상시 동작점**이다:
    #    브릿지가 position_var_floor=0.01 / velocity_var_floor=0.25 를 상수로
    #    붙이므로 정적 장애물의 σ_d = sigma*sqrt(0.01 + 0.3²*0.25) = sigma*0.18
    #    이고, collision_sigma=3.0 이면 0.54 → 항상 이 캡으로 잘린다.
    #    즉 collision_sigma 를 어떤 값으로 바꿔도 결과가 같고, 모든 장애물이
    #    관측 품질과 무관하게 동일한 고정 마진을 받는다.
    #    (collision_sigma <= 1.4 여야 캡이 안 걸린다 — 그쪽 주석 참조.)
    #
    # 2026-08-14: 0.25 -> 0.12. run_0813_221645 에서 **네모코너(s 6.6) 콘을
    # 18회 통과하는 동안 회피 경로가 한 번도 완성되지 않은** 원인이 이 값이다.
    #   (아래 수치는 실차 프로파일 기준 — real_car.yaml 이 path_check_margin
    #    을 0.15 로 덮는다. 이 파일 기본값 0.20 이면 각 0.05 씩 커진다.)
    #   요구 간격 = max(path_check_margin 0.15, 차반폭 0.15) + 캡
    #             = 0.15 + 0.25 = 0.40,  apex 는 +eps 0.05 = 0.45
    #   그 지점 좌벽 클램프 상한 = wall_left 0.59 - boundary_margin 0.20 = 0.39
    #   원거리 인지 d_left = +0.08 -> 필요 apex 0.48 > 0.39  => lane_wall_no_room
    #   (그 구간 장애물 사이클의 91%. 인지가 수렴하는 1.5 m 안쪽에서는 이미
    #    기하 하한 2.50 m > 가용 1.87 m 라 늦다.)
    # 캡 0.12 면 요구 0.27 / apex 0.32 이고 0.39 >= 0.08+0.27 = 0.35 로 성립한다.
    # 손익분기는 0.16 이고, 0.12 는 거기에 25% 여유를 둔 값이다.
    #
    # 부수효과(의도됨): evasion_dist(0.35) 가 하한(0.32) 위로 올라와 ApexFor 의
    # balanced 배분이 되살아난다 — 바로 위 evasion_dist 주석의 "살리려면 하한
    # 보다 크게 잡아야 한다(좁은 트랙이라 지금은 보류)"가 자동 해소된다.
    # evasion_dist 는 건드리지 말 것. 올리면 배분이 다시 깨진다.
    #
    # ⚠️ 실제 여유가 콘 중심 기준 0.55 -> 0.42 m 로 준다(물리 최소 0.25 —
    #    대회 콘 실반경 0.10 + 차 반폭 0.15. 08-24 에 0.30 으로 적혀 있던 것은
    #    고정값 0.15 를 물리 반경으로 오인한 값이다).
    #    real_car.yaml 의 검증 절차를 그대로 적용할 것:
    #    (a) 회피 중 /pitwall/lat_err 가 벽 여유(최소 0.35 m) 안인가
    #    (b) control 백스톱 발화가 늘지 않는가
    #    첫 런은 낮은 속도 캡으로, 고립된 콘 하나부터 확인한다.
    #
    # ── 2026-08-23: 0.12 -> 0.09 ────────────────────────────────────────
    # run_0823_043254 / run_0823_044748 재구성. 매 계획 사이클의 좌/우 통로
    # 성립 여부를 코드와 같은 식으로 다시 계산했다 (574 / 1766 사이클):
    #     양쪽 다 막힘          38.0 %  /  65.7 %
    #     가까운 쪽 부족량 중앙  4.3 cm  /  7.9 cm   (p25 2.3 / 4.5)
    #     여유를 0 으로 두면     0.0 %  /   0.6 %
    #   즉 통로가 물리적으로 없는 게 아니라 **예산이 4~8 cm 모자라서** 닫혔다.
    # 이 캡만 0.12 -> 0.09 로 내렸을 때:  38.0 -> 25.3 %,  65.7 -> 56.1 %
    #   (0.06 이면 13.1 / 42.1 % 지만 실제 여유가 6 cm 밖에 안 남아 보류.)
    # 실제로 콘 표면과 차체 사이에 남는 여유는 0.12 -> 0.09 m 로 3 cm 준다.
    # 이 3 cm 는 같은 백에서 회피 성공 사례들이 실제로 남긴 여유
    # (통과 11 건 중앙 +0.153 m / 8 건 중앙 +0.131 m) 안쪽이다.
    # ⚠️ (2026-08-24 갱신) 위 "장애물 폭이 실측보다 큰 몫" 은 그 뒤
    #    static_cylinder_radius_m 을 0.30 -> 0.15 로 내리면서 사라졌다.
    #    대회 콘의 **실반경은 0.10** (지름 20 cm) 이고 0.15 는 거기에 안전
    #    5 cm 를 얹은 고정값이다. 한쪽당 예산이 이 캡의 3 cm 에 더해
    #    15 cm 더 열렸으므로, 위 "양쪽 다 막힘" 비율은 그 시절(반경 0.30)
    #    수치이고 지금은 훨씬 낮다. 이 캡을 다시 만질 때는 그 백들을
    #    새 반경으로 재계산한 뒤 판단할 것.
    # ⚠️ 되돌릴 때는 0.12 로. 그 위(0.25)는 2026-08-14 에 네모코너 회피가
    #    18 회 전패한 값이다 (바로 위 주석).
    spliner/max_uncertainty_m: 0.09
    # 회피 궤적은 raceline을 d만큼 옮긴 경로라 곡률이 kappa/(1-d*kappa)로 변한다.
    # 아래 두 값으로 (1) 오프셋 곡률 기반 속도 상한, (2) 역방향 감속 패스를
    # 적용한다. 직선(kappa~0)에서는 아무것도 깎지 않아 가속이 유지되고,
    # 코너 진입 전에서만 감속이 커진다.
    # 이 값은 마찰원 예산이므로 **차가 실제로 달리는 라인이 계획에 쓴 mu**와
    # 같아야 한다. 단일 기준은 scripts/deployment_profiles.py 의 MU_PROFILE 이고,
    # 여기 숫자는 그 사본이다 (그 파일의 "베껴 적지 말 것" 경고 참조 — 사본이
    # 드리프트한 사고가 이미 세 번 있었다. 궤적을 재생성할 때 같이 볼 것).
    #
    # 2026-08-10 6.6 -> 7.85. 6.6의 근거는 my_track0807(mu_profile 0.68)이었는데
    # 차가 달리고 있던 라인은 my_track0809(mu_profile 0.80, gate_target=real 통과)다.
    # 그 라인이 실제로 쓰는 a_lat = |kappa|*v^2 는 max 7.85 / p99 7.68 이고
    # 316점 중 46점(15%)이 6.6을 넘는다. BlendLatAcc 는 구간 **최소** 잔여
    # 그립을 쓰므로, 예산 6.6에서는 316점 중 67점(21%)에서 잔여가 하한 2.0으로
    # 접혀 그 구간 회피가 사실상 불가능했다 (7.85면 5점 = 1.6%).
    #   run_0809_231809 4랩: 횡 0.54m / 가용 3.67m 에서 캡 5.20 < 자차 5.33
    #   -> 거부. 7.85면 캡 5.71 로 성립한다.
    # ⚠️ MU(1.00, 물리 타이어 한계)가 아니라 MU_PROFILE(0.90)을 쓴다 — 나머지
    #    0.10 은 컨트롤러 추종 보정 몫이다. build_map 주석대로 이 구간의 실제
    #    구속은 그립이 아니라 추종오차이므로, 올린 뒤 첫 주행에서 회피 중
    #    /pitwall/lat_err 가 벽 여유(최소 0.35 m) 안인지 확인할 것.
    #
    # 2026-08-13: 7.85 -> 8.83. MU_PROFILE 0.80 -> 0.90 을 따라간 것이다.
    # 여기만 7.85 로 두면 레이스라인이 배정한 a_lat(최대 8.83)이 예산을 넘어
    # 잔여 그립 sqrt(예산² - lat_ref²) 가 음수가 되고 하한 2.0 으로 접힌다 —
    # 08-10 에 고친 그 회피 감속이 그대로 되돌아온다.
    # ⚠️ 위 검증(회피 중 /pitwall/lat_err 가 벽 여유 0.35 m 안인지)은 아직
    #    실차에서 하지 않았다. 회피가 걸리는 첫 주행에서 반드시 확인할 것.
    spliner/path_lat_acc_max: 13.734  # 오프셋 경로 횡그립 [m/s^2] (MU_PROFILE*g)
    # 회피 궤적 **정형**용 역방향 감속 한계 [m/s^2]. 플랜트 능력이 아니다 —
    # 그건 아래 plant_decel_mps2 다. 둘을 분리하기 전까지 이 값 하나가 양쪽을
    # 겸했고, 그게 아래 ⚠️ 블록의 미해결 항목이었다.
    spliner/path_decel_max: 6.0
    # 2026-08-11: 위 주석의 "raceline 프로파일 최대 요구 6.27과 정합"은 폐기.
    # my_track0810 CSV 실측 ax 범위는 [-2.38, +4.50] 으로 최대 제동 요구가
    # 정확히 A_DEC_PLANNED 2.38 이다. 6.27 은 mu 0.68 시절 숫자다.
    #
    # ── 해소됨 (2026-08-11) ────────────────────────────────────────────────
    # 옛 ⚠️ 미해결: "이 값은 실차 능력의 과대평가(A_DEC_PLANNED 2.38)인데,
    #   단독으로 2.38 로 내리면 require_current_feasible 의 거부가 더 늘어난다.
    #   함께 가야 하는 수정 = 실패 시 경로를 버리지 말고 진입 구간을 도달 가능한
    #   최대 제동 곡선으로 채워 발행. 그 전에는 건드리지 말 것."
    # 그 선행 수정이 e35c2a5 로 들어왔다(ApplySpeedProfile: 거부 -> 그립 판정 +
    # reachable 발행). 이제 전제가 충족됐으므로 값을 내리는 대신 **역할을
    # 쪼갠다** — 경로 정형은 6.0 그대로, 도달성 시뮬만 plant_decel_mps2 로.
    # 정형 상한을 6.0 으로 남기는 이유: 이건 "프로파일이 이보다 가파르게
    # 떨어지지 않게 하라"는 상한이라 낮추면 회피 프로파일이 더 보수적이 되고,
    # 그 방향의 실차 검증은 없다. 도달성 판정만 물리로 맞추면 게이트의 낙관은
    # 사라진다.
    #
    # "지금 최대로 밟으면 어디까지 줄일 수 있나"를 푸는 **플랜트** 제동 능력.
    # deployment_profiles.A_DEC_PLANNED = A_DEC_MAX(1.4 코스팅) + 0.14 * 7.0 A
    # = 2.38 과 같아야 한다. my_track0810~0818 궤적도 이 값으로 생성됐다
    # (manifest validation.plant_decel_planned_mps2).
    # 6.0 을 쓰면 v0=5.0 m/s 기준 4 m 앞 시뮬 속도가 2.50 인데 실제는 3.58 이고,
    # 이 트랙 최대 곡률 0.783 에서 실제 a_lat 이 10.0 (물리한계 8.83 초과)인데도
    # 게이트는 4.89 로 보고 통과시킨다.
    # ⚠️ A_DEC_PLANNED 를 재측정하면 여기도 같이 갱신할 것 (TUNING_STATUS §11
    #    의 PF 기준 A_ACC/A_DEC 재측정이 그 작업이다).
    # 2026-08-19: 5->7A(2.10->2.38)로 잠깐 내렸다 되돌림 — vesc.yaml
    # ackermann_brake_max/brake_max를 7A로 올리고 ackermann_to_vesc의 브레이크
    # 진입/전류를 계획 ax 기반 피드포워드로 바꿔서, 이 값이 실제로 실현될
    # 가능성이 전보다 높아졌다(그래도 다음 실차 세션 검증 전까지는 가정).
    spliner/plant_decel_mps2: 2.38
    # 2026-08-10: deployment_profiles.A_ACC_MAX(4.5)와 어긋나지만 **의도적으로**
    # 3.0을 유지한다. 이 값은 회피 경로의 계획 속도(vx_mps)를 올리는데, 컨트롤러가
    # 조향 LUT를 그 계획 속도로 조회하고 a_lat도 v_plan²로 계산한다
    # (deployment_profiles.py RACELINE_V_MAX 주석 / control_node calc_steering_angle).
    # 즉 이 값을 올리면 회피 직후 조향 산출이 같이 바뀌므로, 컨트롤 쪽 검증 없이
    # 회피 성립과 무관한 이득(재가속 속도)만 보고 올릴 값이 아니다.
    # 올리려면 /monitor/steering_input · /control/lookahead_point 로 회피 직후
    # 조향 거동을 먼저 확인할 것.
    spliner/path_accel_max: 3.0       # 회피 중 보수적 재가속 한계 [m/s²]
    spliner/path_jerk_max: 8.0        # 현재 상태에서 도달 가능한 감속 변화율 [m/s³]
    spliner/planning_delay_sec: 0.15  # 인지→계획→제어 지연을 충돌 ETA에 포함
    spliner/vehicle_half_length_m: 0.275
    spliner/vehicle_half_width_m: 0.15
    spliner/boundary_tracking_margin_m: 0.05
    # 벽 예비의 속도 의존분 (TrackingReserve).
    #   예비 = min(boundary_tracking_margin_m + gain*max(v - ref, 0), max)
    # gain 0 = 예전(속도 무관) 동작. 실차 값은 real_car.yaml.
    spliner/boundary_tracking_speed_ref: 3.5
    spliner/boundary_tracking_speed_gain: 0.0
    spliner/boundary_tracking_margin_max: 0.05
    # 벽 여유(TrackingReserve)를 "지금 속도"가 아니라 "장애물 옆을 지날 때
    # 속도"로 재기 위한 감속 크레딧 [m/s^2]. 0 = 예전 동작과 비트 단위로 동일.
    #
    # 왜 필요한가: 예비가 덮어야 할 추종오차는 **그 지점을 지나는 동안**의
    # 오차인데, 감속하며 접근하면 도착 속도가 지금보다 한참 낮다. 지금 속도로
    # 재면 예비가 과대해져 통로를 스스로 닫는다.
    #   run_0819_180345 t=267.05: 좌벽 1.145 / 장애물 왼쪽 끝 0.51 -> 필요 0.781.
    #   v=5.53 기준 예비 0.22(상한) -> 상한 0.775 = 6 mm 부족으로 좌측이 닫혔고,
    #   목표가 반대쪽으로 뒤집혀 0.65 초 뒤 정면충돌. 그 구간 실측 감속은
    #   2.29 m/s^2, 도착 속도는 4.1~4.4 m/s 였다 (그 값이면 상한 0.846).
    #
    # ⚠️ 이것은 **완화다** (한 방향으로만 움직인다). run_0819_180345 재구성,
    #    크레딧 2.0, lookahead 내 6094 검사 기준:
    #      통로 열림 60.5% -> 62.6% / 막힘->열림 128건(2.1%) / 열림->막힘 0건
    #      벽 여유 감소 중앙 2 mm, p90 96 mm, 최대 120 mm (49% 는 정확히 0)
    #    안전한 이유는 크레딧의 모양이다 — 가까울수록 0 에 수렴한다:
    #      0~1 m 최대 42 mm | 1~2 m 79 mm | 2~3 m 111 mm | 4 m 이상 120 mm
    #    즉 전폭 크레딧은 제동 시간이 0.7 초 이상 남았을 때만 나온다.
    # ⚠️ 남는 가정은 "접근 중 실제로 이 감속률로 줄인다"이고 강제되지 않는다.
    #    가정이 깨지면 벽 예비가 위 표만큼 얇아진다. 되돌리려면 0 으로.
    # ⚠️ 상한은 spliner/plant_decel_mps2 (파라미터 검증이 강제). 그 위는 브레이크
    #    성능을 실제보다 높게 주장하는 것이라 도착 속도를 과소평가한다.
    spliner/boundary_arrival_decel_mps2: 0.0
    # 트레일링 횡 램프를 장애물과도 대조할 것인가. false = 예전 동작(벽만 검사).
    #
    # 종전에는 이 램프를 벽하고만 대조했다. 그래서 목표가 장애물 반대편일 때
    # 벽 검사만 통과하면 되감기 사다리가 아예 돌지 않고, 장애물 정중앙을 겨눈
    # 램프가 그대로 나갔다 (run_0819_180345 t=267.05 -> 0.65초 뒤 4.0 m/s 충돌).
    # 충돌은 reject_trailing_ramp_collision 이 이미 감지했지만(같은 런 833건)
    # 대응이 속도 프로파일뿐이었고, 그 코드의 주석대로 0.2~5.6 m 에서는 정지
    # 곡선이 되지 못한다.
    #
    # 개입 문턱 = **차체 접촉**(차 반폭 0.15), 되감기 목표 = 계획 마진(~0.27).
    # 문턱을 계획 마진으로 잡으면 차체는 안 닿는 경로까지 손대게 되고
    # (같은 백에서 664 중 363 = 55%), 그만큼 속도 바닥이 2.5 -> 1.5 m/s 로
    # 내려간다. 차체 기준이면 개입이 301 사이클(트레일링의 25%)로 줄고,
    # 실제로 닿던 경로는 그 301 이 전부다.
    #
    # 불변식: 이 검사는 경로의 장애물 여유를 **줄일 수 없다**. 후보가
    # [현재 자리, 원래 목표] 구간 안에만 있고, 원래 목표가 통과하면 손대지
    # 않으며, 아무것도 통과 못 하면 여유가 가장 큰 후보를 고르기 때문이다.
    spliner/trailing_ramp_obstacle_check: false
    # 위치/속도 분산의 footprint 충돌검사 배수.
    # ⚠️ 현재 max_uncertainty_m(0.09)에 항상 먹혀 **무효인 노브**다
    #    (0.50 이상이면 전부 같은 결과 — σ 0.18 x sigma >= 0.09).
    #    2026-08-14 캡 0.25 -> 0.12, 2026-08-23 0.12 -> 0.09 로 내려
    #    무효 구간이 계속 넓어졌다.
    #    살리려면 브릿지의 분산 하한(position_var_floor / velocity_var_floor)을
    #    실제 관측 분산으로 바꿔야 한다 — 그게 근본이고, 캡 조정은 대증이다.
    spliner/collision_sigma: 3.0
    # 정적 장애물의 "속도 분산 x 도착시각" 성장 상한 [s].
    # perception 브릿지가 모든 장애물에 vd_var/vs_var를 상수 0.25로 붙이는데,
    # is_static에도 도착시각 t를 그대로 곱하면 3σ_d = 3*sqrt(t²*0.25) ≈ 1.5t다.
    # run_0806_155621에서 정지 상태로 5.4 m 앞 장애물을 회피하려던 경로는
    # 도달 t≈2 s -> 요구 횡여유 3 m > 트랙 폭 1.79 m 로 CheckPathCollision이
    # 전부 거부했다 (어떤 정적 회피도 검증 통과 불가). 정적 물체는 시간이
    # 지나도 안 움직이므로 성장분을 여기서 자른다 — 분류 오류 대비 완충만 남김.
    spliner/static_time_uncertainty_cap: 0.3
    # 회피 기하(BlendDist·절점 간격)를 계산할 때 쓰는 최소 속도 [m/s].
    # v=0이면 BlendDist가 0이라 횡전환 거리가 붕괴하고, 기하곡률이 조향 한계
    # (tan0.36/0.33 = 1.14 rad/m)를 넘어 ApplySpeedProfile이 경로를 조용히
    # 버린다 — 한 번 멈춘 차가 회피를 다시 만들지 못하는 라치의 원인.
    # 차는 회피 지점에 정지 상태로 도달하지 않으므로 "그때 낼 속도"로 짠다.
    # 제동/속도 프로파일 등 실측 속도가 필요한 경로에는 적용하지 않는다.
    spliner/plan_speed_floor: 1.5
    spliner/vehicle_wheelbase_m: 0.33
    # ⚠️ 서보 기구 한계의 보수적 내림값. 단일 근거는 hardware vesc.yaml 이고
    #    delta = (servo - offset)/gain 로 유도한다.
    #    현재 calib(gain -0.8564 / offset 0.3906, servo 0.05~0.70):
    #      우 -0.36128 rad(20.70°) <- 대칭 한계, 좌 +0.39771 rad(22.79°)
    #      배포값 0.3531 -> Rmin 0.895 m, kappa_max = tan/L = 1.117
    #    2026-08-26 바퀴 교체 후 중립 재측정으로 0.3220 -> 0.3531.
    #    TUNING_STATUS §11 의 런 사이 중립 튐은 멎었다(6런 S* 폭 0.0048 <
    #    기준 0.005). 배포값은 servo_max 에서 0.007 안쪽이라 잔여 편차
    #    (±0.0024 servo)의 약 3배 여유가 있다 — 이제 최대 조향 근처 명령이
    #    잘리지 않는다.
    #    ⚠️ 이건 차가 더 잘 돌게 된 게 아니라 옛 값이 과소평가였던 것이다.
    #    옛 설정에서도 풀락에서 실제로 나가던 각은 좌 0.356 / 우 0.361 이었다.
    #    "차가 더 잘 돈다"를 반영하려고 여기를 올리는 것은 여전히 안 된다 —
    #    아래 steer_kappa_scale 이 그 용도다.
    #    (deployment_profiles.MAX_STEER · control 좌우 한계 중 작은 값과
    #     셋이 같아야 한다. 어긋나면 resolve 단계에서 죽는다.)
    spliner/vehicle_max_steering_rad: 0.3531
    spliner/vehicle_max_steering_rate_radps: 2.0
    # --- 조향 기하 게이트 완화 -----------------------------------------------
    # 회피를 "어떤 속도로도 불가"로 포기시키는 경로는 실질적으로 두 곳이고
    # 둘 다 kappa_steer_max = tan(delta_max)/L 에서 나온다:
    #   (1) BlendGeomFloor > 가용거리 -> BlendSpeedCap=0 -> *_geom_infeasible_
    #       -> Tier3 정지 궤적 (reject_lane_geom_floor / reject_spline_geom_floor)
    #   (2) ApplySpeedProfile 의 곡률 초과 -> 경로 통째로 폐기
    #       (reject_lane_speed_profile / reject_spline_speed_profile)
    # 아래 4개가 그 두 경로의 보수성을 푸는 노브다. 전부 코드 기본값이
    # 예전 하드코딩과 같으므로, 지우면 예전 동작으로 정확히 되돌아간다.
    #
    # 실차 달성 곡률 / kinematic 자전거모델 예측. 1.0 = 예전 동작.
    # 기구 한계는 측정값이므로 base 는 1.0 을 유지하고, "타이어가 좋아져
    # 더 돈다"는 실차 주장은 environments/real_car.yaml 에서만 올린다.
    # ⚠️ 이 노브로 **좌우 비대칭을 되먹이지 말 것.** a4b091d 가 1.25 를 올린
    #    근거가 "control 좌 한계 0.3950 이 kappa 1.263 인데 플래너는 0.3220
    #    = 1.011 만 쓴다"였는데, 그 0.3950/0.3220 비대칭은 조향 능력이 아니라
    #    2.23° 중립 편의였다(hardware vesc.yaml). 2026-08-26 offset 교정으로
    #    비대칭의 그 부분이 사라졌으므로 근거도 함께 사라졌다 — real_car
    #    오버레이를 삭제해 여기 1.0 으로 되돌렸다. 상세는 그 파일 주석.
    spliner/steer_kappa_scale: 1.0
    # BlendGeomFloor 의 smoothstep 근사 여유 (기동 항에만 적용).
    # 0.8 -> 0.92: 근사 오차 흡수용 20% 여유는 실측 근거 없이 고른 값이었고,
    # 그 20%가 하한을 sqrt(0.92/0.8)=1.07 배 늘려 성립하는 회피를 정지로
    # 뒤집는 쪽으로만 작용했다. 근사가 틀린 만큼은 (2)의 곡률 캡이 다시 잡는다.
    spliner/geom_floor_margin: 0.92
    # 트랙 곡률이 조향 예산을 거의 다 먹었을 때 남겨두는 최소 비율.
    # 0.15 -> 0.30. 헤어핀에서만 발화하는 항이고, 바로 거기가 정지 라치가
    # 실제로 걸리던 곳이다. |kappa_track|=1.10 기준 하한 4.68 -> 2.94 m.
    spliner/geom_floor_kappa_ratio: 0.30
    # (2)에서 경로를 통째로 버리는 곡률 문턱의 배율.
    # 1.0 -> 1.15. curvature[] 는 자연 3차 스플라인의 이산 샘플이라 절점
    # 근처에서 한두 점이 튀는데, 예전에는 그 한 점이 1e-3 넘으면 나머지가
    # 전부 성립하는 회피도 죽었다. 밴드 안의 점은 살리되 횡가속 캡
    # sqrt(path_lat_acc_max/k) 이 속도를 눌러 천천히 통과시킨다.
    spliner/steer_kappa_reject_ratio: 1.15
    # 추월 섹터: 벽 여유가 충분하고 코너가 아닌 s 구간을 자동 산출.
    # ⚠️ 2026-08-23 현재 **진단·시각화 전용**이다. 이 섹터가 게이팅하던 것은
    #    동적 회피였는데 그게 폐기됐고(정적 회피는 원래부터 섹터와 무관하게
    #    항상 시도한다), 마지막 소비처였던 직선 인코스 추월도 없앴다.
    #    끄고 켜도 주행은 바뀌지 않고, TraceCycle 의 in_sector 열과
    #    RViz /planner/ot_sectors/markers (초록 라인)만 영향을 받는다.
    spliner/sector_gating: true
    spliner/ot_min_clearance: 0.50       # 섹터 판정 최소 벽 여유 [m] (was 0.95)
                                         # = 장애물반폭(0.15)+회피간격(0.20)+경계여유(0.15)
                                         # my_track 넓은쪽 벽여유 mean 0.57/max 0.72라 0.95는 섹터 0개.
                                         # 0.50이면 직선부 3구간(~15 m, 랩의 47%)이 섹터로 잡힘
    # 2026-08-20: 0.20 -> 0.32 (R>=3.1m). 0.20 은 **포물선 구간을 통째로**
    # 잘라냈다 — 그 구간 |kappa| 최대가 0.31 이라 한 점 차이로 탈락한다.
    # 오프라인 재현(ComputeOtSectors, tools/bag_analysis_0819/sectors.py):
    #   0.20 -> 섹터 1개 10.9 m (랩의 29%) / 0.32 -> 랩의 약 49%
    # (예전에는 이 게이트가 **동적 전용**이었다 — 정적은 섹터 밖에서도
    #  회피했다. 동적 회피 폐기 후 게이팅 대상이 사라져 값은 마커 모양만
    #  바꾼다. 남겨 두는 이유는 백 분석에서 "여기가 직선이었다"를 계속
    #  읽기 위해서다.)
    spliner/ot_max_kappa: 0.32           # 섹터 판정 최대 곡률 [rad/m] (R>=3.1m)
                                         # 2026-08-18: 0.4(R>=2.5m)는 랩의 90%를 섹터로 만들어
                                         # 게이트가 사실상 안 걸렸다 — 코너 추월까지 상시 허용.
                                         # run_0815 /global_waypoints(386점, 38.6m) 실측 스윕:
                                         #   0.40 -> 섹터 4개 90% / 0.20 -> 2개 42% / 0.10 -> 2개 31%
                                         # 문턱을 조여도 남는 직선은 항상 같은 둘(s~15~20, s~29~2)이라
                                         # 0.20 이 "코너 제외"의 최소 침습 지점이다.
                                         # ⚠️ ot_min_clearance 는 이 트랙에서 통과율 100%(최소 벽여유
                                         #    0.80 > 문턱 0.50)라 실제로 거르는 조건은 곡률 하나뿐이다.
    # (SP 레인체인지 항목은 그 기동과 함께 폐기됐다 — 남아 있던 설명 조각과
    #  주인을 잃은 주석 한 줄을 정리했다.)
    spliner/ot_sector_min_len_m: 9.0     # 이보다 짧은 구간은 섹터에서 제외 [m] (was 3.0)
    spliner/path_check_margin: 0.20      # 차 반폭 0.15 + 최소 불확실성 여유
    # 장애물 클러스터링: 사이를 통과 못 하는 배치를 하나의 박스로 병합해
    # "바깥으로 크게 도는" 회피를 후보에 넣는다. 원시 상대와 예측
    # 충돌구간(수 m 앞)이 한 박스로 합쳐지는 역할도 겸한다.
    spliner/cluster_gap_s_m: 3.0         # 이 s 간격 이내면 병합 후보 [m] (was 8.0, 소형 트랙)
    spliner/cluster_gap_d_m: 0.6         # 사이 corridor가 이보다 좁으면 병합 [m] (was 0.8)
    # ── 봉쇄 기하에서 일시적 박스 제외 (2026-08-25, run_0824_192407) ──────
    # 병합과 사이통로봉쇄는 통로를 없애는 **비관적** 조작인데 지금까지
    # 정적/동적·실관측/코스팅을 하나도 안 가렸다. 상대차가 콘 옆을 지나가는
    # 1.5초 동안 회랑이 통째로 막힌 것으로 보여 성립해 있던 회피(d -0.54)가
    # 96 ms 만에 지워졌고 그대로 콘에 접촉했다. 상세 근거·실측은
    # spliner_node.hpp 의 cluster_ghost_miss_frames_ 선언부 주석.
    # 빼는 것은 "합쳐서 없는 벽을 세울 권한"뿐이고, 개별 박스로는 그대로
    # CheckPathCollision(동적은 vs 전파 포함)을 통과해야 한다.
    spliner/cluster_ghost_miss_frames: 4 # 연속 미관측 N프레임 이상이면 제외 (0=off)
    spliner/cluster_merge_dynamic: false # true = 종전 동작(동적도 병합)
    spliner/cluster_min_obs: 5           # 관측 N회 미만 신생 박스도 제외 (0=off)
    # 정적/동적 재분류 (unicorn perception/multi_tracking.py 이식):
    # 위치 std 투표(min/max_std) + 정지 재분류(vs_reset)로 perception의
    # is_static을 덮어쓴다 — 파킹한 상대를 동적으로 두면 예측 유령·섹터
    # 게이팅·커밋 비활성이 겹쳐 회피가 무너진다.
    spliner/cls_min_nb_meas: 5           # 분류 시작 최소 관측 수
    spliner/cls_min_std: 0.16            # std_s/std_d 둘 다 미만이면 정적 표 [m]
    spliner/cls_max_std: 0.2             # 하나라도 초과하면 정적 표 리셋 [m]
    spliner/cls_vs_reset: 0.1            # 최근 |vs| 평균 미만이면 정지 재분류 [m/s]
    # 위 조건을 **연속으로** 이만큼 만족해야 뒤집는다 (2026-08-19).
    # 문턱만 올리는 안은 폐기 — run_0818 실측에서 실제 이동 트랙도 10프레임
    # 이동평균이 일시적으로(p50 3~4 프레임) 문턱 아래로 내려가, 문턱 0.3 이면
    # 이동 트랙의 26~36% 가 정적으로 오분류됐다. 지속 10 이면 3%/0% 로 떨어진다.
    # ⚠️ 이 경로는 vs_hist 가 kClsVsWindow(10) 를 채운 트랙만 탄다. run_0818 의
    # 단명 유령은 관측이 p50 1~2 개라 애초에 도달하지 못한다 — 진짜 멈춘
    # 상대차(장수 트랙)를 위한 경로다. 그 장면이 담긴 백이 아직 없어 미검증.
    spliner/cls_vs_hold: 10
    # ── 멈춘 상대 뒤에서 설 권한 (2026-08-22) ──────────────────────────────
    # allow_stop = !is_static || WasEverMoved(id).
    # 이게 없으면 달리던 상대가 멈춰 STATIC 으로 뒤집히는 순간 정지 권한이
    # 사라지고 trailing_retry_speed(2.5)/degraded(1.5) 바닥으로 들어가 받는다.
    # 판단을 분류기(ever_dynamic)가 아니라 **관측된 변위**로 두는 이유:
    # 짧게 흔들린 콘이 DYNAMIC 으로 각인되는 일이 실제로 있었다
    # (실차 콘 max_disp 최대 0.244 m / 시뮬 0.422 m). 0.5 는 그 위다.
    # 0 이면 기능이 꺼진다(= is_static 하나로 정지 권한이 결정되던 종전 동작).
    spliner/ever_moved_min_disp_m: 0.5
    # ── 회랑 봉쇄 정지 권한 (2026-08-22, run_0822_000310 1:52) ─────────────
    # MergeBlocksTrack 의 "합치면 통과 가능한 d 가 없다" 판정은 지금까지 병합
    # 취소 사유로만 쓰이고 버려졌다. run_0822_000310 t=112.3~113.9 에서 그
    # 판정이 99회(= 매 사이클) 떴는데 자차는 degraded 1.5 m/s 바닥으로 계속
    # 굴러갔다. 이 래치는 그 판정을 **정지 권한**으로만 승격한다 — 비상정지도
    # 아니고 횡 목표도 안 건드린다(allow_stop 은 속도 결정이다). 그래서
    # 오검출의 대가가 "필요 이상 감속"이지 "이유 없는 급정지"가 아니다.
    # false 로 두면 거동은 종전이고 /planner/corridor_blocked 계측만 남는다.
    spliner/corridor_block_stop_enabled: true
    # 근거 구간 **시작 시점**의 속도 게이트. 시작에서 한 번만 보고 고정한다 —
    # 매 사이클 보면 래치가 걸려 차가 느려지는 순간 게이트가 스스로 래치를
    # 풀어 바닥이 되살아난다.
    # 원칙: trailing_retry_speed(2.5) 아래에서는 바닥이 애초에 구속이 아니라
    # 래치가 바꿀 것이 없다 — 그래서 그보다 낮게 두는 것을 노드가 거부한다.
    # 실측(run_0822_000310 재생, tools/bag_analysis_0821b/replay_spliner.zsh):
    #   봉쇄 근거 버스트 2개 — 헤어핀 콘(오발화) v_start 2.02 / v_max 2.02,
    #   사고(잔해) v_start 3.29 / v_max 3.90. 3.0 이 그 사이를 가른다.
    #   오발화 버스트는 트레일링 45사이클 전부 allow_stop=0 이라 래치가 걸리면
    #   **진짜 정지**가 된다 — 이 게이트가 없으면 랩마다 헤어핀에서 선다.
    # ⚠️ n=1 백이다. 백이 늘면 tools/bag_analysis_0821b/replaystat.py 로 재측정.
    # 0 이면 속도 게이트 없음(모든 속도에서 무장).
    spliner/corridor_block_stop_min_speed: 3.0
    # 단발 유령 디바운스. 30Hz 기준 약 5프레임.
    # 상한 0.5 는 물리 예산(봉쇄 확정 -> 정지 데드라인 0.14~0.4s) 밖으로
    # 못 나가게 노드가 검증한다.
    spliner/corridor_block_stop_hold_sec: 0.15
    # 근거가 이만큼 끊기면 해제. hold 보다 짧으면 래치가 채터링한다(노드 검증).
    spliner/corridor_block_stop_release_sec: 0.5

# 벽 충돌/진행불능(stuck) 판정·복구 감독 (mina Task 4).
# Planning은 판정+요청만: /planner/recovery/state (String),
# /planner/recovery/target_speed (Float64; DRIVING=NaN, 정지=0.0, 후진=음수).
# 실행(최종 속도·조향, 후진 하드리밋, E-stop)은 control_node 책임.
# STOP은 래치 — /planner/recovery/reset (Bool true)로만 해제.
# sim tracker와 C++ control 모두 state/target을 짧은 paired lease로 소비한다.
#
# 2026-08-22 (run_0822_191159 근거로 축소): "완전히 박았을 때"만 발동한다.
#   stuck(전진 명령인데 무진행) + 노즈 벽 접촉 + 완전 정지 3조건이 모두 성립 →
#   후진 0.5m → 정지 확인 → DRIVING 직행(복귀는 정상 체인의 최근접 포인트).
# 경계 예측 정지(COLLISION_STOP)는 삭제됐다 — 레이스라인 에이펙스 여유를
# 부호 없는 횡오차와 비교해 정상 주행을 오탐했고, 그때 control이 조향까지
# 0으로 꺾어 코너에서 벽으로 직진시켰다(리커버리가 충돌을 만들었다).
recovery_supervisor_node:
  ros__parameters:
    # control_node의 lease 기반 safety override와 연결됨. 입력 미준비/stale은 STOP.
    # 2026-08-22 부활: 기본 활성. planner_stack launch(recovery:=auto,
    # mapping 제외 on)가 노드 기동 자체를 결정하고, 이 값은 기동된 노드의
    # 내부 게이트다. 끄려면 launch recovery:=false.
    recovery/enabled: true
    recovery/loop_rate_hz: 20.0
    recovery/stuck_timeout_sec: 1.0            # 전진 명령인데 이 시간 무진행 -> stuck
    recovery/stuck_min_progress_m: 0.10        # stuck 판정 최소 s 진행량 [m]
    recovery/min_forward_cmd_mps: 0.2          # 이 이상이 "전진 명령"으로 간주 [m/s]
    # "완전히 박았다" 판정 임계 [m]. 노즈(전방 half_length 투영)의 코리도 여유가
    # 이 값 이하이고 stuck + 완전 정지가 동시에 성립할 때만 후진한다.
    # run_0822_191159 실측: 진짜 벽 접촉 -0.00 / -0.38m, 오탐 0.31m(코너 감속)과
    # 0.55m(출발 스톨). 0.05가 둘을 분리한다.
    recovery/wall_contact_margin_m: 0.05
    recovery/vehicle_width_m: 0.30
    recovery/vehicle_length_m: 0.55
    # ⚠ 후방 무확인 후진은 사용자 수용 리스크(2026-08-22 결정): LiDAR가 후방을
    # 못 보므로 "후방 = 방금 지나온 트랙" 가정에 의존한다. 상대차/사람이 트랙에
    # 있는 세션에서는 false로 내려 STOP-only 킬스위치로 쓸 것.
    recovery/allow_reverse: true
    recovery/recovery_reverse_speed_mps: 0.30  # control cap(max_reverse_speed_mps)과 일치
    recovery/recovery_max_reverse_distance_m: 0.5  # 유클리드 후진 거리 [m]
    recovery/recovery_timeout_sec: 4.0
    # "같은 지점 연속" 실패 한도. progress_reset_m 이상 전진하면 리셋되므로
    # 랩 전체 누적이 아니다.
    recovery/recovery_max_attempts: 3
    # 복구 후 이만큼 s 전진하면 연속 실패 카운터 리셋. 노드가
    # >= 2 * max_reverse_distance 를 강제한다 (제자리 왕복 오인 방지).
    recovery/progress_reset_m: 3.0
    recovery/odom_timeout_sec: 0.20            # receipt와 원본 header 둘 다 검사
    # 값 유지. 다만 의미가 바뀌었다: 파이썬 detector 6.6Hz 시절 이 값은
    # 1.02 프레임이라 readiness 게이트가 상시 깜빡였을 것이다
    # ("perception receipt/source stale" -> not_ready, 아래 StampFresh).
    # C++ 재작성 후 실측 15.4Hz 에서는 3.8 프레임이 되어 값 변경 없이 해소된다.
    # ⚠ 백 재생으로 not_ready 사유 분포를 확인하기 전까지는 "해소됐다"가 아니라
    #   "해소됐을 것"이다.
    recovery/perception_timeout_sec: 0.25
    recovery/local_wpnts_timeout_sec: 0.20
    recovery/source_stamp_future_tolerance_sec: 0.10
    recovery/require_source_stamps: true
    recovery/readiness_dwell_sec: 0.20
    recovery/stopped_speed_threshold_mps: 0.05
    recovery/stopped_dwell_sec: 0.20
    recovery/pose_odom_topic: /pf/pose/odom    # yaw 소스 (sim launch가 /ego_racecar/odom로 override)

# --- 시뮬레이션 전용 (sim_race.launch.py) ---
waypoint_tracker_node:
  ros__parameters:
    tracker/t_lookahead: 0.5             # lookahead = clip(t*v, min, max) [s]
    tracker/min_lookahead_m: 0.6         # my_track: R_min 1.38m 헤어핀(안쪽 벽 0.17m)에서
                                         # 1.2m는 apex 건너편을 겨눠 안쪽 벽으로 컷→스핀.
                                         # lookahead < 코너 R 이어야 함 (was 1.2)
    tracker/max_lookahead_m: 1.2         # S-bend 변곡 오버슛 억제 (was 3.0)
    tracker/wheelbase_m: 0.33
    tracker/max_steer_rad: 0.3531        # 구속측(우측) 배포 한계 20.23°.
                                         # control 좌우 한계 중 작은 값 및
                                         # deployment_profiles.MAX_STEER와 동일.
                                         # 2026-08-26 중립 재측정(offset 0.3906).
    tracker/speed_scale: 0.30            # my_track: 연속 R~1.4m 헤어핀+S-bend라 저속이어야
                                         # pure-pursuit 조향 반전이 오버슛 없이 따라감
    tracker/waypoint_timeout_sec: 0.20   # receipt와 원본 header stale 시 정지
    tracker/odom_timeout_sec: 0.20
    tracker/require_source_stamps: true
    tracker/source_future_tolerance_sec: 0.05
    tracker/safety_watchdog_hz: 40.0
    # 구형 자체 후진은 센서 coverage와 supervisor 계약이 없어 기본 비활성.
    tracker/recovery_state_topic: /planner/recovery/state
    tracker/recovery_target_speed_topic: /planner/recovery/target_speed
    tracker/estop_topic: /safety/emergency_stop
    tracker/recovery_required: false
    tracker/recovery_command_timeout_sec: 0.25
    tracker/recovery_pair_max_skew_sec: 0.10
    # supervisor 무조건 후진 재설계(2026-08-22)에 맞춰 REVERSE lease 소비 허용.
    tracker/recovery_allow_reverse: true
    tracker/recovery_max_reverse_speed_mps: 0.30
    tracker/recovery_max_forward_override_mps: 1.0
    # (tracker 자체 스턱-후진 상태머신 제거: internal_stuck_recovery_enabled 와
    #  recovery_allow_reverse 두 게이트가 모두 false 로 고정돼 REVERSE 분기에 도달할
    #  수 없었고, 관련 파라미터 6개(stuck_detect_sec / reverse_speed_mps /
    #  reverse_max_sec / reverse_min_dist_m / resume_speed_cap_mps / resume_cap_sec)도
    #  같이 죽어 있었다. 스턱 처리는 STOP 래치 + supervisor 의 RECOVER_REVERSE 경로만
    #  남는다.)
    # 정상 TRACK/ALIGN 명령의 액추에이터 변화율 제한. 안전정지는 즉시 0.
    tracker/max_steering_rate_radps: 2.0
    tracker/max_accel_mps2: 5.5
    tracker/max_decel_mps2: 7.0
    tracker/min_command_dt_sec: 0.001
    tracker/max_command_dt_sec: 0.10

virtual_obstacle_node:
  ros__parameters:
    virtual_obstacle/publish_rate_hz: 10.0
    # 심 안에 놓는 가짜 장애물의 **물리 크기**(지름 [m]). 브릿지의
    # static_cylinder_radius_m(=0.15) 과 짝이 맞아야 한다.
    # 2026-08-24 (3): 0.30 -> 0.20. 대회장 장애물의 **실제 반경은 0.10**
    # (지름 20 cm) 이다.
    # ⚠️ 08-24 (2) 의 "실측 지름 30 cm" 는 오기였다. 그 30 cm 는 이미 안전
    #    마진이 들어간 **고정값 0.15** 를 물리 반경으로 오인한 것이고, 그
    #    위에 안전 2 cm 를 또 얹어 고정값이 0.17 이 됐었다(이중 패딩).
    #    같은 오기가 min_cluster_size 재계산에도 들어갔다 — 아래 ⚠️ 참조.
    # 그 앞 이력: 0.3 -> 0.58 (08-24 (1)). 0.58 은 연습에 쓰던 큰 물체
    # (run_0822_192752 스캔 원 적합 반경 0.289)의 크기이고 대회 물체가 아니다.
    # 이 값은 심에 놓는 물체의 **물리** 크기라 실측 그대로 0.20 이다.
    # 브릿지 고정 반경은 0.15 이므로 관계는 이렇다:
    #   물리 지름 0.20 <- 고정 지름 0.30 (한쪽당 여유 5 cm).
    # ⚠️ 이 값을 바꾸면 test/sim/my_track_test.py 의 접촉 판정선도 같이
    #    움직여야 한다 (접촉 = 물체 반경 + 차 반폭 0.15).
    # ⚠️ **미해결 (2026-08-24 (3))**: perception 의 min_cluster_size 6 은
    #    "지름 0.30 물체가 8 m 에서 8.6 점" 이라는 틀린 전제로 정해졌다.
    #    지름 0.20 은 8 m 에서 5.7 점이라 임계 6 에 **미달**한다(검출 한계
    #    7.6 m). 벽에서 0.50 m 이상 떨어진 콘은 min_cluster_size_open 3 이
    #    받아 15.3 m 까지 보이므로 트랙 한복판은 문제가 없고, 벽 가까운 콘과
    #    맵 미수신 프레임만 7.6 m 로 늦다. 값은 유령 억제(0801 재생 5->8 로
    #    유령 프레임 14.2 % -> 11.8 %) 때문에 일부러 안 내렸다 —
    #    perception real_car.yaml 의 min_cluster_size 주석 참조.
    # ⚠️ perception:=ground_truth(기본) 에서는 브릿지가 안 뜨므로 고정이
    #    안 걸린다. 그 모드에서는 이 값이 곧 플래너가 보는 크기다.
    virtual_obstacle/obstacle_size_m: 0.20
    virtual_obstacle/remove_radius_m: 0.5   # 이 반경 내 재클릭 시 장애물 제거
    virtual_obstacle/laser_offset_m: 0.275  # lidar_overlay: base_link->laser 오프셋

# 상대 차량 드라이버 (gym 2번째 에이전트, RViz 2D Goal Pose로 스폰)
opponent_driver_node:
  ros__parameters:
    opponent/mode: path              # path | ftg | manual (패널/토픽으로 런타임 변경)
    # 실제 F1TENTH 대회 페이스 기준 (ForzaETH, IROS 2024: 평균 ~5 m/s,
    # 직선 최고 7~10 m/s): ego 실속 1.9~7.5 평균 ~4는 대회 수준과 일치.
    # opp는 ego의 ~85% 페이스 — 살짝 느린 경쟁자.
    # 0.42 -> 0.255: 0.42 는 tracker/speed_scale 이 0.5 이던 시절의 85% 였는데
    # 9acf1e5 가 tracker 를 0.30 으로 내린 뒤로 0.42/0.30 = ego 의 140% 가 되어
    # 상대를 애초에 따라잡을 수 없었다 (추월 시나리오·predictor 검증이 무의미).
    # 두 노드가 같은 raceline vx 에 배율만 다르게 곱하므로 0.30*0.85 = 0.255.
    #
    # 2026-08-12: 0.255 -> 0.85. 위 계산의 기준(ego 배율)이 0.30 에서 1.0 으로
    # 바뀌었다. opponent_driver_node 는 launch 가 **base params.yaml 만** 물리므로
    # (sim_race.launch.py, env 오버레이 없음) 여기 숫자가 곧 실효값인데, ego 쪽은
    # env 오버레이가 cmd_speed_scale 을 1.0 으로 올린다. 그래서 0.255 는 ego 의
    # 85% 가 아니라 25.5% 였다 — 사실상 주차된 차를 상대로 추월/predictor 를
    # 검증하고 있었다는 뜻이고, 이건 env:=sim_real_car(기본 시뮬)에서 이미
    # 그랬다. 1.0*0.85 = 0.85 로 원래 의도(ego 의 ~85%)를 복원한다.
    # ⚠️ 이 값은 ego 배율과 한 세트다. cmd_speed_scale 을 바꾸면 여기도 같이.
    opponent/max_speed_mps: 7.0      # raceline v-max 7.0과 정합 (was 8.0 -> 6.0)
    opponent/speed_scale: 0.85       # path 모드: raceline 속도 대비 (ego의 ~85%)
    opponent/size_m: 0.3             # F1TENTH 실차 폭 (was 0.4)
    opponent/drive_rate_hz: 40.0
    opponent/wheelbase_m: 0.33
    opponent/max_steer_rad: 0.3531   # 상대도 동급 F1TENTH -> 실차 조향 한계 동일
    # (opponent/park_x, park_y 제거: sim_race.launch.py 가 PARK_POSES[map] 값을
    #  params_file 뒤에 항상 덮어쓰고, opponent_driver 를 띄우는 launch 는 그것뿐이라
    #  여기 값은 어떤 실행 경로에서도 쓰이지 않았다. 남아 있던 -79.81/-31.26 은
    #  Spielberg_map 좌표라 현행 기본 맵과도 무관했다.)
    opponent/park_radius_m: 5.0
    opponent/ftg_max_range_m: 8.0    # FTG: 스캔 클리핑 거리
    opponent/ftg_bubble_m: 0.3       # FTG: 최근접점 safety bubble 반경 (was 0.4)
    opponent/ftg_gap_min_m: 1.5      # FTG: 통과 가능 갭 최소 거리


# Predictive Spliner 상대 예측 (arXiv:2410.04868)
opponent_predictor_node:
  ros__parameters:
    predictor/min_samples: 40        # GP 학습 시작 최소 관측 수
    predictor/sample_min_ds: 0.15    # 관측 데시메이션 간격 [m]
    predictor/max_samples: 600
    predictor/gp_length_scale: 3.0   # RBF 길이 스케일 [m]
    predictor/gp_sigma_n: 0.08      # 주행라인(d) GP 관측 노이즈
    predictor/gp_sigma_n_v: 0.2     # 속도(vs) GP — 예측 튜브 크기를 지배
    predictor/refit_every: 20        # N 관측마다 GP 재학습
    predictor/horizon_sec: 6.0       # 따라잡기 탐색 호라이즌 (was 8.0, 소형 트랙)
    predictor/catch_gap_m: 0.8
    predictor/pass_length_m: 3.5     # 추월 소요 동안 상대가 전진하는 거리까지 커버
                                     # (was 5.0, 소형 트랙 저속이라 축소)
    predictor/publish_rate_hz: 10.0
    predictor/vs_reset: 0.1          # 최근 실측 |vs| 평균 미만이면 정지 상대로 보고 예측 중단 [m/s]
    predictor/obstacle_topic: /perception/obstacles
    predictor/odom_timeout_sec: 0.20
    predictor/obstacle_timeout_sec: 0.30
    predictor/track_forget_sec: 2.0              # 사라진 상대의 버퍼/GP 폐기 (브릿지와 동일)
    predictor/global_waypoints_timeout_sec: 2.0  # /global_waypoints(2 Hz) stale 검사
    predictor/require_source_stamp: true
    predictor/source_future_tolerance_sec: 0.05
    predictor/uncertainty_sigma: 3.0
    predictor/min_pass_relative_speed_mps: 0.5
    predictor/max_prediction_span_ratio: 0.45
    predictor/max_fit_ms: 30.0

planner_visualizer_node:
  ros__parameters:
    planning_viz/loop_rate_hz: 10.0
    # trajectory_csv_file 과 같은 맵이어야 한다 (섞이면 시각화 중앙선만 다른
    # 트랙을 그려서 "레이스라인이 코스를 벗어난 것처럼" 보인다).
    planning_viz/centerline_csv_file: my_track0824_realfinal_centerline.csv

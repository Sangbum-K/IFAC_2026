    #    이 값만 lookahead 이하로 확인하므로 실효 거리는 검증되지 않는다.
    #    감속 시점을 실제로 바꾸려면 속도 계수 쪽(코드 BuildTrailing)을 볼 것.
    # ── 동적 상대 종방향 추종 (2026-08-23) ────────────────────────────────
    # H2H 실주행 뒤 동적 처리를 처음부터 다시 만든 결과. 계약은 셋뿐이다:
    #   1) 개입 거리 밖의 상대는 **무시**한다 (레이스라인 속도 그대로).
    #   2) 안쪽이면 회피가 아니라 간격 유지만 한다. 가까우면 감속/멀면 가속.
    #   3) 정적 회피 상황이 겹치면 회피가 우선이고 여기는 속도만 캡한다.
    # 동적 상대에 대한 **횡 기동은 존재하지 않는다** — 라인 스위치도,
    # 스플라인 회피도, 직선 인코스 추월도 전부 폐기했다. 플래너가 동적
    # 상대에 대해 내는 출력은 속도 하나뿐이다.
    #
    # 유지 목표 간격 [m]. obs.s_start - cur_s_ 기준이다 — 실차 접촉이 이 값
    # 0.44 에서 관측됐으므로(run_0819_211107 89.51s) 1.0 은 실제 차체 여유
    # 약 0.56 m 다.
    # 2026-08-23 1.5 -> 1.0: 추월 기동을 폐기했으므로 남은 성능 레버는
    # "얼마나 바짝 붙어 같은 속도로 따라가는가" 하나다. 개입 게이트가
    # gap_target + Δv²/2a + v·T 라 이 값이 곧 정속 추종 시 개입 거리이고,
    # 1.0 이면 1.5 였을 때 이미 캡이 걸리던 1.0~1.5 m 구간을 레이스라인
    # 속도로 지난다.
    # ⚠️ 급정거를 완전히 막지는 못하고, 1.5 보다 못 막는다. 반응지연 0.4 s
    #    (인지 65 ms + 계획 33 ms + trailing_lag 0.3) + 제동 2.38 기준
    #    무접촉 필요 간격은 3 m/s 1.59 m / 4 m/s 2.29 m / 5 m/s 3.09 m 다.
    #    1.0 은 2.3 m/s 이하에서만 완전 방어이고(1.5 는 2.9 m/s), 그 위에서는

    spliner/dyn_follow_gap_m: 1.0
    # 안전항이 절대 침범하지 않는 간격 [m]. 실측 접촉 거리 0.44 위에 둔다.
    spliner/dyn_follow_gap_min_m: 0.6
    # 비례 추종 이득 [1/s]. 간격 오차 1 m 당 속도 명령 차이.

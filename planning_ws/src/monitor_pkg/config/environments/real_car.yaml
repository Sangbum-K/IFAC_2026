# 실차 (팀 인터페이스, 2026-07-20 기준 — planning_pkg environments/real_car.yaml 참조)
#   odom: localization particle_filter가 직접 발행하는 /pf/pose/odom
#   drive: ackermann_mux 출력 /ackermann_cmd (control_node 출력은 그 앞단인
#          /autonomy/ackermann_cmd). mux 뒤를 봐야 조이스틱 개입까지 포함한
#          "차에 실제로 나간 명령"이 보이므로 의도적으로 mux 출력을 구독한다.
monitor_node:
  ros__parameters:
    monitor/odom_topic: /pf/pose/odom
    monitor/ackermann_topic: /ackermann_cmd

    # 원격 RViz(WiFi) 대역 상한. driven_path/deviation 은 전체 배열을 매 발행마다
    # 다시 직렬화해 보내므로 주행 시간에 비례해 선형으로 커진다.
    # 20000점 x 40B x 5Hz = 4MB/s -> WiFi 포화 -> RELIABLE /tf 가 밀려 perception
    # 전멸 (run_0801_175634, 3분 지점). 1500점(=75m) x 1Hz = 60KB/s.
    # 전체 궤적/이탈량은 주행 중에 볼 게 아니라 로스백 + bagviz 로 본다.
    monitor/trail/max_points: 1500
    monitor/trail/publish_rate_hz: 1.0
    monitor/deviation/enabled: false

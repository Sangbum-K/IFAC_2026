bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.275
    
    # laserscan parameters
    scan_fov: 4.7
    scan_beams: 1080

    # map parameters
    # ⚠ gym_bridge_launch.py(이 패키지 단독 실행)에서만 쓰이는 기본값이다.
    # IFAC_ws 스택은 sim_race.launch.py 가 map:=<맵이름> 으로 항상 덮어쓴다.
    # 옛 값은 '/home/mina/sim_ws/...' 절대경로였는데, 그 디렉터리는 이 패키지가
    # IFAC_ws 로 편입되면서 없어진다 — 리포 안 경로로 옮긴다.
    map_path: '/home/mina/IFAC_ws/sim_ws/src/f1tenth_gym_ros/maps/Spielberg_map'
    map_img_ext: '.png'

    # opponent parameters
    num_agent: 1

    # ego starting pose on map
    sx: 0.0
    sy: 0.0
    stheta: 0.0

    # opp starting pose on map
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0

    # teleop
    kb_teleop: True